name: Tuhaf Kasaba - 10 Bolum Otomatik Cizgi Film

on:
  workflow_dispatch:
  schedule:
    # Onceki duzendeki iki calisma saati korunmustur (UTC).
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-tuhaf-kasaba-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts playwright requests google-auth google-auth-oauthlib google-api-python-client

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Tuhaf Kasaba kaynak paketini bul ve ac
        run: |
          python - <<'PY'
          import io
          import zipfile
          from pathlib import Path

          required_names = {
              "cizgi-short/kit/engine/index.html",
              "tuhaf-kasaba/run_episode.py",
              "tuhaf-kasaba/story.js",
              "tuhaf-kasaba/episodes/episode_01.json",
          }

          # Beklenen dosya adini ve depodaki diger ZIP dosyalarini tara.
          candidates = []
          exact = Path("tuhaf-kasaba-source.zip")
          if exact.is_file():
              candidates.append(exact)
          candidates.extend(
              p for p in Path(".").rglob("*.zip")
              if p.is_file() and p not in candidates
          )

          source_bytes = None
          source_label = None
          for candidate in candidates:
              try:
                  with zipfile.ZipFile(candidate) as outer:
                      names = set(outer.namelist())
                      if required_names.issubset(names):
                          source_bytes = candidate.read_bytes()
                          source_label = str(candidate)
                          break
                      nested = next(
                          (n for n in names if n.replace("\\", "/").endswith(
                              "tuhaf-kasaba-source.zip"
                          )),
                          None
                      )
                      if nested:
                          source_bytes = outer.read(nested)
                          source_label = f"{candidate} icindeki {nested}"
                          break
              except (zipfile.BadZipFile, OSError):
                  continue

          if source_bytes is None:
              raise SystemExit(
                  "Kaynak ZIP bulunamadi. Depo ana dizinine "
                  "'tuhaf-kasaba-source.zip' veya buyuk kurulum ZIP'ini yukleyin."
              )

          with zipfile.ZipFile(io.BytesIO(source_bytes)) as source:
              names = set(source.namelist())
              missing = sorted(required_names - names)
              if missing:
                  raise SystemExit("Kaynak ZIP eksik dosyalar iceriyor: " + ", ".join(missing))
              source.extractall(".")

          print(f"Tuhaf Kasaba kaynaklari acildi: {source_label}")
          PY

      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {k: os.getenv(k, "").strip() for k in (
              "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit("Eksik GitHub Secrets: " + ", ".join(missing))
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "grant_type": "refresh_token",
              "client_id": values["YOUTUBE_CLIENT_ID"],
              "client_secret": values["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": values["YOUTUBE_REFRESH_TOKEN"],
          }, timeout=30)
          payload = r.json()
          if not r.ok or not payload.get("access_token"):
              raise SystemExit("YouTube OAuth hatasi: " + str(payload.get("error")) +
                               " (" + str(payload.get("error_description", ""))[:180] + ")")
          print("YouTube OAuth testi basarili.")
          PY

      - name: Siradaki Tuhaf Kasaba bolumunu uret ve yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tuhaf-kasaba/run_episode.py

      - name: Video, onizleme ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuhaf-kasaba-run-${{ github.run_id }}
          path: |
            output/
            work_tuhaf_kasaba/out/
            work_tuhaf_kasaba/stills/preview_sheet.jpg
            work_tuhaf_kasaba/work/words.json
            data/tuhaf_kasaba_history.json
          if-no-files-found: ignore
          retention-days: 14
