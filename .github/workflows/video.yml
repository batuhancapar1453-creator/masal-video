name: Gizemli Dunya - Otomatik YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9,20 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: gizemli-dunya-youtube
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg ve fontlari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy google-api-python-client google-auth

      # ===========================================
      # YENI: YOUTUBE BAGLANTISINI ONCEDEN TEST ET
      # ===========================================

      - name: YouTube OAuth baglantisini test et
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          names = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]

          values = {
              name: os.getenv(name, "").strip()
              for name in names
          }

          missing = [
              name
              for name, value in values.items()
              if not value
          ]

          if missing:
              raise RuntimeError(
                  "Eksik GitHub Secrets: "
                  + ", ".join(missing)
              )

          print("YouTube OAuth baglantisi kontrol ediliyor...")

          response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": values["YOUTUBE_CLIENT_ID"],
                  "client_secret": values["YOUTUBE_CLIENT_SECRET"],
                  "refresh_token": values["YOUTUBE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token"
              },
              timeout=30
          )

          result = response.json()

          if response.ok and result.get("access_token"):
              print("")
              print("YOUTUBE BAGLANTISI BASARILI!")
              print("Access Token yenileme calisiyor.")
              print("Video uretimine gecilebilir.")
          else:
              error = result.get("error", "bilinmeyen")
              print("OAuth hatasi:", error)

              if error == "unauthorized_client":
                  print(
                      "OAuth istemcisi yetkilendirilmedi. "
                      "GitHub'daki Client ID, Client Secret "
                      "ve Refresh Token ayni OAuth "
                      "istemcisine ait olmali."
                  )

                  print(
                      "OAuth Playground'da kendi OAuth "
                      "kimlik bilgilerinizi kullanarak "
                      "yeni Refresh Token olusturun."
                  )

              elif error == "invalid_grant":
                  print(
                      "Refresh Token gecersiz, suresi "
                      "dolmus veya erisim iptal edilmis."
                  )

              elif error == "invalid_client":
                  print(
                      "Client ID veya Client Secret hatali."
                  )

              else:
                  print(
                      "Google OAuth projesini ve "
                      "izinleri kontrol edin."
                  )

              raise SystemExit(1)
          PY

      # ===========================================
      # VIDEO URETIMI
      # ===========================================

