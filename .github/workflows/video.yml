          def youtube_upload(video_path):
              credentials = Credentials(
                  token=None,
                  refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,
                  scopes=[
                      "https://www.googleapis.com/auth/youtube.upload"
                  ]
              )

              credentials.refresh(Request())

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )

              description = (
                  f"{title}\n\n"
                  "Dünya, tarih ve uzaydan "
                  "ilginç bilgiler.\n\n"
                  "Görseller yapay zekâ destekli "
                  "temsili canlandırmalardır. "
                  "Bilimsel ve tarihsel sahneler "
                  "gerçek görüntü değildir.\n\n"
                  "#Shorts #Bilim #Tarih #Uzay #Gizem"
              )

              body = {
                  "snippet": {
                      "title": (
                          f"{title} | Gizemli Dünya #Shorts"
                      )[:100],
                      "description": description,
                      "tags": [
                          "Shorts",
                          "Gizemli Dünya",
                          "Bilim",
                          "Tarih",
                          "Uzay",
                          category
                      ],
                      "categoryId": "27",
                      "defaultLanguage": "tr"
                  },
                  "status": {
                      "privacyStatus": YOUTUBE_PRIVACY,
                      "selfDeclaredMadeForKids": False,
                      "containsSyntheticMedia": True
                  }
              }

              media = MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  chunksize=-1,
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              result = None
              retry = 0

              while result is None:
                  try:
                      _, result = request.next_chunk()
                      retry = 0

                  except HttpError as error:
                      status = error.resp.status

                      if (
                          status not in (
                              500, 502, 503, 504
                          )
                          or retry >= 4
                      ):
                          raise

                      retry += 1

                      time.sleep(
                          min(2 ** retry, 30)
                      )

                  except (
                      OSError,
                      ConnectionError
                  ):
                      if retry >= 4:
                          raise

                      retry += 1

                      time.sleep(
                          min(2 ** retry, 30)
                      )

              youtube_id = result.get("id")

              if not youtube_id:
                  raise RuntimeError(
                      "YouTube video kimligi donmedi."
                  )

              return youtube_id

