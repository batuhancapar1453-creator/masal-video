name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: FFmpeg kontrol
        run: |
          ffmpeg -version

      - name: Python paketlerini kur
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Masal videosu oluştur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          cat > video_olustur.py <<'PY'
          import os
          import time
          import requests
          import subprocess
          import html

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          AZURE_KEY = os.environ["AZURE_SPEECH_KEY"]
          HF_TOKEN = os.environ["HF_TOKEN"]

          print("=== 1. MASAL OLUŞTURULUYOR ===")

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
          )

          prompt = """
          Türkçe çocuk YouTube kanalı için tamamen özgün bir masal yaz.

          Yaklaşık 4-5 dakika uzunluğunda olsun.

          Sevimli ve akılda kalıcı bir ana karakter olsun.
          Eğlenceli bir macera olsun.
          Küçük bir problem veya gizem olsun.
          Sonunda problem güzel şekilde çözülsün.
          Çocuklara uygun, sıcak ve güvenli bir dil kullan.
          Korku ve şiddet kullanma.

          Önce etkileyici bir başlık yaz.
          Ardından sadece masalı yaz.
          """

          response = requests.post(
              gemini_url,
              headers={
                  "x-goog-api-key": GEMINI_KEY,
                  "Content-Type": "application/json"
              },
              json={
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.9,
                      "maxOutputTokens": 5000
                  }
              },
              timeout=120
          )

          if response.status_code != 200:
              raise Exception(
                  "Gemini hatası "
                  + str(response.status_code)
                  + ": "
                  + response.text
              )

          data = response.json()

          story = (
              data["candidates"][0]
              ["content"]["parts"][0]["text"]
          )

          print("Masal başarıyla oluşturuldu.")

          with open(
              "masal.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(story)

          print("=== 2. SES OLUŞTURULUYOR ===")

          chunks = []
          remaining = story

          while remaining:
              length = min(2000, len(remaining))

              if length < len(remaining):
                  space = remaining.rfind(" ", 0, length)

                  if space > 500:
                      length = space

              chunk = remaining[:length].strip()

              if chunk:
                  chunks.append(chunk)

              remaining = remaining[length:].strip()

          audio_files = []

          azure_url = (
              "https://eastus.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          for index, text in enumerate(chunks):

              safe_text = html.escape(text)

              ssml = (
                  "<speak version='1.0' xml:lang='tr-TR'>"
                  "<voice xml:lang='tr-TR' "
                  "name='tr-TR-EmelNeural'>"
                  + safe_text +
                  "</voice>"
                  "</speak>"
              )

              response = requests.post(
                  azure_url,
                  headers={
                      "Ocp-Apim-Subscription-Key": AZURE_KEY,
                      "X-Microsoft-OutputFormat":
                          "audio-16khz-128kbitrate-mono-mp3",
                      "Content-Type":
                          "application/ssml+xml",
                      "User-Agent":
                          "MasalOtomasyon"
                  },
                  data=ssml.encode("utf-8"),
                  timeout=120
              )

              if response.status_code != 200:
                  raise Exception(
                      "Azure Speech hatası "
                      + str(response.status_code)
                      + ": "
                      + response.text
                  )

              filename = (
                  "ses_"
                  + str(index).zfill(2)
                  + ".mp3"
              )

              with open(filename, "wb") as file:
                  file.write(response.content)

              audio_files.append(filename)

              print(
                  "Ses parçası "
                  + str(index + 1)
                  + "/"
                  + str(len(chunks))
                  + " oluşturuldu."
              )

              time.sleep(2)

          with open(
              "concat.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for filename in audio_files:
                  file.write(
                      "file '"
                      + filename
                      + "'\n"
                  )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  "concat.txt",
                  "-c",
                  "copy",
                  "ses.mp3"
              ],
              check=True
          )

          print("Ses tamamlandı.")

          print("=== 3. GÖRSELLER OLUŞTURULUYOR ===")

          image_url = (
              "https://router.huggingface.co/"
              "hf-inference/models/"
              "stabilityai/stable-diffusion-3-medium-diffusers"
          )

          prompts = [
              "cute friendly rabbit in a magical colorful forest, "
              "children's storybook illustration, warm cheerful style, "
              "safe for young children, landscape 16:9",

              "same cute friendly rabbit exploring a magical forest, "
              "colorful flowers and trees, children's storybook art, "
              "landscape 16:9",

              "same cute friendly rabbit discovering a mysterious "
              "glowing path in a magical forest, children's book "
              "illustration, landscape 16:9",

              "same cute friendly rabbit having a fun adventure with "
              "friendly forest animals, colorful children's storybook "
              "illustration, landscape 16:9",

              "same cute friendly rabbit solving a gentle mystery in "
              "a magical forest, warm cheerful children's book art, "
              "landscape 16:9",

              "same cute friendly rabbit finding a beautiful magical "
              "secret, colorful children's storybook illustration, "
              "landscape 16:9",

              "same cute friendly rabbit celebrating with friends in "
              "a magical forest, heartwarming children's book art, "
              "landscape 16:9",

              "same cute friendly rabbit watching a beautiful sunset "
              "with friends, peaceful children's storybook "
              "illustration, landscape 16:9"
          ]

          for index, prompt in enumerate(prompts):

              response = requests.post(
                  image_url,
                  headers={
                      "Authorization":
                          "Bearer " + HF_TOKEN,
                      "Content-Type":
                          "application/json"
                  },
                  json={
                      "inputs": prompt
                  },
                  timeout=300
              )

              if response.status_code != 200:
                  raise Exception(
                      "Hugging Face hatası "
                      + str(response.status_code)
                      + ": "
                      + response.text
                  )

              filename = (
                  "sahne_"
                  + str(index).zfill(2)
                  + ".png"
              )

              with open(filename, "wb") as file:
                  file.write(response.content)

              print(
                  "Görsel "
                  + str(index + 1)
                  + "/8 oluşturuldu."
              )

              time.sleep(5)

          print("=== 4. VIDEO OLUŞTURULUYOR ===")

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-framerate",
                  "1/8",
                  "-i",
                  "sahne_%02d.png",
                  "-i",
                  "ses.mp3",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2",
                  "-c:v",
                  "libx264",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-shortest",
                  "masal-video.mp4"
              ],
              check=True
          )

          print("================================")
          print("VIDEO BAŞARIYLA OLUŞTURULDU!")
          print("================================")
          PY

          python3 video_olustur.py

      - name: Video dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: masal-video.mp4
