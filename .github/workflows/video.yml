name: Tuhaf Kasaba - 10 Bolum Otomatik Cizgi Film

on:
  workflow_dispatch:
  schedule:
    # Istanbul saatiyle 09:23 ve 20:23
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-tuhaf-kasaba-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core unzip

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts playwright requests google-auth google-auth-oauthlib google-api-python-client

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Tuhaf Kasaba kaynak dosyalarini hazirla
        shell: bash
        run: |
          set -euo pipefail

          # Kaynak klasorleri depoya daha once acik halde eklendiyse ZIP gerekmez.
          required_files=(
            "cizgi-short/kit/engine/index.html"
            "tuhaf-kasaba/run_episode.py"
            "tuhaf-kasaba/story.js"
            "tuhaf-kasaba/episodes/episode_10.json"
          )

          sources_ready=true
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              sources_ready=false
              break
            fi
          done

          if [[ "$sources_ready" == true ]]; then
            echo "Kaynak klasorleri zaten depoda; ZIP acma atlandi."
          else
            # ZIP dosyasini yalnizca ana dizinde degil, deponun alt klasorlerinde de ara.
            mapfile -t archives < <(find . -type f -iname 'tuhaf-kasaba-source.zip' -not -path './.git/*' -print)

            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "HATA: Kaynak klasorleri eksik ve tuhaf-kasaba-source.zip depoda bulunamadi."
              echo "Beklenen dosyalar:"
              for file in "${required_files[@]}"; do
                [[ -f "$file" ]] || echo " - $file (eksik)"
              done
              echo "ZIP dosyasini GitHub deposuna ekleyin veya ZIP'ten cikan klasorleri dogrudan depoya yukleyin."
              exit 1
            fi

            if [[ ${#archives[@]} -gt 1 ]]; then
              echo "HATA: Birden fazla tuhaf-kasaba-source.zip bulundu:"
              printf ' - %s\n' "${archives[@]}"
              echo "Yalnizca bir kaynak ZIP dosyasi birakin."
              exit 1
            fi

            archive="${archives[0]}"
            echo "Kaynak paketi aciliyor: $archive"
            unzip -oq "$archive" -d .
          fi

          # Arsiv acildiktan sonra da tum zorunlu dosyalari dogrula.
          missing=()
          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "HATA: Kaynak paketi acildi ancak beklenen dosyalar bulunamadi:"
            printf ' - %s\n' "${missing[@]}"
            echo "ZIP'in icindeki klasor yapisi beklenen dizinlerle uyumlu degil."
            exit 1
          fi

          echo "Animasyon motoru ve 10 bolum hazir."

      - name: YouTube OAuth baglantisini denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          names = ('YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN')
          values = {k: os.getenv(k, '').strip() for k in names}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('Eksik GitHub Secrets: ' + ', '.join(missing))
          response = requests.post('https://oauth2.googleapis.com/token', data={
              'grant_type': 'refresh_token',
              'client_id': values['YOUTUBE_CLIENT_ID'],
              'client_secret': values['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],
          }, timeout=30)
          payload = response.json()
          if not response.ok or not payload.get('access_token'):
              raise SystemExit('YouTube OAuth hatasi: ' + str(payload.get('error')) +
                               ' (' + str(payload.get('error_description', ''))[:180] + ')')
          print('YouTube OAuth testi basarili.')
          PY

      - name: Siradaki bolumu uret ve YouTube'a yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tuhaf-kasaba/run_episode.py

      - name: Video ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuhaf-kasaba-run-${{ github.run_id }}
          path: |
            output/
            work_tuhaf_kasaba/out/
            work_tuhaf_kasaba/stills/preview_sheet.jpg
            work_tuhaf_kasaba/work/words.json
            data/tuhaf_kasaba_history.json
          if-no-files-found: ignore
          retention-days: 14
