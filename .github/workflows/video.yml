                      d.rectangle((x,y,x+27,y+48), fill=(255,205,120,flicker))
                  # A ghost glides across the scene, changing height and opacity.
                  gx=270+115*math.sin(phase*.48)
                  gy=420+38*math.sin(phase*1.1)
                  alpha=145+int(65*(0.5+0.5*math.sin(phase*1.7)))
                  draw_ghost(d,gx,gy,phase,1.05,alpha)
                  # A second shadow briefly appears in a window or behind the house.
                  if math.sin(phase*0.65+scene_no) > 0.12:
                      sx=350+18*math.sin(phase*1.3)
                      d.ellipse((sx-13,500,sx+13,530), fill=(1,3,9,230))
                      d.rounded_rectangle((sx-17,525,sx+17,610), radius=9, fill=(1,3,9,230))
                  # A flashlight beam sweeps over the ground like a moving explorer's torch.
                  beam_x=80+(frame_no*3.2)%(WIDTH+100)-50
                  d.polygon([(beam_x,650),(beam_x-75,900),(beam_x+115,900)], fill=(210,225,245,22))
                  d.ellipse((beam_x-7,635,beam_x+7,649), fill=(255,238,185,235))
                  for i in range(20):
                      px=(i*47+frame_no*(1+i%3)*.65+seed%31)%WIDTH
                      py=(i*83-frame_no*(.45+i%2*.4))%HEIGHT
                      rr=1+(i%3)
                      d.ellipse((px-rr,py-rr,px+rr,py+rr), fill=(190,210,235,90))
              else:
                  if any(k in topic_id for k in ('squid','octopus','cuttlefish','archerfish')):
                      if 'squid' in topic_id or 'octopus' in topic_id or 'cuttlefish' in topic_id:
                          draw_octopus(d,270+35*math.sin(phase*.65),535+18*math.sin(phase),phase,1.0)
                      else:
                          draw_fish(d,245+45*math.sin(phase*.8),520+15*math.sin(phase*1.4),phase,1.3)
                          d.line((290,500,370,470+12*math.sin(phase*2)),fill=(160,225,255,220),width=5)
                  elif any(k in topic_id for k in ('honeybee','monarch','zombie-ant','tardigrade')):
                      # A clearly visible animated insect/creature with moving legs.
                      x=270+65*math.sin(phase*.55); y=570+12*math.sin(phase*2)
                      if 'honeybee' in topic_id:
                          d.ellipse((x-34,y-19,x+35,y+19),fill=(242,184,45,255),outline=(45,35,15,255),width=3)
                          d.line((x-5,y-17,x-5,y+17),fill=(45,35,15,255),width=7)
                          d.line((x+15,y-17,x+15,y+17),fill=(45,35,15,255),width=7)
                          wing=abs(math.sin(phase*8))*18
                          d.ellipse((x-22,y-35-wing,x+2,y-12),fill=(210,245,255,160))
                          d.ellipse((x+2,y-36-wing,x+26,y-12),fill=(210,245,255,160))
                      else:
                          d.ellipse((x-42,y-20,x+42,y+20),fill=(100,150,95,255),outline=(25,50,30,255),width=3)
                          for leg in range(6):
                              lx=x-25+leg*10
                              swing=math.sin(phase*3+leg)*12
                              d.line((lx,y+12,lx-8+swing,y+35),fill=(45,55,35,255),width=4)
                  else:
                      # Moving researcher/explorer in landscape and nature scenes.
                      x=95+((frame_no*2)%330)
                      draw_worker(d,x,790,phase,.78,(35,48,43,255),False)
                  for i in range(16):
                      x=(i*47+frame_no*(1+i%3)*.7)%WIDTH
                      y=(i*89-frame_no*(.8+i%2))%HEIGHT
                      r=2+(i%3)
                      d.ellipse((x-r,y-r,x+r,y+r),outline=(180,235,245,110),width=2)
              # Animated foreground waves for underwater scenes.
              if category=='Dünya' and any(k in topic_id for k in ('ocean','sea','squid','octopus','cuttlefish','fish','hydrothermal','archer','bioluminescence')):
                  for row in range(3):
                      yy=735+row*28
                      points=[]
                      for x in range(0,WIDTH+12,12):
                          points.append((x,yy+8*math.sin(x/35+phase+row)))
                      d.line(points,fill=(70,190,215,85),width=3)
              progress=(frame_no+1)/max(1,total_frames)
              draw_subtitles(d,caption,progress,category,scene_no)
              return img


          def render_animated_clip(scene_no, caption, duration, category, topic_id, seed, output, frame_count=None):
              frames=frame_count if frame_count is not None else max(1,round(duration*FPS))
              bg=make_background(topic_id,category,scene_no,seed)
              cmd=['ffmpeg','-hide_banner','-loglevel','error','-y',
                   '-f','rawvideo','-pix_fmt','rgb24','-s',f'{WIDTH}x{HEIGHT}','-r',str(FPS),'-i','-',
                   '-an','-vf',f'scale={OUTPUT_WIDTH}:{OUTPUT_HEIGHT}:flags=lanczos,format=yuv420p',
                   '-c:v','libx264','-preset','veryfast','-crf','21','-pix_fmt','yuv420p',
                   '-movflags','+faststart',str(output)]
              proc=subprocess.Popen(cmd,stdin=subprocess.PIPE)
              try:
                  for frame_no in range(frames):
                      frame=render_frame(bg,topic_id,category,scene_no,frame_no,frames,caption,seed)
                      proc.stdin.write(frame.tobytes())
                  proc.stdin.close()
                  code=proc.wait()
                  if code:
                      raise RuntimeError(f'FFmpeg animasyon kodu: {code}')
              except Exception:
                  if proc.stdin and not proc.stdin.closed: proc.stdin.close()
                  proc.kill(); proc.wait()
                  raise
              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError(f'{scene_no}. animasyon klibi olusturulamadi.')


          def make_soundtrack(path):
              total=int(TARGET_SECONDS*SAMPLE_RATE)
              t=np.arange(total,dtype=np.float32)/SAMPLE_RATE
              # Original, generated ambient bed; intentionally quiet under narration.
              audio=(0.035*np.sin(2*np.pi*55*t)+0.018*np.sin(2*np.pi*82.41*t)+
                     0.010*np.sin(2*np.pi*110*t)*(0.5+0.5*np.sin(2*np.pi*0.35*t)))
              notes=[329.63,392,493.88,440,392,293.66]
              for i,start in enumerate(np.arange(0.5,TARGET_SECONDS,2.5)):
                  first=int(start*SAMPLE_RATE); size=min(int(1.8*SAMPLE_RATE),total-first)
                  lt=np.arange(size,dtype=np.float32)/SAMPLE_RATE
                  audio[first:first+size]+=0.018*np.sin(2*np.pi*notes[i%len(notes)]*lt)*np.exp(-1.8*lt)
              fade=int(SAMPLE_RATE*1.0)
              audio[:fade]*=np.linspace(0,1,fade); audio[-fade:]*=np.linspace(1,0,fade)
              peak=float(np.max(np.abs(audio)))
              if peak>0: audio*=0.6/peak
              pcm=(np.clip(np.column_stack((audio,audio)),-1,1)*32767).astype('<i2')
              with wave.open(str(path),'wb') as wav:
                  wav.setnchannels(2); wav.setsampwidth(2); wav.setframerate(SAMPLE_RATE); wav.writeframes(pcm.tobytes())


          def youtube_upload(path):
              creds=Credentials(token=None,refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri='https://oauth2.googleapis.com/token',client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,scopes=['https://www.googleapis.com/auth/youtube.upload'])
              creds.refresh(Request())
              youtube=build('youtube','v3',credentials=creds,cache_discovery=False)
              description=(f'{title}\n\n'
                'Gizemli Dünya’da bu kez kısa bir paranormal hikâye anlatıyoruz. '
                'Bu video, özgün 2D hareketli animasyon ve Türkçe seslendirme ile hazırlanmıştır. '
                'Hikâye kurgu ve şehir efsanesi atmosferinde anlatılmıştır; gerçek olduğu iddia edilmez.\n'
                'Sence bu olayın açıklaması ne? Yorumlarda paylaş. Videoyu beğenmeyi ve kanalımıza abone olmayı unutma!\n\n'
                '#Shorts #Paranormal #GizemliHikayeler #KorkuHikayeleri #Gizem')
              body={'snippet':{'title':f'{title} | Paranormal Hikâye #Shorts'[:100],
                'description':description,'tags':['Shorts','Gizemli Dünya','Paranormal','Paranormal Hikayeler','Gizemli Hikayeler','Korku Hikayeleri','Şehir Efsaneleri'],
                'categoryId':'24','defaultLanguage':'tr'},
                'status':{'privacyStatus':YOUTUBE_PRIVACY,'selfDeclaredMadeForKids':False,'containsSyntheticMedia':True}}
              media=MediaFileUpload(str(path),mimetype='video/mp4',chunksize=-1,resumable=True)
              request=youtube.videos().insert(part='snippet,status',body=body,media_body=media)
              result=None; retry=0
              while result is None:
                  try:
                      _,result=request.next_chunk(); retry=0
                  except HttpError as error:
                      if error.resp.status not in (500,502,503,504) or retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
                  except (OSError,ConnectionError):
                      if retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
              youtube_id=result.get('id')
              if not youtube_id: raise RuntimeError('YouTube ID donmedi: '+str(result)[:300])
              return youtube_id


          # Üretim: sabit görsel slayt gösterisi yok; her kare Python ile yeniden çizilir.
          print('1/5 Hareketli 2D sahneler ve Türkçe seslendirme hazırlanıyor...')
          voice,scene_durations=make_voice_tracks()
          # Yuvarlama farklarini duzelterek toplam kare sayisini tam 750 yap.
