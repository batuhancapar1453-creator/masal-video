name: Gizemli Dunya - Ucretsiz Sinematik Sahne Gorselleri

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron saatleri UTC'dir; Turkiye UTC+3: 09:23 ve 20:23 yerel saat.
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-paranormal-shorts-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ve Türkçe çevrimdışı ses motorunu kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pillow edge-tts google-auth google-auth-oauthlib google-api-python-client

      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {key: os.getenv(key, '').strip() for key in (
              'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('Eksik secrets: ' + ', '.join(missing))
          r = requests.post('https://oauth2.googleapis.com/token', data={
              'grant_type': 'refresh_token',
              'client_id': values['YOUTUBE_CLIENT_ID'],
              'client_secret': values['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],
          }, timeout=30)
          info = r.json()
          if not r.ok or not info.get('access_token'):
              raise SystemExit('YouTube OAuth hatasi: ' + str(info.get('error'))
                  + ' (' + str(info.get('error_description'))[:160] + ')')
          print('YouTube OAuth testi basarili; animasyon uretimi baslayabilir.')
          PY

      - name: Hareketli videoyu uret ve YouTube'a yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat > create_video.py <<'PY'
          import os, io, json, time, wave, subprocess, random, math, asyncio
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import edge_tts
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          ROOT = Path.cwd()
          OUT = ROOT / 'output'
          CAPTIONS = OUT / 'captions'
          CLIPS = OUT / 'clips'
          VOICE_DIR = OUT / 'voice'
          HISTORY_FILE = ROOT / 'data' / 'youtube_history.json'
          # Ucretsiz lisansli sahne fotograflari 768x1365 hazirlanir; final video 1080x1920 kodlanir.
          WIDTH, HEIGHT, FPS = 480, 854, 20
          OUTPUT_WIDTH, OUTPUT_HEIGHT = 1080, 1920
          STORY_PAUSE_SECONDS = 0.45
          SCENE_COUNT = 5
          IMAGE_DIR = OUT / 'scene_images'
          SAMPLE_RATE = 22050
          TTS_VOICE = 'tr-TR-AhmetNeural'
          TTS_RATE = '-7%'
          TTS_PITCH = '-12Hz'
          YOUTUBE_CLIENT_ID = os.environ.get('YOUTUBE_CLIENT_ID', '').strip()
          YOUTUBE_CLIENT_SECRET = os.environ.get('YOUTUBE_CLIENT_SECRET', '').strip()
          YOUTUBE_REFRESH_TOKEN = os.environ.get('YOUTUBE_REFRESH_TOKEN', '').strip()
          YOUTUBE_PRIVACY = os.environ.get('YOUTUBE_PRIVACY', 'public').strip()
          CLOUDFLARE_ACCOUNT_ID = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '').strip()
          CLOUDFLARE_API_TOKEN = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()
          CLOUDFLARE_IMAGE_MODEL = '@cf/black-forest-labs/flux-2-klein-4b'
