name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate Turkish story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import time
          import json
          import base64
          import subprocess
          import requests
          from io import BytesIO
          from PIL import Image, ImageStat

          def secret(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(
                      f"{name} is missing from GitHub Actions secrets."
                  )
              return value

          GEMINI_KEY = secret("GEMINI_API_KEY")
          AZURE_KEY = secret("AZURE_SPEECH_KEY")
          AZURE_REGION = secret("AZURE_REGION")
          CF_TOKEN = secret("CLOUDFLARE_API_TOKEN")
          CF_ACCOUNT = secret("CLOUDFLARE_ACCOUNT_ID")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          def request_with_retry(method, url, **kwargs):
              last_response = None

              for attempt in range(6):
                  response = requests.request(
                      method, url, timeout=180, **kwargs
                  )
                  last_response = response

                  if response.status_code not in (
                      429, 500, 502, 503, 504
                  ):
                      return response

                  if attempt < 5:
                      wait_seconds = 10 * (2 ** attempt)
                      print(
                          f"Temporary error {response.status_code}. "
                          f"Waiting {wait_seconds} seconds; "
                          f"attempt {attempt + 2}/6."
                      )
                      time.sleep(wait_seconds)

              return last_response

          def run(command):
              subprocess.run(command, check=True)

          print("1/5 Türkçe masal hazırlanıyor...")

          prompt = """
          Türkçe, 4-8 yaş çocukları için özgün bir uyku masalı yaz.
          Yaklaşık 600-800 kelime olsun.
          Sıcak, güvenli, eğitici ve hayal gücü yüksek olsun.
          Korkutucu veya şiddet içeren sahneler olmasın.
          Ana karakterleri ve mekânları hikâye boyunca tutarlı tut.
          Başlıkla başla. Yalnızca masalı yaz.
          """

          response = request_with_retry(
              "POST",
              GEMINI_URL,
              headers={"Content-Type": "application/json"},
              json={
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }],
                  "generationConfig": {
                      "temperature": 0.85,
                      "maxOutputTokens": 5000
                  }
              }
          )
          response.raise_for_status()

          data = response.json()

          try:
              story = data["candidates"][0]["content"]["parts"][0]["text"]
          except (KeyError, IndexError, TypeError):
              raise RuntimeError(
                  "Gemini returned no story: "
                  + json.dumps(data, ensure_ascii=False)[:1500]
              )

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print("Masal oluşturuldu.")

          print("2/5 Azure ile seslendiriliyor...")

          speech_url = (
              f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          escaped_story = (
              story.replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
          )

          ssml = f"""
          <speak version="1.0"
              xmlns="http://www.w3.org/2001/10/synthesis"
              xml:lang="tr-TR">
            <voice name="tr-TR-EmelNeural">
              <prosody rate="-5%" pitch="+2%">
                {escaped_story}
              </prosody>
            </voice>
          </speak>
          """

          speech_response = request_with_retry(
              "POST",
              speech_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat":
                      "audio-24khz-48kbitrate-mono-mp3",
                  "User-Agent": "MasalVideoGenerator"
              },
              data=ssml.encode("utf-8")
          )

          if not speech_response.ok:
              raise RuntimeError(
                  f"Azure Speech error {speech_response.status_code}: "
                  f"{speech_response.text[:1000]}"
              )

          with open("narration.mp3", "wb") as f:
              f.write(speech_response.content)

          print("Seslendirme oluşturuldu.")

          print("3/5 Daha kaliteli çizimler oluşturuluyor...")

          cf_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )

          prompts = [
              "Cute little orange fox in a magical green forest at sunrise, "
              "professional children's storybook illustration, beautiful "
              "polished digital painting, clear recognizable character, "
              "expressive face, detailed fur, clean outlines, warm natural "
              "colors, cinematic lighting, carefully composed full scene, "
              "no text, no border",

              "A cute little orange fox meeting a friendly brown rabbit "
              "beside colorful wildflowers, professional children's picture "
              "book illustration, recognizable animals, expressive faces, "
              "detailed forest plants, clean shapes, warm natural colors, "
              "polished digital painting, no text, no border",

              "A sparkling blue river flowing through a peaceful enchanted "
              "forest, little orange fox and friendly rabbit near the bank, "
              "professional children's storybook illustration, detailed "
              "trees and flowers, clear composition, rich natural colors, "
              "soft cinematic sunlight, no text, no border",

              "A little orange fox and a friendly rabbit helping a tiny "
              "yellow bird near its nest, heartwarming children's storybook "
              "illustration, clear recognizable characters, detailed "
              "feathers and fur, clean outlines, expressive faces, "
              "beautiful natural colors, no text, no border",

              "Friendly forest animals gathered beneath a magical starry "
              "sky, little orange fox and rabbit in the foreground, "
              "professional bedtime storybook illustration, detailed "
              "characters, glowing stars, deep blue night sky, warm gentle "
              "lighting, polished digital painting, no text, no border",

              "A cozy little cottage surrounded by colorful flowers and "
              "mushrooms in a magical forest, little orange fox and rabbit "
              "standing outside, beautiful children's picture book art, "
              "clear detailed architecture, clean shapes, warm inviting "
              "colors, cinematic lighting, no text, no border",

              "A smiling little orange fox looking up at a beautiful full "
              "moon through forest branches, charming children's bedtime "
              "storybook illustration, clear expressive face, detailed fur, "
              "soft blue moonlight, warm highlights, clean outlines, "
              "polished digital painting, no text, no border",

              "Little orange fox, friendly rabbit and forest animals sleeping "
              "peacefully beneath a starry sky, beautiful children's bedtime "
              "storybook illustration, clear recognizable animals, cozy "
              "dreamy forest, gentle moonlight, detailed clean shapes, "
              "high quality digital painting, no text, no border"
          ]

          image_files = []
          previous_valid_image = None

          for i, image_prompt in enumerate(prompts, start=1):
              print(f"Çizim {i}/{len(prompts)} hazırlanıyor...")

              try:
                  image_response = request_with_retry(
                      "POST",
                      cf_url,
                      headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"
                      },
                      json={
                          "prompt": (
                              image_prompt
                              + ", sharp focus, detailed children's "
                              "storybook illustration, clear recognizable "
                              "characters, balanced composition, high quality"
                          ),
                          "negative_prompt": (
                              "blurry, abstract, muddy colors, color blobs, "
                              "unrecognizable objects, distorted animals, "
                              "extra limbs, deformed faces, messy composition, "
                              "noise, low quality, black border, white border, "
                              "frame, text, logo, watermark"
                          ),
                          "width": 1024,
                          "height": 1024,
                          "num_steps": 20,
                          "guidance": 1.5
                      }
                  )

                  if not image_response.ok:
                      raise RuntimeError(
                          f"Cloudflare image error "
                          f"{image_response.status_code}: "
                          f"{image_response.text[:500]}"
                      )

                  content_type = image_response.headers.get(
                      "content-type", ""
                  )

                  if "image/" in content_type:
                      image_bytes = image_response.content
                  else:
                      result = image_response.json()
                      image_data = result.get("result", {}).get("image")

                      if not image_data:
                          raise RuntimeError(
                              "Cloudflare did not return image data: "
                              + json.dumps(
                                  result, ensure_ascii=False
                              )[:500]
                          )

                      image_bytes = base64.b64decode(image_data)

                  image = Image.open(BytesIO(image_bytes)).convert("RGB")

                  if image.width < 512 or image.height < 512:
                      raise RuntimeError(
                          f"Image resolution too small: {image.size}"
                      )

                  if ImageStat.Stat(image).stddev[0] < 8:
                      raise RuntimeError(
                          "Image appears nearly blank or lacks detail."
                      )

                  filename = f"image_{i:02d}.png"
                  image.save(filename, format="PNG", optimize=True)
                  image_files.append(filename)
                  previous_valid_image = filename

              except Exception as error:
                  print(f"Çizim {i} üretilemedi: {error}")

                  if previous_valid_image:
                      import shutil
                      filename = f"image_{i:02d}.png"
                      shutil.copyfile(previous_valid_image, filename)
                      image_files.append(filename)
                      print("Önceki geçerli çizim kullanıldı.")
                  else:
                      raise RuntimeError(
                          "İlk çizim üretilemedi; video oluşturulamıyor."
                      ) from error

          print("Çizimler hazır.")

          print("4/5 Video hazırlanıyor...")

          clips = []

          for i, filename in enumerate(image_files, start=1):
              clip = f"clip_{i:02d}.mp4"

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", filename,
                  "-f", "lavfi",
                  "-i",
                  "anullsrc=channel_layout=stereo:sample_rate=48000",
                  "-t", "7",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,"
                  "setsar=1,format=yuv420p",
                  "-r", "24",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",
                  "-shortest",
                  clip
              ])

              clips.append(clip)

          with open("clips.txt", "w", encoding="utf-8") as f:
              for clip in clips:
                  f.write(f"file '{clip}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "clips.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          duration_result = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "narration.mp3"
          ], capture_output=True, text=True, check=True)

          narration_duration = float(duration_result.stdout.strip())

          run([
              "ffmpeg", "-y",
              "-stream_loop", "-1",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-t", str(narration_duration),
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,format=yuv420p",
              "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-c:a", "aac",
              "-b:a", "192k",
              "-ar", "48000",
              "-ac", "2",
              "-shortest",
              "-movflags", "+faststart",
              "masal-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,width,height",
              "-of", "json",
              "masal-video.mp4"
          ], text=True)

          streams = json.loads(probe).get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" not in stream_types:
              raise RuntimeError("Videoda ses akışı bulunamadı.")

          size = os.path.getsize("masal-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "masal-video.mp4",
              "-f", "null", "-"
          ])

          print("5/5 Video başarıyla oluşturuldu!")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Görüntü ve ses akışları doğrulandı.")
          PY

          python create_video.py

      - name: Upload video and story
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
          if-no-files-found: error
          retention-days: 7
