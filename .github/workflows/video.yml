          def make_soundtrack(path):
              duration = (
                  SCENE_COUNT * SCENE_SECONDS
              )

              count = duration * SAMPLE_RATE

              t = (
                  np.arange(
                      count,
                      dtype=np.float32
                  ) / SAMPLE_RATE
              )

              audio = (
                  0.11 * np.sin(
                      2 * np.pi * 55 * t
                  )
                  + 0.055 * np.sin(
                      2 * np.pi * 82.41 * t
                  )
                  + 0.025
                  * np.sin(
                      2 * np.pi * 110 * t
                  )
                  * (
                      0.5
                      + 0.5 * np.sin(
                          2 * np.pi * 0.48 * t
                      )
                  )
              )

              notes = [
                  329.63,
                  392,
                  493.88,
                  440,
                  392,
                  293.66
              ]

              for i, start in enumerate(
                  np.arange(
                      0.5,
                      duration,
                      2.5
                  )
              ):
                  first = int(
                      start * SAMPLE_RATE
                  )

                  size = min(
                      int(2.1 * SAMPLE_RATE),
                      count - first
                  )

                  local_t = (
                      np.arange(
                          size,
                          dtype=np.float32
                      ) / SAMPLE_RATE
                  )

                  note = notes[
                      i % len(notes)
                  ]

                  bell = (
                      0.07
                      * np.sin(
                          2 * np.pi * note * local_t
                      )
                      * np.exp(-1.6 * local_t)
                  )

                  audio[
                      first:first + size
                  ] += bell

              rng = np.random.default_rng(987)

              for second in range(
                  SCENE_SECONDS,
                  duration,
                  SCENE_SECONDS
              ):
                  first = int(
                      (second - 0.2) * SAMPLE_RATE
                  )

                  size = min(
                      int(0.4 * SAMPLE_RATE),
                      count - first
                  )

                  noise = rng.normal(
                      0, 1, size
                  ).astype(np.float32)

                  envelope = np.sin(
                      np.linspace(
                          0,
                          np.pi,
                          size
                      )
                  )

                  audio[
                      first:first + size
                  ] += noise * envelope * 0.03

              fade = int(
                  SAMPLE_RATE * 1.2
              )

              audio[:fade] *= np.linspace(
                  0, 1, fade
              )

              audio[-fade:] *= np.linspace(
                  1, 0, fade
              )

              peak = float(
                  np.max(np.abs(audio))
              )

              if peak > 0:
                  audio *= 0.7 / peak

              stereo = np.column_stack(
                  (audio, audio)
              )

              pcm = (
                  np.clip(
                      stereo, -1, 1
                  ) * 32767
              ).astype("<i2")

              with wave.open(
                  str(path),
                  "wb"
              ) as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(SAMPLE_RATE)
                  wav.writeframes(pcm.tobytes())

