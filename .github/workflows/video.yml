          silent=OUT/'silent.mp4'
          run_ffmpeg(['-f','concat','-safe','0','-i',str(concat),'-c','copy','-an',str(silent)])
          final=ROOT/'gizemli-dunya-video.mp4'
          run_ffmpeg(['-i',str(silent),'-i',str(voice),'-i',str(sound),
              '-filter_complex','[1:a]volume=1.0[voice];[2:a]volume=0.16[music];[voice][music]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.95[a]',
              '-map','0:v:0','-map','[a]','-shortest','-c:v','copy','-c:a','aac','-b:a','160k',
              '-movflags','+faststart',str(final)])
          # Upload gate: every planned beat must have its own valid, distinct, sourced photograph.
          generated_images = sorted(IMAGE_DIR.glob('scene_*.jpg'))
          if len(generated_images) != SCENE_COUNT:
              raise RuntimeError(f'Sahne fotografi sayisi hatali: {len(generated_images)}/{SCENE_COUNT}. YouTube yuklemesi engellendi.')
          approved_hashes = []
          for image_path in generated_images:
              with Image.open(image_path) as check_img:
                  check_img.verify()
              with Image.open(image_path) as check_img:
                  check_img = check_img.convert('RGB')
                  if check_img.size != (768, 1365):
                      raise RuntimeError(f'Sahne boyutu hatali: {image_path.name} {check_img.size}')
                  h = image_dhash(check_img)
                  if any(hamming_distance(h, old) < 7 for old in approved_hashes):
                      raise RuntimeError(f'Benzer/tekrar sahne fotografi bulundu: {image_path.name}. Yayin engellendi.')
                  approved_hashes.append(h)
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(final)],text=True))
          streams=info.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams): raise RuntimeError('Videoda goruntu akisi yok.')
          if not any(s.get('codec_type')=='audio' for s in streams): raise RuntimeError('Videoda ses akisi yok.')
          duration=float(info['format']['duration'])
