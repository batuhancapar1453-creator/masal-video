name: Gizemli Dunya - Ucretsiz Sinematik Sahne Gorselleri
on:
  workflow_dispatch: null
  schedule:
  - cron: 23 6,17 * * *
permissions:
  contents: write
concurrency:
  group: youtube-paranormal-shorts-publisher
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: true
    - name: Python kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: FFmpeg ve Türkçe çevrimdışı ses motorunu kur
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng tesseract-ocr

        '
    - name: Python bagimliliklarini kur
      run: 'python -m pip install --upgrade pip

        python -m pip install requests numpy pillow pytesseract opencv-python-headless edge-tts google-auth google-auth-oauthlib google-api-python-client

        '
    - name: YouTube OAuth baglantisini onceden denetle
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: "python - <<'PY'\nimport os, requests\nvalues = {key: os.getenv(key, '').strip() for key in (\n    'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'\n)}\nmissing = [k for k, v in values.items() if not v]\nif missing:\n    raise SystemExit('Eksik secrets: ' + ', '.join(missing))\nr = requests.post('https://oauth2.googleapis.com/token', data={\n    'grant_type': 'refresh_token',\n    'client_id': values['YOUTUBE_CLIENT_ID'],\n    'client_secret': values['YOUTUBE_CLIENT_SECRET'],\n    'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],\n}, timeout=30)\ninfo = r.json()\nif not r.ok or not info.get('access_token'):\n    raise SystemExit('YouTube OAuth hatasi: ' + str(info.get('error'))\n        + ' (' + str(info.get('error_description'))[:160] + ')')\nprint('YouTube OAuth testi basarili; animasyon uretimi baslayabilir.')\nPY\n"
    - name: Hareketli videoyu uret ve YouTube'a yukle
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PRIVACY: public
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: "cat > create_video.py <<'PY'\nimport os, io, json, time, wave, subprocess, random, math, asyncio\nfrom pathlib import Path\nfrom datetime import datetime\nfrom zoneinfo import ZoneInfo\nimport requests\nimport numpy as np\nfrom PIL import Image, ImageDraw, ImageFont, ImageOps\nimport edge_tts\nfrom google.oauth2.credentials import Credentials\nfrom google.auth.transport.requests import Request\nfrom googleapiclient.discovery import build\nfrom googleapiclient.http import MediaFileUpload\nfrom googleapiclient.errors import HttpError\n\nROOT = Path.cwd()\nOUT = ROOT / 'output'\nCAPTIONS = OUT / 'captions'\nCLIPS = OUT / 'clips'\nVOICE_DIR = OUT / 'voice'\nHISTORY_FILE = ROOT / 'data' / 'youtube_history.json'\n# Ucretsiz lisansli sahne fotograflari 768x1365 hazirlanir; final video 1080x1920 kodlanir.\nWIDTH, HEIGHT, FPS = 480, 854, 20\nOUTPUT_WIDTH, OUTPUT_HEIGHT = 1080, 1920\nSTORY_PAUSE_SECONDS = 0.45\nSCENE_COUNT = 10\nVOICE_BEAT_COUNT = 4\nVISUALS_PER_BEAT = 2\nCTA_TEXT = 'Bu hikayeyi begendiysen begen tusuna basmayi ve Gizemli Dunya kanalina abone olmayi unutma.'\nIMAGE_DIR = OUT / 'scene_images'\nSAMPLE_RATE = 22050\nTTS_VOICE = 'tr-TR-AhmetNeural'\nTTS_RATE = '-7%'\nTTS_PITCH = '-12Hz'\nYOUTUBE_CLIENT_ID = os.environ.get('YOUTUBE_CLIENT_ID', '').strip()\nYOUTUBE_CLIENT_SECRET = os.environ.get('YOUTUBE_CLIENT_SECRET', '').strip()\nYOUTUBE_REFRESH_TOKEN = os.environ.get('YOUTUBE_REFRESH_TOKEN', '').strip()\nYOUTUBE_PRIVACY = os.environ.get('YOUTUBE_PRIVACY', 'public').strip()\nCLOUDFLARE_ACCOUNT_ID = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '').strip()\nCLOUDFLARE_API_TOKEN = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()\nCLOUDFLARE_IMAGE_MODEL = '@cf/black-forest-labs/flux-2-klein-4b'\nRUN_EVENT = os.environ.get('GITHUB_EVENT_NAME', 'workflow_dispatch')\nRUN_ID = os.environ.get('GITHUB_RUN_ID', 'local')\n\nVISUAL_KIND_BY_TOPIC = {\n    'story-bedroom-double': 'bedroom',\n    'paranormal-0317-phone': 'phone',\n    'paranormal-thirteenth-room': 'hotel',\n    'paranormal-late-mirror': 'mirror',\n    'paranormal-three-knocks': 'forest',\n    'paranormal-ghost-train': 'train',\n    'paranormal-lighthouse': 'lighthouse',\n    'paranormal-attic-steps': 'attic',\n    'paranormal-stranger-photo': 'photo',\n    'paranormal-moving-chair': 'chair',\n    'paranormal-hospital-hall': 'hospital',\n    'paranormal-zero-floor': 'elevator',\n    'paranormal-village-bell': 'bell',\n    'paranormal-door-light': 'door',\n    'paranormal-piano': 'piano',\n    'paranormal-wall-whisper': 'wall',\n    'paranormal-ghost-ship': 'ship',\n    'paranormal-red-window': 'window',\n    'paranormal-shared-dream': 'dream',\n    'paranormal-missing-passenger': 'busstop',\n    'paranormal-umbrella': 'umbrella',\n    'paranormal-last-cassette': 'cassette',\n    'paranormal-empty-class': 'classroom',\n    'paranormal-night-shop': 'shop',\n    'paranormal-bridge-shadow': 'bridge',\n    'paranormal-thirteen-clock': 'clock',\n    'paranormal-snow-cabin': 'cabin',\n    'paranormal-lost-number': 'phonebook',\n    'paranormal-bus-stop-woman': 'missing_passenger',\n    'paranormal-museum-steps': 'museum',\n    'paranormal-lantern': 'lantern',\n    'paranormal-rain-house': 'rainhouse',\n    'paranormal-empty-playground': 'swing',\n    'paranormal-last-bus': 'bus',\n    'paranormal-rooftop-steps': 'rooftop',\n    'paranormal-street-silhouette': 'silhouette',\n    'paranormal-self-opening-door': 'door_self',\n    'paranormal-carousel': 'carousel',\n    'paranormal-lake-light': 'lake',\n    'paranormal-station-announcement': 'station',\n    'paranormal-basement-door': 'basement',\n    'paranormal-village-map': 'map',\n    'paranormal-night-photo': 'camera',\n    'paranormal-cold-spot': 'coldspot',\n    'paranormal-window-fingerprints': 'fingerprints',\n    'paranormal-old-key': 'key',\n    'paranormal-third-floor': 'elevator_zero',\n    'paranormal-pine-forest': 'pine_forest',\n    'paranormal-empty-cinema': 'cinema',\n    'paranormal-library-book': 'book',\n    'paranormal-window-face': 'window_face',\n    'paranormal-doorbell': 'doorbell',\n    'paranormal-fog-road': 'road',\n    'paranormal-dancing-shadow': 'shadow',\n    'paranormal-radio-time': 'radio',\n    'paranormal-clock-thirteen': 'clock_backwards',\n    'paranormal-warm-tea': 'tea',\n    'paranormal-photo-album': 'album',\n    'paranormal-hidden-room': 'hiddenroom',\n    'paranormal-last-ferry': 'ferry',\n    'paranormal-footprints': 'footprints',\n}\n\ndef paranormal_visual_kind(topic_id, topic_title=''):\n    \"\"\"Choose a visual world for each story; new topics get a keyword-based fallback.\"\"\"\n    if topic_id in VISUAL_KIND_BY_TOPIC:\n        return VISUAL_KIND_BY_TOPIC[topic_id]\n    text_value = (str(topic_id) + ' ' + str(topic_title)).lower()\n    rules = (\n        (('telefon', 'phone', 'numara'), 'phone'),\n        (('ayna', 'mirror'), 'mirror'),\n        (('tren', 'train', 'istasyon'), 'train'),\n        (('orman', 'forest', 'ağaç'), 'forest'),\n        (('deniz feneri', 'lighthouse'), 'lighthouse'),\n        (('gemi', 'feribot', 'ferry', 'ship'), 'ship'),\n        (('otobüs', 'bus', 'durak'), 'bus'),\n        (('saat', 'clock', 'vuruş'), 'clock'),\n        (('kapı', 'door', 'zil'), 'door'),\n        (('pencere', 'window'), 'window'),\n        (('kitap', 'kütüphane', 'book'), 'book'),\n        (('fotoğraf', 'foto', 'camera'), 'photo'),\n        (('radyo', 'radio'), 'radio'),\n        (('kaset', 'cassette'), 'cassette'),\n        (('salıncak', 'playground'), 'swing'),\n        (('göl', 'lake'), 'lake'),\n        (('sisli yol', 'road'), 'road'),\n        (('anahtar', 'key'), 'key'),\n        (('hastane', 'hospital'), 'hospital'),\n        (('asansör', 'elevator', 'kat'), 'elevator'),\n    )\n    for keywords, kind in rules:\n        if any(word in text_value for word in keywords):\n            return kind\n    return 'haunted_room'\n\nTOPICS = [\n  [\"story-bedroom-double\", \"Yatağımda Kim Var?\", \"Korku Hikayesi\", [\n    \"Gece yarısı baba, yedi yaşındaki oğluna iyi geceler demek için odasına girdi. Çocuk yorganın altında yatıyordu. Yüzünde, babasının daha önce hiç görmediği tuhaf bir gülümseme vardı.\",\n    \"“Bugün neden bu kadar sessizsin?” diye sordu baba. Çocuk gözlerini kırpmadan, “Baba, yatağımın altında bir şey var. Bakabilir misin?” dedi. Baba eğilmeden önce çocuğun elini tuttu; eli buz gibiydi.\",\n    \"Baba yatağın altına baktığında karanlıkta bir çift göz gördü. Orada, pijamaları içindeki gerçek oğlu yatıyordu. Çocuk ağlamamak için ağzını kapatmıştı. “Baba,” diye fısıldadı, “yatağımda benim gibi görünen biri var.”\",\n    \"Baba yavaşça doğruldu. Yatakta oturan şey hâlâ gülümsüyordu. “Baba, neden yere bakıyorsun?” dedi. Sonra babasının sesini taklit ederek ekledi: “Oğlum, yatağın altına saklanma. Orası benim yerim.”\",\n  ]],\n  [\"story-0317-call\", \"03.17'de Annemin Sesi\", \"Korku Hikayesi\", [\n    \"Deniz, annesini üç yıl önce kaybetmişti. O gece telefonu tam 03.17’de çaldı. Ekranda annesinin eski numarası yazıyordu. Önce kapatmak istedi, sonra titreyen parmağıyla aramayı açtı.\",\n    \"Karşıdan annesinin sesi geldi: “Oğlum, kapıyı açma. Ben dışarıda değilim.” Deniz dondu. Çünkü aynı anda apartman kapısına üç kez vuruldu ve annesinin sesi koridordan, “Deniz, benim, aç kapıyı,” diye seslendi.\",\n    \"Telefon hâlâ kulağındaydı. İçerideki ses ağlamaya başladı: “Beni dinle. Dışarıdaki şey benim sesimi kullanıyor.” Deniz kapı dürbününden baktı. Koridor boştu; ama kapının altından içeriye doğru ıslak ayak izleri uzanıyordu.\",\n    \"Telefonun sesi birden kesildi. Ardından annesinin sesi bu kez Deniz'in arkasından geldi: “Aferin oğlum. Kapıyı açmadın.” Deniz yavaşça döndü. Telefon ekranında arama hâlâ sürüyordu; arayan numara ise kendi numarasıydı.\",\n  ]],\n  [\"story-hotel-room\", \"Otelin Olmayan Odası\", \"Korku Hikayesi\", [\n    \"Gece vardiyasındaki resepsiyonist, otelde yalnızca on iki oda bulunduğunu biliyordu. Saat 02.10’da asansörden çıkan yaşlı bir adam, 13 numaralı odanın anahtarını istedi. Adamın elindeki rezervasyon kâğıdı yirmi yıl öncesine aitti.\",\n    \"Resepsiyonist nazikçe odanın olmadığını söyledi. Yaşlı adam, “Her gece var,” diye cevap verdi. Sonra koridorun sonundaki duvarı gösterdi. Resepsiyonist baktığında orada, az önce olmayan bir kapı duruyordu.\",\n    \"Kapıyı açtıklarında içeride eski bir oda, tozlu bir yatak ve duvarda resepsiyonistin çocukluk fotoğrafı vardı. Fotoğrafta küçük kız, otel lobisinde aynı yaşlı adamın elini tutuyordu.\",\n    \"Resepsiyonist geri çekildi. Yaşlı adam fısıldadı: “Beni hatırladın mı? O gece seni odadan çıkarmıştım.” Kadın fotoğrafın arkasını çevirdi. Tarih, kendi doğumundan on yıl öncesini gösteriyordu.\",\n  ]],\n  [\"story-mirror\", \"Aynadaki Geç Kalan\", \"Korku Hikayesi\", [\n    \"Emre, banyoda dişlerini fırçalarken aynadaki yansımasının gözlerini kendisinden geç kırptığını fark etti. Uykusuz olduğunu düşündü. Başını sağa çevirdi, aynadaki görüntü bir saniye sonra onu takip etti.\",\n    \"Telefonunu lavaboya dayayıp video kaydını açtı. Bu kez aynaya el salladı. Kayıtta yansıma hiç hareket etmedi; Emre elini indirdikten sonra görüntü yavaşça gülümsedi.\",\n    \"Emre banyodan çıktı ve kapıyı kilitledi. İçeriden musluk açıldı. Aynaya bakmamaya çalışırken telefonuna yeni bir video bildirimi geldi. Kayıtta, aynadaki görüntü kameraya yaklaşıp cama içeriden vuruyordu.\",\n    \"Sonra banyodaki kapı kolu aşağı indi. Emre kaçmak için merdivene yöneldi. Telefonundaki son karede aynadaki yansıma artık banyoda değildi; koridorda, tam arkasında duruyordu.\",\n  ]],\n  [\"story-cabin\", \"Dağ Evindeki Misafir\", \"Korku Hikayesi\", [\n    \"Kar fırtınası yüzünden dağ evinde mahsur kalan Elif, gece kapının çalındığını duydu. Dışarıda kimse yoktu. Eşi, “Rüzgârdır,” dedi. Ama kapının önündeki karın üzerinde eve doğru gelen tek bir ayak izi vardı.\",\n    \"Bir süre sonra üst kattan bir sandalye sürüklenme sesi geldi. Evde yalnızca ikisi vardı. Elif eşine baktı; o da sesi duymuştu. “Yukarıda kim var?” diye seslendi. Cevap gelmedi.\",\n    \"Telefon çekmediği için eşini aşağıda bırakıp merdivenleri çıktı. Yatak odasının kapısı aralıktı. İçeride, kendi montunu giymiş biri pencereye sırtı dönük duruyordu. Elif adını söylediğinde o kişi başını çevirmedi.\",\n    \"Alt kattan eşi bağırdı: “Elif, sakın içeri girme! Ben hâlâ kapının önündeyim!” Elif'in önündeki kişi yavaşça döndü. Yüzü eşinin yüzüydü; ama ağzı hiç kıpırdamadan onun sesiyle konuştu: “Hangimize inanacaksın?”\",\n  ]],\n  [\"story-baby-monitor\", \"Bebek Telsizindeki Ninni\", \"Korku Hikayesi\", [\n    \"Yeni anne Zeynep, bebeği uyuduktan sonra telsizi açıp mutfağa geçti. Gece yarısı cihazdan hafif bir ninni duyuldu. Eşi uyuyordu; evde ninni söyleyen başka kimse yoktu.\",\n    \"Zeynep odaya girdiğinde bebek gözleri açık şekilde tavana bakıyordu. Telsizden aynı melodi devam etti. Bu kez şarkının arasında bir kadın, “Birazdan kapıyı açacak,” diye fısıldadı.\",\n    \"Zeynep cihazı kapattı. Ninni bu kez bebeğin odasındaki dolabın içinden duyuldu. Dolabı açtığında yalnızca battaniyeler vardı. En alttaki battaniyenin altında, kendi çocukluğundan kalma eski bir bebek telsizi buldu.\",\n    \"Eski cihazın hoparlöründen kendi sesi yükseldi: “Zeynep, sakın bebeği kucağına alma.” Tam o sırada beşikteki bebek, annesinin sesiyle fısıldadı: “Geç kaldın.”\",\n  ]],\n  [\"story-last-train\", \"Son Trenin Yolcusu\", \"Korku Hikayesi\", [\n    \"Son trenin makinisti Murat, boş vagonda tek bir yolcu gördü. Adam eski model bir palto giymiş, yüzünü camdan dışarı çevirmişti. Bilet kontrolü için yanına gittiğinde adam başını kaldırmadan, “Bu sefer durmayın,” dedi.\",\n    \"Murat istasyon listesine baktı. Bir sonraki durak on beş yıldır kapalıydı. Telsizden merkeze sordu; cevap alamadı. Tren yavaşlamaya başladığında yolcu ayağa kalktı ve “Burada inmem gerekiyor,” dedi.\",\n    \"Kapılar açıldı. Peronda onlarca kişi sessizce bekliyordu. Hepsi aynı eski fotoğraftaki insanlara benziyordu. Murat fotoğrafı yıllar önce kaybolan babasının cüzdanında görmüştü.\",\n    \"Yolcu inerken Murat'a döndü. Adam babasıydı. “O gece treni sen kullanıyordun,” dedi. Murat irkildi; çünkü o kazada makinist değil, kurtulan tek yolcuydu.\",\n  ]],\n  [\"story-neighbor\", \"Üst Kattaki Komşu\", \"Korku Hikayesi\", [\n    \"Selin, yeni taşındığı dairede her gece saat 01.00'de üst kattan sandalye çekilme sesi duyuyordu. Yöneticiye sorduğunda üst katın yıllardır boş olduğunu öğrendi. Yine de her gece aynı ses tekrarlanıyordu.\",\n    \"Bir akşam tavana vurup sesin kesilmesini bekledi. Üç saniye sonra tavandan üç kez vuruldu. Ertesi gece tavana “Yeter,” diye bağırdı. Bu kez yukarıdan kendi sesiyle “Yeter,” cevabı geldi.\",\n    \"Selin telefonunu kayda aldı ve koridora çıktı. Üst katın kapısı aralıktı. İçeride kendi dairesinin aynısı vardı; aynı koltuk, aynı perde, aynı masada duran telefon. Telefon ekranında canlı kayıt açıktı.\",\n    \"Kayda baktığında kendisini kapının önünde görüyordu. Görüntüdeki Selin başını kaldırıp kameraya baktı ve fısıldadı: “Aşağı inme. Ben zaten aşağıdayım.”\",\n  ]],\n  [\"story-photo\", \"Aile Fotoğrafındaki Çocuk\", \"Korku Hikayesi\", [\n    \"Bir taşınma sırasında bulunan eski aile fotoğrafında, herkesin arkasında tanımadıkları küçük bir çocuk duruyordu. Fotoğrafın çekildiği gün ailede yalnızca dört kişi vardı. Çocuk, kameraya değil evin penceresine bakıyordu.\",\n    \"Anne fotoğrafı büyüttü. Çocuğun yüzü, yıllar önce kaybolan komşu çocukla aynıydı. Babası fotoğrafı çöpe attı ve konuyu kapattı. O gece fotoğraf, salon masasının üzerinde yeniden belirdi.\",\n    \"Ertesi sabah fotoğraftaki çocuk biraz daha yakındı. Sonraki gün aile üyelerinin arasına girmişti. Her gece görüntüdeki mesafe azalıyordu. Aile fotoğrafı kilitli çekmeceye koydu.\",\n    \"Bir hafta sonra fotoğrafta yalnızca boş salon vardı. Aile rahatladı. Sonra küçük kızları, “Anne, fotoğraftaki çocuk neden artık bizimle kahvaltı ediyor?” diye sordu.\",\n  ]],\n  [\"story-hospital\", \"Boş Hastanedeki Oda\", \"Korku Hikayesi\", [\n    \"Gece güvenlik görevlisi Cem, kapatılmış hastanede her gece aynı odadan çağrı zili sesi duyuyordu. Oda 214'ün elektriği kesilmişti. İlk gece kontrol ettiğinde yatak boştu, zil kablosu ise duvardan sökülmüştü.\",\n    \"Üçüncü gece kapının altından ışık sızdı. İçeri girdiğinde monitör çalışıyordu. Ekranda kalp ritmi vardı; yatakta kimse yoktu. Monitörün yanındaki dosyada kendi adı ve o geceki tarih yazıyordu.\",\n    \"Cem telsizle yardım istedi. Merkezden gelen ses, “O hastanede görevli değilsin,” dedi. “Sen 214 numaralı hastasın.” Cem dosyayı açtı; içinde yıllar önce geçirdiği kazanın raporu vardı.\",\n    \"Kapıya koştu ama koridor yerine hastane yatağında uyandığını gördü. Başucundaki hemşire gözlerini açtı: “Sonunda uyandın.” Sonra monitör düz çizgiye geçti.\",\n  ]],\n  [\"story-elevator\", \"Asansörün Durdurduğu Kat\", \"Korku Hikayesi\", [\n    \"Gece eve dönen Barış, asansörde yalnızdı. Düğmelere basmadığı hâlde kabin bodrumun altında durdu. Ekranda eksi bir yerine “0” yazıyordu. Kapılar açılınca kendi apartmanının karanlık bir kopyasını gördü.\",\n    \"Koridorda aynı kapılar vardı ama daire numaraları tersti. Kendi kapısının önünde çocukluğundaki kırmızı bisiklet duruyordu. Bisikleti yirmi yıl önce kaybolmuştu. İçeriden annesinin sesi geldi: “Barış, geç kaldın.”\",\n    \"Annesi yıllar önce ölmüştü. Asansöre geri koştu, fakat kapılar kapanmadı. Koridorun sonunda kendisine benzeyen bir adam belirdi ve “Bu sefer sen kal,” dedi.\",\n    \"Barış sonunda asansöre bindi. Normal kata çıktığında güvenlik görevlisi onu görünce şaşırdı: “Az önce senin cenazenden dönüyorduk.” Kamera kayıtlarında asansöre binen kimse görünmüyordu.\",\n  ]],\n  [\"story-forest\", \"Ormandaki Telefon\", \"Korku Hikayesi\", [\n    \"İki arkadaş yürüyüşte yollarını kaybetti. Telefon çekmiyordu. Yerde çamura bulanmış eski bir telefon buldular. Ekranı çatlak olmasına rağmen çalışıyordu ve tek bir numaradan arama geliyordu.\",\n    \"Aramayı açınca kendi seslerinden biri duyuldu: “Sakın patikadan ayrılmayın.” Arkadaşlar birbirine baktı. Ses, birkaç saniye sonra yanlarında yaşanacak tartışmayı kelimesi kelimesine anlattı.\",\n    \"Telefon yeniden çaldı. Bu kez ses ağlıyordu: “Biri arkamızda. Sakın dönmeyin.” İkisi de koşmaya başladı. Ağaçların arasında üçüncü birinin ayak sesleri onlarla aynı hızda ilerliyordu.\",\n    \"Yola çıktıklarında telefon sustu. Ekranda yeni bir fotoğraf belirdi: İkisi ormanda yürürken çekilmişti. Fotoğrafın arkasında, yüzü kameraya dönük üçüncü arkadaşları duruyordu. Oysa yanlarında yalnızca ikisi vardı.\",\n  ]],\n  [\"story-door\", \"Kapıyı Açan Kimdi?\", \"Korku Hikayesi\", [\n    \"Gece vardiyasından dönen Mert, evinin kapısının içeriden kilitlendiğini fark etti. Eşi evdeydi; anahtarı çevirdiğinde kapı açılmadı. İçeriden eşi, “Bir dakika, kapıyı ben açayım,” diye seslendi.\",\n    \"Kapı açıldığında eşi koridorda duruyordu. Mert içeri girdi, ayakkabılarını çıkardı. Tam o sırada telefonuna eşinden mesaj geldi: “Neredesin? Kapıyı çalmanı bekliyorum.”\",\n    \"Mert mesajı okurken karşısındaki kadın gülümsedi. “Telefonunu kapat,” dedi. “O sana yazamaz.” Mert geri çekildi. Kadının ayakları yerde değil, birkaç santim yukarıda duruyordu.\",\n    \"Kapının dışından gerçek eşinin sesi geldi: “Mert, sakın içeridekiyle konuşma!” Mert kapıya koştu. Arkasındaki kadın, bu kez kendi sesiyle fısıldadı: “Beni dışarıda bırakma. Sen beni içeri aldın.”\",\n  ]],\n  [\"story-radio\", \"Radyodaki Son Haber\", \"Korku Hikayesi\", [\n    \"Gece araba kullanan Ozan, eski radyosunda kendi adını duydu. Spiker, “Saat 02.40'ta şehir çıkışında meydana gelen kazada sürücü Ozan Yılmaz hayatını kaybetti,” diyordu. Saat henüz 02.12'ydi.\",\n    \"Ozan radyoyu kapattı. Telefonundan haber sitelerine baktı; hiçbir şey yoktu. Birkaç kilometre sonra spiker tekrar konuştu: “Sürücü şu anda sağ şeritte, farları yanmayan beyaz bir kamyonun arkasında.”\",\n    \"Ozan aynadan baktı. Beyaz kamyon gerçekten arkasındaydı. Hızlandı, ama kamyon da hızlandı. Radyodaki spiker bu kez kazanın nasıl olacağını anlattı: “Bir sonraki virajda direksiyon kilitlenecek.”\",\n    \"Ozan viraja girmeden durdu. Kamyon yanından geçerken sürücüsünün yüzünü gördü. Direksiyonda kendisi oturuyordu; başını çevirip radyodaki sesiyle “Yayını dinlemeye devam et,” dedi.\",\n  ]],\n  [\"story-basement\", \"Bodrumdaki Çocuk\", \"Korku Hikayesi\", [\n    \"Ev sahibi tadilat için bodruma indiğinde duvarın arkasından çocuk ağlaması duydu. Duvarı açtırdı; arkasında eski bir merdiven ve küçük bir kapı vardı. Evin planında böyle bir bölüm görünmüyordu.\",\n    \"Kapının ardında çocuk odası vardı. Yerde oyuncak araba, masada yarım kalmış bir resim duruyordu. Resimde evin bugünkü hâli çizilmişti; pencerede ise bodruma inen bir adam vardı.\",\n    \"Adam resmi eline alınca arkasından küçük bir ses geldi: “Babam nerede?” Döndüğünde odada kimse yoktu. Kapının dışından kendi çocukluk lakabını duyan adam dondu kaldı.\",\n    \"Yukarı çıkıp eşiyle konuştu. Eşi, “Bizim çocuğumuz olmadı,” dedi. Adam itiraz edecekti ki eşinin elindeki eski fotoğrafı gördü. Fotoğrafta, bodrumdaki resimdeki çocukla yan yana kendisi duruyordu.\",\n  ]],\n  [\"story-window\", \"Penceredeki Kadın\", \"Korku Hikayesi\", [\n    \"Her gece karşı apartmanın aynı penceresinde bir kadın duruyordu. Perde aralığından sokağı izliyor, ışıklar sönene kadar kıpırdamıyordu. Ece, komşusuna kadını sorduğunda o dairede kimsenin yaşamadığını öğrendi.\",\n    \"Bir gece kadın elini cama koydu. Ece de istemsizce elini kendi penceresine koydu. Kadın başını yana eğdi ve dudaklarını oynattı: “Arkanda.” Ece hızla döndü; odada kimse yoktu.\",\n    \"Ertesi akşam pencerenin önüne kamera koydu. Kayıtta karşı daire boştu. Ancak kendi odasının camında, Ece'nin arkasında duran başka bir kadın görünüyordu.\",\n    \"Ece kaydı durdurup arkasına baktı. Oda boştu. Telefonuna karşı apartmandan bir mesaj geldi: “Bu gece pencereye çıkma. Seni gören kadın ben değilim.” Mesajı gönderen kişi, kendi telefon numarasıydı.\",\n  ]],\n  [\"story-taxi\", \"Son Yolcu\", \"Korku Hikayesi\", [\n    \"Taksi şoförü Hakan, yağmurlu gecede mezarlık önünden bir kadın aldı. Kadın adres vermedi; yalnızca “Beni eve götürün, ama aynaya bakmayın,” dedi. Hakan bunun tuhaf bir şaka olduğunu düşündü.\",\n    \"Yol boyunca kadın hiç konuşmadı. Dikiz aynasında arka koltuk boş görünüyordu. Hakan başını çevirdiğinde kadın oradaydı. Kadın sakin bir sesle, “Söylemiştim,” dedi.\",\n    \"Adresin önüne geldiklerinde kadın indi ve arka koltuğa eski bir fotoğraf bıraktı. Fotoğrafta Hakan, genç bir kadınla mezarlıkta duruyordu. Kadının yüzü, az önceki yolcunun yüzüydü.\",\n    \"Hakan fotoğrafı çevirdi. Arkasında kendi el yazısıyla şu not vardı: “Bu gece onu yine eve götürdüm.” Tarih on iki yıl öncesine aitti; o gece Hakan'ın yaptığı ilk taksi yolculuğuydu.\",\n  ]],\n  [\"story-cassette\", \"Kasetteki Kayıt\", \"Korku Hikayesi\", [\n    \"Babası öldükten sonra eşyalarını toplayan Aslı, üzerinde kendi adının yazdığı bir kaset buldu. Kasetin tarihi, doğduğu günden üç ay öncesiydi. Eski teybe takıp oynattığında önce annesinin sesi duyuldu.\",\n    \"Annesi kayıtta, “Bunu dinliyorsan evde yalnız değilsin,” diyordu. Ardından bir kapı kapanma sesi geldi. Aslı kaydı durdurdu; evin giriş kapısı az önce kendiliğinden kapanmıştı.\",\n    \"Kaseti başa sardı. Bu kez kendi çocuk sesini duydu: “Anne, odamdaki kadın yine geldi.” Aslı'nın hiç hatırlamadığı bir çocukluk anısıydı. Kayıt ilerledikçe kadın, teybe çok yakından nefes almaya başladı.\",\n    \"Son bölümde babası konuştu: “Aslı, anneni dinleme. O kadın annenin yüzünü aldı.” Aslı kaseti elinden düşürdü. Mutfaktan annesinin sesi geldi: “Kızım, sonunda buldun mu?”\",\n  ]],\n  [\"story-school\", \"Okulda Son Yoklama\", \"Korku Hikayesi\", [\n    \"Temizlik görevlisi Nihat, kapatılmış okulda son turunu atarken sınıflardan birinde yoklama sesi duydu. İçeride ışık yanıyordu. Kapıyı açtığında sıralar doluydu; öğrenciler başları öne eğik oturuyordu.\",\n    \"Öğretmen adları okuyor, her isme aynı çocuk cevap veriyordu: “Buradayım.” Nihat içeri girdiğinde öğretmen başını kaldırmadan, “Geç kaldınız, müdür bey,” dedi.\",\n    \"Nihat yıllar önce bu okulda müdürdü. Bir yangında sınıftaki çocukları kurtaramamıştı. Öğretmen, boş bir sırayı gösterdi: “Sizin yeriniz hâlâ boş.”\",\n    \"Nihat kaçmak için döndü. Kapı yerine sınıfın arka duvarında eski bir yangın merdiveni vardı. Öğrenciler aynı anda başlarını kaldırdı ve tek ağızdan, “Bu kez bizi bırakmayın,” dedi.\",\n  ]],\n  [\"story-lighthouse\", \"Fenerdeki Işık\", \"Korku Hikayesi\", [\n    \"Balıkçı Cemil, yıllardır terk edilmiş deniz fenerinin her gece yandığını fark etti. Işık denize değil, kendi teknesine dönüyordu. Bir gece kıyıya çıkıp fenerin kapısını zorladı; kapı içeriden kilitliydi.\",\n    \"İçeriden telsiz sesi geldi: “Cemil, geri dön.” Ses kendi sesiydi. Merdivenlerden yukarı çıktığında duvarda ıslak ayak izleri gördü. İzler, fenerin tepesine çıkıyor ama aşağı inmiyordu.\",\n    \"Fenerin lambasının yanında eski bir seyir defteri vardı. Son sayfada o geceki tarih ve “Cemil kıyıya çıkarsa ışığı söndür” yazıyordu. Defterin altında kendi teknesinin anahtarı duruyordu.\",\n    \"Tam ışığı kapatırken denizden yardım çığlığı duydu. Kıyıda kendi teknesi boştu. Uzakta, dalgaların arasında kendisi suya tutunmuş yardım istiyordu. Fenerdeki Cemil ise ıslak değildi.\",\n  ]],\n  [\"story-wardrobe\", \"Dolabın İçindeki Oda\", \"Korku Hikayesi\", [\n    \"Taşındıkları evde çocuk odasındaki gömme dolap normalden derindi. Duru içine kutu koyarken arka duvarın hafifçe oynadığını fark etti. Duvarı ittiğinde dar bir koridor açıldı; içeriden sıcak yemek kokusu geliyordu.\",\n    \"Koridorun sonunda kendi evlerinin aynısı vardı. Mutfakta masa kurulmuş, salonda televizyon açıktı. Masanın başında Duru'nun ailesi oturuyordu; ama hepsi birkaç yaş daha yaşlı görünüyordu.\",\n    \"Öteki Duru ayağa kalktı. “Buraya gelmemeliydin,” dedi. “Biz seni yıllardır bekliyoruz.” Duru geri dönmek istedi, ama koridorun kapısı kapanmıştı.\",\n    \"Evdeki annesi onu bulduğunda dolabın içinde yalnızca kutular vardı. Duru ortadan kaybolmuştu. O gece anne, dolabın arkasından kızının sesini duydu: “Anne, buradaki Duru gerçek değil.”\",\n  ]],\n  [\"story-bridge\", \"Köprüdeki İkinci Araba\", \"Korku Hikayesi\", [\n    \"Gece vardiyasından dönen iki kardeş, sisli köprüde yol kenarında duran aynı model arabayı gördü. İçinde kimse yoktu. Birkaç dakika sonra kendi arabalarının farları arkadan göründü; oysa onlar hâlâ köprüde ilerliyordu.\",\n    \"Arkalarındaki araç selektör yaptı. Şoför koltuğunda ağabeyleri oturuyordu. Kardeşler birbirine baktı; ağabey direksiyondaydı ve aynadan arkasındaki aracı görmüyordu.\",\n    \"Telefon çaldı. Arayan, köprüden beş dakika önce geçtiklerini söyleyen polis memuruydu. “Aracınız kaza yaptı,” dedi. “İkiniz de olay yerinde değilsiniz. Ama arka koltukta bir kişi daha var.”\",\n    \"Ön koltuktaki kardeşler arka aynaya baktı. Arka koltukta üçüncü bir yolcu oturuyordu. Polis telefonda fısıldadı: “Sakın ona bakmayın. O, kazadan önce arabada değildi.”\",\n  ]],\n  [\"story-clock\", \"Saat 04.04\", \"Korku Hikayesi\", [\n    \"Evdeki eski duvar saati her gece 04.04'te duruyordu. Saat tamircisi Selim mekanizmayı değiştirdi, pili yeniledi. Ertesi sabah saat yine aynı dakikada durmuştu. Üstelik akrep ve yelkovan geriye dönük takılmıştı.\",\n    \"Bir gece saatin önünde bekledi. 04.03'te tik taklar hızlandı. 04.04 olduğunda evin bütün ışıkları söndü ve koridordan bir çocuk sesi geldi: “Bu kez saklanma.”\",\n    \"Selim saatin arkasını açtı. İçinde eski bir fotoğraf sıkışmıştı. Fotoğrafta çocukken kendisi, saatin yanında duruyordu. Arkasında annesi, “O gece seni bulamadık,” diye yazmıştı.\",\n    \"Selim fotoğrafı eline alınca kapı çaldı. Dışarıda annesi duruyordu; annesi yirmi yıl önce ölmüştü. Kadın saate baktı ve “Saat durmadan önce içeri gir,” dedi.\",\n  ]],\n  [\"story-ferry\", \"Gece Feribotundaki Yolcu\", \"Korku Hikayesi\", [\n    \"Son feribotta görevli olan Ayhan, güvertede tek başına oturan yaşlı bir adam gördü. Biletini istediğinde adam cebinden sararmış bir kâğıt çıkardı. Biletin tarihi, feribotun battığı geceye aitti.\",\n    \"Adam, “Bu sefer karşıya geçeceğim,” dedi. Ayhan kaptana haber verdi. Kaptan kameraları kontrol etti; güverte görüntüsünde Ayhan tek başına görünüyordu.\",\n    \"Ayhan yeniden güverteye çıktığında adam hâlâ oradaydı. “Beni hatırlamadın mı?” diye sordu. Sonra Ayhan'ın babasının adını söyledi. Babası o feribot kazasında kaybolmuştu.\",\n    \"Feribot kıyıya yanaştığında adam kayboldu. Ayhan'ın elindeki biletin arkasında tek satır vardı: “O gece seni ben kıyıya çıkardım. Şimdi sıra sende.”\",\n  ]],\n  [\"story-attic\", \"Tavan Arasındaki Kayıt\", \"Korku Hikayesi\", [\n    \"Evini yenileyen Murat, tavan arasında eski bir ses kayıt cihazı buldu. Cihazın içindeki tek kasette kendi adı yazıyordu. Oysa ev, ailesine ondan önce aitti. Kaydı açınca kendi sesiyle konuşan birini duydu.\",\n    \"Ses, “Şimdi merdivenden çıkacak. Elinde tornavida var,” dedi. Murat elindeki tornavidaya baktı. Kayıt devam etti: “Kapıyı açma. İçerideki sen değil.”\",\n    \"Merdivenden bir gıcırtı geldi. Murat tavan arasının kapısını kapattı. Dışarıdan kendi sesiyle biri, “Aç, aşağıda kaldım,” diye seslendi. Kayıttaki ses ise ağlayarak “Sakın cevap verme,” dedi.\",\n    \"Kapı kolu yavaşça döndü. Murat kayıt cihazını yere bıraktı. Cihazdan son bir cümle duyuldu: “Beni dinlediğin için teşekkürler. Artık kapıyı ben açabilirim.”\",\n  ]],\n  [\"story-subway\", \"Boş Metro Vagonu\", \"Korku Hikayesi\", [\n    \"Gece son metrosuna binen İrem, vagonda kendisinden başka kimse olmadığını sandı. Bir sonraki istasyonda kapılar açıldı; bütün koltuklarda insanlar oturuyordu. Hepsi başlarını öne eğmiş, aynı ıslak kıyafetleri giymişti.\",\n    \"İrem kapıya yaklaştı. İstasyondaki tabelada yıllar önce kapatılan bir durak yazıyordu. Telefonuna annesinden mesaj geldi: “O istasyonda inme. Seni orada kaybettik.”\",\n    \"Vagonun ışıkları titredi. Yolcular aynı anda başlarını kaldırdı. İrem hepsinin yüzünde kendi yüzünü gördü; yaşlı, çocuk, yaralı ve ağlayan hâlleri ona bakıyordu.\",\n    \"Tren durdu. Kapının dışında küçük bir kız el salladı. İrem onu çocukluk fotoğrafından tanıdı. Kız camın ardından dudaklarını oynattı: “Ben dışarıda kaldım. Sen benim yerime bindin.”\",\n  ]],\n  [\"story-pet\", \"Köpeğin Baktığı Köşe\", \"Korku Hikayesi\", [\n    \"Kerem'in köpeği her gece salonun boş bir köşesine bakıp hırlıyordu. Kerem oraya kamera koydu. Görüntüde köpek normal davranıyor, köşeye hiç bakmıyordu. Ama ses kaydında köpek bütün gece aynı noktaya havlıyordu.\",\n    \"Bir gece Kerem köpeğin tasmasını tuttu ve “Orada ne var?” diye sordu. Köpek ilk kez havlamadı; kuyruğunu kıstı ve kapıya doğru geri çekildi. Köşeden, Kerem'in çocukluk lakabını söyleyen bir ses geldi.\",\n    \"Kerem ışığı açtı. Köşe boştu. Sabah kamera kayıtlarını izlediğinde kendisini koltukta uyurken gördü. Görüntünün arkasında, köşede duran uzun bir siluet vardı.\",\n    \"Kerem kaydı durdurdu. Köpeği yanına çağırdı; köpek gelmedi. Çünkü kamera görüntüsünde köpek hâlâ köşeye bakıyordu. Gerçek odada ise köpek, Kerem'in arkasındaki boşluğa hırlıyordu.\",\n  ]],\n  [\"story-library\", \"Kütüphanedeki İsim\", \"Korku Hikayesi\", [\n    \"Üniversite kütüphanesinde çalışan Eylül, iade edilen kitapların arasında kendi adı yazılı eski bir günlük buldu. İlk sayfada doğum tarihi, son sayfada ise ertesi günün tarihi vardı. Günlüğün içindeki el yazısı kendisininkiyle aynıydı.\",\n    \"Sayfaları çevirdi. Her gün için yaptığı şeyler yazılmıştı; hatta o gün öğle yemeğinde ne yiyeceği bile. Son sayfada tek cümle vardı: “Bu gece bodrumdaki kapıyı açma.”\",\n    \"Eylül kütüphaneyi kapatırken bodrumdan üç kez vuruldu. Güvenlik görevlisi o katta bodrum olmadığını söyledi. Günlüğü çantasına koydu ve çıkışa yöneldi; kapı kilitliydi.\",\n    \"Son sayfa kendi kendine çevrildi. Yeni bir satır belirdi: “Kapıyı açtı.” Eylül başını kaldırdı. Kütüphanenin rafları arasında, kendi kıyafetlerini giymiş başka bir kadın duruyordu.\",\n  ]],\n  [\"story-rain\", \"Yağmurda Gelen Misafir\", \"Korku Hikayesi\", [\n    \"Şiddetli yağmurda kapısı çalınan yaşlı çift, sırılsıklam bir genç kadını içeri aldı. Kadın, “Telefonum çekmiyor. Biraz oturabilir miyim?” dedi. Ev sahibi ona havlu verdi; kadın aynaya hiç bakmadı.\",\n    \"Kadın salonda otururken evin köpeği yatağın altına saklandı. Yaşlı adam, “Daha önce burada mıydın?” diye sordu. Kadın başını salladı: “Siz beni geçen kış da içeri almıştınız.”\",\n    \"Kadın gittikten sonra yaşlı kadın, masadaki ıslak havluyu gördü. Üzerinde çamurla yazılmış bir tarih vardı. O tarih, kızlarının trafik kazasında öldüğü geceydi.\",\n    \"Yaşlı adam kapıya koştu. Dışarıda kimse yoktu. Eşine dönüp “Kızımız geldi,” dedi. Kadın başını salladı: “Hayır. Kızımız o gece öldü.” Sonra ikisi de fark etti: Evdeki misafir, kızlarının çocukluk fotoğrafındaki yaşındaydı.\",\n  ]],\n  [\"story-cctv\", \"Güvenlik Kamerasındaki Ben\", \"Korku Hikayesi\", [\n    \"Site güvenliği yapan Onur, gece kameralarında otoparkta dolaşan bir adam gördü. Adam sürekli kameraya bakıyordu. Onur görüntüyü yakınlaştırınca adamın kendi üniformasını giydiğini fark etti.\",\n    \"Devriye kayıtlarına baktı. O saatte kendisi güvenlik kulübesinden hiç çıkmamıştı. Kameradaki adam bir araca yaklaştı, bagajı açtı ve içeri baktı. Sonra başını kaldırıp kulübeye doğru yürüdü.\",\n    \"Onur kapıyı kilitledi. Monitördeki görüntüde adam kulübenin önüne geldi. Gerçek kapıya da üç kez vuruldu. Kameradaki adam ekrana eğilip dudaklarını oynattı: “Aç. Sen içeride değilsin.”\",\n    \"Onur diğer kamerayı açtı. Kulübenin içi boş görünüyordu. Monitörde kendisini dışarıda, kapıyı çalarken izledi. Ardından kulübenin içinden kendi sesi geldi: “Sonunda yerimi buldun.”\",\n  ]],\n]\ntopic_ids = [item[0] for item in TOPICS]\nif len(TOPICS) != 30:\n    raise RuntimeError(f'TOPICS listesi tam 30 hikaye olmali; bulunan: {len(TOPICS)}')\nif len(set(topic_ids)) != len(topic_ids):\n    raise RuntimeError('TOPICS listesinde tekrar eden konu IDsi var.')\nif any(len(item[3]) != 4 for item in TOPICS):\n    raise RuntimeError('Her hikaye 4 anlatim bolumu ve baslik girisi icermeli.')\n\nfor folder in (OUT, CAPTIONS, CLIPS, VOICE_DIR, HISTORY_FILE.parent, IMAGE_DIR):\n    folder.mkdir(parents=True, exist_ok=True)\n# Prevent stale scene files from a previous/manual run from passing the upload gate.\nfor stale in IMAGE_DIR.glob('scene_*.jpg'):\n    stale.unlink()\nsource_manifest = OUT / 'image_sources.json'\nif source_manifest.exists():\n    source_manifest.unlink()\n\nrequired = {\n    'YOUTUBE_CLIENT_ID': YOUTUBE_CLIENT_ID,\n    'YOUTUBE_CLIENT_SECRET': YOUTUBE_CLIENT_SECRET,\n    'YOUTUBE_REFRESH_TOKEN': YOUTUBE_REFRESH_TOKEN,\n}\nmissing = [name for name, value in required.items() if not value]\nif missing:\n    raise RuntimeError('GitHub Secrets eksik: ' + ', '.join(missing))\nif YOUTUBE_PRIVACY not in ('public', 'private', 'unlisted'):\n    raise RuntimeError('YOUTUBE_PRIVACY public/private/unlisted olmali.')\nprint('Gorsel motoru: Cloudflare Workers AI FLUX.2 Klein 4B (ucretsiz gunluk kota; secrets yoksa Wikimedia Commons yedegi).')\n\nnow = datetime.now(ZoneInfo('Europe/Istanbul'))\nslot = (f'{now:%Y-%m-%d}-' + ('sabah' if now.hour < 15 else 'aksam')\n        if RUN_EVENT == 'schedule' else f'manuel-{RUN_ID}')\nhistory = json.loads(HISTORY_FILE.read_text(encoding='utf-8')) if HISTORY_FILE.exists() else []\nif not isinstance(history, list):\n    raise RuntimeError('data/youtube_history.json bir JSON listesi olmali.')\nif any(item.get('slot') == slot for item in history):\n    print(f'Bu zaman diliminde zaten yukleme kaydedildi: {slot}. Tekrar edilmiyor.')\n    raise SystemExit(0)\nused_ids = {item.get('topic_id') for item in history}\navailable = [item for item in TOPICS if item[0] not in used_ids]\nif not available:\n    raise RuntimeError('Tum hazir konular kullanildi. Tekrar yapmamak icin durduruldu; TOPICS havuzuna yeni konular ekleyin.')\ntopic_id, title, category, facts = available[0]\nvisual_theme = paranormal_visual_kind(topic_id, title)\nprint(f'Hikaye: {title} | Animasyon temasi: {visual_theme} | Kayitli video: {len(history)} | Kalan hikaye: {len(available)}')\n# Baslik videonun icine konmaz; yalnizca YouTube basligi/aciklamasinda kullanilir.\n# Video dogrudan hikayenin ilk cumlesiyle baslar.\nscenes = [(story_beat, '') for story_beat in facts]\nassert len(scenes) == VOICE_BEAT_COUNT\n(OUT / 'video-plani.json').write_text(json.dumps({\n    'topic_id': topic_id, 'title': title, 'category': category,\n    'scenes': [{'caption': c, 'visual': v} for c, v in scenes],\n    'visual_theme': visual_theme,\n    'style': 'at least ten distinct photorealistic cinematic 9:16 AI still images, two story-specific shots per narration beat plus two closing CTA shots; no Blender, no procedural characters, no toy-like figures, no repeated background; subtle camera movement on each still',\n    'fiction_notice': 'Kurgusal korku hikayesi; gercek oldugu iddia edilmez.',\n    'story_format': 'Naturalistic micro-horror with grounded everyday setup, believable dialogue, gradual escalation, specific visual moments and a sharp final twist; variable duration based on narration.',\n    'voice': TTS_VOICE, 'voice_style': 'deep male Turkish narration, restrained and natural, slower final line', 'visuals_per_story': 10, 'duration_seconds': 'automatic from narration; no fixed 30-second limit', 'image_source': 'Cloudflare Workers AI FLUX.2 Klein 4B native portrait; Wikimedia Commons fallback'\n}, ensure_ascii=False, indent=2), encoding='utf-8')\n\nFONT_PATH = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'\nFONT_REGULAR = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'\nFONT_TITLE = ImageFont.truetype(FONT_PATH, 29)\nFONT_CAPTION = ImageFont.truetype(FONT_PATH, 23)\nFONT_SMALL = ImageFont.truetype(FONT_PATH, 18)\n\n\ndef run_ffmpeg(args):\n    subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', *args], check=True)\n\n\ndef probe_duration(path):\n    return float(subprocess.check_output([\n        'ffprobe', '-v', 'error', '-show_entries', 'format=duration',\n        '-of', 'default=noprint_wrappers=1:nokey=1', str(path)\n    ], text=True).strip())\n\n\nasync def create_tts(text_value, path, rate=TTS_RATE, pitch=TTS_PITCH):\n    last_error = None\n    for attempt in range(3):\n        try:\n            communicator = edge_tts.Communicate(\n                text_value, TTS_VOICE, rate=rate, volume='+0%', pitch=pitch\n            )\n            await communicator.save(str(path))\n            if path.exists() and path.stat().st_size > 1000:\n                return\n            raise RuntimeError('TTS bos ses dosyasi olusturdu.')\n        except Exception as exc:\n            last_error = exc\n            print(f'TTS denemesi {attempt+1}/3: {str(exc)[:220]}')\n            if attempt < 2:\n                await asyncio.sleep(3 * (attempt + 1))\n    # Internet tabanli ucretsiz TTS erisilemezse, tamamen yerel espeak-ng yedegi.\n    fallback_wav = path.with_suffix('.fallback.wav')\n    try:\n        subprocess.run(['espeak-ng','-v','tr','-s','145','-p','35','-a','170',\n                        '-w',str(fallback_wav),text_value],check=True)\n        subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(fallback_wav),\n                        '-codec:a','libmp3lame','-q:a','4',str(path)],check=True)\n        if path.exists() and path.stat().st_size > 1000:\n            print('Bilgi: Edge TTS erisilemedi; ucretsiz cevrimdisi Turkce ses kullanildi.')\n            return\n    except Exception as fallback_error:\n        raise RuntimeError('Ucretsiz Turkce seslendirme olusturulamadi: '\n                           + str(last_error) + ' | cevrimdisi yedek: ' + str(fallback_error))\n    raise RuntimeError('Ucretsiz Turkce seslendirme bos dosya olusturdu: ' + str(last_error))\n\n\ndef make_voice_tracks():\n    print('1/5 Ucretsiz Turkce erkek seslendirme olusturuluyor...')\n    raw_files, raw_durations = [], []\n    voice_items = scenes + [(CTA_TEXT, '')]\n    for i, (caption, _) in enumerate(voice_items, 1):\n        mp3 = VOICE_DIR / f'voice_{i:02d}.mp3'\n        final_beat = (i == len(scenes))\n        voice_rate = '-12%' if final_beat else TTS_RATE\n        voice_pitch = '-18Hz' if final_beat else TTS_PITCH\n        asyncio.run(create_tts(caption, mp3, rate=voice_rate, pitch=voice_pitch))\n        duration = probe_duration(mp3)\n        if duration <= 0.2:\n            raise RuntimeError(f'{i}. sahnenin seslendirmesi gecersiz.')\n        raw_files.append(mp3)\n        raw_durations.append(duration)\n        print(f'Ses {i}/{len(voice_items)}: {duration:.2f} saniye')\n\n    # Sabit 30 saniyeye sikistirma yok: dogal konusma hizi korunur.\n    # Her sahne sonuna kisa bir nefes araligi eklenir; goruntu suresi sese gore belirlenir.\n    scene_durations = [d + STORY_PAUSE_SECONDS for d in raw_durations]\n    padded_files = []\n    for i, (mp3, spoken, scene_duration) in enumerate(zip(raw_files, raw_durations, scene_durations), 1):\n        wav = VOICE_DIR / f'voice_padded_{i:02d}.wav'\n        pad = max(0.0, scene_duration - spoken)\n        filters = f'apad=pad_dur={pad:.6f},atrim=duration={scene_duration:.6f}'\n        run_ffmpeg(['-i', str(mp3), '-af', filters, '-ar', '44100', '-ac', '2',\n                    '-c:a', 'pcm_s16le', str(wav)])\n        padded_files.append(wav)\n    # WAV dosyalarini ffmpeg concat-list dosyasina bagimli kalmadan\n    # Python wave moduluyle sirayla birlestir. Bu yontem, GitHub\n    # runner'da concat-list dosyasinin kaybolmasi/okunamamasi hatasini\n    # ortadan kaldirir.\n    voice = OUT / 'narration.wav'\n    if len(padded_files) != len(voice_items):\n        raise RuntimeError(f'Birlesecek ses parcasi eksik: {len(padded_files)}/{len(voice_items)}')\n    missing_wavs = [str(p) for p in padded_files if not p.exists() or p.stat().st_size < 1000]\n    if missing_wavs:\n        raise RuntimeError('Ara ses dosyasi olusmadi: ' + ', '.join(missing_wavs))\n    with wave.open(str(padded_files[0]), 'rb') as first_wav:\n        params = first_wav.getparams()\n        with wave.open(str(voice), 'wb') as merged:\n            merged.setnchannels(params.nchannels)\n            merged.setsampwidth(params.sampwidth)\n            merged.setframerate(params.framerate)\n            merged.setcomptype(params.comptype, params.compname)\n            for wav_path in padded_files:\n                with wave.open(str(wav_path), 'rb') as part:\n                    part_params = part.getparams()\n                    if (part_params.nchannels != params.nchannels or\n                        part_params.sampwidth != params.sampwidth or\n                        part_params.framerate != params.framerate or\n                        part_params.comptype != params.comptype):\n                        raise RuntimeError(f'Ses parcasi formatlari uyusmuyor: {wav_path.name}')\n                    while True:\n                        frames = part.readframes(65536)\n                        if not frames:\n                            break\n                        merged.writeframesraw(frames)\n    actual = probe_duration(voice)\n    expected = sum(scene_durations)\n    if actual <= 0 or abs(actual - expected) > 0.35:\n        raise RuntimeError(f'Seslendirme/sahne zamanlamasi uyusmuyor: {actual:.3f}s / {expected:.3f}s.')\n    print(f'Dogal seslendirme + kapanis cagrisi suresi: {actual:.2f} saniye (30 saniye siniri yok)')\n    return voice, scene_durations\n\n\ndef wrap_text(draw, text_value, font, max_width):\n    words = text_value.split()\n    lines = []\n    current = ''\n    for word in words:\n        test = (current + ' ' + word).strip()\n        if draw.textbbox((0, 0), test, font=font)[2] <= max_width or not current:\n            current = test\n        else:\n            lines.append(current)\n            current = word\n    if current:\n        lines.append(current)\n    return lines\n\n\ndef subtitle_chunks(text_value, words_per_chunk=5):\n    words = str(text_value).split()\n    return [' '.join(words[i:i+words_per_chunk]) for i in range(0, len(words), words_per_chunk)] or ['']\n\n\ndef draw_subtitles(draw, text_value, progress, category, scene_no):\n    # Kisa altyazi parcalari: kucuk, orta hizada ve arka plani kapatmayan tasarim.\n    chunks = subtitle_chunks(text_value, 5)\n    chunk_index = min(len(chunks)-1, int(max(0.0, min(0.999999, progress)) * len(chunks)))\n    lines = wrap_text(draw, chunks[chunk_index], FONT_CAPTION, WIDTH-110)\n    line_h = 31\n    block_h = len(lines) * line_h\n    center_y = int(HEIGHT * 0.59)\n    top = center_y - block_h // 2\n    # Yalnizca altyazi metninin arkasinda dar ve yari saydam bir zemin.\n    widths = [draw.textbbox((0, 0), line, font=FONT_CAPTION)[2] for line in lines]\n    panel_w = min(WIDTH-34, max(widths, default=0) + 28)\n    draw.rounded_rectangle((WIDTH//2-panel_w//2, top-7, WIDTH//2+panel_w//2, top+block_h+7),\n                           radius=12, fill=(0, 0, 0, 82))\n    for i, line in enumerate(lines):\n        draw.text((WIDTH//2, top+i*line_h), line, font=FONT_CAPTION, anchor='mt',\n                  fill=(255, 255, 255, 255), stroke_width=2, stroke_fill=(0, 0, 0, 210))\n\n\ndef image_dhash(image):\n    \"\"\"Small perceptual fingerprint used to reject repeated-looking scenes.\"\"\"\n    gray = ImageOps.fit(image.convert('L'), (9, 8), method=Image.Resampling.LANCZOS)\n    px = np.asarray(gray, dtype=np.int16)\n    bits = (px[:, 1:] > px[:, :-1]).flatten()\n    value = 0\n    for bit in bits:\n        value = (value << 1) | int(bit)\n    return value\n\n\ndef hamming_distance(a, b):\n    return (a ^ b).bit_count()\n\n\ndef scene_shot_description(scene_no):\n    # Her anlatim bolumu iki ayri kamera planiyla gosterilir.\n    if scene_no % 2:\n        return ('wide or medium live-action establishing shot of the exact narrated action, '\n                'show the people, room layout and relevant objects clearly')\n    return ('a completely different cinematic close-up or over-the-shoulder reverse angle '\n            'showing a specific story clue, facial reaction or physical detail from the same moment')\n\n\ndef reject_unwanted_bottom_text(image, scene_no):\n    \"\"\"Reject source images with legible stray writing in the bottom edge.\"\"\"\n    try:\n        import pytesseract\n        # The actual Turkish subtitle is rendered later; inspect only the source image.\n        y0 = int(image.height * 0.82)\n        strip = image.crop((0, y0, image.width, image.height)).convert('L')\n        result = pytesseract.image_to_data(\n            strip, config='--psm 11', output_type=pytesseract.Output.DICT\n        )\n        hits = []\n        for word, confidence in zip(result.get('text', []), result.get('conf', [])):\n            token = ''.join(ch for ch in str(word) if ch.isalnum())\n            try:\n                score = float(confidence)\n            except (TypeError, ValueError):\n                score = -1\n            # Ignore isolated OCR noise and tiny marks; reject clearly readable text.\n            if len(token) >= 3 and any(ch.isalpha() for ch in token) and score >= 60:\n                hits.append(token)\n        if hits:\n            raise RuntimeError(\n                f'Alt bolgede istenmeyen yazi tespit edildi: {\" \".join(hits[:5])}'\n            )\n    except ImportError as exc:\n        raise RuntimeError('Gorsel yazi kontrolu icin pytesseract kurulu degil.') from exc\n\n\ndef validate_generated_image(image, scene_no):\n    reject_unwanted_bottom_text(image, scene_no)\n    if image.width < 640 or image.height < 1100:\n        raise RuntimeError(f'Gorsel cozunurlugu dusuk: {image.size}')\n    rgb = np.asarray(image.convert('RGB'), dtype=np.uint8)\n    if float(rgb.std()) < 18.0:\n        raise RuntimeError('Gorsel asiri duz/siyah; ayrinti seviyesi yetersiz.')\n    if len(np.unique(rgb.reshape(-1, 3)[::max(1, rgb.shape[0] * rgb.shape[1] // 5000)], axis=0)) < 80:\n        raise RuntimeError('Gorselde yeterli renk/detay cesitliligi yok.')\n    current_hash = image_dhash(image)\n    for old_path in sorted(IMAGE_DIR.glob('scene_*.jpg')):\n        if old_path.name == f'scene_{scene_no:02d}.jpg':\n            continue\n        try:\n            old = Image.open(old_path).convert('RGB')\n            if hamming_distance(current_hash, image_dhash(old)) < 7:\n                raise RuntimeError(f'{old_path.name} ile birbirine cok benzeyen sahne gorseli reddedildi.')\n        except RuntimeError:\n            raise\n        except Exception:\n            continue\n    return current_hash\n\n\ndef commons_terms(kind, caption):\n    \"\"\"English search terms for free-to-use, topic-matched documentary photographs.\"\"\"\n    mapping = {\n        'train': ['railway station train locomotive platform', 'passenger train railway tracks'],\n        'station': ['railway station platform night', 'empty train station interior'],\n        'forest': ['dark pine forest fog', 'dense forest mist trees'],\n        'pine_forest': ['pine forest fog trees', 'dark woodland path'],\n        'hotel': ['old hotel corridor interior', 'abandoned hotel hallway'],\n        'hospital': ['abandoned hospital corridor', 'hospital hallway interior'],\n        'mirror': ['antique mirror dark room', 'old mirror interior'],\n        'phone': ['vintage telephone closeup', 'old telephone dark room'],\n    'bedroom': ['dark realistic bedroom at night bed', 'child bedroom bed under blanket night interior', 'father standing in bedroom doorway night'],\n        'lighthouse': ['lighthouse storm coast fog', 'lighthouse at night'],\n        'ship': ['old ship fog sea', 'ship at night ocean'],\n        'bus': ['empty bus night road', 'old bus station'],\n        'busstop': ['empty bus stop night', 'rural bus shelter fog'],\n        'door': ['old wooden door dark corridor', 'abandoned house doorway'],\n        'door_self': ['old wooden door corridor', 'door handle closeup'],\n        'window': ['old window rain night', 'dark house window'],\n        'window_face': ['foggy window night', 'old window condensation'],\n        'attic': ['dusty attic old house', 'abandoned attic interior'],\n        'elevator': ['old elevator doors hallway', 'elevator interior vintage'],\n        'elevator_zero': ['old elevator panel buttons', 'empty elevator hallway'],\n        'clock': ['antique clock dark room', 'old wall clock closeup'],\n        'clock_backwards': ['antique clock closeup', 'old clock mechanism'],\n        'bridge': ['old bridge fog night', 'empty bridge mist'],\n        'lake': ['misty lake forest night', 'fog over lake'],\n        'road': ['foggy forest road night', 'empty road fog'],\n        'basement': ['dark basement stairs old house', 'stone basement corridor'],\n        'classroom': ['abandoned classroom school', 'empty school classroom'],\n        'cinema': ['abandoned cinema theater interior', 'empty old movie theater'],\n        'museum': ['old museum corridor interior', 'museum hall dark'],\n        'library': ['old library shelves dark', 'historic library interior'],\n        'book': ['antique book closeup', 'old book library'],\n        'radio': ['vintage radio closeup', 'old radio dark room'],\n        'cassette': ['audio cassette tape closeup', 'vintage cassette recorder'],\n        'camera': ['vintage camera closeup', 'old photograph camera'],\n        'photo': ['old photograph album closeup', 'vintage photo album'],\n        'footprints': ['footprints wet ground night', 'footprints snow forest'],\n        'swing': ['empty playground swing fog', 'playground at night'],\n        'rooftop': ['old building rooftop night', 'city rooftop fog'],\n        'ferry': ['ferry boat fog water', 'empty ferry terminal'],\n        'lantern': ['old lantern dark forest', 'vintage lantern night'],\n        'key': ['antique iron key closeup', 'old rusty key'],\n        'bell': ['old church bell tower', 'village church bell'],\n        'piano': ['old piano dark room', 'abandoned piano interior'],\n        'wall': ['old plaster wall dark room', 'cracked wall closeup'],\n        'swing': ['empty playground swing fog', 'playground at night'],\n        'haunted_room': ['abandoned room dark interior', 'old house room dust'],\n    }\n    terms = list(mapping.get(kind, ['abandoned building interior', 'foggy night street']))\n    caption_text = str(caption).lower()\n    # Scene-specific fallback searches: keep Commons results tied to the narrated action.\n    if any(k in caption_text for k in ('çocuk', 'oğlu', 'yatak', 'yorgan')):\n        terms = ['real child bedroom bed at night interior', 'child lying under blanket in bed bedroom', 'dark bedroom bed night cinematic'] + terms\n    if any(k in caption_text for k in ('baba', 'babası', 'kapı', 'odaya', 'girdi')):\n        terms = ['man father standing in bedroom doorway night', 'dark bedroom doorway interior man'] + terms\n    if any(k in caption_text for k in ('saat', '03.00', '03:00', 'üç')):\n        terms = ['wall clock showing 3 o clock dark bedroom', 'close up analog clock at night'] + terms\n    # Preserve order while removing repeated queries.\n    return list(dict.fromkeys(terms))\n\n\ndef commons_search_images(query, limit=18):\n    api = 'https://commons.wikimedia.org/w/api.php'\n    params = {\n        'action': 'query', 'format': 'json', 'generator': 'search',\n        'gsrsearch': f'filetype:bitmap {query}', 'gsrnamespace': 6,\n        'gsrlimit': limit, 'prop': 'imageinfo',\n        'iiprop': 'url|size|extmetadata', 'iiurlwidth': 1100\n    }\n    response = requests.get(api, params=params,\n        headers={'User-Agent': 'GizemliDunyaVideoBot/1.0 (educational noncommercial video project)'}, timeout=35)\n    response.raise_for_status()\n    pages = response.json().get('query', {}).get('pages', {})\n    return list(pages.values())\n\n\ndef visual_detail_for_caption(caption):\n    text_value = str(caption).lower()\n    details = []\n    if any(k in text_value for k in ('saat', '03.00', '03:00', 'üç', 'uc')):\n        details.append('If a clock or time is mentioned, show a clearly visible realistic wall or bedside clock; use 03:00 only when the narration specifies three o’clock.')\n    if any(k in text_value for k in ('baba', 'babası', 'adam', 'erkek')):\n        details.append('Show the father/adult man performing the exact action described, with natural adult proportions and believable expression.')\n    if any(k in text_value for k in ('çocuk', 'oğlu', 'kız', 'yatak', 'yorgan')):\n        details.append('When the child or bed is mentioned, show a real child lying naturally in a real bed under a believable blanket; avoid dolls or mannequins.')\n    if any(k in text_value for k in ('kapı', 'odaya', 'girdi', 'koridor')):\n        details.append('When a doorway or entrance is mentioned, clearly show the actual door, room threshold or corridor from a distinct camera angle.')\n    if any(k in text_value for k in ('pencere', 'dışarı', 'karanlık', 'gece')):\n        details.append('When night or a window is mentioned, show the dark exterior beyond the real window, with believable night lighting.')\n    if any(k in text_value for k in ('telefon', 'arama', 'mesaj', 'ekran')):\n        details.append('Show the real phone and the relevant screen/action as a close, readable visual clue without generated text.')\n    return ' '.join(details)\n\n\ndef generate_cloudflare_scene_image(scene_no, caption, topic_id, seed):\n    \"\"\"Generate a story-specific FLUX image using Cloudflare's free daily Workers AI allocation.\"\"\"\n    import base64\n    if not (CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN):\n        raise RuntimeError('Cloudflare AI secrets tanimli degil.')\n    path = IMAGE_DIR / f'scene_{scene_no:02d}.jpg'\n    kind = paranormal_visual_kind(topic_id, title)\n    shot = scene_shot_description(scene_no)\n    visual_detail = visual_detail_for_caption(caption)\n    prompt = (\n        'Photorealistic live-action supernatural mystery feature-film still, native vertical 9:16 portrait '\n        'composition designed specifically for a 768x1365 frame. Use the full vertical canvas naturally; '\n        'keep the main subject and the story-critical clue clearly visible, with cinematic foreground and depth. '\n        f'Story title: {title}. Story environment: {kind}. Exact narrated moment in Turkish: \"{caption}\". '\n        f'Camera direction: {shot}. Story-specific visual requirements: {visual_detail}. Show the literal event in the sentence, not generic horror wallpaper. '\n        'If the line mentions a hospital, show a believable real hospital interior; if it mentions a train, '\n        'show a real train and platform; if it mentions a window, show a real window and the described clue. '\n        'Each scene must use a different location detail, camera angle, lighting setup and composition. '\n        'Premium cinema photography, realistic adult human actors if needed, natural skin texture, '\n        'physically plausible architecture, detailed surfaces, atmospheric practical lighting, volumetric fog '\n        'only when appropriate, rich but natural colors, high detail, sharp photographic focus. '\n        'No cartoon, no illustration, no painting, no 3D render, no CGI character, no toy, no doll, '\n        'no mannequin, no miniature, no plastic skin, absolutely no writing anywhere, no letters, no numbers, no captions, no subtitles, no labels, no signage, no typography, no logos, no watermarks, no signatures, no borders, no printed image captions.'\n    )\n    url = (f'https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}'\n           f'/ai/run/{CLOUDFLARE_IMAGE_MODEL}')\n    headers = {'Authorization': f'Bearer {CLOUDFLARE_API_TOKEN}',\n               'Content-Type': 'application/json'}\n    last_error = None\n    for attempt in range(3):\n        try:\n            # FLUX.2 Klein 4B uses multipart form data and supports native portrait dimensions.\n            response = requests.post(url, headers={'Authorization': headers['Authorization']}, files={\n                'prompt': (None, prompt[:2048]),\n                'width': (None, '768'),\n                'height': (None, '1365'),\n                'seed': (None, str(int(seed + scene_no * 7919 + attempt * 104729)))\n            }, timeout=(30, 300))\n            if response.status_code in (401, 403):\n                raise RuntimeError('Cloudflare API token yetkisiz. Workers AI Read iznini ve Account ID degerini kontrol edin.')\n            if response.status_code == 429:\n                raise RuntimeError('Cloudflare ucretsiz gunluk AI limiti veya hiz limiti dolmus (HTTP 429).')\n            response.raise_for_status()\n            payload = response.json()\n            if not payload.get('success', True):\n                raise RuntimeError(str(payload.get('errors', payload))[:400])\n            encoded = (payload.get('result') or {}).get('image')\n            if not encoded:\n                raise RuntimeError('Cloudflare yanitinda result.image bulunamadi.')\n            raw = base64.b64decode(encoded)\n            if len(raw) < 18000:\n                raise RuntimeError(f'AI gorseli cok kucuk: {len(raw)} byte.')\n            with Image.open(io.BytesIO(raw)) as opened:\n                opened.load()\n                image = opened.convert('RGB')\n            if image.width < 400 or image.height < 400:\n                raise RuntimeError(f'AI kaynak cozunurlugu yetersiz: {image.size}')\n            # FLUX.2 Klein 4B supports native 9:16 output; only normalize exact dimensions.\n            image = ImageOps.fit(image, (768, 1365), method=Image.Resampling.LANCZOS,\n                                 centering=(0.5, 0.5))\n            validate_generated_image(image, scene_no)\n            image.save(path, 'JPEG', quality=95, optimize=True)\n            record = {\n                'scene': scene_no, 'caption': caption,\n                'source_type': 'AI-generated / Cloudflare Workers AI FLUX.2 Klein 4B',\n                'commons_title': f'AI-generated scene {scene_no}',\n                'artist': 'AI-generated', 'license': 'AI-generated image',\n                'source_page': '', 'image_url': '',\n            }\n            source_file = OUT / 'image_sources.json'\n            sources = json.loads(source_file.read_text(encoding='utf-8')) if source_file.exists() else []\n            sources.append(record)\n            source_file.write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')\n            print(f'AI GORSEL ONAYLANDI: sahne {scene_no}/{SCENE_COUNT} | FLUX.2 Klein 4B | {image.width}x{image.height}')\n            return path\n        except Exception as exc:\n            last_error = exc\n            print(f'Cloudflare AI sahne {scene_no} denemesi {attempt+1}/3: {str(exc)[:260]}')\n            if attempt < 2:\n                time.sleep(5 * (attempt + 1))\n    raise RuntimeError(f'Cloudflare AI sahne gorseli uretilemedi: {last_error}')\n\n\ndef generate_scene_image(scene_no, caption, topic_id, seed):\n    \"\"\"Prefer a custom AI image; use Wikimedia Commons only as a free fallback.\"\"\"\n    path = IMAGE_DIR / f'scene_{scene_no:02d}.jpg'\n    if CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN:\n        try:\n            return generate_cloudflare_scene_image(scene_no, caption, topic_id, seed)\n        except Exception as ai_error:\n            print(f'UYARI: AI gorseli olusmadi; bu sahnede ucretsiz Commons yedegi deneniyor: {str(ai_error)[:260]}')\n    else:\n        print('Bilgi: Cloudflare AI anahtarlari yok; Wikimedia Commons yedegi kullaniliyor.')\n    kind = paranormal_visual_kind(topic_id, title)\n    terms = commons_terms(kind, caption)\n    banned = ('diagram', 'map', 'logo', 'coat of arms', 'drawing', 'illustration',\n              'painting', 'poster', 'flag', 'icon', 'screenshot', 'svg', 'collage',\n              'engraving', 'etching', 'woodcut', 'lithograph', 'print', 'plate',\n              'broadsheet', 'newspaper', 'book page', 'comic', 'cartoon', 'caption')\n    used_titles = set()\n    last_error = None\n    for query in terms:\n        try:\n            candidates = commons_search_images(query)\n            if not candidates:\n                last_error = f'Bu aramada uygun aday bulunamadi: {query}'\n            else:\n                last_error = f'{len(candidates)} aday bulundu; kalite/lisans/benzersizlik filtrelerinden gecemedi: {query}'\n            # Sort deterministically but vary the preferred result by scene/topic.\n            candidates.sort(key=lambda item: (len(item.get('title', '')), item.get('title', '')))\n            random.Random(seed + scene_no * 7919 + len(query)).shuffle(candidates)\n            for item in candidates:\n                title_text = item.get('title', '')\n                low_title = title_text.lower()\n                if any(word in low_title for word in banned) or title_text in used_titles:\n                    continue\n                info_list = item.get('imageinfo', [])\n                if not info_list:\n                    continue\n                info = info_list[0]\n                # Commons metadata MIME values vary by original file format.\n                # Do not reject candidates by metadata MIME: request the generated\n                # thumbnail and let Pillow verify/decode the actual downloaded bytes.\n                mime = str(info.get('mime', '')).lower()\n                if mime in ('image/svg+xml', 'application/pdf', 'application/postscript'):\n                    continue\n                if int(info.get('width', 0)) < 900 or int(info.get('height', 0)) < 1200:\n                    continue\n                ext = info.get('extmetadata', {})\n                desc = str(ext.get('ImageDescription', {}).get('value', '')).lower()\n                if any(word in desc for word in banned):\n                    continue\n                url = info.get('thumburl') or info.get('url')\n                if not url:\n                    continue\n                image_response = requests.get(url, headers={'User-Agent': 'GizemliDunyaVideoBot/1.0'}, timeout=60)\n                image_response.raise_for_status()\n                if len(image_response.content) < 45000:\n                    continue\n                try:\n                    with Image.open(io.BytesIO(image_response.content)) as opened:\n                        opened.load()\n                        image = opened.convert('RGB')\n                except Exception as image_error:\n                    last_error = f'Fotograf cozulemedi ({mime}): {image_error}'\n                    continue\n                if image.width < 640 or image.height < 1000:\n                    continue\n                image = ImageOps.fit(image, (768, 1365), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))\n                try:\n                    validate_generated_image(image, scene_no)\n                except RuntimeError:\n                    used_titles.add(title_text)\n                    continue\n                image.save(path, 'JPEG', quality=94, optimize=True)\n                def meta(key):\n                    return str(ext.get(key, {}).get('value', '')).replace('<br />', ' ').strip()\n                record = {\n                    'scene': scene_no, 'caption': caption, 'commons_title': title_text,\n                    'source_page': info.get('descriptionurl', ''),\n                    'image_url': info.get('url', ''), 'artist': meta('Artist'),\n                    'license': meta('LicenseShortName'), 'license_url': meta('LicenseUrl'),\n                    'search_query': query\n                }\n                source_file = OUT / 'image_sources.json'\n                sources = json.loads(source_file.read_text(encoding='utf-8')) if source_file.exists() else []\n                sources.append(record)\n                source_file.write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')\n                print(f'Ucretsiz sahne fotografi bulundu: {scene_no}/{SCENE_COUNT} | {title_text} | {record[\"license\"]}')\n                return path\n        except Exception as exc:\n            last_error = exc\n            print(f'Commons arama uyarisi ({query}): {str(exc)[:180]}')\n    raise RuntimeError(f'{scene_no}. sahne icin yeterli kalitede, benzersiz ve lisans bilgisi olan ucretsiz fotograf bulunamadi. Yayin engellendi. Son hata: {last_error}')\n\n\n\ndef remove_embedded_bottom_text(image):\n    \"\"\"Remove OCR-detected writing embedded in the source image's lower area.\"\"\"\n    import cv2\n    from pytesseract import Output\n\n    rgb = np.asarray(image.convert('RGB'))\n    height, width = rgb.shape[:2]\n    top = int(height * 0.66)\n    region = rgb[top:, :]\n    enlarged = cv2.resize(region, None, fx=2.0, fy=2.0, interpolation=cv2.INTER_CUBIC)\n    gray = cv2.cvtColor(enlarged, cv2.COLOR_RGB2GRAY)\n    gray = cv2.convertScaleAbs(gray, alpha=1.25, beta=8)\n    mask = np.zeros((height, width), dtype=np.uint8)\n\n    # Detect scattered AI lettering and text arranged in multiple lines.\n    for config in ('--oem 3 --psm 11', '--oem 3 --psm 6'):\n        data = pytesseract.image_to_data(gray, config=config, output_type=Output.DICT)\n        for i, raw_word in enumerate(data['text']):\n            word = str(raw_word).strip()\n            try:\n                confidence = float(data['conf'][i])\n            except (TypeError, ValueError):\n                continue\n            if not word or confidence < 15:\n                continue\n\n            x = int(data['left'][i] / 2)\n            y = int(data['top'][i] / 2) + top\n            w = int(data['width'][i] / 2)\n            h = int(data['height'][i] / 2)\n            if w < 3 or h < 3:\n                continue\n\n            px = max(3, int(w * 0.12))\n            py = max(3, int(h * 0.22))\n            x1, y1 = max(0, x - px), max(top, y - py)\n            x2, y2 = min(width, x + w + px), min(height, y + h + py)\n            cv2.rectangle(mask, (x1, y1), (x2, y2), 255, -1)\n\n    if not np.any(mask):\n        return image\n\n    mask = cv2.dilate(\n        mask,\n        cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (9, 7)),\n        iterations=1\n    )\n    cleaned = cv2.inpaint(rgb, mask, 5, cv2.INPAINT_TELEA)\n    return Image.fromarray(cleaned)\n\n\ndef render_image_scene(scene_no, caption, duration, category, topic_id, seed, output, frame_count=None, subtitle_progress_start=0.0, subtitle_progress_span=1.0):\n    \"\"\"Animate a unique AI still with restrained camera drift and synchronized subtitles.\"\"\"\n    frames = frame_count if frame_count is not None else max(1, round(duration * FPS))\n    still = generate_scene_image(scene_no, caption, topic_id, seed)\n    source = Image.open(still).convert('RGB')\n    # Remove writing embedded in the source image before adding subtitles.\n    source = remove_embedded_bottom_text(source)\n    # Portrait crop with a little overscan enables a slow, cinematic push-in/pan.\n    base = ImageOps.fit(source, (WIDTH, HEIGHT), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))\n    encode = subprocess.Popen([\n        'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',\n        '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-video_size', f'{WIDTH}x{HEIGHT}',\n        '-framerate', str(FPS), '-i', 'pipe:0', '-an',\n        '-vf', f'scale={OUTPUT_WIDTH}:{OUTPUT_HEIGHT}:flags=lanczos,format=yuv420p',\n        '-frames:v', str(frames), '-c:v', 'libx264', '-preset', 'veryfast',\n        '-crf', '20', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', str(output)\n    ], stdin=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)\n    try:\n        for frame_no in range(frames):\n            progress = frame_no / max(1, frames - 1)\n            zoom = 1.0 + 0.075 * progress\n            cw, ch = int(WIDTH / zoom), int(HEIGHT / zoom)\n            # Alternate gentle pan directions so the visual does not feel like a static card.\n            drift = (progress - 0.5) * 0.10\n            cx = 0.5 + (drift if scene_no % 2 else -drift)\n            cy = 0.48 + (progress - 0.5) * 0.035\n            left = max(0, min(WIDTH - cw, int(cx * WIDTH - cw / 2)))\n            top = max(0, min(HEIGHT - ch, int(cy * HEIGHT - ch / 2)))\n            frame = base.crop((left, top, left + cw, top + ch)).resize((WIDTH, HEIGHT), Image.Resampling.LANCZOS)\n            draw = ImageDraw.Draw(frame, 'RGBA')\n            local_progress = (frame_no + 1) / max(1, frames)\n            draw_subtitles(draw, caption, subtitle_progress_start + local_progress * subtitle_progress_span, category, scene_no)\n            encode.stdin.write(frame.tobytes())\n        encode.stdin.close()\n        code = encode.wait()\n        err = encode.stderr.read().decode('utf-8', 'replace')[-1500:]\n        if code:\n            raise RuntimeError(f'AI görsel video kodlama hatası: {code}; {err}')\n    finally:\n        if encode.poll() is None:\n            encode.kill()\n    if not output.exists() or output.stat().st_size < 10000:\n        raise RuntimeError(f'{scene_no}. Ücretsiz fotoğraf sahnesisi video klibine dönüştürülemedi.')\n\n\n\ndef make_soundtrack(path, duration, music_seed):\n    # Her hikaye icin farkli tohumla uretilen ozgun, urpertici ambient fon.\n    rng = random.Random(music_seed)\n    total = int(duration * SAMPLE_RATE)\n    t = np.arange(total, dtype=np.float32) / SAMPLE_RATE\n    base = rng.choice([43.65, 49.0, 55.0, 58.27])\n    pulse_rate = rng.uniform(0.07, 0.16)\n    audio = (0.050 * np.sin(2*np.pi*base*t) +\n             0.027 * np.sin(2*np.pi*(base*1.498)*t + 0.4) +\n             0.016 * np.sin(2*np.pi*(base*2.01)*t) *\n             (0.35 + 0.65*np.sin(2*np.pi*pulse_rate*t)**2))\n    scale = rng.choice([[1.0, 1.059, 1.414, 1.498],\n                        [1.0, 1.122, 1.335, 1.587],\n                        [1.0, 1.067, 1.26, 1.414]])\n    for start in np.arange(rng.uniform(0.3, 1.2), duration, rng.uniform(2.2, 3.8)):\n        first = int(start * SAMPLE_RATE)\n        size = min(int(rng.uniform(1.8, 3.2) * SAMPLE_RATE), total-first)\n        if size <= 0:\n            continue\n        local = np.arange(size, dtype=np.float32) / SAMPLE_RATE\n        freq = base * rng.choice(scale) * rng.choice([3.0, 4.0, 5.0])\n        swell = np.sin(np.pi*np.minimum(1.0, local/max(0.1, local[-1])))\n        tone = np.sin(2*np.pi*freq*local) + 0.35*np.sin(2*np.pi*freq*1.013*local)\n        audio[first:first+size] += rng.uniform(0.012, 0.024) * tone * swell * np.exp(-0.28*local)\n    audio *= (0.78 + 0.22*np.sin(2*np.pi*rng.uniform(0.025, 0.05)*t)**2)\n    fade = min(int(SAMPLE_RATE*1.5), max(1, total//3))\n    audio[:fade] *= np.linspace(0, 1, fade)\n    audio[-fade:] *= np.linspace(1, 0, fade)\n    peak = float(np.max(np.abs(audio)))\n    if peak > 0:\n        audio *= 0.52 / peak\n    pcm = (np.clip(np.column_stack((audio, audio)), -1, 1) * 32767).astype('<i2')\n    with wave.open(str(path), 'wb') as wav:\n        wav.setnchannels(2); wav.setsampwidth(2); wav.setframerate(SAMPLE_RATE)\n        wav.writeframes(pcm.tobytes())\n\n\ndef youtube_upload(path):\n    import re, unicodedata, random\n    from google.auth.exceptions import RefreshError\n\n    def safe_text(value, limit):\n        value = unicodedata.normalize('NFKD', str(value or ''))\n        value = value.encode('ascii', 'ignore').decode('ascii')\n        value = re.sub(r'[^A-Za-z0-9 .,;:!?()_/#&+\\-]', ' ', value)\n        value = re.sub(r'\\s+', ' ', value).strip()\n        return value[:limit].rstrip()\n\n    def safe_url(value):\n        value = str(value or '').strip()\n        if value.startswith('https://') and all(c.isalnum() or c in ':/._-%?=&+#' for c in value):\n            return value[:300]\n        return ''\n\n    safe_title = safe_text(title, 100) or 'Gizemli paranormal hikaye'\n    credit_lines = []\n    source_file = OUT / 'image_sources.json'\n    if source_file.exists():\n        try:\n            credits = json.loads(source_file.read_text(encoding='utf-8'))\n            for item in credits[:SCENE_COUNT]:\n                work = safe_text(item.get('commons_title', 'Gorsel'), 90) or 'Gorsel'\n                artist = safe_text(item.get('artist', 'Bilinmiyor'), 55) or 'Bilinmiyor'\n                license_name = safe_text(item.get('license', 'Lisans bilgisi'), 35) or 'Lisans bilgisi'\n                source_type = safe_text(item.get('source_type', 'Wikimedia Commons'), 65)\n                page = safe_url(item.get('source_page', ''))\n                line = 'Scene ' + safe_text(item.get('scene', ''), 2) + ': ' + source_type + ' / ' + work + ' / ' + artist + ' / ' + license_name\n                if page:\n                    line += ' / ' + page\n                credit_lines.append(line[:480])\n        except Exception as credit_error:\n            print('Kaynakca okunamadi:', str(credit_error)[:160])\n\n    # Aciklama sadece ASCII, satir sonlari ve guvenli noktalama icerir.\n    intro = (safe_title + '\\n\\n'\n             'Gizemli Dunya paranormal hikaye videosu. Hikaye kurgu ve sehir efsanesi atmosferinde anlatilmistir.\\n'\n             'Teorini yorumlarda paylas.\\n\\n'\n             '#Shorts #Paranormal #GizemliHikayeler')\n    attribution = ''\n    if credit_lines:\n        attribution = ('\\n\\nIMAGE SOURCES / CREDITS:\\n' + '\\n'.join(credit_lines) +\n            '\\nLicense information: see each source page for the applicable license and terms.')\n    description = (intro + attribution)[:4500].rstrip()\n    # En sade yedek de kaynak atiflarini tutar; aciklama 4000 karakterin altinda kalir.\n    fallback_description = ('Gizemli Dunya paranormal hikaye videosu. Kurgu anlatim. #Shorts' +\n        (('\\n\\nImage sources / credits:\\n' + '\\n'.join(credit_lines)) if credit_lines else ''))[:3900].rstrip()\n    tags = ['Shorts', 'Gizemli Dunya', 'Paranormal', 'Gizemli Hikayeler', 'Korku Hikayeleri']\n    body = {\n        'snippet': {'title': safe_title, 'description': description, 'tags': tags,\n                    'categoryId': '24', 'defaultLanguage': 'tr'},\n        'status': {'privacyStatus': YOUTUBE_PRIVACY, 'selfDeclaredMadeForKids': False,\n                   'containsSyntheticMedia': True}\n    }\n\n    creds = Credentials(token=None, refresh_token=YOUTUBE_REFRESH_TOKEN,\n        token_uri='https://oauth2.googleapis.com/token', client_id=YOUTUBE_CLIENT_ID,\n        client_secret=YOUTUBE_CLIENT_SECRET,\n        scopes=['https://www.googleapis.com/auth/youtube.upload'])\n    try:\n        creds.refresh(Request())\n    except RefreshError as exc:\n        raise RuntimeError('YouTube oturum anahtari yenilenemedi. YOUTUBE_REFRESH_TOKEN ve OAuth izinlerini kontrol edin: ' + str(exc)[:300]) from exc\n    youtube = build('youtube', 'v3', credentials=creds, cache_discovery=False)\n\n    def new_request():\n        media = MediaFileUpload(str(path), mimetype='video/mp4',\n            chunksize=8 * 1024 * 1024, resumable=True)\n        return youtube.videos().insert(part='snippet,status', body=body, media_body=media)\n\n    request = new_request()\n    result = None\n    used_fallback = False\n    retry = 0\n    max_retries = 6\n    while result is None:\n        try:\n            # google-api-client icindeki gecici 5xx yeniden denemeleri de etkin.\n            _, result = request.next_chunk(num_retries=3)\n            retry = 0\n        except HttpError as error:\n            status = getattr(error.resp, 'status', 0)\n            raw = getattr(error, 'content', b'')\n            try:\n                payload = json.loads(raw.decode('utf-8', 'replace'))\n                api_error = payload.get('error', {})\n                reasons = [e.get('reason', '') for e in api_error.get('errors', [])]\n                message = api_error.get('message', '')\n            except Exception:\n                reasons, message = [], str(error)\n            reason_text = ' '.join(reasons)\n\n            if status == 400 and ('invalidDescription' in raw.decode('utf-8', 'replace')) and not used_fallback:\n                print('YouTube aciklamayi reddetti; kaynak atiflarini koruyan sade aciklama deneniyor.')\n                used_fallback = True\n                body['snippet']['description'] = fallback_description\n                request = new_request()\n                retry = 0\n                continue\n\n            transient = (status in (408, 429, 500, 502, 503, 504) or\n                         (status == 403 and any(x in reason_text for x in\n                          ('rateLimitExceeded', 'userRateLimitExceeded', 'backendError'))))\n            if transient and retry < max_retries:\n                retry += 1\n                delay = min(60, 2 ** retry) + random.uniform(0, 1.5)\n                print(f'YouTube gecici HTTP {status} hatasi ({retry}/{max_retries}); {delay:.1f} sn sonra ayni yukleme devam edecek. {message[:180]}')\n                time.sleep(delay)\n                continue\n            if status == 403 and 'quotaExceeded' in reason_text:\n                raise RuntimeError('YouTube API gunluk kotasi dolmus. Video hazir; kota sifirlaninca tekrar yuklenmeli. Yeni API istegiyle tekrar denemek kotayi artirmaz.') from error\n            if status in (401, 403):\n                raise RuntimeError(f'YouTube yetki/izin hatasi (HTTP {status}, {reason_text or \"unknown\"}): {message[:300]}. OAuth izinleri ve kanal erisimini kontrol edin.') from error\n            raise RuntimeError(f'YouTube yukleme hatasi (HTTP {status}, {reason_text or \"unknown\"}): {message[:400]}') from error\n        except (OSError, ConnectionError, TimeoutError) as error:\n            if retry >= max_retries:\n                raise RuntimeError('YouTube yuklemesinde ag hatasi; tekrar deneme siniri asildi: ' + str(error)[:250]) from error\n            retry += 1\n            delay = min(60, 2 ** retry) + random.uniform(0, 1.5)\n            print(f'Ag baglantisi kesildi ({retry}/{max_retries}); {delay:.1f} sn sonra yukleme surdurulecek.')\n            time.sleep(delay)\n\n    youtube_id = result.get('id') if isinstance(result, dict) else None\n    if not youtube_id:\n        raise RuntimeError('YouTube yukleme yaniti video ID icermiyor: ' + str(result)[:300])\n    return youtube_id\n\n\n# Her ses bolumu iki farkli, konuya ozel sinematik gorsel plana bolunur.\nprint(f'1/4 Her hikaye icin en az {SCENE_COUNT} farkli sinematik gorsel hazirlaniyor')\nvoice,scene_durations=make_voice_tracks()\ntotal_duration=sum(scene_durations)\nseed=int.from_bytes(__import__('hashlib').sha256((topic_id+slot).encode()).digest()[:4],'big')\nclips=[]\nvisual_no=0\nrender_scenes = scenes + [(CTA_TEXT, '')]\nfor beat_no,((caption,visual),duration) in enumerate(zip(render_scenes,scene_durations),1):\n    for shot_no in range(VISUALS_PER_BEAT):\n        visual_no += 1\n        shot_duration = duration / VISUALS_PER_BEAT\n        frame_count = max(1, round(shot_duration * FPS))\n        progress_start = shot_no / VISUALS_PER_BEAT\n        progress_span = 1.0 / VISUALS_PER_BEAT\n        clip=CLIPS/f'clip_{visual_no:02d}.mp4'\n        render_image_scene(visual_no,caption,shot_duration,category,topic_id,\n            seed + beat_no * 1009 + shot_no * 9176,clip,frame_count,\n            progress_start,progress_span)\n        clips.append(clip)\n        print(f'Sinematik gorsel {visual_no}/{SCENE_COUNT} hazir | anlatim bolumu {beat_no}/{VOICE_BEAT_COUNT} | plan {shot_no+1}/{VISUALS_PER_BEAT}')\n\nprint('2/5 Fon muzigi hazirlaniyor...')\nsound=OUT/'soundtrack.wav'\nmake_soundtrack(sound, total_duration, seed ^ 0x5A17C0DE)\nprint(f'3/5 {total_duration:.1f} saniyelik hikaye videosu birlestiriliyor...')\nconcat=OUT/'concat.txt'\nconcat.write_text(''.join(\"file '\"+p.resolve().as_posix()+\"'\\n\" for p in clips),encoding='utf-8')\nsilent=OUT/'silent.mp4'\nrun_ffmpeg(['-f','concat','-safe','0','-i',str(concat),'-c','copy','-an',str(silent)])\nfinal=ROOT/'gizemli-dunya-video.mp4'\nrun_ffmpeg(['-i',str(silent),'-i',str(voice),'-i',str(sound),\n    '-filter_complex','[1:a]volume=1.0[voice];[2:a]volume=0.24[music];[voice][music]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.95[a]',\n    '-map','0:v:0','-map','[a]','-shortest','-c:v','copy','-c:a','aac','-b:a','160k',\n    '-movflags','+faststart',str(final)])\n# Upload gate: every planned beat must have its own valid, distinct, sourced photograph.\ngenerated_images = sorted(IMAGE_DIR.glob('scene_*.jpg'))\nif len(generated_images) != SCENE_COUNT:\n    raise RuntimeError(f'Sahne fotografi sayisi hatali: {len(generated_images)}/{SCENE_COUNT}. YouTube yuklemesi engellendi.')\napproved_hashes = []\nfor image_path in generated_images:\n    with Image.open(image_path) as check_img:\n        check_img.verify()\n    with Image.open(image_path) as check_img:\n        check_img = check_img.convert('RGB')\n        if check_img.size != (768, 1365):\n            raise RuntimeError(f'Sahne boyutu hatali: {image_path.name} {check_img.size}')\n        h = image_dhash(check_img)\n        if any(hamming_distance(h, old) < 7 for old in approved_hashes):\n            raise RuntimeError(f'Benzer/tekrar sahne fotografi bulundu: {image_path.name}. Yayin engellendi.')\n        approved_hashes.append(h)\ninfo=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(final)],text=True))\nstreams=info.get('streams',[])\nif not any(s.get('codec_type')=='video' for s in streams): raise RuntimeError('Videoda goruntu akisi yok.')\nif not any(s.get('codec_type')=='audio' for s in streams): raise RuntimeError('Videoda ses akisi yok.')\nduration=float(info['format']['duration'])\nif abs(duration-total_duration)>1.0: raise RuntimeError(f'Video/ses suresi uyusmuyor: video {duration:.2f}s, beklenen {total_duration:.2f}s')\nif int(info.get('streams',[{}])[0].get('width',0))!=OUTPUT_WIDTH: raise RuntimeError('Video genisligi 1080 degil.')\nif int(info.get('streams',[{}])[0].get('height',0))!=OUTPUT_HEIGHT: raise RuntimeError('Video yuksekligi 1920 degil.')\nif final.stat().st_size<250000: raise RuntimeError('Video dosyasi beklenenden kucuk.')\n\nprint('4/5 YouTube yuklemesi baslatiliyor...')\nyoutube_id=youtube_upload(final)\nyoutube_url=f'https://www.youtube.com/watch?v={youtube_id}'\nprint('YouTube video:',youtube_url)\nrecord={'slot':slot,'topic_id':topic_id,'title':title,'youtube_id':youtube_id,'url':youtube_url,\n        'uploaded_at':datetime.now(ZoneInfo('Europe/Istanbul')).isoformat()}\n(OUT/'upload-result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2),encoding='utf-8')\n\nprint('5/5 Kalici yayin gecmisi kaydediliyor...')\nhistory.append(record)\nHISTORY_FILE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nsubprocess.run(['git','config','user.name','github-actions[bot]'],check=True)\nsubprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)\nsubprocess.run(['git','add',str(HISTORY_FILE.relative_to(ROOT))],check=True)\nsubprocess.run(['git','commit','-m',f'Yayin gecmisi: {topic_id}'],check=True)\ntry:\n    subprocess.run(['git','push','origin','HEAD:main'],check=True)\nexcept subprocess.CalledProcessError as exc:\n    raise RuntimeError('Video YouTube a yuklendi fakat gecmis GitHub a yazilamadi! '\n      'Ayni videonun tekrarlanmamasi icin output/upload-result.json kaydini '\n      'depo data/youtube_history.json dosyasina elle ekleyin.') from exc\nprint('BASARILI:',youtube_url)\nPY\npython create_video.py\n"
    - name: Videoyu ve yayin kaydini sakla
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gizemli-dunya-youtube-${{ github.run_id }}
        path: 'gizemli-dunya-video.mp4

          output/upload-result.json

          output/video-plani.json

