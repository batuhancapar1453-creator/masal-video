```yaml
name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg kur
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Masal videosunu oluştur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import sys
          import json
          import time
          import base64
          import subprocess
          import requests

          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
          AZURE_KEY = os.environ.get("AZURE_SPEECH_KEY", "")
          CF_TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          CF_ACCOUNT = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")

          def require(value, name):
              if not value:
                  print(f"EKSİK GİZLİ AYAR: {name}")
                  sys.exit(1)

          require(GEMINI_KEY, "GEMINI_API_KEY")
          require(AZURE_KEY, "AZURE_SPEECH_KEY")
          require(CF_TOKEN, "CLOUDFLARE_API_TOKEN")
          require(CF_ACCOUNT, "CLOUDFLARE_ACCOUNT_ID")

          def run(command):
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode != 0:
                  print(result.stderr[-4000:])
                  raise RuntimeError("Komut başarısız oldu")
              return result

          print("1/5 Masal yazılıyor...")

          prompt = """
          Türkçe, 4-6 yaş çocukları için özgün ve sıcak bir masal yaz.
          Kahramanlar sevimli bir tavşan ve küçük bir yıldız olsun.
          Korkutucu olay, şiddet, tehlikeli davranış ve telifli karakter kullanma.
          Masal yaklaşık 450-600 kelime olsun.
          Sadece masal metnini ver; başlık ekleyebilirsin.
          Sonu mutlu bitsin ve nazik olma mesajı versin.
          """

          gemini_url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent"
          )

          response = requests.post(
              gemini_url,
              params={"key": GEMINI_KEY},
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 1800
                  }
              },
              timeout=120
          )

          if not response.ok:
              print("Gemini hatası:", response.status_code, response.text[:2000])
              response.raise_for_status()

          data = response.json()
          story = data["candidates"][0]["content"]["parts"][0]["text"].strip()

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print("Masal yazıldı:", len(story), "karakter")

          print("2/5 Seslendiriliyor...")

          ssml = (
              '<speak version="1.0" xml:lang="tr-TR">'
              '<voice name="tr-TR-EmelNeural">'
              + story.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              + '</voice></speak>'
          )

          # Azure Speech için Türkiye bölgesi.
          # Anahtarın farklı bir Azure bölgesine aitse AZURE_REGION secret'ı ekleyebilirsin.
          azure_region = os.environ.get("AZURE_REGION", "westeurope")

          tts_url = (
              f"https://{azure_region}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          audio_response = requests.post(
              tts_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3"
              },
              data=ssml.encode("utf-8"),
              timeout=180
          )

          if not audio_response.ok:
              print("Azure ses hatası:", audio_response.status_code)
              print(audio_response.text[:2000])
              audio_response.raise_for_status()

          with open("narration.mp3", "wb") as f:
              f.write(audio_response.content)

          print("Ses dosyası hazır:", len(audio_response.content), "bayt")

          print("3/5 Görseller hazırlanıyor...")

          image_url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )

          image_prompts = [
              "A cute little brown bunny in a magical flower meadow, children's storybook illustration, colorful, soft lighting, no text",
              "A tiny glowing golden star smiling in a purple twilight sky, children's storybook illustration, no text",
              "A cute bunny looking up at a friendly little star, enchanted forest, children's picture book illustration, no text",
              "A bunny walking on a winding path with glowing flowers, whimsical children's storybook art, no text",
              "A tiny star gently lighting a dark but friendly forest path, cute children's illustration, no text",
              "A bunny and a little star helping a small bird find its nest, warm colorful storybook art, no text",
              "A happy bunny, little star and forest animals celebrating under a magical sky, children's book illustration, no text",
              "A cute bunny sleeping peacefully beneath a starry sky, cozy bedtime storybook illustration, no text"
          ]

          headers = {
              "Authorization": f"Bearer {CF_TOKEN}",
              "Content-Type": "application/json"
          }

          def save_cloudflare_image(prompt, filename):
              r = requests.post(
                  image_url,
                  headers=headers,
                  json={
                      "prompt": prompt,
                      "width": 1024,
                      "height": 576,
                      "num_steps": 8
                  },
                  timeout=180
              )

              if not r.ok:
                  print("Cloudflare görsel hatası:", r.status_code)
                  print(r.text[:2000])
                  r.raise_for_status()

              content_type = r.headers.get("content-type", "").lower()

              if "image/" in content_type or r.content[:8] == b"\x89PNG\r\n\x1a\n":
                  image_bytes = r.content
              else:
                  try:
                      result = r.json()
                  except Exception:
                      print("Cloudflare beklenmeyen yanıt türü:", content_type)
                      print(r.text[:1000])
                      raise RuntimeError("Cloudflare görsel yanıtı okunamadı")

                  if isinstance(result.get("result"), dict):
                      image_data = result["result"].get("image")
                  else:
                      image_data = None

                  if not image_data:
                      print("Cloudflare yanıtında görsel bulunamadı.")
                      print(json.dumps(result, ensure_ascii=False)[:1500])
                      raise RuntimeError("Görsel verisi eksik")

                  if isinstance(image_data, str):
                      if image_data.startswith("data:image"):
                          image_data = image_data.split(",", 1)[1]
                      image_bytes = base64.b64decode(image_data)
                  else:
                      raise RuntimeError("Görsel verisinin biçimi desteklenmiyor")

              if not image_bytes:
                  raise RuntimeError("Boş görsel alındı")

              with open(filename, "wb") as f:
                  f.write(image_bytes)

              print(filename, "hazır:", len(image_bytes), "bayt")

          for i, prompt_text in enumerate(image_prompts, start=1):
              print(f"Görsel {i}/8 hazırlanıyor...")
              save_cloudflare_image(prompt_text, f"scene_{i:02d}.png")
              time.sleep(1)

          print("4/5 Video oluşturuluyor...")

          # Görselleri videoya çevir ve birleştir.
          for i in range(1, 9):
              filename = f"scene_{i:02d}.png"
              if not os.path.exists(filename):
                  raise RuntimeError(f"Görsel bulunamadı: {filename}")

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", filename,
                  "-t", "7",
                  "-vf", "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,format=yuv420p",
                  "-r", "24",
                  "-an",
                  f"clip_{i:02d}.mp4"
              ])

          with open("clips.txt", "w", encoding="utf-8") as f:
              for i in range(1, 9):
                  f.write(f"file 'clip_{i:02d}.mp4'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat", "-safe", "0",
              "-i", "clips.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          run([
              "ffmpeg", "-y",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "128k",
              "-shortest",
              "-movflags", "+faststart",
              "masal-video.mp4"
          ])

          print("5/5 Tamamlandı!")
          print("Video:", os.path.getsize("masal-video.mp4"), "bayt")
          PY

          python create_video.py

      - name: Video ve masalı yükle
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
          if-no-files-found: error
          retention-days: 7
```
