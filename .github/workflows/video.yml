name: Gizemli Dunya - Ucretsiz Paranormal Hikayeler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron saatleri UTC'dir; Turkiye UTC+3: 09:23 ve 20:23 yerel saat.
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-paranormal-shorts-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ve sanal ekran kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng xvfb libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1

      - name: Blender 4.5.15 LTS cache
        uses: actions/cache@v4
        with:
          path: ~/blender-4.5.15
          key: blender-4.5.15-linux-x64-${{ runner.os }}-v1

      - name: Resmî Blender 4.5.15 LTS kur
        run: |
          set -euo pipefail
          BLENDER_DIR="$HOME/blender-4.5.15"
          if [ ! -x "$BLENDER_DIR/blender" ]; then
            ARCHIVE="blender-4.5.15-linux-x64.tar.xz"
            BASE_URL="https://download.blender.org/release/Blender4.5"
            cd "$RUNNER_TEMP"
            curl -fL --retry 3 --retry-delay 3 "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"
            # Blender checksum dosyasi arsiv adi + .sha256 degil,
            # surum adi ile yayinlaniyor; yalnizca Linux x64 arsiv satirini dogrula.
            curl -fL --retry 3 --retry-delay 3 "$BASE_URL/blender-4.5.15.sha256" -o blender-4.5.15.sha256
            grep -F "$ARCHIVE" blender-4.5.15.sha256 | sha256sum -c -
            tar -xf "$ARCHIVE"
            mv "$RUNNER_TEMP/blender-4.5.15-linux-x64" "$BLENDER_DIR"
          else
            echo "Blender 4.5.15 cache bulundu; yeniden indirme atlandi."
          fi
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          "$BLENDER_DIR/blender" --version | head -n 1
          python - <<'PY'
          import re, subprocess
          version = subprocess.check_output([str(__import__('pathlib').Path.home() / 'blender-4.5.15' / 'blender'), '--version'], text=True).splitlines()[0]
          m = re.search(r'Blender (\d+)\.(\d+)', version)
          if not m or tuple(map(int, m.groups())) < (4, 1):
              raise SystemExit('Rain v3 / Snow v4 icin Blender 4.1 veya uzeri gerekli: ' + version)
          if not version.startswith('Blender 4.5.15'):
              raise SystemExit('Beklenen Blender 4.5.15 LTS yerine farkli surum bulundu: ' + version)
          print('Blender surumu uygun:', version)
          PY

      - name: Ucretsiz Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy edge-tts google-api-python-client google-auth

      - name: Ara 3D Gen karakter motorunu indir
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara3dgen

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ara3dgen/package-lock.json

      - name: Ara 3D Gen bağımlılıklarını kur
        run: |
          cd ara3dgen
          npm ci

      - name: CC0 gerçekçi insan varlıklarını hazırla (önbellekli)
        uses: actions/cache@v4
        with:
          path: |
            ara3dgen/vendor
            ara3dgen/public/assets
          key: ara3dgen-cc0-${{ runner.os }}-${{ hashFiles('ara3dgen/package-lock.json') }}-v1

      - name: CC0 MakeHuman karakter verisini hazırla
        run: |
          set -euo pipefail
          cd ara3dgen
          npm run setup-assets

      - name: İki gerçekçi rigli karakteri ve animasyonları üret
        run: |
          set -euo pipefail
          mkdir -p assets/characters ara3dgen/out/rain ara3dgen/out/snow
          cd ara3dgen
          # Ara CLI GLB dışa aktarımı: PBR dokular, Mixamo uyumlu rig ve seçili animasyon klipleri.
          npm run export -- --random 3170317 --detail high --formats glb --out out/rain
          npm run export -- --random 3170320 --detail high --formats glb --out out/snow
          python - <<'PYCHAR'
          from pathlib import Path
          import shutil
          root=Path('out')
          for label in ('rain','snow'):
              files=sorted((root/label).rglob('*.glb'), key=lambda p:p.stat().st_size, reverse=True)
              if not files:
                  raise SystemExit(f'Ara 3D Gen {label} için GLB üretmedi; export klasörü: {root/label}')
              src=files[0]
              with src.open('rb') as f:
                  if f.read(4)!=b'glTF': raise SystemExit(f'Geçersiz GLB: {src}')
              if src.stat().st_size < 150000:
                  raise SystemExit(f'Karakter GLB dosyası beklenenden küçük: {src} ({src.stat().st_size})')
              dst=Path('../assets/characters')/('rain_v3.glb' if label=='rain' else 'snow_v4.glb')
              shutil.copy2(src,dst)
              print(f'{dst}: {dst.stat().st_size:,} bytes; kaynak={src}')
          PYCHAR

      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {key: os.getenv(key, '').strip() for key in (
              'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('Eksik secrets: ' + ', '.join(missing))
          r = requests.post('https://oauth2.googleapis.com/token', data={
              'grant_type': 'refresh_token',
              'client_id': values['YOUTUBE_CLIENT_ID'],
              'client_secret': values['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],
          }, timeout=30)
          info = r.json()
          if not r.ok or not info.get('access_token'):
              raise SystemExit('YouTube OAuth hatasi: ' + str(info.get('error'))
                  + ' (' + str(info.get('error_description'))[:160] + ')')
          print('YouTube OAuth testi basarili; animasyon uretimi baslayabilir.')
          PY

      - name: Hareketli videoyu uret ve YouTube'a yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: |
          cat > render_3d.py <<'BLENDER'
          import bpy, sys, math, random, argparse
          from mathutils import Vector
          
          argv = sys.argv[sys.argv.index('--') + 1:] if '--' in sys.argv else []
          p = argparse.ArgumentParser()
          p.add_argument('--theme', default='haunted_room')
          p.add_argument('--scene', type=int, default=1)
          p.add_argument('--seed', type=int, default=1)
          p.add_argument('--duration', type=float, default=5)
          p.add_argument('--output', required=True)
          p.add_argument('--width', type=int, default=540)
          p.add_argument('--height', type=int, default=960)
          p.add_argument('--fps', type=int, default=25)
          p.add_argument('--frame-count', type=int, default=0)
          p.add_argument('--rain-file', required=True)
          p.add_argument('--snow-file', required=True)
          p.add_argument('--audio-file', required=True)
          p.add_argument('--audio-offset', type=float, default=0.0)
          a = p.parse_args(argv)
          rng = random.Random(a.seed)
          
          bpy.ops.object.select_all(action='SELECT'); bpy.ops.object.delete(use_global=False)
          for datablocks in (bpy.data.materials, bpy.data.curves, bpy.data.meshes, bpy.data.cameras, bpy.data.lights):
              pass
          
          def mat(name, color, rough=0.72, metallic=0.0):
              m=bpy.data.materials.new(name); m.diffuse_color=(*color,1); m.roughness=rough; m.metallic=metallic
              return m
          
          colors=[(0.08,0.55,0.78),(0.92,0.28,0.18),(0.95,0.62,0.12),(0.35,0.72,0.38),(0.55,0.32,0.78),(0.92,0.35,0.58),(0.12,0.68,0.62)]
          skin=mat('Character skin',rng.choice([(0.72,.43,.28),(.91,.68,.51),(.55,.32,.21),(.82,.59,.42),(.95,.77,.63)]))
          shirt=mat('Unique clothing',rng.choice(colors)); pants=mat('Trousers',rng.choice([(0.05,.09,.19),(.12,.16,.24),(.28,.19,.14),(.12,.25,.28)]))
          hair=mat('Unique hair',rng.choice([(.025,.02,.03),(.12,.055,.025),(.22,.12,.06),(.55,.19,.08),(.08,.12,.18)]))
          shoe=mat('Shoes',(.025,.03,.045)); white=mat('Eyes',(.96,.97,1)); iris=mat('Iris',(.04,.08,.12)); dark=mat('Shadow figure',(.012,.018,.035),.95)
          wall=mat('Deep teal walls',(.035,.095,.16)); floor=mat('Polished floor',(.055,.075,.11),.35); gold=mat('Warm light',(.98,.53,.12),.3,0.25); metal=mat('Metal',(.22,.32,.4),.25,.7)
          
          def cube(name, loc, scale, material, bevel=0.0):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc); o=bpy.context.object; o.name=name; o.dimensions=scale; bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              o.data.materials.append(material)
              if bevel:
                  mod=o.modifiers.new('Soft rounded edges','BEVEL'); mod.width=bevel; mod.segments=3
                  o.modifiers.new('Weighted corner normals','WEIGHTED_NORMAL')
              return o
          
          def sphere(name, loc, scale, material):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=20, ring_count=12, location=loc); o=bpy.context.object; o.name=name; o.scale=scale; o.data.materials.append(material); bpy.ops.object.shade_smooth(); return o
          
          def cylinder(name, loc, radius, depth, material, rotation=None):
              bpy.ops.mesh.primitive_cylinder_add(vertices=20, radius=radius, depth=depth, location=loc, rotation=rotation or (0,0,0)); o=bpy.context.object; o.name=name; o.data.materials.append(material); bpy.ops.object.shade_smooth(); return o
          
          def between(name, p1, p2, radius, material):
              mid=(Vector(p1)+Vector(p2))/2; vec=Vector(p2)-Vector(p1)
              o=cylinder(name,mid,radius,vec.length,material); o.rotation_mode='QUATERNION'; o.rotation_quaternion=vec.to_track_quat('Z','Y'); return o
          
          # Stage: a designed, colored 3D set, not a flat image.
          cube('Floor',(0,0,-.18),(12,12,.35),floor,.12)
          cube('Back wall',(0,3.0,3.3),(12,.35,7),wall,.12)
          for x in (-5.3,5.3): cube('Side wall',(x,0,3.3),(.28,6.2,7),wall,.08)
          # luminous wall strips and floor markings
          for x in (-4.7,4.7): cube('Neon architectural strip',(x,2.78,3.2),(.07,.035,5.8),gold,.025)
          for x in (-3,-1,1,3): cube('Floor inlay',(x,-.4,.005),(.025,6,.012),metal,.005)
          
          # Theme-specific 3D story prop.
          if a.theme in ('elevator','elevator_zero','hotel','hospital','basement','door','door_self','doorbell','hiddenroom'):
              cube('Elevator surround',(0,2.55,2.0),(3.25,.35,4.3),metal,.12)
              left=cube('Elevator left door',(-.72,2.30,2.0),(1.38,.16,3.75),mat('Door blue',(.12,.3,.48)),.08)
              right=cube('Elevator right door',(.72,2.30,2.0),(1.38,.16,3.75),mat('Door violet',(.28,.16,.48)),.08)
              left.keyframe_insert('location',frame=1); left.location.x=-1.55; left.keyframe_insert('location',frame=max(2,int(a.duration*a.fps*.45)))
              right.keyframe_insert('location',frame=1); right.location.x=1.55; right.keyframe_insert('location',frame=max(2,int(a.duration*a.fps*.45)))
              for z in (1.25,2.0,2.75): sphere('Elevator button',(1.95,2.15,z),(.07,.07,.07),gold)
          elif a.theme in ('mirror','window','window_face','photo','camera','album'):
              cube('Mirror frame',(0,2.55,2.3),(2.6,.22,3.7),gold,.15); cube('Reflective dark glass',(0,2.40,2.3),(2.3,.08,3.4),mat('Mirror glass',(.06,.19,.27),.12,.8),.05)
          elif a.theme in ('phone','phonebook','radio','cassette','piano','clock','clock_backwards','tea','key','book'):
              cube('Antique table',(0,1.5,.65),(2.6,1.3,.18),mat('Wood',(.24,.095,.045)),.08)
              for x in (-1,1):
                  for y in (1.05,1.95): cube('Table leg',(x,y,.28),(.12,.12,.65),mat('Dark wood',(.12,.055,.03)),.035)
              if a.theme in ('phone','phonebook'):
                  cube('Glowing phone',(0,1.45,.88),(.52,.25,.12),mat('Phone casing',(.025,.035,.05),.2,.6),.04); cube('Phone screen',(0,1.31,.95),(.40,.012,.07),gold,.01)
              else:
                  sphere('Mysterious artifact',(0,1.45,1.02),(.42,.32,.24),gold)
          elif a.theme in ('train','station','bus','busstop','missing_passenger','ship','ferry'):
              cube('Vehicle body',(0,2.15,1.65),(4.6,.75,2.2),mat('Vehicle enamel',(.12,.34,.53)),.22)
              for x in (-1.55,-.5,.5,1.55): cube('Vehicle window',(x,1.75,2.0),(.72,.06,.72),mat('Window glass',(.08,.28,.4),.1,.5),.05)
              for x in (-1.5,1.5): cylinder('Wheel',(x,1.68,.55),.34,.18,shoe,(math.pi/2,0,0))
          elif a.theme == 'lighthouse':
              # Coastal lighthouse set: sea, wet rocks, tower, lantern room and a visible beam.
              sea=mat('Night sea',(.012,.055,.095),.24,.22); stone=mat('Weathered lighthouse stone',(.34,.39,.42),.82); rock=mat('Wet coastal rock',(.045,.065,.075),.28,.18)
              cube('Dark sea',(0,2.8,-.05),(14,8,.35),sea,.08)
              cube('Rocky promontory',(0,1.0,.18),(5.5,3.8,.65),rock,.28)
              cylinder('Lighthouse tower',(0,1.25,2.15),.62,3.8,stone)
              cylinder('Lantern gallery',(0,1.25,4.12),.82,.22,metal)
              cylinder('Lantern glass',(0,1.25,4.48),.55,.55,mat('Lantern glass',(.9,.58,.2),.12,.15))
              cylinder('Lantern roof',(0,1.25,4.82),.72,.22,mat('Roof',(.12,.035,.025),.4))
              for z in (1.0,1.8,2.6,3.4): cube('Tower slit window',(0,.61,z),(.13,.035,.28),gold,.025)
              bpy.ops.object.light_add(type='SPOT',location=(0,1.1,4.5)); beam=bpy.context.object; beam.data.energy=1800; beam.data.color=(1.0,.72,.38); beam.data.spot_size=math.radians(34); beam.data.spot_blend=.65; beam.rotation_euler=(math.radians(75),0,math.radians(-22))
              for i in range(5):
                  x=-2.0+i*1.0; sphere('Coastal boulder',(x,-.15,.38),(.42,.5,.34),rock)
          elif a.theme in ('forest','pine_forest','road','bridge','lake','swing','cabin'):
              for i in range(7):
                  x=-4.5+i*1.5
                  cylinder('Tree trunk',(x,2.25,1.25),.15,2.5,mat('Bark',(.18,.075,.035)))
                  bpy.ops.mesh.primitive_cone_add(vertices=12, radius1=.85, radius2=0, depth=2.2, location=(x,2.25,2.9)); bpy.context.object.data.materials.append(mat('Bright pine',(.045,.27,.16)))
          else:
              cube('Mysterious doorway',(0,2.55,2.0),(2.4,.22,3.8),gold,.08)
              cube('Door dark inset',(0,2.39,2.0),(2.1,.08,3.5),mat('Door interior',(.018,.028,.055)),.04)
          
          # Ara 3D Gen: PBR dokulu, Mixamo uyumlu rigli GLB karakterleri içe aktar.
          def import_rig(glb_path, label, x_position, target_height=3.15):
              from pathlib import Path
              path=Path(glb_path)
              if not path.is_file() or path.stat().st_size < 150000:
                  raise RuntimeError('Karakter GLB dosyası eksik veya bozuk: '+str(path))
              with path.open('rb') as f:
                  if f.read(4) != b'glTF':
                      raise RuntimeError('Geçerli GLB başlığı bulunamadı: '+str(path))
              before=set(bpy.data.objects)
              bpy.ops.import_scene.gltf(filepath=str(path))
              imported=[o for o in bpy.data.objects if o not in before]
              meshes=[o for o in imported if o.type=='MESH']
              rigs=[o for o in imported if o.type=='ARMATURE']
              if not meshes or not rigs:
                  raise RuntimeError(label+' GLB içinde mesh veya armature bulunamadı.')
              arm=rigs[0]
              bounds=[o.matrix_world @ Vector(corner) for o in meshes for corner in o.bound_box]
              min_z=min(v.z for v in bounds); max_z=max(v.z for v in bounds)
              scale=target_height/max(0.01,max_z-min_z)
              root=bpy.data.objects.new(label+' cinematic root',None)
              bpy.context.scene.collection.objects.link(root)
              root.location=(x_position,-1.0,-min_z*scale)
              root.scale=(scale,scale,scale)
              for obj in imported:
                  if obj.parent is None:
                      obj.parent=root
                      obj.matrix_parent_inverse=__import__('mathutils').Matrix.Identity(4)
              # GLB içindeki gerçek hareket kliplerini kullan; statik procedural kemik sallama yok.
              actions=list(bpy.data.actions)
              preferred=('idle','talk','walk','slouch')
              chosen=None
              for token in preferred:
                  chosen=next((act for act in actions if token in act.name.lower()),None)
                  if chosen: break
              if chosen:
                  if not arm.animation_data: arm.animation_data_create()
                  arm.animation_data.action=chosen
                  print(label,'animasyon klibi:',chosen.name)
              else:
                  print('UYARI:',label,'GLB içinde adında Idle/Talk/Walk bulunan animasyon bulunamadı.')
              return root,arm,meshes

          frames=a.frame_count if a.frame_count>0 else max(2,round(a.duration*a.fps))
          mid=max(2,frames//2); end=frames
          rain=import_rig(a.rain_file,'rain',-.65)
          actors=[(*rain,'rain')]
          if a.scene>=4:
              snow=import_rig(a.snow_file,'snow',1.35)
              actors.append((*snow,'snow'))

          def read_audio_levels(filename,offset,count,fps):
              import wave, array
              try:
                  with wave.open(filename,'rb') as w:
                      if w.getsampwidth()!=2: return [0.0]*count
                      rate=w.getframerate(); channels=w.getnchannels()
                      samples=array.array('h'); samples.frombytes(w.readframes(w.getnframes()))
                      if sys.byteorder!='little': samples.byteswap()
                      result=[]
                      for i in range(count):
                          lo=int((offset+i/fps)*rate)*channels
                          hi=int((offset+(i+1)/fps)*rate)*channels
                          part=samples[lo:hi]
                          rms=math.sqrt(sum(float(v)*v for v in part)/len(part))/32768.0 if part else 0.0
                          result.append(min(1.0,rms*5.0))
                      return result
              except Exception as exc:
                  print('Ses dalga bicimi okunamadi; agiz kontrolu sifirlandi:',exc)
                  return [0.0]*count

          levels=read_audio_levels(a.audio_file,a.audio_offset,frames,a.fps)
          for actor_index,(root,arm,meshes,actor_name) in enumerate(actors):
              root.keyframe_insert('location',frame=1)
              root.location.x += (1.05 if a.scene in (1,2) else .35 if a.scene in (3,4) else -.55)
              root.keyframe_insert('location',frame=end)
              root.rotation_euler[2]=0; root.keyframe_insert('rotation_euler',frame=1)
              root.rotation_euler[2]=rng.choice([-.16,.16]) if a.scene>=3 else 0
              root.keyframe_insert('rotation_euler',frame=mid)
              # Imported mocap action drives the body; the root keyframes below add subtle blocking.
              face_keys=[]
              for mesh in meshes:
                  if mesh.data.shape_keys:
                      for key in mesh.data.shape_keys.key_blocks:
                          if any(k in key.name.lower() for k in ('jawopen','jaw_open','mouthopen','mouth_open')):
                              face_keys.append(key)
              jaw_bones=[pb for pb in arm.pose.bones if 'jaw' in pb.name.lower() or 'mouth' in pb.name.lower()]
              for fr,level in enumerate(levels,1):
                  for key in face_keys:
                      key.value=level
                      key.keyframe_insert(data_path='value',frame=fr,group='Audio-driven mouth')
                  for pb in jaw_bones:
                      pb.rotation_mode='XYZ'; pb.rotation_euler[0]=level*.22
                      pb.keyframe_insert(data_path='rotation_euler',frame=fr,group='Audio-driven jaw')
              for mesh in meshes:
                  if not mesh.data.shape_keys: continue
                  for key in mesh.data.shape_keys.key_blocks:
                      if 'blink' in key.name.lower() or 'eye_close' in key.name.lower():
                          for bf in (max(2,int(frames*.32)),max(2,int(frames*.76))):
                              key.value=1.0; key.keyframe_insert(data_path='value',frame=bf)
                              key.value=0.0; key.keyframe_insert(data_path='value',frame=min(frames,bf+2))

          # Cinematic portrait camera, depth and lighting.
          bpy.ops.object.camera_add(location=(5.6,-10.8,5.0)); cam=bpy.context.object
          cam.rotation_euler=(Vector((0,.4,1.9))-cam.location).to_track_quat('-Z','Y').to_euler(); cam.data.lens=48; bpy.context.scene.camera=cam
          cam.data.dof.use_dof=True; cam.data.dof.focus_distance=10.5; cam.data.dof.aperture_fstop=5.6
          for loc, power, size, color in [((-3,-4,7),1150,5,(.25,.55,1)),((4,1,6),1450,4,(1,.28,.12)),((0,3,5),900,3,(1,.65,.28))]:
              bpy.ops.object.light_add(type='AREA',location=loc); light=bpy.context.object; light.data.energy=power; light.data.shape='DISK'; light.data.size=size; light.data.color=color; light.rotation_euler=(Vector((0,0,1.5))-light.location).to_track_quat('-Z','Y').to_euler()
          
          scene=bpy.context.scene
          engines={item.identifier for item in scene.render.bl_rna.properties['engine'].enum_items}
          if 'BLENDER_EEVEE_NEXT' in engines:
              scene.render.engine='BLENDER_EEVEE_NEXT'
          elif 'BLENDER_EEVEE' in engines:
              scene.render.engine='BLENDER_EEVEE'
          else:
              scene.render.engine='CYCLES'
              scene.cycles.samples=8
              scene.cycles.use_denoising=True
