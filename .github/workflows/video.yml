          print('2/5 Fon muzigi hazirlaniyor...')
          sound=OUT/'soundtrack.wav'
          make_soundtrack(sound)
          print('3/5 30 saniyelik video birlestiriliyor...')
          concat=OUT/'concat.txt'
          concat.write_text(''.join("file '"+p.resolve().as_posix()+"'\n" for p in clips),encoding='utf-8')
          silent=OUT/'silent.mp4'
          run_ffmpeg(['-f','concat','-safe','0','-i',str(concat),'-c','copy','-an',str(silent)])
          final=ROOT/'gizemli-dunya-video.mp4'
          run_ffmpeg(['-i',str(silent),'-i',str(voice),'-i',str(sound),
              '-filter_complex','[1:a]volume=1.0[voice];[2:a]volume=0.16[music];[voice][music]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.95[a]',
              '-map','0:v:0','-map','[a]','-t',str(TARGET_SECONDS),'-c:v','copy','-c:a','aac','-b:a','160k',
              '-movflags','+faststart',str(final)])
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(final)],text=True))
          streams=info.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams): raise RuntimeError('Videoda goruntu akisi yok.')
          if not any(s.get('codec_type')=='audio' for s in streams): raise RuntimeError('Videoda ses akisi yok.')
          duration=float(info['format']['duration'])
          if abs(duration-TARGET_SECONDS)>0.25: raise RuntimeError(f'Video 30 saniye degil: {duration:.2f}s')
          if int(info.get('streams',[{}])[0].get('width',0))!=OUTPUT_WIDTH: raise RuntimeError('Video genisligi 1080 degil.')
          if int(info.get('streams',[{}])[0].get('height',0))!=OUTPUT_HEIGHT: raise RuntimeError('Video yuksekligi 1920 degil.')
          if final.stat().st_size<250000: raise RuntimeError('Video dosyasi beklenenden kucuk.')

          print('4/5 YouTube yuklemesi baslatiliyor...')
          youtube_id=youtube_upload(final)
          youtube_url=f'https://www.youtube.com/watch?v={youtube_id}'
          print('YouTube video:',youtube_url)
          record={'slot':slot,'topic_id':topic_id,'title':title,'youtube_id':youtube_id,'url':youtube_url,
                  'uploaded_at':datetime.now(ZoneInfo('Europe/Istanbul')).isoformat()}
          (OUT/'upload-result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2),encoding='utf-8')

          print('5/5 Kalici yayin gecmisi kaydediliyor...')
          history.append(record)
          HISTORY_FILE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(HISTORY_FILE.relative_to(ROOT))],check=True)
          subprocess.run(['git','commit','-m',f'Yayin gecmisi: {topic_id}'],check=True)
          try:
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          except subprocess.CalledProcessError as exc:
              raise RuntimeError('Video YouTube a yuklendi fakat gecmis GitHub a yazilamadi! '
                'Ayni videonun tekrarlanmamasi icin output/upload-result.json kaydini '
                'depo data/youtube_history.json dosyasina elle ekleyin.') from exc
          print('BASARILI:',youtube_url)
          PY
          python create_video.py

      - name: Videoyu ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizemli-dunya-youtube-${{ github.run_id }}
          path: |
            gizemli-dunya-video.mp4
            output/upload-result.json
            output/video-plani.json
            data/youtube_history.json
          if-no-files-found: warn
          retention-days: 14
