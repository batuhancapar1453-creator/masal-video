          def wrap_text(draw, text_value, font, max_width):
              words = text_value.split()
              lines = []
              current = ''
              for word in words:
                  test = (current + ' ' + word).strip()
                  if draw.textbbox((0, 0), test, font=font)[2] <= max_width or not current:
                      current = test
                  else:
                      lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines


          def draw_subtitles(draw, text_value, progress, category, scene_no):
              # Kanal adi / ust koyu serit tamamen kaldirildi.
              lines = wrap_text(draw, text_value, FONT_CAPTION, WIDTH-78)
              line_h = 37
              panel_h = len(lines)*line_h + 34
              top = HEIGHT-72-panel_h
              draw.rounded_rectangle((24, top, WIDTH-24, HEIGHT-72), radius=22,
                                     fill=(3, 8, 18, 220), outline=(255, 255, 255, 80), width=2)
              for i, line in enumerate(lines):
                  draw.text((WIDTH//2, top+18+i*line_h), line, font=FONT_CAPTION, anchor='mt',
                            fill=(255, 255, 255, 255), stroke_width=1, stroke_fill=(0, 0, 0, 180))


          def render_frame(bg, topic_id, category, scene_no, frame_no, total_frames, caption, seed):
              img = bg.copy()
              d = ImageDraw.Draw(img, 'RGBA')
              t = frame_no / FPS
              phase = t*2.8 + scene_no
              if category == 'Paranormal':
                  draw_paranormal_subject(d, topic_id, frame_no, total_frames, phase, scene_no, seed)
                  # Every story gets its own moving atmospheric details, not a repeated haunted-house overlay.
                  kind = paranormal_visual_kind(topic_id, title)
                  for i in range(12):
                      x = (i*53 + frame_no*(1+i%3)*0.48 + seed%31) % WIDTH
                      y = (i*79 - frame_no*(0.45+i%2*0.35)) % HEIGHT
                      r = 1 + (i%3)
                      color = (175, 205, 225, 70) if kind not in ('phone','piano','tea','cassette','radio') else (235, 190, 125, 65)
                      d.ellipse((x-r, y-r, x+r, y+r), fill=color)
              elif category == 'Uzay':
                  for i in range(22):
                      x=(i*83+frame_no*(1+i%3)*0.55+seed%37)%WIDTH
                      y=(i*137+frame_no*(1+i%2)*0.7)%HEIGHT
                      r=2+(i%3)
                      d.ellipse((x-r,y-r,x+r,y+r),fill=(190,220,255,110))
                  draw_astronaut(d,105+25*math.sin(phase*.7),560+20*math.cos(phase),phase,.72)
              elif category == 'Tarih':
                  for i in range(3):
                      x=(55+i*185+frame_no*(5+i)*.18)%(WIDTH+80)-30
                      draw_worker(d,x,785,phase+i*1.7,.88 if i==1 else .78,carrying=(i!=1))
              else:
                  x=95+((frame_no*2)%330)
                  draw_worker(d,x,790,phase,.78,(35,48,43,255),False)
              progress=(frame_no+1)/max(1,total_frames)
              draw_subtitles(d,caption,progress,category,scene_no)
              return img



          def render_animated_clip(scene_no, caption, duration, category, topic_id, seed, output, frame_count=None, audio_offset=0.0):
              """Render a genuine animated 3D scene in Blender, then add the established subtitles."""
              frames = frame_count if frame_count is not None else max(1, round(duration * FPS))
              temp_video = CLIPS / f'blender_raw_{scene_no:02d}.mp4'
              theme = paranormal_visual_kind(topic_id, title)
              # GitHub Actions Linux ortaminda Blender icin sanal ekran ve yazilimsal OpenGL.
              blender_config = OUT / 'blender-config'
              blender_config.mkdir(parents=True, exist_ok=True)
              blender_env = os.environ.copy()
              blender_env['LIBGL_ALWAYS_SOFTWARE'] = '1'
              blender_env['MESA_LOADER_DRIVER_OVERRIDE'] = 'llvmpipe'
              blender_env['GALLIUM_DRIVER'] = 'llvmpipe'
              blender_env['OMP_NUM_THREADS'] = '1'
              blender_env['OPENBLAS_NUM_THREADS'] = '1'
              blender_env['BLENDER_USER_CONFIG'] = str(blender_config)

              blender_executable = str(Path.home() / 'blender-4.5.15' / 'blender')
              if not Path(blender_executable).is_file():
                  raise FileNotFoundError(f'Blender calistirilabilir dosyasi bulunamadi: {blender_executable}')
              command = [
                  'xvfb-run', '-a', '-s', '-screen 0 1280x1024x24',
                  blender_executable, '--background', '--factory-startup',
                  '--threads', '2', '--python-exit-code', '1',
                  '--python', str(ROOT / 'render_3d.py'), '--',
                  '--theme', theme, '--scene', str(scene_no), '--seed', str(seed),
                  '--duration', f'{duration:.6f}', '--output', str(temp_video),
                  '--width', str(WIDTH), '--height', str(HEIGHT), '--fps', str(FPS),
                  '--frame-count', str(frames),
                  '--rain-file', str(ROOT / 'assets' / 'characters' / 'rain_v3.glb'),
                  '--snow-file', str(ROOT / 'assets' / 'characters' / 'snow_v4.glb'),
                  '--audio-file', str(OUT / 'narration.wav'),
                  '--audio-offset', f'{audio_offset:.6f}'
              ]
              print(f'Blender 3D sahnesi olusturuluyor: {scene_no}/6 | tema={theme}')
              print('Sanal ekran ve yazilimsal OpenGL etkin.')
              subprocess.run(
                  command, check=True, timeout=max(900, int(duration * 180)),
                  env=blender_env
              )
              if not temp_video.exists() or temp_video.stat().st_size < 10000:
                  raise RuntimeError(f'Blender {scene_no}. sahne icin gecerli video olusturamadi.')

              # Decode exactly the expected number of frames at a fixed size.
              # Draining the decoder pipe prevents FFmpeg from exiting with SIGPIPE
              # when the source contains an extra frame due to container timestamps.
              decode = subprocess.Popen([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-i', str(temp_video),
                  '-map', '0:v:0', '-an', '-vf', f'scale={WIDTH}:{HEIGHT}:flags=bicubic,setsar=1',
                  '-frames:v', str(frames), '-vsync', '0',
                  '-f', 'rawvideo', '-pix_fmt', 'rgb24', 'pipe:1'
              ], stdout=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)
              encode = subprocess.Popen([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-video_size', f'{WIDTH}x{HEIGHT}',
                  '-framerate', str(FPS), '-i', 'pipe:0', '-an',
                  '-vf', f'scale={OUTPUT_WIDTH}:{OUTPUT_HEIGHT}:flags=lanczos,format=yuv420p',
                  '-frames:v', str(frames), '-c:v', 'libx264', '-preset', 'veryfast',
                  '-crf', '21', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', str(output)
              ], stdin=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)
              frame_bytes = WIDTH * HEIGHT * 3
              try:
                  for frame_no in range(frames):
                      chunks = []
                      remaining = frame_bytes
                      while remaining:
                          chunk = decode.stdout.read(remaining)
                          if not chunk:
                              break
                          chunks.append(chunk)
                          remaining -= len(chunk)
                      raw = b''.join(chunks)
                      if len(raw) != frame_bytes:
                          decode_err = decode.stderr.read().decode('utf-8', 'replace')[-1500:]
                          raise RuntimeError(
                              f'Blender videosundan eksik kare okundu: {scene_no}. sahne, '
                              f'{frame_no}/{frames}. kare; okunan={len(raw)}/{frame_bytes} byte. '
                              f'FFmpeg: {decode_err}'
                          )
                      frame = Image.frombytes('RGB', (WIDTH, HEIGHT), raw)
                      draw = ImageDraw.Draw(frame, 'RGBA')
                      draw_subtitles(draw, caption, (frame_no + 1) / max(1, frames), category, scene_no)
                      encode.stdin.write(frame.tobytes())

                  # Read to EOF before waiting; otherwise the decoder can receive SIGPIPE.
                  extra_data = decode.stdout.read()
                  encode.stdin.close()
                  enc_code = encode.wait()
                  dec_code = decode.wait()
                  encode_err = encode.stderr.read().decode('utf-8', 'replace')[-1500:]
                  decode_err = decode.stderr.read().decode('utf-8', 'replace')[-1500:]
                  if enc_code or dec_code:
                      raise RuntimeError(
                          f'3D altyazi birlestirme hatasi: encode={enc_code}, decode={dec_code}; '
                          f'ekstra_veri={len(extra_data)} byte; encoder={encode_err}; decoder={decode_err}'
                      )
              finally:
                  temp_video.unlink(missing_ok=True)
              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError(f'{scene_no}. 3D animasyon klibi olusturulamadi.')



          def make_soundtrack(path):
              total=int(TARGET_SECONDS*SAMPLE_RATE)
              t=np.arange(total,dtype=np.float32)/SAMPLE_RATE
              # Original, generated ambient bed; intentionally quiet under narration.
              audio=(0.035*np.sin(2*np.pi*55*t)+0.018*np.sin(2*np.pi*82.41*t)+
                     0.010*np.sin(2*np.pi*110*t)*(0.5+0.5*np.sin(2*np.pi*0.35*t)))
              notes=[329.63,392,493.88,440,392,293.66]
              for i,start in enumerate(np.arange(0.5,TARGET_SECONDS,2.5)):
                  first=int(start*SAMPLE_RATE); size=min(int(1.8*SAMPLE_RATE),total-first)
                  lt=np.arange(size,dtype=np.float32)/SAMPLE_RATE
                  audio[first:first+size]+=0.018*np.sin(2*np.pi*notes[i%len(notes)]*lt)*np.exp(-1.8*lt)
              fade=int(SAMPLE_RATE*1.0)
              audio[:fade]*=np.linspace(0,1,fade); audio[-fade:]*=np.linspace(1,0,fade)
              peak=float(np.max(np.abs(audio)))
              if peak>0: audio*=0.6/peak
              pcm=(np.clip(np.column_stack((audio,audio)),-1,1)*32767).astype('<i2')
              with wave.open(str(path),'wb') as wav:
                  wav.setnchannels(2); wav.setsampwidth(2); wav.setframerate(SAMPLE_RATE); wav.writeframes(pcm.tobytes())


          def youtube_upload(path):
              creds=Credentials(token=None,refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri='https://oauth2.googleapis.com/token',client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,scopes=['https://www.googleapis.com/auth/youtube.upload'])
              creds.refresh(Request())
              youtube=build('youtube','v3',credentials=creds,cache_discovery=False)
              description=(f'{title}\n\n'
                'Gizemli Dünya’da bu kez kısa bir paranormal hikâye anlatıyoruz. '
                'Bu video Blender icinde uretilen ozgun, rigli CC0 humanoid karakterlerle hazirlanan 3D animasyon ve Turkce seslendirme icerir. '
                'Karakterler: ozgun prosedurel humanoid rigler (CC0). '
                'Hikâye kurgu ve şehir efsanesi atmosferinde anlatılmıştır; gerçek olduğu iddia edilmez.\n'
                'Sence bu olayın açıklaması ne? Yorumlarda paylaş. Videoyu beğenmeyi ve kanalımıza abone olmayı unutma!\n\n'
                '#Shorts #Paranormal #GizemliHikayeler #KorkuHikayeleri #Gizem')
              body={'snippet':{'title':f'{title} | Paranormal Hikâye #Shorts'[:100],
                'description':description,'tags':['Shorts','Gizemli Dünya','Paranormal','Paranormal Hikayeler','Gizemli Hikayeler','Korku Hikayeleri','Şehir Efsaneleri'],
                'categoryId':'24','defaultLanguage':'tr'},
                'status':{'privacyStatus':YOUTUBE_PRIVACY,'selfDeclaredMadeForKids':False,'containsSyntheticMedia':True}}
              media=MediaFileUpload(str(path),mimetype='video/mp4',chunksize=-1,resumable=True)
              request=youtube.videos().insert(part='snippet,status',body=body,media_body=media)
              result=None; retry=0
              while result is None:
                  try:
                      _,result=request.next_chunk(); retry=0
                  except HttpError as error:
                      if error.resp.status not in (500,502,503,504) or retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
                  except (OSError,ConnectionError):
                      if retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
              youtube_id=result.get('id')
              if not youtube_id: raise RuntimeError('YouTube ID donmedi: '+str(result)[:300])
              return youtube_id


          # Üretim: Blender gerçek 3D sahneleri render eder; Python altyazıları karelere işler.
          print('1/5 Blender ile gerçek 3D sahneler ve Türkçe seslendirme hazırlanıyor...')
          voice,scene_durations=make_voice_tracks()
          # Yuvarlama farklarini duzelterek toplam kare sayisini tam 750 yap.
          frame_counts=[max(1,round(d*FPS)) for d in scene_durations]
          frame_counts[-1]+=int(TARGET_SECONDS*FPS)-sum(frame_counts)
          if frame_counts[-1] < 1: raise RuntimeError('Son sahne suresi gecersiz.')
          seed=int.from_bytes(__import__('hashlib').sha256((topic_id+slot).encode()).digest()[:4],'big')
          clips=[]
          audio_offset=0.0
          for i,((caption,visual),duration,frame_count) in enumerate(zip(scenes,scene_durations,frame_counts),1):
              clip=CLIPS/f'clip_{i:02d}.mp4'
              render_animated_clip(i,caption,duration,category,topic_id,seed,clip,frame_count,audio_offset)
              clips.append(clip)
              audio_offset += duration
              print(f'Blender 3D sahne {i}/6 hazir: {duration:.2f} saniye')

          print('2/5 Fon muzigi hazirlaniyor...')
          sound=OUT/'soundtrack.wav'
          make_soundtrack(sound)
          print('3/5 30 saniyelik video birlestiriliyor...')
          concat=OUT/'concat.txt'
          concat.write_text(''.join("file '"+p.resolve().as_posix()+"'\n" for p in clips),encoding='utf-8')
          silent=OUT/'silent.mp4'
          run_ffmpeg(['-f','concat','-safe','0','-i',str(concat),'-c','copy','-an',str(silent)])
          final=ROOT/'gizemli-dunya-video.mp4'
          run_ffmpeg(['-i',str(silent),'-i',str(voice),'-i',str(sound),
              '-filter_complex','[1:a]volume=1.0[voice];[2:a]volume=0.16[music];[voice][music]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.95[a]',
              '-map','0:v:0','-map','[a]','-t',str(TARGET_SECONDS),'-c:v','copy','-c:a','aac','-b:a','160k',
              '-movflags','+faststart',str(final)])
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(final)],text=True))
          streams=info.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams): raise RuntimeError('Videoda goruntu akisi yok.')
          if not any(s.get('codec_type')=='audio' for s in streams): raise RuntimeError('Videoda ses akisi yok.')
          duration=float(info['format']['duration'])
          if abs(duration-TARGET_SECONDS)>0.25: raise RuntimeError(f'Video 30 saniye degil: {duration:.2f}s')
          if int(info.get('streams',[{}])[0].get('width',0))!=OUTPUT_WIDTH: raise RuntimeError('Video genisligi 1080 degil.')
          if int(info.get('streams',[{}])[0].get('height',0))!=OUTPUT_HEIGHT: raise RuntimeError('Video yuksekligi 1920 degil.')
          if final.stat().st_size<250000: raise RuntimeError('Video dosyasi beklenenden kucuk.')

          print('4/5 YouTube yuklemesi baslatiliyor...')
          youtube_id=youtube_upload(final)
          youtube_url=f'https://www.youtube.com/watch?v={youtube_id}'
          print('YouTube video:',youtube_url)
          record={'slot':slot,'topic_id':topic_id,'title':title,'youtube_id':youtube_id,'url':youtube_url,
                  'uploaded_at':datetime.now(ZoneInfo('Europe/Istanbul')).isoformat()}
          (OUT/'upload-result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2),encoding='utf-8')

          print('5/5 Kalici yayin gecmisi kaydediliyor...')
          history.append(record)
          HISTORY_FILE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(HISTORY_FILE.relative_to(ROOT))],check=True)
          subprocess.run(['git','commit','-m',f'Yayin gecmisi: {topic_id}'],check=True)
          try:
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          except subprocess.CalledProcessError as exc:
              raise RuntimeError('Video YouTube a yuklendi fakat gecmis GitHub a yazilamadi! '
                'Ayni videonun tekrarlanmamasi icin output/upload-result.json kaydini '
                'depo data/youtube_history.json dosyasina elle ekleyin.') from exc
          print('BASARILI:',youtube_url)
          PY
          python create_video.py

      - name: Videoyu ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizemli-dunya-youtube-${{ github.run_id }}
          path: |
            gizemli-dunya-video.mp4
            output/upload-result.json
            output/video-plani.json
            data/youtube_history.json
          if-no-files-found: warn
          retention-days: 14
