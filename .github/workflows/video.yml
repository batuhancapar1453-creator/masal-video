name: Gizemli Dunya - Kaliteli Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9,20 * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: write

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ve font kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy google-api-python-client google-auth

      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {key: os.getenv(key, '').strip() for key in (
              'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('Eksik secrets: ' + ', '.join(missing))
          r = requests.post('https://oauth2.googleapis.com/token', data={
              'grant_type': 'refresh_token',
              'client_id': values['YOUTUBE_CLIENT_ID'],
              'client_secret': values['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],
          }, timeout=30)
          info = r.json()
          if not r.ok or not info.get('access_token'):
              raise SystemExit('YouTube OAuth hatasi: ' + str(info.get('error'))
                  + ' (' + str(info.get('error_description'))[:160] + ')')
          print('YouTube OAuth testi basarili; gorsel uretimi baslayabilir.')
          PY

      - name: Video uret ve YouTube'a yukle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
