          def image_from_response(response):
              content_type = (
                  response.headers.get(
                      "Content-Type", ""
                  ).lower()
              )

              if (
                  "json" not in content_type
                  and response.content[:1] != b"{"
              ):
                  return response.content

              payload = response.json()

              if payload.get("success") is False:
                  raise RuntimeError(
                      str(payload.get("errors"))[:500]
                  )

              result = payload.get(
                  "result", payload
              )

              encoded = None

              if isinstance(result, dict):
                  encoded = (
                      result.get("image")
                      or result.get("data")
                  )

              if isinstance(encoded, list):
                  return bytes(encoded)

              if isinstance(encoded, str):
                  encoded = encoded.split(",")[-1]
                  return base64.b64decode(encoded)

              raise RuntimeError(
                  "API gorsel verisi donmedi."
              )

          def call_image(model, prompt, seed):
              url = (
                  "https://api.cloudflare.com/client/v4/"
                  f"accounts/{CF_ACCOUNT}/ai/run/{model}"
              )

              headers = {
                  "Authorization": f"Bearer {CF_TOKEN}"
              }

              if model == PRIMARY_MODEL:
                  response = session.post(
                      url,
                      headers=headers,
                      files={
                          "prompt": (None, prompt[:2100]),
                          "width": (None, "1024"),
                          "height": (None, "1792"),
                          "guidance": (None, "4"),
                          "seed": (None, str(seed))
                      },
                      timeout=240
                  )
              else:
                  response = session.post(
                      url,
                      headers=headers,
                      json={
                          "prompt": prompt[:1800],
                          "width": 768,
                          "height": 1344,
                          "num_steps": 20,
                          "seed": seed,
                          "negative_prompt": (
                              "blurry, cartoon, watermark, text, "
                              "low quality, distorted"
                          )
                      },
                      timeout=240
                  )

              if not response.ok:
                  raise RuntimeError(
                      f"{model} HTTP {response.status_code}: "
                      f"{response.text[:350]}"
                  )

              return image_from_response(response)

          def save_image(raw, path):
              image = Image.open(
                  io.BytesIO(raw)
              ).convert("RGB")

              if min(image.size) < 256:
                  raise RuntimeError(
                      "Gorsel cozunurlugu cok dusuk."
                  )

              ratio = WIDTH / HEIGHT
              current = image.width / image.height

              if current > ratio:
                  crop_w = round(
                      image.height * ratio
                  )

                  x = (
                      image.width - crop_w
                  ) // 2

                  image = image.crop((
                      x, 0,
                      x + crop_w,
                      image.height
                  ))
              else:
                  crop_h = round(
                      image.width / ratio
                  )

                  y = (
                      image.height - crop_h
                  ) // 2

                  image = image.crop((
                      0, y,
                      image.width,
                      y + crop_h
                  ))

              image = image.resize(
                  (WIDTH, HEIGHT),
                  Image.Resampling.LANCZOS
              )

              image = (
                  ImageEnhance.Contrast(image)
                  .enhance(1.04)
              )

              image = image.filter(
                  ImageFilter.UnsharpMask(
                      radius=1.1,
                      percent=75,
                      threshold=3
                  )
              )

              image.save(
                  path,
                  format="PNG",
                  optimize=True
              )

