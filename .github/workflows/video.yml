          def youtube_upload(video_path):
              credentials = Credentials(
                  token=None,
                  refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,
                  scopes=[
                      "https://www.googleapis.com/auth/youtube.upload"
                  ]
              )

              credentials.refresh(Request())

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )

              description = (
                  f"{title}\n\n"
                  "Dünya, uzay ve tarihten "
                  "ilginç bilgiler.\n\n"
                  "Görseller yapay zekâ destekli "
                  "temsili canlandırmalardır. "
                  "Gerçek görüntüler değildir.\n\n"
                  "#Shorts #Bilim #Tarih #Uzay #Gizem"
              )

              body = {
                  "snippet": {
                      "title": (
                          f"{title} | Gizemli Dünya #Shorts"
                      )[:100],
                      "description": description,
                      "tags": [
                          "Shorts",
                          "Gizemli Dünya",
                          "Bilim",
                          "Tarih",
                          "Uzay",
                          category
                      ],
                      "categoryId": "27",
                      "defaultLanguage": "tr"
                  },
                  "status": {
                      "privacyStatus": YOUTUBE_PRIVACY,
                      "selfDeclaredMadeForKids": False,
                      "containsSyntheticMedia": True
                  }
              }

              media = MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  chunksize=-1,
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              result = None
              retry = 0

              while result is None:
                  try:
                      _, result = request.next_chunk()

                  except HttpError as exc:
                      if (
                          exc.resp.status
                          not in (500, 502, 503, 504)
                          or retry >= 4
                      ):
                          raise

                      retry += 1
                      time.sleep(
                          min(2 ** retry, 30)
                      )

              video_id = result.get("id")

              if not video_id:
                  raise RuntimeError(
                      "YouTube video ID donmedi."
                  )

              return video_id

