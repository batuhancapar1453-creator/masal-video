name: Tuhaf Kasaba - 10 Bolum Otomatik Cizgi Film

on:
  workflow_dispatch:
  schedule:
    # Onceki duzendeki iki calisma saati korunmustur (UTC).
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-tuhaf-kasaba-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts playwright requests google-auth google-auth-oauthlib google-api-python-client

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Tuhaf Kasaba kaynaklarini hazirla
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          # Depodaki ZIP dosyalarini isim/klasor farki olmadan bul.
          candidates = sorted(
              p for p in Path(".").rglob("*")
              if p.is_file() and p.suffix.lower() == ".zip"
              and ".git" not in p.parts
          )

          source_zip = None
          for candidate in candidates:
              try:
                  with zipfile.ZipFile(candidate) as z:
                      names = set(z.namelist())
                      # Kaynak ZIP dogrudan yuklenmis olabilir.
                      if (
                          "cizgi-short/kit/engine/index.html" in names
                          and "tuhaf-kasaba/run_episode.py" in names
                      ):
                          source_zip = candidate
                          print(f"Kaynak ZIP bulundu: {candidate}")
                          break

                      # Uygulama paketi, kaynak ZIP'i kendi icinde tasiyor olabilir.
                      for member in z.namelist():
                          if member.lower().endswith("tuhaf-kasaba-source.zip"):
                              data = z.read(member)
                              import io
                              with zipfile.ZipFile(io.BytesIO(data)) as inner:
                                  inner_names = set(inner.namelist())
                                  if (
                                      "cizgi-short/kit/engine/index.html" in inner_names
                                      and "tuhaf-kasaba/run_episode.py" in inner_names
                                  ):
                                      source_zip = Path(".tuhaf-kasaba-source-found.zip")
                                      source_zip.write_bytes(data)
                                      print(
                                          f"Uygulama paketi bulundu: {candidate} "
                                          f"(icindeki {member} kullaniliyor)"
                                      )
                                      break
                          if source_zip:
                              break
              except (zipfile.BadZipFile, OSError):
                  print(f"Gecersiz ZIP atlandi: {candidate}")
              if source_zip:
                  break

          if source_zip is None:
              print("Depoda bulunan ZIP dosyalari:")
              for item in candidates:
                  print(" -", item)
              raise SystemExit(
                  "Tuhaf Kasaba kaynak ZIP'i bulunamadi. ZIP'i depo ana dizinine "
                  "yeniden yukleyin; uygulama paketinin icinde "
                  "tuhaf-kasaba-source.zip bulunmalidir."
              )

          with zipfile.ZipFile(source_zip) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP bozuk: {bad}")

              # ZIP icindeki dosyalari guvenli sekilde depo calisma alanina cikar.
              root = Path(".").resolve()
              for info in archive.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"ZIP icinde guvensiz dosya yolu: {info.filename}")
              archive.extractall(".")

          required = [
              Path("cizgi-short/kit/engine/index.html"),
              Path("tuhaf-kasaba/run_episode.py"),
              Path("tuhaf-kasaba/story.js"),
          ] + [
              Path(f"tuhaf-kasaba/episodes/episode_{n:02d}.json")
              for n in range(1, 11)
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(
                  "Kaynak paketinden cikarilan dosyalar eksik:\\n - "
                  + "\\n - ".join(missing)
              )

          print("Tuhaf Kasaba kaynaklari ve 10 bolum basariyla hazir.")
          PY

      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {k: os.getenv(k, "").strip() for k in (
              "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit("Eksik GitHub Secrets: " + ", ".join(missing))
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "grant_type": "refresh_token",
              "client_id": values["YOUTUBE_CLIENT_ID"],
              "client_secret": values["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": values["YOUTUBE_REFRESH_TOKEN"],
          }, timeout=30)
          payload = r.json()
          if not r.ok or not payload.get("access_token"):
              raise SystemExit("YouTube OAuth hatasi: " + str(payload.get("error")) +
                               " (" + str(payload.get("error_description", ""))[:180] + ")")
          print("YouTube OAuth testi basarili.")
          PY

      - name: Siradaki Tuhaf Kasaba bolumunu uret ve yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tuhaf-kasaba/run_episode.py

      - name: Video, onizleme ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuhaf-kasaba-run-${{ github.run_id }}
          path: |
            output/
            work_tuhaf_kasaba/out/
            work_tuhaf_kasaba/stills/preview_sheet.jpg
            work_tuhaf_kasaba/work/words.json
            data/tuhaf_kasaba_history.json
          if-no-files-found: ignore
          retention-days: 14
