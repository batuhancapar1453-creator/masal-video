name: Masal Videosu Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy

      - name: Masal videosunu oluştur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import re
          import json
          import time
          import math
          import base64
          import random
          import subprocess
          import wave
          from pathlib import Path
          from io import BytesIO

          import requests
          import numpy as np
          from PIL import Image, ImageEnhance, ImageFilter, ImageStat

          # --------------------------------------------------
          # AYARLAR
          # --------------------------------------------------

          GEMINI_KEY = os.environ["GEMINI_API_KEY"].strip()
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()

          if not GEMINI_KEY:
              raise RuntimeError("GEMINI_API_KEY boş.")
          if not CF_TOKEN:
              raise RuntimeError("CLOUDFLARE_API_TOKEN boş.")
          if not CF_ACCOUNT:
              raise RuntimeError("CLOUDFLARE_ACCOUNT_ID boş.")

          GEMINI_MODEL = "gemini-2.5-flash"
          IMAGE_MODEL = "@cf/lykon/dreamshaper-8-lcm"

          SCENE_COUNT = 8
          SCENE_SECONDS = 7
          FPS = 25
          WIDTH = 1280
          HEIGHT = 720
          SAMPLE_RATE = 44100

          ROOT = Path.cwd()
          OUT = ROOT / "output"
          IMAGES = OUT / "images"
          CLIPS = OUT / "clips"

          OUT.mkdir(exist_ok=True)
          IMAGES.mkdir(exist_ok=True)
          CLIPS.mkdir(exist_ok=True)

          session = requests.Session()
          random.seed(int(time.time()))

          # --------------------------------------------------
          # KOMUT ÇALIŞTIRMA
          # --------------------------------------------------

          def run_cmd(command):
              subprocess.run(command, check=True)

          def api_json_with_retry(url, payload, headers=None,
                                  params=None, timeout=180):
              last_error = None

              for attempt in range(1, 6):
                  try:
                      response = session.post(
                          url,
                          json=payload,
                          headers=headers,
                          params=params,
                          timeout=timeout
                      )

                      if response.status_code in (429, 500, 502, 503, 504):
                          raise RuntimeError(
                              f"Geçici HTTP {response.status_code}: "
                              f"{response.text[:500]}"
                          )

                      response.raise_for_status()
                      return response.json()

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"API denemesi {attempt}/5 başarısız: {exc}"
                      )

                      if attempt < 5:
                          time.sleep(min(5 * attempt, 25))

              raise RuntimeError(
                  f"API 5 denemede yanıt vermedi: {last_error}"
              )

          # --------------------------------------------------
          # 1. MASAL OLUŞTURMA
          # --------------------------------------------------

          def generate_story():
              seed = random.randint(100000, 999999)

              prompt = f"""
              Türkçe çocuk masalı yazarı gibi davran.

              {seed} numaralı çalıştırma için yepyeni ve özgün bir
              uyku öncesi masalı üret.

              Hedef yaş: 4-8.
              Dil: doğal, akıcı Türkçe.
              Ton: sıcak, huzurlu, hayal gücü yüksek.
              Uzunluk: yaklaşık 650-850 kelime.

              Korku, şiddet, tehlikeli davranış, marka veya telifli
              karakter kullanma.

              Masalın belirgin bir başlangıcı, gelişmesi ve mutlu
              bir sonu olsun. Karakterlerin adları ve görünümleri
              hikâye boyunca tutarlı kalsın.

              Yalnızca geçerli JSON döndür:
              {{
                "title": "Masal başlığı",
                "story": "Masalın tamamı"
              }}

              JSON dışında hiçbir şey yazma.
              """

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{GEMINI_MODEL}:generateContent"
              )

              for attempt in range(1, 5):
                  try:
                      result = api_json_with_retry(
                          url,
                          {
                              "contents": [
                                  {
                                      "parts": [
                                          {"text": prompt}
                                      ]
                                  }
                              ],
                              "generationConfig": {
                                  "temperature": 0.9,
                                  "responseMimeType": "application/json"
                              }
                          },
                          params={"key": GEMINI_KEY},
                          timeout=180
                      )

                      raw = (
                          result["candidates"][0]["content"]
                          ["parts"][0]["text"]
                      )

                      try:
                          data = json.loads(raw)
                      except json.JSONDecodeError:
                          match = re.search(r"\{.*\}", raw, re.S)
                          if not match:
                              raise RuntimeError(
                                  "Gemini geçerli JSON döndürmedi."
                              )
                          data = json.loads(match.group(0))

                      title = str(data.get("title", "")).strip()
                      story = str(data.get("story", "")).strip()

                      if len(story) < 1500:
                          raise RuntimeError(
                              "Masal çok kısa; yeniden deneniyor."
                          )

                      if not title:
                          title = "Yıldızların Masalı"

                      return title, story

                  except Exception as exc:
                      print(
                          f"Masal denemesi {attempt}/4: {exc}"
                      )
                      if attempt == 4:
                          raise
                      time.sleep(attempt * 4)

          print("1/6 Masal oluşturuluyor...")

          title, story = generate_story()

          (OUT / "masal.txt").write_text(
              title + "\n\n" + story,
              encoding="utf-8"
          )

          print(f"Masal hazır: {title}")
          print(f"Masal karakter sayısı: {len(story)}")

          # --------------------------------------------------
          # 2. SAHNE PLANI OLUŞTURMA
          # --------------------------------------------------

          def generate_scene_plan(title, story):
              prompt = f"""
              Aşağıdaki Türkçe çocuk masalını sekiz sıralı görsel
              sahneye böl.

              Başlık: {title}

              Masal:
              {story}

              Tam 8 sahne üret.
              Her sahne hikâyedeki gerçek bir olayı göstermeli.
              Aynı karakterlerin görünüşünü her sahnede koru.
              Görsel istemleri İngilizce yaz.
              Görsellerde yazı, altyazı, logo veya filigran olmasın.
              Çocuk kitabı illüstrasyonu tarzını kullan.

              Yalnızca geçerli JSON döndür:
              {{
                "scenes": [
                  {{
                    "description": "Görselin ayrıntılı İngilizce açıklaması",
                    "motion": "Kameranın sahnede nasıl hareket edeceği"
                  }}
                ]
              }}

              Her sahnede description ve motion alanları bulunmalı.
              JSON dışında açıklama yazma.
              """

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{GEMINI_MODEL}:generateContent"
              )

              result = api_json_with_retry(
                  url,
                  {
                      "contents": [
                          {"parts": [{"text": prompt}]}
                      ],
                      "generationConfig": {
                          "temperature": 0.65,
                          "responseMimeType": "application/json"
                      }
                  },
                  params={"key": GEMINI_KEY},
                  timeout=180
              )

              raw = (
                  result["candidates"][0]["content"]
                  ["parts"][0]["text"]
              )

              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  match = re.search(r"\{.*\}", raw, re.S)
                  if not match:
                      raise RuntimeError(
                          "Sahne planı JSON biçiminde değil."
                      )
                  data = json.loads(match.group(0))

              scenes = data.get("scenes", [])

              if len(scenes) < SCENE_COUNT:
                  raise RuntimeError(
                      f"Yalnızca {len(scenes)} sahne oluşturuldu."
                  )

              scenes = scenes[:SCENE_COUNT]

              for index, scene in enumerate(scenes, start=1):
                  scene["scene"] = index
                  scene["description"] = str(
                      scene.get("description", "")
                  ).strip()
                  scene["motion"] = str(
                      scene.get("motion", "")
                  ).strip()

                  if not scene["description"]:
                      raise RuntimeError(
                          f"{index}. sahnenin açıklaması boş."
                      )

              return scenes

          print("2/6 Sahne planı hazırlanıyor...")

          scenes = generate_scene_plan(title, story)

          (OUT / "sahne-plani.json").write_text(
              json.dumps(
                  {"title": title, "scenes": scenes},
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"{len(scenes)} sahne hazır.")

          # --------------------------------------------------
          # 3. CLOUDFLARE İLE GÖRSEL ÜRETME
          # --------------------------------------------------

          def generate_image(description, destination):
              url = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  f"{CF_ACCOUNT}/ai/run/{IMAGE_MODEL}"
              )

              prompt = (
                  "High-quality children's picture book illustration. "
                  "Warm magical atmosphere, detailed hand-painted look, "
                  "beautiful lighting, clear readable composition, "
                  "appealing original characters, consistent character "
                  "design, colorful but harmonious palette. "
                  "Landscape 16:9 composition. "
                  "No text, no letters, no captions, no watermark. "
                  "Scene: " + description
              )

              last_error = None

              for attempt in range(1, 5):
                  try:
                      response = session.post(
                          url,
                          headers={
                              "Authorization": f"Bearer {CF_TOKEN}",
                              "Content-Type": "application/json"
                          },
                          json={"prompt": prompt},
                          timeout=240
                      )

                      if not response.ok:
                          raise RuntimeError(
                              f"Cloudflare HTTP {response.status_code}: "
                              f"{response.text[:700]}"
                          )

                      content_type = response.headers.get(
                          "Content-Type", ""
                      ).lower()

                      if "json" in content_type or response.content[:1] == b"{":
                          payload = response.json()

                          if payload.get("success") is False:
                              raise RuntimeError(
                                  json.dumps(
                                      payload.get("errors", payload),
                                      ensure_ascii=False
                                  )[:700]
                              )

                          result = payload.get("result", {})
                          encoded = None

                          if isinstance(result, dict):
                              encoded = (
                                  result.get("image")
                                  or result.get("data")
                              )

                          if not encoded:
                              raise RuntimeError(
                                  "Cloudflare yanıtında görsel bulunamadı."
                              )

                          if isinstance(encoded, list):
                              content = bytes(encoded)
                          elif isinstance(encoded, str):
                              encoded = encoded.strip()

                              if encoded.startswith("data:"):
                                  encoded = encoded.split(",", 1)[-1]

                              content = base64.b64decode(encoded)
                          else:
                              raise RuntimeError(
                                  "Görsel yanıtının biçimi tanınmadı."
                              )
                      else:
                          content = response.content

                      image = Image.open(
                          BytesIO(content)
                      ).convert("RGB")

                      if image.width < 100 or image.height < 100:
                          raise RuntimeError(
                              "Üretilen görselin çözünürlüğü çok düşük."
                          )

                      # 16:9 kırpma
                      target_ratio = WIDTH / HEIGHT
                      current_ratio = image.width / image.height

                      if current_ratio > target_ratio:
                          new_width = int(image.height * target_ratio)
                          left = (image.width - new_width) // 2
                          image = image.crop(
                              (
                                  left, 0,
                                  left + new_width, image.height
                              )
                          )
                      else:
                          new_height = int(image.width / target_ratio)
                          top = (image.height - new_height) // 2
                          image = image.crop(
                              (
                                  0, top,
                                  image.width, top + new_height
                              )
                          )

                      image = image.resize(
                          (WIDTH, HEIGHT),
                          Image.Resampling.LANCZOS
                      )

                      brightness = (
                          sum(ImageStat.Stat(image).mean) / 3
                      )

                      if brightness < 12:
                          raise RuntimeError(
                              "Görsel neredeyse tamamen siyah."
                          )

                      image = ImageEnhance.Color(image).enhance(1.06)
                      image = ImageEnhance.Contrast(image).enhance(1.04)
                      image = image.filter(
                          ImageFilter.UnsharpMask(
                              radius=1.2,
                              percent=100,
                              threshold=3
                          )
                      )

                      image.save(destination, format="PNG")
                      return

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"Görsel denemesi {attempt}/4: {exc}"
                      )

                      if attempt < 4:
                          time.sleep(attempt * 4)

              raise RuntimeError(
                  f"Görsel oluşturulamadı: {last_error}"
              )

          print("3/6 Sahne görselleri oluşturuluyor...")

          for scene in scenes:
              number = scene["scene"]
              destination = IMAGES / f"scene_{number:02d}.png"

              if destination.exists():
                  destination.unlink()

              print(f"Görsel {number}/{SCENE_COUNT} oluşturuluyor...")

              generate_image(
                  scene["description"],
                  destination
              )

              if not destination.exists() or destination.stat().st_size < 5000:
                  raise RuntimeError(
                      f"{number}. sahnenin görseli geçersiz."
                  )

              print(f"Görsel {number}/{SCENE_COUNT} hazır.")

          # --------------------------------------------------
          # 4. HER GÖRSELDEN HAREKETLİ KLİP ÜRETME
          # --------------------------------------------------

          def make_animated_clip(image_path, output_path, scene):
              total_frames = SCENE_SECONDS * FPS
              number = int(scene["scene"])

              # Hareket yönünü sahne numarasına göre değiştir.
              if number % 4 == 1:
                  x_expr = "iw/2-(iw/zoom/2)"
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.0+0.0007*on,1.06)"
                  )
              elif number % 4 == 2:
                  x_expr = (
                      "max(0,min(iw-iw/zoom,"
                      "(iw-iw/zoom)*on/" + str(total_frames) + "))"
                  )
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.06,1.0+0.0006*on)"
                  )
              elif number % 4 == 3:
                  x_expr = (
                      "max(0,min(iw-iw/zoom,"
                      "(iw-iw/zoom)*(1-on/" + str(total_frames) + ")))"
                  )
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.06,1.0+0.0006*on)"
                  )
              else:
                  x_expr = "iw/2-(iw/zoom/2)"
                  y_expr = (
                      "max(0,min(ih-ih/zoom,"
                      "(ih-ih/zoom)*on/" + str(total_frames) + "))"
                  )
                  zoom_expr = (
                      "min(1.0+0.0007*on,1.06)"
                  )

              video_filter = (
                  "zoompan="
                  f"z='{zoom_expr}':"
                  f"x='{x_expr}':"
                  f"y='{y_expr}':"
                  f"d={total_frames}:"
                  f"s={WIDTH}x{HEIGHT}:"
                  f"fps={FPS},"
                  "setsar=1,"
                  "format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-y",
                  "-loop", "1",
                  "-framerate", str(FPS),
                  "-i", str(image_path),
                  "-vf", video_filter,
                  "-frames:v", str(total_frames),
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-movflags", "+faststart",
                  str(output_path)
              ])

              if (
                  not output_path.exists()
                  or output_path.stat().st_size < 20000
              ):
                  raise RuntimeError(
                      f"{number}. sahnenin klibi oluşturulamadı."
                  )

          print("4/6 Görseller hareketli kliplere dönüştürülüyor...")

          clip_paths = []

          for scene in scenes:
              number = scene["scene"]
              image_path = IMAGES / f"scene_{number:02d}.png"
              clip_path = CLIPS / f"clip_{number:02d}.mp4"

              print(f"Hareketli sahne {number}/{SCENE_COUNT}...")

              make_animated_clip(
                  image_path,
                  clip_path,
                  scene
              )

              clip_paths.append(clip_path)
              print(f"Sahne {number} hazır.")

          # --------------------------------------------------
          # 5. KONUŞMASIZ FON MÜZİĞİ VE AMBİYANS
          # --------------------------------------------------

          def make_soundtrack(destination):
              duration = SCENE_COUNT * SCENE_SECONDS
              sample_count = duration * SAMPLE_RATE

              t = (
                  np.arange(sample_count, dtype=np.float32)
                  / SAMPLE_RATE
              )

              # Yumuşak, basit bir müzikal dizi.
              notes = [
                  261.63, 329.63, 392.00, 329.63,
                  293.66, 349.23, 440.00, 349.23,
                  261.63, 329.63, 392.00, 523.25,
                  440.00, 392.00, 329.63, 293.66
              ]

              beat = 1.5
              music = np.zeros(sample_count, dtype=np.float32)

              for index, start in enumerate(
                  np.arange(0, duration, beat)
              ):
                  end = min(start + beat, duration)
                  start_i = int(start * SAMPLE_RATE)
                  end_i = int(end * SAMPLE_RATE)

                  if end_i <= start_i:
                      continue

                  local_t = (
                      np.arange(end_i - start_i, dtype=np.float32)
                      / SAMPLE_RATE
                  )

                  note = notes[index % len(notes)]
                  envelope = np.minimum(
                      local_t / 0.12, 1.0
                  ) * np.minimum(
                      (end - start - local_t) / 0.2, 1.0
                  )
                  envelope = np.clip(envelope, 0.0, 1.0)

                  tone = (
                      np.sin(2 * np.pi * note * local_t)
                      + 0.35 * np.sin(
                          2 * np.pi * note * 2 * local_t
                      )
                  )

                  music[start_i:end_i] += (
                      0.10 * tone * envelope
                  )

              # Hafif, konuşmasız ortam sesi.
              rng = np.random.default_rng()
              noise = rng.normal(
                  0, 1, sample_count
              ).astype(np.float32)

              # Düşük seviyeli yumuşak ambiyans.
              ambience = (
                  0.008 * noise
                  + 0.003 * np.sin(2 * np.pi * 110 * t)
                  + 0.002 * np.sin(2 * np.pi * 164.81 * t)
              )

              # Seyrek, yumuşak çan benzeri sesler.
              chimes = np.zeros(sample_count, dtype=np.float32)

              for start in np.arange(4.0, duration, 9.0):
                  freq = random.choice(
                      [523.25, 659.25, 783.99, 880.0]
                  )
                  start_i = int(start * SAMPLE_RATE)
                  length = min(
                      int(1.8 * SAMPLE_RATE),
                      sample_count - start_i
                  )

                  if length <= 0:
                      continue

                  local_t = (
                      np.arange(length, dtype=np.float32)
                      / SAMPLE_RATE
                  )

                  decay = np.exp(-2.8 * local_t)
                  chimes[start_i:start_i + length] += (
                      0.035
                      * np.sin(2 * np.pi * freq * local_t)
                      * decay
                  )

              mix = music + ambience + chimes

              # Başlangıç ve bitişte yumuşak geçiş.
              fade_length = int(2 * SAMPLE_RATE)
              fade_in = np.linspace(
                  0, 1, fade_length, dtype=np.float32
              )
              fade_out = np.linspace(
                  1, 0, fade_length, dtype=np.float32
              )

              mix[:fade_length] *= fade_in
              mix[-fade_length:] *= fade_out

              peak = float(np.max(np.abs(mix)))

              if peak > 0:
                  mix = mix * (0.75 / peak)

              stereo = np.column_stack((mix, mix))
              pcm = (
                  np.clip(stereo, -1, 1) * 32767
              ).astype("<i2")

              with wave.open(str(destination), "wb") as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(SAMPLE_RATE)
                  wav.writeframes(pcm.tobytes())

          print("5/6 Fon müziği ve ambiyans hazırlanıyor...")

          soundtrack = OUT / "soundtrack.wav"
          make_soundtrack(soundtrack)

          # --------------------------------------------------
          # 6. KLİPLERİ BİRLEŞTİR VE VİDEOYU DOĞRULA
          # --------------------------------------------------

          concat_file = OUT / "concat.txt"

          concat_file.write_text(
              "".join(
                  "file '" + str(path.resolve()) + "'\n"
                  for path in clip_paths
              ),
              encoding="utf-8"
          )

          silent_video = OUT / "silent-video.mp4"

          run_cmd([
              "ffmpeg", "-hide_banner", "-loglevel", "error",
              "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video)
          ])

          final_video = ROOT / "animasyon-video.mp4"

          run_cmd([
              "ffmpeg", "-hide_banner", "-loglevel", "error",
              "-y",
              "-i", str(silent_video),
              "-i", str(soundtrack),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries",
              "format=duration,size:stream=codec_type,width,height",
              "-of", "json",
              str(final_video)
          ], text=True)

          info = json.loads(probe)
          streams = info.get("streams", [])
          stream_types = {
              stream.get("codec_type") for stream in streams
          }

          if "video" not in stream_types:
              raise RuntimeError("Video akışı bulunamadı.")

          if "audio" not in stream_types:
              raise RuntimeError("Fon müziği akışı bulunamadı.")

          duration = float(info["format"]["duration"])
          size = int(info["format"]["size"])

          if duration < 30:
              raise RuntimeError(
                  f"Video beklenenden kısa: {duration:.1f} saniye."
              )

          if size < 500000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          print("")
          print("BAŞARILI: Video oluşturuldu.")
          print(f"Başlık: {title}")
          print(f"Süre: {duration:.1f} saniye")
          print(f"Boyut: {size / 1024 / 1024:.2f} MB")
          print(f"Dosya: {final_video}")
          print("Seslendirme: Yok")
          print("Ses: Fon müziği ve hafif ambiyans")
          PY

          python create_video.py

      - name: Videoyu ve dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            animasyon-video.mp4
            output/masal.txt
            output/sahne-plani.json
            output/soundtrack.wav
            output/images/
          if-no-files-found: error
          retention-days: 7
