                  'bridge': ['old bridge fog night', 'empty bridge mist'],
                  'lake': ['misty lake forest night', 'fog over lake'],
                  'road': ['foggy forest road night', 'empty road fog'],
                  'basement': ['dark basement stairs old house', 'stone basement corridor'],
                  'classroom': ['abandoned classroom school', 'empty school classroom'],
