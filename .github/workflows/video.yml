          def make_caption(text, destination):
              overlay = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(overlay)

              font_path = (
                  "/usr/share/fonts/truetype/"
                  "dejavu/DejaVuSans-Bold.ttf"
              )

              font = ImageFont.truetype(
                  font_path, 54
              )

              words = text.split()
              lines = []
              current = ""

              for word in words:
                  candidate = (
                      current + " " + word
                  ).strip()

                  bbox = draw.textbbox(
                      (0, 0),
                      candidate,
                      font=font
                  )

                  text_width = (
                      bbox[2] - bbox[0]
                  )

                  if (
                      text_width <= WIDTH - 140
                      or not current
                  ):
                      current = candidate
                  else:
                      lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              line_height = 80

              start = (
                  HEIGHT
                  - 300
                  - len(lines) * line_height
              )

              draw.rounded_rectangle(
                  (
                      45,
                      start - 30,
                      WIDTH - 45,
                      start
                      + len(lines) * line_height
                      + 40
                  ),
                  radius=30,
                  fill=(0, 0, 0, 185)
              )

              for index, line in enumerate(lines):
                  draw.text(
                      (
                          WIDTH // 2,
                          start + index * line_height
                      ),
                      line,
                      font=font,
                      anchor="mt",
                      fill="white",
                      stroke_width=2,
                      stroke_fill="black"
                  )

              overlay.save(destination)

