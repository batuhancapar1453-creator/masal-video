          print('2/5 Fon muzigi hazirlaniyor...')
          sound=OUT/'soundtrack.wav'
          make_soundtrack(sound, total_duration)
          print(f'3/5 {total_duration:.1f} saniyelik hikaye videosu birlestiriliyor...')
          concat=OUT/'concat.txt'
