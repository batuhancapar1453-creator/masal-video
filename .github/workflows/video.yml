name: Sessiz Cizgi Film Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate silent cartoon animation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIFTYVID_WORKER_URL: https://nifty-vid.batuhancapar1453.workers.dev
          ANIMATION_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import json
          import time
          import subprocess
          import requests
          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          RUN_NUMBER = os.environ.get("ANIMATION_RUN_NUMBER", "1")

          NIFTYVID_WORKER_URL = os.environ.get(
              "NIFTYVID_WORKER_URL",
              "https://nifty-vid.batuhancapar1453.workers.dev"
          ).rstrip("/")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          CF_MODEL = "@cf/lykon/dreamshaper-8-lcm"
          CF_URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/{CF_MODEL}"
          )

          def run(cmd):
              subprocess.run(cmd, check=True)

          def request_with_retry(method, url, **kwargs):
              for attempt in range(5):
                  response = requests.request(
                      method, url, timeout=180, **kwargs
                  )

                  if response.status_code not in (
                      429, 500, 502, 503, 504
                  ):
                      response.raise_for_status()
                      return response

                  if attempt == 4:
                      response.raise_for_status()

                  wait_time = 5 * (attempt + 1)
                  print(
                      f"İstek başarısız: {response.status_code}. "
                      f"{wait_time} saniye sonra tekrar denenecek."
                  )
                  time.sleep(wait_time)

              raise RuntimeError("İstek tekrar denemeleri başarısız.")

          def extract_niftyvid_url(file_data):
              if isinstance(file_data, str):
                  if file_data.startswith("http"):
                      return file_data
                  return (
                      "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space/"
                      "gradio_api/file=" + file_data
                  )

              if isinstance(file_data, dict):
                  if file_data.get("url"):
                      return file_data["url"]

                  if file_data.get("path"):
                      return (
                          "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space/"
                          "gradio_api/file=" + file_data["path"]
                      )

              return None

          def generate_animated_clip(
              image_path, output_path, motion_prompt, scene_number
          ):
              params = {
                  "prompt": motion_prompt,
                  "duration_seconds": 3.5,
                  "steps": 6
              }

              print(
                  f"Sahne {scene_number}: hareketli klip oluşturuluyor..."
              )

              with open(image_path, "rb") as image_file:
                  with requests.post(
                      f"{NIFTYVID_WORKER_URL}/generate",
                      files={
                          "image": (
                              os.path.basename(image_path),
                              image_file,
                              "image/png"
                          )
                      },
                      data={
                          "params": json.dumps(
                              params, ensure_ascii=False
                          )
                      },
                      headers={"Accept": "text/event-stream"},
                      stream=True,
                      timeout=(30, 600)
                  ) as response:

                      if not response.ok:
                          raise RuntimeError(
                              f"NiftyVid HTTP {response.status_code}: "
                              f"{response.text[:500]}"
                          )

                      event_name = "message"
                      data_lines = []
                      video_url = None

                      for raw_line in response.iter_lines(
                          decode_unicode=True
                      ):
                          if raw_line is None:
                              continue

                          line = raw_line.strip()

                          if not line:
                              if data_lines:
                                  event_data = "\n".join(data_lines)

                                  if event_name == "error":
                                      raise RuntimeError(
                                          "NiftyVid hatası: "
                                          + event_data[:500]
                                      )

                                  if event_name == "complete":
                                      payload = json.loads(event_data)

                                      if isinstance(payload, dict):
                                          file_data = (
                                              payload.get("video")
                                              or payload.get("output")
                                              or payload.get("data")
                                          )
                                      elif isinstance(payload, list) and payload:
                                          file_data = payload[0]
                                      else:
                                          file_data = None

                                      video_url = extract_niftyvid_url(
                                          file_data
                                      )

                                      if not video_url:
                                          raise RuntimeError(
                                              "Video bağlantısı dönmedi: "
                                              + event_data[:500]
                                          )
                                      break

                              event_name = "message"
                              data_lines = []

                          elif line.startswith("event:"):
                              event_name = line[6:].strip()

                          elif line.startswith("data:"):
                              data_lines.append(line[5:].strip())

              if not video_url:
                  raise RuntimeError(
                      "Animasyon servisi video tamamlanmadan kapandı."
                  )

              temp_path = output_path + ".download.mp4"

              with requests.get(
                  video_url, stream=True, timeout=(30, 180)
              ) as video_response:
                  video_response.raise_for_status()

                  with open(temp_path, "wb") as video_file:
                      for chunk in video_response.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              video_file.write(chunk)

              run([
                  "ffmpeg", "-y",
                  "-i", temp_path,
                  "-t", "3.5",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,setsar=1,format=yuv420p",
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-movflags", "+faststart",
                  output_path
              ])

              os.remove(temp_path)

              if os.path.getsize(output_path) < 20000:
                  raise RuntimeError("Animasyon klibi çok küçük.")

          print("1/3 Yeni çizgi film konusu hazırlanıyor...")

          animation_prompt = f"""
          Üretim numarası: {RUN_NUMBER}

          4-8 yaş çocukları için sessiz, müziksiz, konuşmasız bir çizgi film
          animasyonu üret. Masal anlatımı veya slayt gösterisi üretme.

          HER ÇALIŞTIRMADA FARKLI KONU:
          Her çalıştırmada yepyeni bir konu, ana karakter ve amaç seç.
          Aynı konuyu sürekli tekrarlama. Minik bir dinozor, sevimli bir robot,
          penguen, kedi, uzaylı veya yepyeni bir karakter seçebilirsin.
          Örnekleri aynen tekrarlamak zorunda değilsin; yeni bir olay örgüsü kur.

          PROFESYONEL ÇİZGİ FİLM GÖRÜNÜMÜ:
          Fotoğraf veya gerçekçi hayvan görüntüsü istemiyorum. Büyük stüdyo
          yapımı çocuk animasyonları gibi stilize 3D karakterler kullan:
          büyük ve ifadeli gözler, yuvarlak yumuşak şekiller, temiz siluetler,
          sevimli ve abartılı yüz ifadeleri, kaliteli materyaller, canlı renkler,
          güzel sinematik ışık ve profesyonel animasyon filmi estetiği.
          Gerçek bir hayvan fotoğrafı gibi değil, tasarlanmış çizgi film
          karakteri gibi görünmeli.

          KARAKTER DEVAMLILIĞI:
          Tek ana karakter belirle. Yüzü, gözleri, rengi, kıyafeti, boyutu,
          oranları ve aksesuarları bütün sahnelerde aynı kalsın.
          Her sahnede aynı karakter tasarımını ayrıntılı biçimde koru.
          Yardımcı karakterleri yalnızca hikâyede gerçekten gerekiyorsa ekle.

          OLAYLAR SIRAYLA İLERLEMELİ:
          Tam 8 sahne üret. Karakterin açık ve basit bir hedefi olsun.
          Her sahne önceki sahnenin doğrudan devamı olsun.
          Karakterin nerede olduğu, ne yaptığı ve sonra ne yapacağı tutarlı olsun.
          Rastgele, bağımsız veya konu dışı klip ekleme.
          Her sahnede bir belirgin eylem ve gözle görülebilir hareket bulunsun.
          Hareket istemi karakterin hareketini, yönünü, yüz ifadesini ve
          gerekiyorsa kamera hareketini açıkça anlatsın.

          Ses, konuşma, anlatım, altyazı ve müzik yok.
          Görüntüde yazı, logo veya filigran yok.
          Yatay 16:9 kadraj kullan; karakterin başı ve gövdesi kadrajda kalsın.
          Her sahne yaklaşık 3,5 saniyelik bir klibe uygun olsun.
          Sekiz sahne toplamda yaklaşık 28 saniye sürsün.

          Yalnızca geçerli JSON döndür. Markdown veya açıklama yazma.

          JSON şeması:
          {{
            "title": "kısa çizgi film başlığı",
            "style": "tüm sahnelerde sabit stilize 3D çizgi film stili",
            "character_bible": "ana karakterin değişmeyecek görünüşü",
            "scenes": [
              {{
                "scene": 1,
                "story_beat": "bu sahnede gerçekleşen somut olay",
                "visual_prompt": "İngilizce ayrıntılı çizgi film görsel istemi",
                "motion_prompt": "İngilizce somut karakter hareketi istemi"
              }}
            ]
          }}
          """

          plan_response = request_with_retry(
              "POST",
              GEMINI_URL,
              json={
                  "contents": [
                      {
                          "parts": [
                              {"text": animation_prompt}
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.85,
                      "maxOutputTokens": 6000,
                      "responseMimeType": "application/json"
                  }
              }
          )

          plan_data = plan_response.json()

          try:
              plan_text = (
                  plan_data["candidates"][0]["content"]["parts"][0]["text"]
                  .strip()
              )

              if plan_text.startswith("```"):
                  plan_text = plan_text.split("\n", 1)[1]
                  plan_text = plan_text.rsplit("```", 1)[0].strip()

              scene_plan = json.loads(plan_text)
              scenes = scene_plan["scenes"]
              character_bible = str(
                  scene_plan.get("character_bible", "")
              ).strip()
              style_bible = str(
                  scene_plan.get("style", "")
              ).strip()

              if len(scenes) != 8:
                  raise ValueError(
                      f"8 sahne yerine {len(scenes)} sahne döndü."
                  )

              if not character_bible or not style_bible:
                  raise ValueError(
                      "Karakter görünüşü veya çizgi film stili eksik."
                  )

              for index, scene in enumerate(scenes, start=1):
                  scene["visual_prompt"] = str(
                      scene.get("visual_prompt", "")
                  ).strip()
                  scene["motion_prompt"] = str(
                      scene.get("motion_prompt", "")
                  ).strip()
                  scene["story_beat"] = str(
                      scene.get("story_beat", "")
                  ).strip()

                  if (
                      not scene["visual_prompt"]
                      or not scene["motion_prompt"]
                      or not scene["story_beat"]
                  ):
                      raise ValueError(
                          f"{index}. sahnenin olay/görsel/hareket istemi eksik."
                      )

          except Exception as e:
              raise RuntimeError(
                  "Çizgi film sahne planı oluşturulamadı: "
                  + str(e) + " | Yanıt: "
                  + json.dumps(plan_data, ensure_ascii=False)[:1800]
              ) from e

          with open("sahne-plani.json", "w", encoding="utf-8") as f:
              json.dump(
                  scene_plan,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          for index, scene in enumerate(scenes, start=1):
              scene["visual_prompt"] = (
                  f"{style_bible}. "
                  f"Consistent main character design: {character_bible}. "
                  f"Exact chronological action for shot {index}: "
                  f"{scene['story_beat']}. {scene['visual_prompt']}. "
                  "Stylized high-quality 3D children's cartoon character, "
                  "large expressive eyes, rounded appealing shapes, polished "
                  "materials, cinematic lighting, bright colors. Not a photo, "
                  "not photorealistic. Keep the exact same character face, "
                  "colors, proportions and clothing. Show only this scene's "
                  "action. Wide 16:9 composition, full character visible, "
                  "no text, no captions, no logo, no watermark."
              )

          print(
              f"Yeni çizgi film: {scene_plan.get('title', 'Kısa animasyon')}"
          )

          print("2/3 Çizgi film sahnelerinin görselleri oluşturuluyor...")

          image_prompts = [
              scene["visual_prompt"] for scene in scenes
          ]

          os.makedirs("images", exist_ok=True)
          valid_images = []

          for i, prompt in enumerate(image_prompts, start=1):
              print(f"Görsel {i}/8 oluşturuluyor...")

              payload = {
                  "prompt": prompt,
                  "negative_prompt": (
                      "photograph, photorealistic, real animal photo, "
                      "blurry, low quality, distorted, deformed, extra limbs, "
                      "bad anatomy, text, letters, watermark, logo, noise, "
                      "inconsistent character, different face, different "
                      "costume, cropped head, cropped body, black bars, borders"
                  ),
                  "width": 1024,
                  "height": 576,
                  "num_steps": 20,
                  "guidance": 1.5
              }

              try:
                  image_response = request_with_retry(
                      "POST",
                      CF_URL,
                      headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"
                      },
                      json=payload
                  )

                  try:
                      image = Image.open(
                          BytesIO(image_response.content)
                      ).convert("RGB")
                  except Exception:
                      raise RuntimeError(
                          "Cloudflare geçerli görsel döndürmedi: "
                          + image_response.text[:800]
                      )

                  if image.width < 512 or image.height < 288:
                      raise RuntimeError("Görsel çözünürlüğü çok düşük.")

                  target_ratio = 16 / 9
                  image_ratio = image.width / image.height

                  if image_ratio > target_ratio:
                      new_width = int(image.height * target_ratio)
                      left = (image.width - new_width) // 2
                      image = image.crop(
                          (left, 0, left + new_width, image.height)
                      )
                  elif image_ratio < target_ratio:
                      new_height = int(image.width / target_ratio)
                      top = (image.height - new_height) // 2
                      image = image.crop(
                          (0, top, image.width, top + new_height)
                      )

                  image_path = f"images/scene_{i:02d}.png"
                  image.save(image_path, format="PNG")
                  valid_images.append(image_path)
                  print(f"Görsel {i} kaydedildi.")

              except Exception as e:
                  raise RuntimeError(
                      f"{i}. sahnenin görseli oluşturulamadı. "
                      "Başka bir sahnenin görseli kullanılmayacak. "
                      + str(e)
                  ) from e

          if len(valid_images) != 8:
              raise RuntimeError("Sekiz sahnenin tüm görselleri oluşmadı.")

          print("3/3 Her sahne için gerçek hareketli klip oluşturuluyor...")

          motion_prompts = [
              scene["motion_prompt"] for scene in scenes
          ]

          clip_paths = []

          for i, image_path in enumerate(valid_images, start=1):
              clip_path = f"clip_{i:02d}.mp4"

              try:
                  generate_animated_clip(
                      image_path,
                      clip_path,
                      motion_prompts[i - 1],
                      i
                  )
              except Exception as e:
                  raise RuntimeError(
                      f"{i}. sahnenin animasyon klibi üretilemedi. "
                      "Sabit görüntüyü animasyon diye kullanmamak için "
                      "işlem durduruldu. NiftyVid hatası: " + str(e)
                  ) from e

              clip_paths.append(clip_path)

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for clip_path in clip_paths:
                  f.write(f"file '{clip_path}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat_list.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          print("Sekiz klip birleştiriliyor; ses eklenmeyecek.")

          run([
              "ffmpeg", "-y",
              "-i", "visuals.mp4",
              "-t", "180",
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,format=yuv420p",
              "-an",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-movflags", "+faststart",
              "animasyon-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,width,height",
              "-of", "json",
              "animasyon-video.mp4"
          ], text=True)

          streams = json.loads(probe).get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" in stream_types:
              raise RuntimeError(
                  "Sessiz animasyon bekleniyordu ama ses akışı bulundu."
              )

          size = os.path.getsize("animasyon-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "animasyon-video.mp4",
              "-f", "null", "-"
          ])

          print("Sessiz çizgi film başarıyla oluşturuldu!")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Ses akışı olmadığı doğrulandı.")
          PY

          python create_video.py

      - name: Upload silent cartoon video and scene plan
        uses: actions/upload-artifact@v4
        with:
          name: sessiz-cizgi-film
          path: |
            animasyon-video.mp4
            sahne-plani.json
          if-no-files-found: error
          retention-days: 7
