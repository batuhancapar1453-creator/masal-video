
name: Sessiz Cizgi Film Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pyyaml

      - name: Generate silent cartoon animation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIFTYVID_WORKER_URL: https://nifty-vid.batuhancapar1453.workers.dev
          ANIMATION_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import json
          import time
          import subprocess
          import requests
          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          RUN_NUMBER = os.environ.get("ANIMATION_RUN_NUMBER", "1")

          NIFTYVID_WORKER_URL = os.environ.get(
              "NIFTYVID_WORKER_URL",
              "https://nifty-vid.batuhancapar1453.workers.dev"
          ).rstrip("/")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          CF_MODEL = "@cf/lykon/dreamshaper-8-lcm"
          CF_URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/{CF_MODEL}"
          )

          HF_SPACE_URL = (
              "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space"
          )

          def run(cmd):
              subprocess.run(cmd, check=True)

          def request_with_retry(method, url, **kwargs):
              last_error = None

              for attempt in range(5):
                  try:
                      response = requests.request(
                          method, url, timeout=180, **kwargs
                      )

                      if response.status_code not in (
                          429, 500, 502, 503, 504
                      ):
                          response.raise_for_status()
                          return response

                      last_error = (
                          f"HTTP {response.status_code}: "
                          f"{response.text[:1200]}"
                      )

                  except requests.RequestException as exc:
                      last_error = str(exc)

                  if attempt == 4:
                      raise RuntimeError(
                          f"İstek 5 denemede başarısız: {last_error}"
                      )

                  wait_time = 5 * (attempt + 1)
                  print(
                      f"İstek başarısız: {last_error}. "
                      f"{wait_time} saniye sonra tekrar denenecek."
                  )
                  time.sleep(wait_time)

              raise RuntimeError("İstek tekrar denemeleri başarısız.")

          def extract_niftyvid_url(value):
              """İç içe Gradio/Worker yanıtlarından video URL'sini bulur."""
              if isinstance(value, str):
                  value = value.strip()

                  if value.startswith(("https://", "http://")):
                      return value

                  if value.startswith("gradio_api/file="):
                      return f"{HF_SPACE_URL}/{value}"

                  if value.startswith("/gradio_api/file="):
                      return f"{HF_SPACE_URL}{value}"

                  if value.startswith("/tmp/") or value.startswith("tmp/"):
                      return (
                          f"{HF_SPACE_URL}/gradio_api/file="
                          + value.lstrip("/")
                      )

                  try:
                      parsed = json.loads(value)
                      if parsed != value:
                          return extract_niftyvid_url(parsed)
                  except (json.JSONDecodeError, TypeError):
                      pass

                  return None

              if isinstance(value, dict):
                  for key in (
                      "url", "video_url", "path", "video",
                      "output", "data", "file", "name"
                  ):
                      if key in value:
                          found = extract_niftyvid_url(value[key])
                          if found:
                              return found

                  for nested in value.values():
                      found = extract_niftyvid_url(nested)
                      if found:
                          return found

              if isinstance(value, (list, tuple)):
                  for nested in value:
                      found = extract_niftyvid_url(nested)
                      if found:
                          return found

              return None

          def parse_sse(response):
              """SSE akışını event adı ve JSON içeriğiyle birlikte okur."""
              events = []
              event_name = "message"
              data_lines = []

              def save_event():
                  nonlocal event_name, data_lines

                  if data_lines:
                      raw_data = "\n".join(data_lines).strip()

                      try:
                          payload = json.loads(raw_data)
                      except json.JSONDecodeError:
                          payload = raw_data

                      events.append((event_name, payload, raw_data))

                  event_name = "message"
                  data_lines = []

              for raw_line in response.iter_lines(decode_unicode=True):
                  if raw_line is None:
                      continue

                  if isinstance(raw_line, bytes):
                      line = raw_line.decode("utf-8", errors="replace").strip()
                  else:
                      line = raw_line.strip()

                  if not line:
                      save_event()
                  elif line.startswith("event:"):
                      event_name = line.split(":", 1)[1].strip()
                  elif line.startswith("data:"):
                      data_lines.append(line.split(":", 1)[1].strip())

              save_event()
              return events

          def generate_animated_clip(
              image_path, output_path, motion_prompt, scene_number
          ):
              params = {
                  "prompt": motion_prompt,
                  "duration_seconds": 3.5,
                  "steps": 6,
              }

              last_error = None

              # Ücretsiz animasyon servisi geçici hata verirse aynı sahneyi dene.
              for attempt in range(1, 4):
                  temp_path = output_path + ".download.mp4"

                  try:
                      print(
                          f"Sahne {scene_number}: NiftyVid "
                          f"denemesi {attempt}/3..."
                      )

                      with open(image_path, "rb") as image_file:
                          with requests.post(
                              f"{NIFTYVID_WORKER_URL}/generate",
                              files={
                                  "image": (
                                      os.path.basename(image_path),
                                      image_file,
                                      "image/png"
                                  )
                              },
                              data={
                                  "params": json.dumps(
                                      params, ensure_ascii=False
                                  )
                              },
                              headers={"Accept": "text/event-stream"},
                              stream=True,
                              timeout=(30, 600),
                          ) as response:

                              if not response.ok:
                                  body = response.text[:2500]
                                  raise RuntimeError(
                                      f"Worker HTTP {response.status_code}: "
                                      f"{body}"
                                  )

                              events = parse_sse(response)

                      if not events:
                          raise RuntimeError(
                              "Worker boş SSE yanıtı döndürdü."
                          )

                      # Hata olaylarını gerçek mesajıyla raporla.
                      for name, payload, raw_data in events:
                          if name.lower() in ("error", "failed"):
                              raise RuntimeError(
                                  f"SSE event={name}; "
                                  f"data={raw_data[:2500]}"
                              )

                          if (
                              payload is None
                              and name.lower() in ("complete", "completed")
                          ):
                              raise RuntimeError(
                                  "Worker tamamlanma olayı null döndürdü. "
                                  f"Olaylar: {str(events)[-2500:]}"
                              )

                      video_url = None

                      # Son olaylardan başlayarak tüm iç içe alanları kontrol et.
                      for name, payload, raw_data in reversed(events):
                          video_url = extract_niftyvid_url(payload)
                          if video_url:
                              break

                      if not video_url:
                          diagnostics = "\n".join(
                              f"event={name}, data={raw_data[:1000]}"
                              for name, payload, raw_data in events
                          )

                          raise RuntimeError(
                              "SSE içinde video URL'si bulunamadı. "
                              "Worker yanıtı: "
                              f"{diagnostics[-3500:]}"
                          )

                      print(
                          f"Sahne {scene_number}: video adresi alındı; "
                          "dosya indiriliyor."
                      )

                      with requests.get(
                          video_url,
                          stream=True,
                          timeout=(30, 180)
                      ) as video_response:

                          if not video_response.ok:
                              raise RuntimeError(
                                  f"Video indirme HTTP "
                                  f"{video_response.status_code}: "
                                  f"{video_response.text[:1200]}"
                              )

                          with open(temp_path, "wb") as video_file:
                              for chunk in video_response.iter_content(
                                  chunk_size=1024 * 1024
                              ):
                                  if chunk:
                                      video_file.write(chunk)

                      if (
                          not os.path.exists(temp_path)
                          or os.path.getsize(temp_path) < 10000
                      ):
                          raise RuntimeError(
                              "İndirilen video dosyası boş veya çok küçük."
                          )

                      # Her sahneyi aynı çözünürlükte, sessiz MP4 yap.
                      run([
                          "ffmpeg", "-y",
                          "-i", temp_path,
                          "-t", "3.5",
                          "-vf",
                          "scale=1280:720:force_original_aspect_ratio=increase,"
                          "crop=1280:720,setsar=1,format=yuv420p",
                          "-an",
                          "-c:v", "libx264",
                          "-preset", "medium",
                          "-crf", "18",
                          "-movflags", "+faststart",
                          output_path
                      ])

                      os.remove(temp_path)

                      if os.path.getsize(output_path) < 20000:
                          raise RuntimeError(
                              "Oluşturulan klip beklenenden küçük."
                          )

                      print(f"Sahne {scene_number}: klip hazır.")
                      return

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"Sahne {scene_number}, deneme {attempt}/3 "
                          f"başarısız: {exc}"
                      )

                      if os.path.exists(temp_path):
                          try:
                              os.remove(temp_path)
                          except OSError:
                              pass

                      if attempt < 3:
                          wait_seconds = 8 * attempt
                          print(
                              f"{wait_seconds} saniye sonra "
                              "aynı sahne yeniden denenecek."
                          )
                          time.sleep(wait_seconds)

              raise RuntimeError(
                  f"NiftyVid 3 denemede de sahne {scene_number} "
                  f"klibini üretemedi: {last_error}"
              ) from last_error

          print("1/3 Yeni çizgi film konusu hazırlanıyor...")

          animation_prompt = f"""
          4-8 yaş çocukları için kısa, neşeli, tamamen görsel anlatımlı
          bir çizgi film tasarla. Çıktı sessiz olacak: konuşma, anlatıcı,
          müzik veya ses efekti ekleme. Toplam video 3 dakikayı geçmesin.
          Tam 8 sahne üret; her sahne 3.5 saniyelik hareketli klip olacak.

          Her çalıştırmada yeni ve farklı bir konu seç. Önceden kullanılan
          örnekleri kopyalama; arı ve polen konusunu kullanma.
          Çalıştırma numarası: {RUN_NUMBER}. Bu numarayı konu seçimini
          çeşitlendirmek için kullan; numarayı hikâyede gösterme.

          Bir ana karakter, tek ve anlaşılır bir amaç, küçük bir sorun ve
          mutlu bir çözüm olsun. Her sahne öncekinin devamı olsun.
          Rastgele veya ilgisiz görüntüler ekleme. Karakterin yüzü, rengi,
          boyutu, kıyafetleri ve ayırt edici özellikleri aynı kalsın.

          Görsel stil: yüksek kaliteli, sevimli, stilize 3D aile çizgi filmi;
          büyük ve ifadeli gözler, belirgin siluet, sevimli oranlar,
          sinematik aydınlatma, canlı renkler ve temiz kompozisyon.
          Fotogerçekçi insan veya fotoğraf görünümü isteme.

          Korku, şiddet, tehlikeli davranış, yazı, altyazı, logo ve filigran yok.
          Her sahnede tek belirgin eylem ve sonraki sahneye doğal geçiş olsun.
          Her motion_prompt tek bir görselden üretilebilecek doğal hareketleri
          anlatsın; karakter dönüşümü veya yeni karakter eklenmesini istemesin.

          Yalnızca geçerli JSON döndür. Markdown çiti veya açıklama yazma.

          Şema:
          {{
            "title": "kısa başlık",
            "style": "tüm sahnelerde sabit görsel stil",
            "character_bible": "ana karakterin değişmeyecek görünüşü",
            "scenes": [
              {{
                "scene": 1,
                "story_beat": "bu sahnede olan somut olay",
                "visual_prompt": "İngilizce ayrıntılı görsel istemi",
                "motion_prompt": "İngilizce doğal hareket istemi"
              }}
            ]
          }}
          """

          plan_response = request_with_retry(
              "POST",
              GEMINI_URL,
              json={
                  "contents": [
                      {"parts": [{"text": animation_prompt}]}
                  ],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 6000,
                      "responseMimeType": "application/json"
                  }
              }
          )

          plan_data = plan_response.json()

          try:
              plan_text = (
                  plan_data["candidates"][0]["content"]["parts"][0]["text"]
                  .strip()
              )

              if plan_text.startswith("```"):
                  plan_text = plan_text.split("\n", 1)[1]
                  plan_text = plan_text.rsplit("```", 1)[0].strip()

              scene_plan = json.loads(plan_text)
              scenes = scene_plan["scenes"]
              character_bible = scene_plan.get("character_bible", "").strip()
              style_bible = scene_plan.get("style", "").strip()

              if len(scenes) != 8:
                  raise ValueError(
                      f"8 sahne yerine {len(scenes)} sahne döndü."
                  )

              if not character_bible or not style_bible:
                  raise ValueError(
                      "Karakter veya çizgi film stili eksik."
                  )

              for index, scene in enumerate(scenes, start=1):
                  scene["visual_prompt"] = str(
                      scene.get("visual_prompt", "")
                  ).strip()

                  scene["motion_prompt"] = str(
                      scene.get("motion_prompt", "")
                  ).strip()

                  scene["story_beat"] = str(
                      scene.get("story_beat", "")
                  ).strip()

                  if not all((
                      scene["visual_prompt"],
                      scene["motion_prompt"],
                      scene["story_beat"]
                  )):
                      raise ValueError(
                          f"{index}. sahnenin istemlerinden biri eksik."
                      )

          except Exception as exc:
              raise RuntimeError(
                  "Sahne planı oluşturulamadı: "
                  f"{exc}; Gemini yanıtı: "
                  f"{json.dumps(plan_data, ensure_ascii=False)[:2000]}"
              ) from exc

          with open("sahne-plani.json", "w", encoding="utf-8") as f:
              json.dump(scene_plan, f, ensure_ascii=False, indent=2)

          for index, scene in enumerate(scenes, start=1):
              scene["visual_prompt"] = (
                  f"{style_bible}. "
                  f"Consistent main character design: {character_bible}. "
                  f"Exact chronological action for shot {index}: "
                  f"{scene['story_beat']}. {scene['visual_prompt']}. "
                  "High-quality stylized 3D animated family cartoon, "
                  "appealing character shapes, expressive large eyes, "
                  "cinematic lighting, vibrant colors. Keep the exact same "
                  "character design, proportions, face and colors. "
                  "Wide 16:9 composition, full character visible, "
                  "no text, no captions, no logo, no watermark."
              )

          print(
              f"'{scene_plan.get('title', 'Kısa çizgi film')}' "
              "için 8 sahne planlandı."
          )

          print("2/3 Çizgi film sahneleri için görseller oluşturuluyor...")

          os.makedirs("images", exist_ok=True)
          valid_images = []

          for i, scene in enumerate(scenes, start=1):
              print(f"Görsel {i}/8 hazırlanıyor...")

              payload = {
                  "prompt": scene["visual_prompt"],
                  "negative_prompt": (
                      "photorealistic, realistic photo, live action, "
                      "blurry, low quality, distorted, deformed, extra limbs, "
                      "bad anatomy, text, letters, watermark, logo, "
                      "different character, inconsistent costume, "
                      "cropped head, cropped feet, black bars, borders"
                  ),
                  "width": 1024,
                  "height": 576,
                  "num_steps": 20,
                  "guidance": 1.5
              }

              image_response = request_with_retry(
                  "POST",
                  CF_URL,
                  headers={
                      "Authorization": f"Bearer {CF_TOKEN}",
                      "Content-Type": "application/json"
                  },
                  json=payload
              )

              try:
                  image = Image.open(
                      BytesIO(image_response.content)
                  ).convert("RGB")
              except Exception as exc:
                  raise RuntimeError(
                      f"Cloudflare {i}. sahne için geçerli görsel "
                      f"döndürmedi: {image_response.text[:1200]}"
                  ) from exc

              if image.width < 512 or image.height < 288:
                  raise RuntimeError(
                      f"{i}. görselin çözünürlüğü çok düşük: "
                      f"{image.width}x{image.height}"
                  )

              # 16:9 oranını kırparak koru.
              target_ratio = 16 / 9
              image_ratio = image.width / image.height

              if image_ratio > target_ratio:
                  new_width = int(image.height * target_ratio)
                  left = (image.width - new_width) // 2
                  image = image.crop(
                      (left, 0, left + new_width, image.height)
                  )
              elif image_ratio < target_ratio:
                  new_height = int(image.width / target_ratio)
                  top = (image.height - new_height) // 2
                  image = image.crop(
                      (0, top, image.width, top + new_height)
                  )

              image_path = f"images/scene_{i:02d}.png"
              image.save(image_path, format="PNG")
              valid_images.append(image_path)
              print(f"Görsel {i} kaydedildi.")

          if len(valid_images) != 8:
              raise RuntimeError("8 görselin tamamı oluşturulamadı.")

          print("3/3 Her sahne için gerçek hareketli klip oluşturuluyor...")

          clip_paths = []

          for i, image_path in enumerate(valid_images, start=1):
              clip_path = f"clip_{i:02d}.mp4"
              motion_prompt = scenes[i - 1]["motion_prompt"]

              try:
                  generate_animated_clip(
                      image_path,
                      clip_path,
                      motion_prompt,
                      i
                  )
              except Exception as exc:
                  raise RuntimeError(
                      f"{i}. sahnenin animasyon klibi oluşturulamadı. "
                      "Sabit görseli animasyonmuş gibi kullanmamak için "
                      f"işlem durduruldu. Ayrıntı: {exc}"
                  ) from exc

              clip_paths.append(clip_path)

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for clip_path in clip_paths:
                  f.write(f"file '{clip_path}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat_list.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          run([
              "ffmpeg", "-y",
              "-i", "visuals.mp4",
              "-t", "180",
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,format=yuv420p",
              "-an",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-movflags", "+faststart",
              "animasyon-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,width,height",
              "-of", "json",
              "animasyon-video.mp4"
          ], text=True)

          streams = json.loads(probe).get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" in stream_types:
              raise RuntimeError(
                  "Sessiz animasyon bekleniyordu ama ses akışı bulundu."
              )

          size = os.path.getsize("animasyon-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "animasyon-video.mp4",
              "-f", "null", "-"
          ])

          print("Sessiz çizgi film başarıyla oluşturuldu!")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Ses akışı olmadığı doğrulandı.")
          PY

          python create_video.py

      - name: Upload silent cartoon video and scene plan
        uses: actions/upload-artifact@v4
        with:
          name: sessiz-cizgi-film
          path: |
            animasyon-video.mp4
            sahne-plani.json
          if-no-files-found: error
          retention-days: 7
