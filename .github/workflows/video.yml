          def commons_search_images(query, limit=18):
              api = 'https://commons.wikimedia.org/w/api.php'
              params = {
                  'action': 'query', 'format': 'json', 'generator': 'search',
                  'gsrsearch': f'filetype:bitmap {query}', 'gsrnamespace': 6,
                  'gsrlimit': limit, 'prop': 'imageinfo',
                  'iiprop': 'url|size|extmetadata', 'iiurlwidth': 1100
              }
              response = requests.get(api, params=params,
                  headers={'User-Agent': 'GizemliDunyaVideoBot/1.0 (educational noncommercial video project)'}, timeout=35)
              response.raise_for_status()
              pages = response.json().get('query', {}).get('pages', {})
              return list(pages.values())


          def generate_cloudflare_scene_image(scene_no, caption, topic_id, seed):
              """Generate a story-specific FLUX image using Cloudflare's free daily Workers AI allocation."""
              import base64
              if not (CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN):
                  raise RuntimeError('Cloudflare AI secrets tanimli degil.')
              path = IMAGE_DIR / f'scene_{scene_no:02d}.jpg'
              kind = paranormal_visual_kind(topic_id, title)
              shot = scene_shot_description(scene_no)
              prompt = (
                  'Photorealistic live-action supernatural mystery feature-film still, native vertical 9:16 portrait '
                  'composition designed specifically for a 768x1365 frame. Use the full vertical canvas naturally; '
                  'keep the main subject and the story-critical clue clearly visible, with cinematic foreground and depth. '
                  f'Story title: {title}. Story environment: {kind}. Exact narrated moment in Turkish: "{caption}". '
                  f'Camera direction: {shot}. Show the literal event in the sentence, not generic horror wallpaper. '
                  'If the line mentions a hospital, show a believable real hospital interior; if it mentions a train, '
                  'show a real train and platform; if it mentions a window, show a real window and the described clue. '
                  'Each scene must use a different location detail, camera angle, lighting setup and composition. '
                  'Premium cinema photography, realistic adult human actors if needed, natural skin texture, '
                  'physically plausible architecture, detailed surfaces, atmospheric practical lighting, volumetric fog '
                  'only when appropriate, rich but natural colors, high detail, sharp photographic focus. '
                  'No cartoon, no illustration, no painting, no 3D render, no CGI character, no toy, no doll, '
                  'no mannequin, no miniature, no plastic skin, no text, no subtitles, no logo, no watermark.'
              )
              url = (f'https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}'
                     f'/ai/run/{CLOUDFLARE_IMAGE_MODEL}')
              headers = {'Authorization': f'Bearer {CLOUDFLARE_API_TOKEN}',
                         'Content-Type': 'application/json'}
              last_error = None
              for attempt in range(3):
                  try:
                      # FLUX.2 Klein 4B uses multipart form data and supports native portrait dimensions.
                      response = requests.post(url, headers={'Authorization': headers['Authorization']}, files={
                          'prompt': (None, prompt[:2048]),
                          'width': (None, '768'),
                          'height': (None, '1365'),
                          'seed': (None, str(int(seed + scene_no * 7919 + attempt * 104729)))
                      }, timeout=(30, 300))
                      if response.status_code in (401, 403):
                          raise RuntimeError('Cloudflare API token yetkisiz. Workers AI Read iznini ve Account ID degerini kontrol edin.')
                      if response.status_code == 429:
                          raise RuntimeError('Cloudflare ucretsiz gunluk AI limiti veya hiz limiti dolmus (HTTP 429).')
                      response.raise_for_status()
                      payload = response.json()
                      if not payload.get('success', True):
                          raise RuntimeError(str(payload.get('errors', payload))[:400])
                      encoded = (payload.get('result') or {}).get('image')
                      if not encoded:
                          raise RuntimeError('Cloudflare yanitinda result.image bulunamadi.')
                      raw = base64.b64decode(encoded)
                      if len(raw) < 18000:
                          raise RuntimeError(f'AI gorseli cok kucuk: {len(raw)} byte.')
                      with Image.open(io.BytesIO(raw)) as opened:
                          opened.load()
                          image = opened.convert('RGB')
                      if image.width < 400 or image.height < 400:
                          raise RuntimeError(f'AI kaynak cozunurlugu yetersiz: {image.size}')
                      # FLUX.2 Klein 4B supports native 9:16 output; only normalize exact dimensions.
                      image = ImageOps.fit(image, (768, 1365), method=Image.Resampling.LANCZOS,
                                           centering=(0.5, 0.5))
                      validate_generated_image(image, scene_no)
                      image.save(path, 'JPEG', quality=95, optimize=True)
                      record = {
                          'scene': scene_no, 'caption': caption,
                          'source_type': 'AI-generated / Cloudflare Workers AI FLUX.2 Klein 4B',
                          'commons_title': f'AI-generated scene {scene_no}',
                          'artist': 'AI-generated', 'license': 'AI-generated image',
                          'source_page': '', 'image_url': '',
                      }
                      source_file = OUT / 'image_sources.json'
                      sources = json.loads(source_file.read_text(encoding='utf-8')) if source_file.exists() else []
                      sources.append(record)
                      source_file.write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')
                      print(f'AI GORSEL ONAYLANDI: sahne {scene_no}/{SCENE_COUNT} | FLUX.2 Klein 4B | {image.width}x{image.height}')
                      return path
                  except Exception as exc:
                      last_error = exc
                      print(f'Cloudflare AI sahne {scene_no} denemesi {attempt+1}/3: {str(exc)[:260]}')
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))
              raise RuntimeError(f'Cloudflare AI sahne gorseli uretilemedi: {last_error}')


          def generate_scene_image(scene_no, caption, topic_id, seed):
              """Prefer a custom AI image; use Wikimedia Commons only as a free fallback."""
              path = IMAGE_DIR / f'scene_{scene_no:02d}.jpg'
              if CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN:
                  try:
                      return generate_cloudflare_scene_image(scene_no, caption, topic_id, seed)
                  except Exception as ai_error:
                      print(f'UYARI: AI gorseli olusmadi; bu sahnede ucretsiz Commons yedegi deneniyor: {str(ai_error)[:260]}')
              else:
                  print('Bilgi: Cloudflare AI anahtarlari yok; Wikimedia Commons yedegi kullaniliyor.')
              kind = paranormal_visual_kind(topic_id, title)
              terms = commons_terms(kind, caption)
              banned = ('diagram', 'map', 'logo', 'coat of arms', 'drawing', 'illustration',
                        'painting', 'poster', 'flag', 'icon', 'screenshot', 'svg', 'collage')
              used_titles = set()
              last_error = None
              for query in terms:
                  try:
                      candidates = commons_search_images(query)
                      # Sort deterministically but vary the preferred result by scene/topic.
                      candidates.sort(key=lambda item: (len(item.get('title', '')), item.get('title', '')))
                      random.Random(seed + scene_no * 7919 + len(query)).shuffle(candidates)
                      for item in candidates:
                          title_text = item.get('title', '')
                          low_title = title_text.lower()
                          if any(word in low_title for word in banned) or title_text in used_titles:
                              continue
                          info_list = item.get('imageinfo', [])
                          if not info_list:
                              continue
                          info = info_list[0]
                          # Commons metadata MIME values vary by original file format.
                          # Do not reject candidates by metadata MIME: request the generated
                          # thumbnail and let Pillow verify/decode the actual downloaded bytes.
                          mime = str(info.get('mime', '')).lower()
                          if mime in ('image/svg+xml', 'application/pdf', 'application/postscript'):
                              continue
                          if int(info.get('width', 0)) < 900 or int(info.get('height', 0)) < 1200:
                              continue
                          ext = info.get('extmetadata', {})
                          desc = str(ext.get('ImageDescription', {}).get('value', '')).lower()
                          if any(word in desc for word in banned):
                              continue
                          url = info.get('thumburl') or info.get('url')
                          if not url:
                              continue
                          image_response = requests.get(url, headers={'User-Agent': 'GizemliDunyaVideoBot/1.0'}, timeout=60)
                          image_response.raise_for_status()
                          if len(image_response.content) < 45000:
                              continue
                          try:
                              with Image.open(io.BytesIO(image_response.content)) as opened:
                                  opened.load()
                                  image = opened.convert('RGB')
                          except Exception as image_error:
                              last_error = f'Fotograf cozulemedi ({mime}): {image_error}'
                              continue
                          if image.width < 640 or image.height < 1000:
                              continue
                          image = ImageOps.fit(image, (768, 1365), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))
                          try:
                              validate_generated_image(image, scene_no)
                          except RuntimeError:
                              used_titles.add(title_text)
                              continue
                          image.save(path, 'JPEG', quality=94, optimize=True)
                          def meta(key):
                              return str(ext.get(key, {}).get('value', '')).replace('<br />', ' ').strip()
                          record = {
                              'scene': scene_no, 'caption': caption, 'commons_title': title_text,
                              'source_page': info.get('descriptionurl', ''),
                              'image_url': info.get('url', ''), 'artist': meta('Artist'),
                              'license': meta('LicenseShortName'), 'license_url': meta('LicenseUrl'),
                              'search_query': query
                          }
                          source_file = OUT / 'image_sources.json'
                          sources = json.loads(source_file.read_text(encoding='utf-8')) if source_file.exists() else []
                          sources.append(record)
                          source_file.write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')
                          print(f'Ucretsiz sahne fotografi bulundu: {scene_no}/{SCENE_COUNT} | {title_text} | {record["license"]}')
                          return path
                  except Exception as exc:
                      last_error = exc
                      print(f'Commons arama uyarisi ({query}): {str(exc)[:180]}')
              raise RuntimeError(f'{scene_no}. sahne icin yeterli kalitede, benzersiz ve lisans bilgisi olan ucretsiz fotograf bulunamadi. Yayin engellendi. Son hata: {last_error}')


          def render_image_scene(scene_no, caption, duration, category, topic_id, seed, output, frame_count=None):
              """Animate a unique AI still with restrained camera drift and synchronized subtitles."""
              frames = frame_count if frame_count is not None else max(1, round(duration * FPS))
              still = generate_scene_image(scene_no, caption, topic_id, seed)
              source = Image.open(still).convert('RGB')
              # Portrait crop with a little overscan enables a slow, cinematic push-in/pan.
              base = ImageOps.fit(source, (WIDTH, HEIGHT), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))
              encode = subprocess.Popen([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-video_size', f'{WIDTH}x{HEIGHT}',
                  '-framerate', str(FPS), '-i', 'pipe:0', '-an',
                  '-vf', f'scale={OUTPUT_WIDTH}:{OUTPUT_HEIGHT}:flags=lanczos,format=yuv420p',
                  '-frames:v', str(frames), '-c:v', 'libx264', '-preset', 'veryfast',
                  '-crf', '20', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', str(output)
              ], stdin=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)
              try:
                  for frame_no in range(frames):
                      progress = frame_no / max(1, frames - 1)
                      zoom = 1.0 + 0.075 * progress
                      cw, ch = int(WIDTH / zoom), int(HEIGHT / zoom)
                      # Alternate gentle pan directions so the visual does not feel like a static card.
                      drift = (progress - 0.5) * 0.10
                      cx = 0.5 + (drift if scene_no % 2 else -drift)
                      cy = 0.48 + (progress - 0.5) * 0.035
                      left = max(0, min(WIDTH - cw, int(cx * WIDTH - cw / 2)))
                      top = max(0, min(HEIGHT - ch, int(cy * HEIGHT - ch / 2)))
                      frame = base.crop((left, top, left + cw, top + ch)).resize((WIDTH, HEIGHT), Image.Resampling.LANCZOS)
                      draw = ImageDraw.Draw(frame, 'RGBA')
                      draw_subtitles(draw, caption, (frame_no + 1) / max(1, frames), category, scene_no)
                      encode.stdin.write(frame.tobytes())
                  encode.stdin.close()
                  code = encode.wait()
                  err = encode.stderr.read().decode('utf-8', 'replace')[-1500:]
                  if code:
                      raise RuntimeError(f'AI görsel video kodlama hatası: {code}; {err}')
              finally:
                  if encode.poll() is None:
                      encode.kill()
              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError(f'{scene_no}. Ücretsiz fotoğraf sahnesisi video klibine dönüştürülemedi.')



          def make_soundtrack(path, duration):
              total=int(duration*SAMPLE_RATE)
              t=np.arange(total,dtype=np.float32)/SAMPLE_RATE
              # Original, generated ambient bed; intentionally quiet under narration.
              audio=(0.035*np.sin(2*np.pi*55*t)+0.018*np.sin(2*np.pi*82.41*t)+
                     0.010*np.sin(2*np.pi*110*t)*(0.5+0.5*np.sin(2*np.pi*0.35*t)))
              notes=[329.63,392,493.88,440,392,293.66]
              for i,start in enumerate(np.arange(0.5,duration,2.5)):
                  first=int(start*SAMPLE_RATE); size=min(int(1.8*SAMPLE_RATE),total-first)
                  lt=np.arange(size,dtype=np.float32)/SAMPLE_RATE
                  audio[first:first+size]+=0.018*np.sin(2*np.pi*notes[i%len(notes)]*lt)*np.exp(-1.8*lt)
              fade=min(int(SAMPLE_RATE*1.0), max(1, total//3))
              audio[:fade]*=np.linspace(0,1,fade); audio[-fade:]*=np.linspace(1,0,fade)
              peak=float(np.max(np.abs(audio)))
              if peak>0: audio*=0.6/peak
              pcm=(np.clip(np.column_stack((audio,audio)),-1,1)*32767).astype('<i2')
              with wave.open(str(path),'wb') as wav:
                  wav.setnchannels(2); wav.setsampwidth(2); wav.setframerate(SAMPLE_RATE); wav.writeframes(pcm.tobytes())


          def youtube_upload(path):
              import re, unicodedata, random
              from google.auth.exceptions import RefreshError

              def safe_text(value, limit):
                  value = unicodedata.normalize('NFKD', str(value or ''))
                  value = value.encode('ascii', 'ignore').decode('ascii')
                  value = re.sub(r'[^A-Za-z0-9 .,;:!?()_/#&+\-]', ' ', value)
                  value = re.sub(r'\s+', ' ', value).strip()
                  return value[:limit].rstrip()

              def safe_url(value):
                  value = str(value or '').strip()
                  if value.startswith('https://') and all(c.isalnum() or c in ':/._-%?=&+#' for c in value):
                      return value[:300]
                  return ''

              safe_title = safe_text(title, 100) or 'Gizemli paranormal hikaye'
              credit_lines = []
              source_file = OUT / 'image_sources.json'
              if source_file.exists():
                  try:
                      credits = json.loads(source_file.read_text(encoding='utf-8'))
                      for item in credits[:SCENE_COUNT]:
                          work = safe_text(item.get('commons_title', 'Gorsel'), 90) or 'Gorsel'
                          artist = safe_text(item.get('artist', 'Bilinmiyor'), 55) or 'Bilinmiyor'
                          license_name = safe_text(item.get('license', 'Lisans bilgisi'), 35) or 'Lisans bilgisi'
                          source_type = safe_text(item.get('source_type', 'Wikimedia Commons'), 65)
                          page = safe_url(item.get('source_page', ''))
                          line = 'Scene ' + safe_text(item.get('scene', ''), 2) + ': ' + source_type + ' / ' + work + ' / ' + artist + ' / ' + license_name
                          if page:
                              line += ' / ' + page
                          credit_lines.append(line[:480])
                  except Exception as credit_error:
                      print('Kaynakca okunamadi:', str(credit_error)[:160])

              # Aciklama sadece ASCII, satir sonlari ve guvenli noktalama icerir.
              intro = (safe_title + '\n\n'
                       'Gizemli Dunya paranormal hikaye videosu. Hikaye kurgu ve sehir efsanesi atmosferinde anlatilmistir.\n'
                       'Teorini yorumlarda paylas.\n\n'
                       '#Shorts #Paranormal #GizemliHikayeler')
              attribution = ''
              if credit_lines:
                  attribution = ('\n\nIMAGE SOURCES / CREDITS:\n' + '\n'.join(credit_lines) +
                      '\nLicense information: see each source page for the applicable license and terms.')
              description = (intro + attribution)[:4500].rstrip()
              # En sade yedek de kaynak atiflarini tutar; aciklama 4000 karakterin altinda kalir.
              fallback_description = ('Gizemli Dunya paranormal hikaye videosu. Kurgu anlatim. #Shorts' +
                  (('\n\nImage sources / credits:\n' + '\n'.join(credit_lines)) if credit_lines else ''))[:3900].rstrip()
              tags = ['Shorts', 'Gizemli Dunya', 'Paranormal', 'Gizemli Hikayeler', 'Korku Hikayeleri']
              body = {
                  'snippet': {'title': safe_title, 'description': description, 'tags': tags,
                              'categoryId': '24', 'defaultLanguage': 'tr'},
                  'status': {'privacyStatus': YOUTUBE_PRIVACY, 'selfDeclaredMadeForKids': False,
                             'containsSyntheticMedia': True}
              }

              creds = Credentials(token=None, refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri='https://oauth2.googleapis.com/token', client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,
                  scopes=['https://www.googleapis.com/auth/youtube.upload'])
              try:
                  creds.refresh(Request())
              except RefreshError as exc:
                  raise RuntimeError('YouTube oturum anahtari yenilenemedi. YOUTUBE_REFRESH_TOKEN ve OAuth izinlerini kontrol edin: ' + str(exc)[:300]) from exc
              youtube = build('youtube', 'v3', credentials=creds, cache_discovery=False)

              def new_request():
                  media = MediaFileUpload(str(path), mimetype='video/mp4',
                      chunksize=8 * 1024 * 1024, resumable=True)
                  return youtube.videos().insert(part='snippet,status', body=body, media_body=media)

              request = new_request()
              result = None
              used_fallback = False
              retry = 0
              max_retries = 6
              while result is None:
                  try:
                      # google-api-client icindeki gecici 5xx yeniden denemeleri de etkin.
                      _, result = request.next_chunk(num_retries=3)
                      retry = 0
                  except HttpError as error:
                      status = getattr(error.resp, 'status', 0)
                      raw = getattr(error, 'content', b'')
                      try:
                          payload = json.loads(raw.decode('utf-8', 'replace'))
                          api_error = payload.get('error', {})
                          reasons = [e.get('reason', '') for e in api_error.get('errors', [])]
                          message = api_error.get('message', '')
                      except Exception:
                          reasons, message = [], str(error)
                      reason_text = ' '.join(reasons)

                      if status == 400 and ('invalidDescription' in raw.decode('utf-8', 'replace')) and not used_fallback:
                          print('YouTube aciklamayi reddetti; kaynak atiflarini koruyan sade aciklama deneniyor.')
                          used_fallback = True
                          body['snippet']['description'] = fallback_description
                          request = new_request()
                          retry = 0
                          continue

                      transient = (status in (408, 429, 500, 502, 503, 504) or
                                   (status == 403 and any(x in reason_text for x in
                                    ('rateLimitExceeded', 'userRateLimitExceeded', 'backendError'))))
                      if transient and retry < max_retries:
                          retry += 1
                          delay = min(60, 2 ** retry) + random.uniform(0, 1.5)
                          print(f'YouTube gecici HTTP {status} hatasi ({retry}/{max_retries}); {delay:.1f} sn sonra ayni yukleme devam edecek. {message[:180]}')
                          time.sleep(delay)
                          continue
                      if status == 403 and 'quotaExceeded' in reason_text:
                          raise RuntimeError('YouTube API gunluk kotasi dolmus. Video hazir; kota sifirlaninca tekrar yuklenmeli. Yeni API istegiyle tekrar denemek kotayi artirmaz.') from error
                      if status in (401, 403):
                          raise RuntimeError(f'YouTube yetki/izin hatasi (HTTP {status}, {reason_text or "unknown"}): {message[:300]}. OAuth izinleri ve kanal erisimini kontrol edin.') from error
                      raise RuntimeError(f'YouTube yukleme hatasi (HTTP {status}, {reason_text or "unknown"}): {message[:400]}') from error
                  except (OSError, ConnectionError, TimeoutError) as error:
                      if retry >= max_retries:
                          raise RuntimeError('YouTube yuklemesinde ag hatasi; tekrar deneme siniri asildi: ' + str(error)[:250]) from error
                      retry += 1
                      delay = min(60, 2 ** retry) + random.uniform(0, 1.5)
                      print(f'Ag baglantisi kesildi ({retry}/{max_retries}); {delay:.1f} sn sonra yukleme surdurulecek.')
                      time.sleep(delay)

              youtube_id = result.get('id') if isinstance(result, dict) else None
              if not youtube_id:
                  raise RuntimeError('YouTube yukleme yaniti video ID icermiyor: ' + str(result)[:300])
              return youtube_id


          # Uretim: Her anlatim sahnesi icin ayri AI gorseli; Blender/3D karakter yoktur.
          print(f'1/5 Her hikaye sahnesi icin farkli gorsel hazirlaniyor | sahne={SCENE_COUNT}')
