name: Gizemli Dunya - Yuksek Kalite Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg ve fontlari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python kutuphanelerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy

      - name: Yuksek kaliteli videoyu olustur
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import io
          import json
          import time
          import base64
          import wave
          import random
          import subprocess
          from pathlib import Path

          import requests
          import numpy as np
          from PIL import (
              Image, ImageDraw, ImageFont,
              ImageEnhance, ImageFilter, ImageStat
          )

          # ============================================
          # GENEL AYARLAR
          # ============================================

          CF_TOKEN = os.getenv(
              "CLOUDFLARE_API_TOKEN", ""
          ).strip()

          CF_ACCOUNT = os.getenv(
              "CLOUDFLARE_ACCOUNT_ID", ""
          ).strip()

          if not CF_TOKEN or not CF_ACCOUNT:
              raise RuntimeError(
                  "Cloudflare API bilgileri eksik."
              )

          # Birinci tercih: daha kaliteli FLUX modeli
          PRIMARY_MODEL = (
              "@cf/black-forest-labs/flux-2-klein-9b"
          )

          # Yedek: daha once calisan model
          BACKUP_MODEL = (
              "@cf/lykon/dreamshaper-8-lcm"
          )

          WIDTH = 1080
          HEIGHT = 1920
          FPS = 25

          SCENE_COUNT = 6
          SCENE_SECONDS = 5
          DURATION = SCENE_COUNT * SCENE_SECONDS

          SAMPLE_RATE = 22050

          ROOT = Path.cwd()
          OUT = ROOT / "output"
          IMAGES = OUT / "images"
          CAPTIONS = OUT / "captions"
          CLIPS = OUT / "clips"

          for folder in [
              OUT, IMAGES, CAPTIONS, CLIPS
          ]:
              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

          session = requests.Session()

          # ============================================
          # KONU HAVUZU
          # ============================================

          TOPICS = [
              {
                  "title": "Piramitlerin Gizli Boşlukları",
                  "category": "Antik Mısır",
                  "scenes": [
                      [
                          "Piramitlerde hâlâ keşfedilecek sırlar var.",
                          "The Great Pyramid of Giza rising above "
                          "golden desert dunes at sunrise, massive "
                          "limestone monument, Egyptian plateau, "
                          "dramatic atmospheric perspective"
                      ],
                      [
                          "Büyük Piramit yaklaşık 4.500 yıllık.",
                          "Photorealistic close view of the Great "
                          "Pyramid, weathered ancient limestone "
                          "blocks, accurate Egyptian architecture, "
                          "enormous scale, warm desert light"
                      ],
                      [
                          "Bilim insanları kozmik parçacıklardan yararlandı.",
                          "Documentary reconstruction of researchers "
                          "using modern particle detection equipment "
                          "to study the interior of an Egyptian pyramid"
                      ],
                      [
                          "2017'de büyük bir iç boşluk tespit edildi.",
                          "Scientific architectural cutaway of the "
                          "Great Pyramid revealing a large previously "
                          "unknown void, plausible ancient stone "
                          "interior, accurate educational visualization"
                      ],
                      [
                          "Bu boşluğun amacı kesin olarak bilinmiyor.",
                          "Realistic speculative reconstruction of "
                          "a large unlit void inside the Great Pyramid, "
                          "raw ancient limestone surfaces, atmospheric "
                          "dust, no invented artifacts or hieroglyphs"
                      ],
                      [
                          "Piramitler araştırmacıları hâlâ şaşırtıyor.",
                          "Magnificent Great Pyramid of Giza under "
                          "dramatic sunset sky, cinematic monumental "
                          "architecture photography, golden clouds"
                      ]
                  ]
              },
              {
                  "title": "Europa'nın Gizli Okyanusu",
                  "category": "Uzay",
                  "scenes": [
                      [
                          "Jüpiter'in uydusu Europa buzla kaplı.",
                          "Scientifically grounded visualization of "
                          "Jupiter and its icy moon Europa floating "
                          "in deep space, dramatic natural lighting"
                      ],
                      [
                          "Europa'nın yüzeyinde dev çatlaklar var.",
                          "Detailed close aerial visualization of "
                          "Europa ice crust, reddish fractures, "
                          "complex frozen terrain, scientific realism"
                      ],
                      [
                          "Buzun altında bir okyanus olduğu düşünülüyor.",
                          "Scientific cross-section of Europa showing "
                          "its thick frozen shell and suspected deep "
                          "subsurface liquid water ocean"
                      ],
                      [
                          "Bu okyanus yaşam için ilgi çekici olabilir.",
                          "Speculative but scientifically plausible "
                          "underwater environment beneath Europa's "
                          "ice shell, deep blue water, floating "
                          "particles, no visible alien creatures"
                      ],
                      [
                          "Uzay araçları bu gizemi araştırıyor.",
                          "Realistic robotic space probe flying past "
                          "Europa with huge Jupiter in the distance, "
                          "scientific spacecraft illustration"
                      ],
                      [
                          "Europa'da yaşam var mı? Henüz bilmiyoruz.",
                          "Spectacular realistic Europa above Jupiter, "
                          "glowing icy horizon, immense scale of space, "
                          "cinematic final documentary shot"
                      ]
                  ]
              },
              {
                  "title": "Nazca Çizgileri",
                  "category": "Antik Dünya",
                  "scenes": [
                      [
                          "Peru çölünde dev çizimler bulunuyor.",
                          "Photorealistic aerial view of the Nazca "
                          "Desert in Peru, authentic ancient geoglyph "
                          "lines on dry reddish ground"
                      ],
                      [
                          "Bazıları yukarıdan daha kolay görülüyor.",
                          "Bird's-eye view of the famous Nazca "
                          "hummingbird geoglyph, natural desert terrain, "
                          "clear authentic line-art geometry"
                      ],
                      [
                          "Bu çizimleri antik insanlar oluşturdu.",
                          "Historically grounded reconstruction of "
                          "ancient Nazca people carefully clearing "
                          "desert stones to create large geoglyph lines"
                      ],
                      [
                          "Hayvanlar ve geometrik şekiller çizilmiş.",
                          "Authentic style Nazca monkey and spider "
                          "geoglyphs viewed from high above, detailed "
                          "Peruvian desert environment"
                      ],
                      [
                          "Tam olarak ne amaçla yapıldıkları araştırılıyor.",
                          "Archaeologists documenting Nazca geoglyphs "
                          "with field notebooks and measuring tools, "
                          "sunlit Peruvian archaeological landscape"
                      ],
                      [
                          "Bu çizgiler insanlık tarihinin bir parçası.",
                          "Epic wide aerial panorama of Nazca desert "
                          "geoglyphs at sunset, realistic landscape "
                          "documentary photography"
                      ]
                  ]
              },
              {
                  "title": "Derin Okyanusun Gizli Yaşamı",
                  "category": "Dünya",
                  "scenes": [
                      [
                          "Okyanus derinlerinde güneş ışığı yok.",
                          "Vast deep ocean abyss descending into "
                          "darkness, realistic underwater particles "
                          "and distant rocks, deep blue-black water"
                      ],
                      [
                          "Yine de burada yaşam devam ediyor.",
                          "Detailed deep-sea organisms in natural "
                          "underwater environment, scientifically "
                          "plausible fish and invertebrates"
                      ],
                      [
                          "Deniz tabanında sıcak su bacaları var.",
                          "Photorealistic hydrothermal black smoker "
                          "vents rising from ocean floor, mineral "
                          "clouds billowing into deep water"
                      ],
                      [
                          "Bazı canlılar kimyasal enerjiye dayanıyor.",
                          "Deep sea tube worms and microbial mats "
                          "surrounding hydrothermal vents, realistic "
                          "scientific marine documentary image"
                      ],
                      [
                          "Bu ekosistem güneş olmadan işleyebiliyor.",
                          "Close scientific visualization of unusual "
                          "deep-sea hydrothermal ecosystem, tube worms, "
                          "crustaceans and dark water"
                      ],
                      [
                          "Dünya'nın derinlikleri keşfedilmeyi bekliyor.",
                          "Research submersible illuminating a deep "
                          "underwater canyon, suspended particles, "
                          "cinematic ocean exploration photography"
                      ]
                  ]
              },
              {
                  "title": "Paskalya Adası'nın Moai Heykelleri",
                  "category": "Tarih",
                  "scenes": [
                      [
                          "Bu dev taş heykellere Moai deniyor.",
                          "Monumental Moai statues on Rapa Nui "
                          "Easter Island, realistic volcanic stone "
                          "texture, Pacific Ocean and blue sky"
                      ],
                      [
                          "Heykelleri Rapa Nui halkı yaptı.",
                          "Historically respectful reconstruction "
                          "of Rapa Nui artisans carving a giant "
                          "Moai in a volcanic stone quarry"
                      ],
                      [
                          "Bazı heykeller tonlarca ağırlığında.",
                          "Close perspective of an enormous Moai "
                          "statue showing its massive scale, "
                          "weathered volcanic rock and fine details"
                      ],
                      [
                          "Heykellerin taşınma yöntemleri araştırılıyor.",
                          "Archaeological reconstruction of Rapa Nui "
                          "people transporting a giant Moai statue "
                          "using ropes and coordinated teamwork"
                      ],
                      [
                          "Bilim insanları farklı yöntemleri test ediyor.",
                          "Modern experimental archaeologists testing "
                          "Moai statue movement methods outdoors "
                          "on Rapa Nui, documentary realism"
                      ],
                      [
                          "Moai heykelleri eşsiz bir kültürel miras.",
                          "Magnificent row of Moai statues at "
                          "sunset on Easter Island, dramatic "
                          "clouds and distant Pacific Ocean"
                      ]
                  ]
              }
          ]

          # ============================================
          # KONUYU SEC
          # ============================================

          run_number = int(
              os.getenv("GITHUB_RUN_NUMBER", "1")
          )

          topic = TOPICS[
              (run_number - 1) % len(TOPICS)
          ]

          scenes = [
              {
                  "number": i + 1,
                  "caption": caption,
                  "prompt": prompt
              }
              for i, (caption, prompt)
              in enumerate(topic["scenes"])
          ]

          print("1/6 Konu:", topic["title"])

          (OUT / "video-plani.json").write_text(
              json.dumps(
                  {
                      "title": topic["title"],
                      "category": topic["category"],
                      "scenes": scenes
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ============================================
          # YUKSEK KALITELI GORSEL URETIMI
          # ============================================

          STYLE = (
              "Premium cinematic science documentary still, "
              "highly detailed realistic environment, "
              "professional cinematic lighting, "
              "rich natural colors, precise physical textures, "
              "realistic stone, ice, atmosphere and materials, "
              "strong sense of scale, layered visual depth, "
              "sharp subject focus, sophisticated composition, "
              "careful atmospheric perspective, "
              "subtle volumetric lighting, "
              "high-end visual storytelling, "
              "vertical 9:16 portrait framing, "
              "main subject centered within safe crop area, "
              "no words, no typography, no subtitles, "
              "no logo, no watermark. "
          )

          NEGATIVE = (
              "blurry, low resolution, pixelated, noisy, "
              "cartoon, childish illustration, plastic CGI, "
              "cheap 3D render, distorted buildings, "
              "unrealistic anatomy, overprocessed image, "
              "excessive saturation, visible text, "
              "letters, logos, watermarks"
          )

          def extract_image_bytes(response):
              content_type = response.headers.get(
                  "Content-Type", ""
              ).lower()

              if (
                  "json" not in content_type
                  and response.content[:1] != b"{"
              ):
                  return response.content

              payload = response.json()

              if payload.get("success") is False:
                  raise RuntimeError(
                      str(payload.get("errors"))
                  )

              result = payload.get(
                  "result", payload
              )

              if isinstance(result, dict):
                  encoded = (
                      result.get("image")
                      or result.get("data")
                  )
              else:
                  encoded = None

              if isinstance(encoded, list):
                  return bytes(encoded)

              if isinstance(encoded, str):
                  if encoded.startswith("data:"):
                      encoded = encoded.split(
                          ",", 1
                      )[-1]

                  return base64.b64decode(
                      encoded
                  )

              raise RuntimeError(
                  "API yanitinda gorsel bulunamadi."
              )

          def call_flux(prompt, seed):
              url = (
                  "https://api.cloudflare.com/client/v4/"
                  f"accounts/{CF_ACCOUNT}/ai/run/"
                  f"{PRIMARY_MODEL}"
              )

              # FLUX.2 multipart/form-data ister.
              # Content-Type requests tarafindan ayarlanir.
              response = session.post(
                  url,
                  headers={
                      "Authorization": (
                          f"Bearer {CF_TOKEN}"
                      )
                  },
                  data={
                      "prompt": prompt[:2000],
                      "width": "1024",
                      "height": "1792",
                      "guidance": "4",
                      "seed": str(seed)
                  },
                  timeout=240
              )

              if not response.ok:
                  raise RuntimeError(
                      f"FLUX HTTP {response.status_code}: "
                      f"{response.text[:400]}"
                  )

              return extract_image_bytes(
                  response
              )

          def call_dreamshaper(prompt, seed):
              url = (
                  "https://api.cloudflare.com/client/v4/"
                  f"accounts/{CF_ACCOUNT}/ai/run/"
                  f"{BACKUP_MODEL}"
              )

              response = session.post(
                  url,
                  headers={
                      "Authorization": (
                          f"Bearer {CF_TOKEN}"
                      )
                  },
                  json={
                      "prompt": prompt[:1800],
                      "negative_prompt": NEGATIVE,
                      "width": 768,
                      "height": 1344,
                      "num_steps": 20,
                      "guidance": 8,
                      "seed": seed
                  },
                  timeout=240
              )

              if not response.ok:
                  raise RuntimeError(
                      f"DreamShaper HTTP "
                      f"{response.status_code}: "
                      f"{response.text[:400]}"
                  )

              return extract_image_bytes(
                  response
              )

          def enhance_image(image_bytes, destination):
              image = Image.open(
                  io.BytesIO(image_bytes)
              ).convert("RGB")

              if (
                  image.width < 256
                  or image.height < 256
              ):
                  raise RuntimeError(
                      "Gorsel cozunurlugu cok dusuk."
                  )

              target_ratio = WIDTH / HEIGHT
              image_ratio = (
                  image.width / image.height
              )

              # Orta bolge korunarak dikey kadraj
              if image_ratio > target_ratio:
                  new_width = int(
                      image.height * target_ratio
                  )

                  left = (
                      image.width - new_width
                  ) // 2

                  image = image.crop((
                      left,
                      0,
                      left + new_width,
                      image.height
                  ))
              else:
                  new_height = int(
                      image.width / target_ratio
                  )

                  top = (
                      image.height - new_height
                  ) // 2

                  image = image.crop((
                      0,
                      top,
                      image.width,
                      top + new_height
                  ))

              image = image.resize(
                  (WIDTH, HEIGHT),
                  Image.Resampling.LANCZOS
              )

              # Hafif renk ve kontrast duzenlemesi
              image = (
                  ImageEnhance.Contrast(image)
                  .enhance(1.045)
              )

              image = (
                  ImageEnhance.Color(image)
                  .enhance(1.035)
              )

              # Abartisiz keskinlestirme
              image = image.filter(
                  ImageFilter.UnsharpMask(
                      radius=1.1,
                      percent=85,
                      threshold=3
                  )
              )

              brightness = sum(
                  ImageStat.Stat(image).mean
              ) / 3

              if brightness < 8:
                  raise RuntimeError(
                      "Gorsel neredeyse tamamen siyah."
                  )

              image.save(
                  destination,
                  format="PNG",
                  optimize=True
              )

          def generate_image(scene, destination):
              prompt = (
                  STYLE + scene["prompt"]
              )

              seed = random.randint(
                  1, 2000000000
              )

              last_error = None

              for attempt in range(1, 3):
                  try:
                      print(
                          "FLUX kalite modeli deneniyor:",
                          attempt
                      )

                      image_bytes = call_flux(
                          prompt, seed + attempt
                      )

                      enhance_image(
                          image_bytes, destination
                      )

                      print(
                          "FLUX gorseli basarili."
                      )
                      return

                  except Exception as exc:
                      last_error = exc
                      print(
                          "FLUX kullanilamadi:",
                          str(exc)[:350]
                      )

                      if attempt < 2:
                          time.sleep(4)

              print(
                  "Yedek DreamShaper modeline geciliyor."
              )

              for attempt in range(1, 4):
                  try:
                      image_bytes = call_dreamshaper(
                          prompt,
                          seed + attempt
                      )

                      enhance_image(
                          image_bytes, destination
                      )

                      print(
                          "DreamShaper gorseli hazir."
                      )
                      return

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"Yedek deneme {attempt}/3:",
                          str(exc)[:350]
                      )

                      if attempt < 3:
                          time.sleep(attempt * 5)

              raise RuntimeError(
                  "Gorsel uretilemedi: "
                  + str(last_error)
              )

          print("2/6 Yuksek kaliteli gorseller...")

          for scene in scenes:
              number = scene["number"]

              destination = (
                  IMAGES / f"scene_{number:02d}.png"
              )

              print(
                  f"Gorsel {number}/{SCENE_COUNT}"
              )

              generate_image(
                  scene,
                  destination
              )

              if (
                  not destination.exists()
                  or destination.stat().st_size < 5000
              ):
                  raise RuntimeError(
                      "Gorsel dosyasi gecersiz."
                  )

          # ============================================
          # TURKCE YAZILAR
          # ============================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          def make_caption(text, destination):
              canvas = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(canvas)

              font = ImageFont.truetype(
                  FONT_PATH, 55
              )

              words = text.split()
              lines = []
              current = ""

              for word in words:
                  candidate = (
                      current + " " + word
                  ).strip()

                  bounds = draw.textbbox(
                      (0, 0),
                      candidate,
                      font=font
                  )

                  if (
                      bounds[2] - bounds[0] <= WIDTH - 130
                      or not current
                  ):
                      current = candidate
                  else:
                      lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              line_height = 80
              text_height = (
                  len(lines) * line_height
              )

              y_start = (
                  HEIGHT - 290 - text_height
              )

              draw.rounded_rectangle(
                  (
                      42,
                      y_start - 35,
                      WIDTH - 42,
                      y_start + text_height + 40
                  ),
                  radius=34,
                  fill=(0, 0, 0, 185)
              )

              for index, line in enumerate(
                  lines
              ):
                  draw.text(
                      (
                          WIDTH // 2,
                          y_start + index * line_height
                      ),
                      line,
                      font=font,
                      anchor="mt",
                      fill=(255, 255, 255, 255),
                      stroke_width=2,
                      stroke_fill=(0, 0, 0, 255)
                  )

              canvas.save(
                  destination,
                  format="PNG"
              )

          print("3/6 Altyazilar hazirlaniyor...")

          for scene in scenes:
              number = scene["number"]

              make_caption(
                  scene["caption"],
                  CAPTIONS / f"caption_{number:02d}.png"
              )

          # ============================================
          # HAREKETLI KLIPLER
          # ============================================

          def make_clip(
              image_path,
              caption_path,
              output_path,
              number
          ):
              frames = (
                  SCENE_SECONDS * FPS
              )

              # Hafif zoom ve kamera hareketleri.
              # Asiri zoom gorsel netligini dusurur.

              if number % 3 == 1:
                  zoom = (
                      "min(1.0+0.00065*on,1.08)"
                  )
                  x = "iw/2-(iw/zoom/2)"
                  y = "ih/2-(ih/zoom/2)"

              elif number % 3 == 2:
                  zoom = "1.07"
                  x = (
                      "max(0,min(iw-iw/zoom,"
                      f"(iw-iw/zoom)*on/{frames}))"
                  )
                  y = "ih/2-(ih/zoom/2)"

              else:
                  zoom = "1.07"
                  x = "iw/2-(iw/zoom/2)"
                  y = (
                      "max(0,min(ih-ih/zoom,"
                      f"(ih-ih/zoom)*on/{frames}))"
                  )

              filters = (
                  "[0:v]"
                  "zoompan="
                  f"z='{zoom}':"
                  f"x='{x}':"
                  f"y='{y}':"
                  f"d={frames}:"
                  f"s={WIDTH}x{HEIGHT}:"
                  f"fps={FPS},"
                  "setsar=1,"
                  "format=yuv420p[bg];"
                  "[bg][1:v]"
                  "overlay=0:0:"
                  "shortest=0:"
                  "repeatlast=1,"
                  "format=yuv420p[v]"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-hide_banner",
                      "-loglevel", "error",
                      "-y",
                      "-i", str(image_path),
                      "-i", str(caption_path),
                      "-filter_complex", filters,
                      "-map", "[v]",
                      "-frames:v", str(frames),
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "medium",
                      "-crf", "17",
                      "-pix_fmt", "yuv420p",
                      str(output_path)
                  ],
                  check=True
              )

              if (
                  not output_path.exists()
                  or output_path.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      "Klip olusturulamadi."
                  )

          print("4/6 Sinematik klipler uretiliyor...")

          clip_paths = []

          for number in range(
              1, SCENE_COUNT + 1
          ):
              image_path = (
                  IMAGES / f"scene_{number:02d}.png"
              )

              caption_path = (
                  CAPTIONS / f"caption_{number:02d}.png"
              )

              clip_path = (
                  CLIPS / f"clip_{number:02d}.mp4"
              )

              make_clip(
                  image_path,
                  caption_path,
                  clip_path,
                  number
              )

              clip_paths.append(
                  clip_path
              )

              print(
                  f"Klip {number}/{SCENE_COUNT} hazir."
              )

          # ============================================
          # GIZEMLI MUZIK VE EFEKTLER
          # ============================================

          def make_soundtrack(destination):
              count = (
                  DURATION * SAMPLE_RATE
              )

              t = (
                  np.arange(
                      count,
                      dtype=np.float32
                  ) / SAMPLE_RATE
              )

              drone = (
                  0.12 * np.sin(
                      2 * np.pi * 55 * t
                  )
                  + 0.05 * np.sin(
                      2 * np.pi * 82.41 * t
                  )
              )

              pulse = (
                  0.035
                  * np.sin(
                      2 * np.pi * 110 * t
                  )
                  * (
                      0.5
                      + 0.5 * np.sin(
                          2 * np.pi * 0.45 * t
                      )
                  )
              )

              music = (
                  drone + pulse
              ).astype(np.float32)

              notes = [
                  329.63, 392.0,
                  493.88, 440.0,
                  392.0, 293.66
              ]

              for i, start in enumerate(
                  np.arange(
                      0.5,
                      DURATION,
                      2.5
                  )
              ):
                  start_i = int(
                      start * SAMPLE_RATE
                  )

                  length = min(
                      int(2.2 * SAMPLE_RATE),
                      count - start_i
                  )

                  local_t = (
                      np.arange(
                          length,
                          dtype=np.float32
                      ) / SAMPLE_RATE
                  )

                  freq = notes[
                      i % len(notes)
                  ]

                  bell = (
                      0.08
                      * np.sin(
                          2 * np.pi
                          * freq * local_t
                      )
                      * np.exp(
                          -1.6 * local_t
                      )
                  )

                  music[
                      start_i:start_i + length
                  ] += bell

              rng = np.random.default_rng()

              for second in range(
                  SCENE_SECONDS,
                  DURATION,
                  SCENE_SECONDS
              ):
                  length = int(
                      0.5 * SAMPLE_RATE
                  )

                  start_i = int(
                      (second - 0.25)
                      * SAMPLE_RATE
                  )

                  noise = rng.normal(
                      0, 1, length
                  ).astype(np.float32)

                  envelope = np.sin(
                      np.linspace(
                          0,
                          np.pi,
                          length,
                          dtype=np.float32
                      )
                  )

                  whoosh = (
                      0.035
                      * noise
                      * envelope
                  )

                  end_i = min(
                      start_i + length,
                      count
                  )

                  music[
                      start_i:end_i
                  ] += whoosh[
                      :end_i - start_i
                  ]

              fade_len = int(
                  1.2 * SAMPLE_RATE
              )

              music[:fade_len] *= np.linspace(
                  0, 1, fade_len
              )

              music[-fade_len:] *= np.linspace(
                  1, 0, fade_len
              )

              peak = float(
                  np.max(np.abs(music))
              )

              if peak > 0:
                  music *= (
                      0.7 / peak
                  )

              stereo = np.column_stack(
                  (music, music)
              )

              pcm = (
                  np.clip(
                      stereo,
                      -1,
                      1
                  ) * 32767
              ).astype("<i2")

              with wave.open(
                  str(destination),
                  "wb"
              ) as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(
                      SAMPLE_RATE
                  )
                  wav.writeframes(
                      pcm.tobytes()
                  )

          print("5/6 Muzik ve efektler...")

          soundtrack = (
              OUT / "soundtrack.wav"
          )

          make_soundtrack(
              soundtrack
          )

          # ============================================
          # FINAL VIDEO
          # ============================================

          print("6/6 Final video birlestiriliyor...")

          concat_file = (
              OUT / "concat.txt"
          )

          concat_file.write_text(
              "".join(
                  f"file '{path.resolve()}'\n"
                  for path in clip_paths
              ),
              encoding="utf-8"
          )

          silent_video = (
              OUT / "silent.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(concat_file),
                  "-c", "copy",
                  str(silent_video)
              ],
              check=True
          )

          final_video = (
              ROOT / "gizemli-dunya-video.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-y",
                  "-i", str(silent_video),
                  "-i", str(soundtrack),
                  "-map", "0:v:0",
                  "-map", "1:a:0",
                  "-c:v", "copy",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  str(final_video)
              ],
              check=True
          )

          probe = subprocess.check_output(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration,size:"
                  "stream=codec_type,width,height",
                  "-of", "json",
                  str(final_video)
              ],
              text=True
          )

          info = json.loads(probe)

          streams = info.get(
              "streams", []
          )

          types = {
              item.get("codec_type")
              for item in streams
          }

          if "video" not in types:
              raise RuntimeError(
                  "Video akisi bulunamadi."
              )

          if "audio" not in types:
              raise RuntimeError(
                  "Ses akisi bulunamadi."
              )

          duration = float(
              info["format"]["duration"]
          )

          if duration < 25:
              raise RuntimeError(
                  "Video beklenenden kisa."
              )

          if not final_video.exists():
              raise RuntimeError(
                  "Final video bulunamadi."
              )

          print("")
          print("===============================")
          print("YUKSEK KALITELI VIDEO HAZIR")
          print("===============================")
          print("Konu:", topic["title"])
          print("Sure:", round(duration, 1), "saniye")
          print("Cozunurluk:", WIDTH, "x", HEIGHT)
          print("Altyazilar: Turkce")
          print("Seslendirme: Yok")
          print("Muzik: Var")
          print("Dosya:", final_video)

          PY

          python create_video.py

