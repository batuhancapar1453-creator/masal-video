          def commons_search_images(query, limit=18):
              api = 'https://commons.wikimedia.org/w/api.php'
              params = {
                  'action': 'query', 'format': 'json', 'generator': 'search',
                  'gsrsearch': f'filetype:bitmap {query}', 'gsrnamespace': 6,
                  'gsrlimit': limit, 'prop': 'imageinfo',
                  'iiprop': 'url|size|extmetadata', 'iiurlwidth': 1100
              }
              response = requests.get(api, params=params,
                  headers={'User-Agent': 'GizemliDunyaVideoBot/1.0 (educational noncommercial video project)'}, timeout=35)
              response.raise_for_status()
              pages = response.json().get('query', {}).get('pages', {})
              return list(pages.values())


          def generate_scene_image(scene_no, caption, topic_id, seed):
              """Fetch a distinct, high-resolution, freely licensed real photograph from Wikimedia Commons."""
              path = IMAGE_DIR / f'scene_{scene_no:02d}.jpg'
              kind = paranormal_visual_kind(topic_id, title)
              terms = commons_terms(kind, caption)
              banned = ('diagram', 'map', 'logo', 'coat of arms', 'drawing', 'illustration',
                        'painting', 'poster', 'flag', 'icon', 'screenshot', 'svg', 'collage')
              used_titles = set()
              last_error = None
              for query in terms:
                  try:
                      candidates = commons_search_images(query)
                      # Sort deterministically but vary the preferred result by scene/topic.
                      candidates.sort(key=lambda item: (len(item.get('title', '')), item.get('title', '')))
                      random.Random(seed + scene_no * 7919 + len(query)).shuffle(candidates)
                      for item in candidates:
                          title_text = item.get('title', '')
                          low_title = title_text.lower()
                          if any(word in low_title for word in banned) or title_text in used_titles:
                              continue
                          info_list = item.get('imageinfo', [])
                          if not info_list:
                              continue
                          info = info_list[0]
                          # Commons metadata MIME values vary by original file format.
                          # Do not reject candidates by metadata MIME: request the generated
                          # thumbnail and let Pillow verify/decode the actual downloaded bytes.
                          mime = str(info.get('mime', '')).lower()
                          if mime in ('image/svg+xml', 'application/pdf', 'application/postscript'):
                              continue
                          if int(info.get('width', 0)) < 900 or int(info.get('height', 0)) < 1200:
                              continue
                          ext = info.get('extmetadata', {})
                          desc = str(ext.get('ImageDescription', {}).get('value', '')).lower()
                          if any(word in desc for word in banned):
                              continue
                          url = info.get('thumburl') or info.get('url')
                          if not url:
                              continue
                          image_response = requests.get(url, headers={'User-Agent': 'GizemliDunyaVideoBot/1.0'}, timeout=60)
                          image_response.raise_for_status()
                          if len(image_response.content) < 45000:
                              continue
                          try:
                              with Image.open(io.BytesIO(image_response.content)) as opened:
                                  opened.load()
                                  image = opened.convert('RGB')
                          except Exception as image_error:
                              last_error = f'Fotograf cozulemedi ({mime}): {image_error}'
                              continue
                          if image.width < 640 or image.height < 1000:
                              continue
                          image = ImageOps.fit(image, (768, 1365), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))
                          try:
                              validate_generated_image(image, scene_no)
                          except RuntimeError:
                              used_titles.add(title_text)
                              continue
                          image.save(path, 'JPEG', quality=94, optimize=True)
                          def meta(key):
                              return str(ext.get(key, {}).get('value', '')).replace('<br />', ' ').strip()
                          record = {
                              'scene': scene_no, 'caption': caption, 'commons_title': title_text,
                              'source_page': info.get('descriptionurl', ''),
                              'image_url': info.get('url', ''), 'artist': meta('Artist'),
                              'license': meta('LicenseShortName'), 'license_url': meta('LicenseUrl'),
                              'search_query': query
                          }
                          source_file = OUT / 'image_sources.json'
                          sources = json.loads(source_file.read_text(encoding='utf-8')) if source_file.exists() else []
                          sources.append(record)
                          source_file.write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')
                          print(f'Ucretsiz sahne fotografi bulundu: {scene_no}/{SCENE_COUNT} | {title_text} | {record["license"]}')
                          return path
                  except Exception as exc:
                      last_error = exc
                      print(f'Commons arama uyarisi ({query}): {str(exc)[:180]}')
              raise RuntimeError(f'{scene_no}. sahne icin yeterli kalitede, benzersiz ve lisans bilgisi olan ucretsiz fotograf bulunamadi. Yayin engellendi. Son hata: {last_error}')


          def render_image_scene(scene_no, caption, duration, category, topic_id, seed, output, frame_count=None):
              """Animate a unique AI still with restrained camera drift and synchronized subtitles."""
              frames = frame_count if frame_count is not None else max(1, round(duration * FPS))
              still = generate_scene_image(scene_no, caption, topic_id, seed)
              source = Image.open(still).convert('RGB')
              # Portrait crop with a little overscan enables a slow, cinematic push-in/pan.
              base = ImageOps.fit(source, (WIDTH, HEIGHT), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))
              encode = subprocess.Popen([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-video_size', f'{WIDTH}x{HEIGHT}',
                  '-framerate', str(FPS), '-i', 'pipe:0', '-an',
                  '-vf', f'scale={OUTPUT_WIDTH}:{OUTPUT_HEIGHT}:flags=lanczos,format=yuv420p',
                  '-frames:v', str(frames), '-c:v', 'libx264', '-preset', 'veryfast',
                  '-crf', '20', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', str(output)
              ], stdin=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)
              try:
                  for frame_no in range(frames):
                      progress = frame_no / max(1, frames - 1)
                      zoom = 1.0 + 0.075 * progress
                      cw, ch = int(WIDTH / zoom), int(HEIGHT / zoom)
                      # Alternate gentle pan directions so the visual does not feel like a static card.
                      drift = (progress - 0.5) * 0.10
                      cx = 0.5 + (drift if scene_no % 2 else -drift)
                      cy = 0.48 + (progress - 0.5) * 0.035
                      left = max(0, min(WIDTH - cw, int(cx * WIDTH - cw / 2)))
                      top = max(0, min(HEIGHT - ch, int(cy * HEIGHT - ch / 2)))
                      frame = base.crop((left, top, left + cw, top + ch)).resize((WIDTH, HEIGHT), Image.Resampling.LANCZOS)
                      draw = ImageDraw.Draw(frame, 'RGBA')
                      draw_subtitles(draw, caption, (frame_no + 1) / max(1, frames), category, scene_no)
                      encode.stdin.write(frame.tobytes())
                  encode.stdin.close()
                  code = encode.wait()
                  err = encode.stderr.read().decode('utf-8', 'replace')[-1500:]
                  if code:
                      raise RuntimeError(f'AI görsel video kodlama hatası: {code}; {err}')
              finally:
                  if encode.poll() is None:
                      encode.kill()
              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError(f'{scene_no}. Ücretsiz fotoğraf sahnesisi video klibine dönüştürülemedi.')



          def make_soundtrack(path):
              total=int(TARGET_SECONDS*SAMPLE_RATE)
              t=np.arange(total,dtype=np.float32)/SAMPLE_RATE
              # Original, generated ambient bed; intentionally quiet under narration.
              audio=(0.035*np.sin(2*np.pi*55*t)+0.018*np.sin(2*np.pi*82.41*t)+
                     0.010*np.sin(2*np.pi*110*t)*(0.5+0.5*np.sin(2*np.pi*0.35*t)))
              notes=[329.63,392,493.88,440,392,293.66]
              for i,start in enumerate(np.arange(0.5,TARGET_SECONDS,2.5)):
                  first=int(start*SAMPLE_RATE); size=min(int(1.8*SAMPLE_RATE),total-first)
                  lt=np.arange(size,dtype=np.float32)/SAMPLE_RATE
                  audio[first:first+size]+=0.018*np.sin(2*np.pi*notes[i%len(notes)]*lt)*np.exp(-1.8*lt)
              fade=int(SAMPLE_RATE*1.0)
              audio[:fade]*=np.linspace(0,1,fade); audio[-fade:]*=np.linspace(1,0,fade)
              peak=float(np.max(np.abs(audio)))
              if peak>0: audio*=0.6/peak
              pcm=(np.clip(np.column_stack((audio,audio)),-1,1)*32767).astype('<i2')
              with wave.open(str(path),'wb') as wav:
                  wav.setnchannels(2); wav.setsampwidth(2); wav.setframerate(SAMPLE_RATE); wav.writeframes(pcm.tobytes())


          def youtube_upload(path):
              creds=Credentials(token=None,refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri='https://oauth2.googleapis.com/token',client_id=YOUTUBE_CLIENT_ID,
                  client_secret=YOUTUBE_CLIENT_SECRET,scopes=['https://www.googleapis.com/auth/youtube.upload'])
              creds.refresh(Request())
              youtube=build('youtube','v3',credentials=creds,cache_discovery=False)
              description=(f'{title}\n\n'
                'Gizemli Dünya’da bu kez kısa bir paranormal hikâye anlatıyoruz. '
                'Bu video, hikâyedeki anlatım anlarına eşleştirilmiş ücretsiz lisanslı fotoğraflar ve Türkçe seslendirme içerir. '
                'Hikâye kurgu ve şehir efsanesi atmosferinde anlatılmıştır; gerçek olduğu iddia edilmez.\n'
                'Bu hikâyeyle ilgili teorini yorumlarda paylaş.\n\n'
                '#Shorts #Paranormal #GizemliHikayeler #KorkuHikayeleri #Gizem')
              source_file = OUT / 'image_sources.json'
              if source_file.exists():
                  credits = json.loads(source_file.read_text(encoding='utf-8'))
                  credit_lines = []
                  for x in credits:
                      # Commons dosya basliklari cok uzun veya kontrol karakterli olabilir.
                      credit_lines.append(
                          'Sahne ' + str(x.get('scene', '')) + ': ' +
                          str(x.get('commons_title', 'Gorsel'))[:110] + ' — ' +
                          str(x.get('artist', 'Bilinmiyor'))[:80] + ' — ' +
                          str(x.get('license', 'Lisans bilgisi'))[:45] + ' — ' +
                          str(x.get('source_page', ''))[:220]
                      )
                  description += '\n\nGÖRSEL KAYNAKLARI / LİSANSLAR:\n' + '\n'.join(credit_lines)
              # YouTube aciklamasi en fazla 5000 karakter olabilir. Kontrol karakterlerini
              # temizle, Unicode metni koru ve guvenli pay birakarak 4500 karakterde kes.
              import unicodedata
              description = unicodedata.normalize('NFC', str(description))
              description = ''.join(ch for ch in description
                  if ch in '\n\r\t' or unicodedata.category(ch)[0] != 'C')
              description = description.replace('\r\n', '\n').replace('\r', '\n').strip()
              description = description[:4500].rstrip()
              body={'snippet':{'title':f'{title} | Paranormal Hikâye #Shorts'[:100],
                'description':description,'tags':['Shorts','Gizemli Dünya','Paranormal','Paranormal Hikayeler','Gizemli Hikayeler','Korku Hikayeleri','Şehir Efsaneleri'],
                'categoryId':'24','defaultLanguage':'tr'},
                'status':{'privacyStatus':YOUTUBE_PRIVACY,'selfDeclaredMadeForKids':False,'containsSyntheticMedia':True}}
              media=MediaFileUpload(str(path),mimetype='video/mp4',chunksize=-1,resumable=True)
              request=youtube.videos().insert(part='snippet,status',body=body,media_body=media)
              result=None; retry=0
              while result is None:
                  try:
                      _,result=request.next_chunk(); retry=0
                  except HttpError as error:
                      if error.resp.status not in (500,502,503,504) or retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
                  except (OSError,ConnectionError):
                      if retry>=4: raise
                      retry+=1; time.sleep(min(2**retry,30))
              youtube_id=result.get('id')
              if not youtube_id: raise RuntimeError('YouTube ID donmedi: '+str(result)[:300])
              return youtube_id


          # Uretim: Her anlatim sahnesi icin ayri, ucretsiz lisansli fotograf kullanilir; Blender/3D karakter yoktur.
          print(f'1/5 Her anlatim olayi icin farkli, ucretsiz Commons fotografi hazirlaniyor | sahne={SCENE_COUNT}')
