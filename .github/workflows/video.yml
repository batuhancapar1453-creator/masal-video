name: Gizemli Dunya - Ucretsiz Sinematik Sahne Gorselleri
permissions:
  contents: write
concurrency:
  group: youtube-paranormal-shorts-publisher
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: true
    - name: Python kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: FFmpeg ve Türkçe çevrimdışı ses motorunu kur
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng tesseract-ocr

        '
    - name: Python bagimliliklarini kur
      run: 'python -m pip install --upgrade pip

        python -m pip install requests numpy pillow pytesseract opencv-python-headless edge-tts google-auth google-auth-oauthlib
        google-api-python-client

        '
    - name: YouTube OAuth baglantisini onceden denetle
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: "python - <<'PY'\nimport os, requests\nvalues = {key: os.getenv(key, '').strip() for key in (\n    'YOUTUBE_CLIENT_ID',\
        \ 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'\n)}\nmissing = [k for k, v in values.items() if not v]\nif missing:\n\
        \    raise SystemExit('Eksik secrets: ' + ', '.join(missing))\nr = requests.post('https://oauth2.googleapis.com/token',\
        \ data={\n    'grant_type': 'refresh_token',\n    'client_id': values['YOUTUBE_CLIENT_ID'],\n    'client_secret':\
        \ values['YOUTUBE_CLIENT_SECRET'],\n    'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],\n}, timeout=30)\ninfo =\
        \ r.json()\nif not r.ok or not info.get('access_token'):\n    raise SystemExit('YouTube OAuth hatasi: ' + str(info.get('error'))\n\
        \        + ' (' + str(info.get('error_description'))[:160] + ')')\nprint('YouTube OAuth testi basarili; animasyon\
        \ uretimi baslayabilir.')\nPY\n"
    - name: Hareketli videoyu uret ve YouTube'a yukle
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PRIVACY: public
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: "cat > create_video.py <<'PY'\nimport os, io, json, time, wave, subprocess, random, math, asyncio, base64\nfrom\
        \ pathlib import Path\nfrom datetime import datetime\nfrom zoneinfo import ZoneInfo\nimport requests\nimport numpy\
        \ as np\nfrom PIL import Image, ImageDraw, ImageFont, ImageOps\nimport edge_tts\nfrom google.oauth2.credentials import\
        \ Credentials\nfrom google.auth.transport.requests import Request\nfrom googleapiclient.discovery import build\nfrom\
        \ googleapiclient.http import MediaFileUpload\nfrom googleapiclient.errors import HttpError\n\nROOT = Path.cwd()\n\
        OUT = ROOT / 'output'\nCAPTIONS = OUT / 'captions'\nCLIPS = OUT / 'clips'\nVOICE_DIR = OUT / 'voice'\nHISTORY_FILE\
        \ = ROOT / 'data' / 'youtube_history.json'\n# Ucretsiz lisansli sahne fotograflari 768x1365 hazirlanir; final video\
        \ 1080x1920 kodlanir.\nWIDTH, HEIGHT, FPS = 720, 1280, 30\nOUTPUT_WIDTH, OUTPUT_HEIGHT = 1080, 1920\nSTORY_PAUSE_SECONDS\
        \ = 0.45\nSCENE_COUNT = 10\nVOICE_BEAT_COUNT = 4\nVISUALS_PER_BEAT = 2\nCTA_TEXT = \"Kanalıma abone olup bana destek\
        \ olmayı unutmayın!\"\nIMAGE_DIR = OUT / 'scene_images'\nSAMPLE_RATE = 22050\nTTS_VOICE = 'tr-TR-EmelNeural'\nTTS_RATE\
        \ = '-5%'\nTTS_PITCH = '+0Hz'\nYOUTUBE_CLIENT_ID = os.environ.get('YOUTUBE_CLIENT_ID', '').strip()\nYOUTUBE_CLIENT_SECRET\
        \ = os.environ.get('YOUTUBE_CLIENT_SECRET', '').strip()\nYOUTUBE_REFRESH_TOKEN = os.environ.get('YOUTUBE_REFRESH_TOKEN',\
        \ '').strip()\nYOUTUBE_PRIVACY = os.environ.get('YOUTUBE_PRIVACY', 'public').strip()\nCLOUDFLARE_ACCOUNT_ID = os.environ.get('CLOUDFLARE_ACCOUNT_ID',\
        \ '').strip()\nCLOUDFLARE_API_TOKEN = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()\nCLOUDFLARE_IMAGE_MODEL =\
        \ '@cf/black-forest-labs/flux-2-klein-4b'\n\n# Onaylanan Lina referansi YAML icine gomuludur; GitHub deposuna ayri\
