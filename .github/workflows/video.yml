              caption_path = (
                  CAPTIONS /
                  f"caption_{number:02d}.png"
              )

              clip_path = (
                  CLIPS /
                  f"clip_{number:02d}.mp4"
              )

              prompt = (
                  STYLE + visual_prompt
              )

              last_error = None

              for model in (
                  PRIMARY_MODEL,
                  BACKUP_MODEL
              ):
                  for attempt in range(2):
                      try:
                          raw = call_image(
                              model,
                              prompt,
                              seed_base
                              + number * 17
                              + attempt
                          )

                          crop_and_save(
                              raw,
                              image_path
                          )

                          last_error = None
                          break

                      except Exception as error:
                          last_error = error

                          print(
                              f"Gorsel {number}, "
                              f"model {model}, "
                              f"deneme {attempt + 1}: "
                              f"{str(error)[:220]}"
                          )

                          time.sleep(3)

                  if last_error is None:
                      break

              if last_error is not None:
                  raise RuntimeError(
                      f"{number}. gorsel "
                      f"uretilemedi: {last_error}"
                  )

              print(
                  f"Gorsel {number}/"
                  f"{SCENE_COUNT} hazir."
              )

              make_caption(
                  caption_text,
                  caption_path
              )

              make_clip(
                  image_path,
                  caption_path,
                  clip_path,
                  number
              )

              clip_paths.append(
                  clip_path
              )

          # ======================================
          # 2. MUZIK
          # ======================================

          print(
              "2/5 Fon muzigi hazirlaniyor..."
          )

          soundtrack = (
              OUT / "soundtrack.wav"
          )

          make_soundtrack(soundtrack)

          # ======================================
          # 3. VIDEO BIRLESTIR
          # ======================================

          print(
              "3/5 Video birlestiriliyor..."
          )

          concat_file = (
              OUT / "concat.txt"
          )

          concat_file.write_text(
              "".join(
                  f"file '{path.resolve()}'\n"
                  for path in clip_paths
              ),
              encoding="utf-8"
          )

          silent_video = (
              OUT / "silent.mp4"
          )

          run_ffmpeg([
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video)
          ])

          final_video = (
              ROOT / "gizemli-dunya-video.mp4"
          )

          run_ffmpeg([
              "-i", str(silent_video),
              "-i", str(soundtrack),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ])

          probe = subprocess.check_output(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration:"
                  "stream=codec_type",
                  "-of", "json",
                  str(final_video)
              ],
              text=True
          )

          info = json.loads(probe)

          duration = float(
              info.get(
                  "format", {}
              ).get("duration", 0)
          )

          if duration < 25:
              raise RuntimeError(
                  "Video 25 saniyeden kisa."
              )

          stream_types = {
              item.get("codec_type")
              for item in info["streams"]
          }

          if not (
              "video" in stream_types
              and "audio" in stream_types
          ):
              raise RuntimeError(
                  "Video veya ses akisi eksik."
              )

          # ======================================
          # 4. YOUTUBE'A YUKLE
          # ======================================

          print(
              "4/5 YouTube yuklemesi baslatiliyor..."
          )

          youtube_id = youtube_upload(
              final_video
          )

          youtube_url = (
              "https://www.youtube.com/watch?v="
              + youtube_id
          )

          print(
              "YouTube video:", youtube_url
          )

          record = {
              "slot": slot,
              "topic_id": topic_id,
              "title": title,
              "youtube_id": youtube_id,
              "url": youtube_url,
              "privacy": YOUTUBE_PRIVACY,
              "uploaded_at": (
                  datetime.now(
                      ZoneInfo("Europe/Istanbul")
                  ).isoformat()
              )
          }

          (OUT / "upload-result.json").write_text(
              json.dumps(
                  record,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ======================================
          # 5. KALICI YAYIN GECMISI
          # ======================================

          print(
              "5/5 Yayin gecmisi kaydediliyor..."
          )

          history.append(record)

          HISTORY_FILE.write_text(
              json.dumps(
                  history,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  str(
                      HISTORY_FILE.relative_to(ROOT)
                  )
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  f"Yayin gecmisi: {topic_id}"
              ],
              check=True
          )

          try:
              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "HEAD:main"
                  ],
                  check=True
              )

          except subprocess.CalledProcessError as exc:
              raise RuntimeError(
                  "Video YouTube'a yuklendi, "
                  "ancak gecmis GitHub'a kaydedilemedi. "
                  "Tekrar yuklemeyi onlemek icin "
                  "output/upload-result.json "
                  "kaydini kontrol edin."
              ) from exc

          print("")
          print("============================")
          print("YOUTUBE YUKLEMESI BASARILI")
          print("============================")
          print("Baslik:", title)
          print("Video:", youtube_url)
          print("Gizlilik:", YOUTUBE_PRIVACY)
          print("Sure:", duration)
          print("Cozunurluk: 1080x1920")
          print("Seslendirme: Yok")
          print("Turkce bilgiler: Var")
          print("Fon muzigi: Var")
          print("Yayin gecmisi: Kaydedildi")

          PY

          python create_video.py

      - name: Videoyu ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizemli-dunya-youtube-${{ github.run_id }}
          path: |
            gizemli-dunya-video.mp4
            output/upload-result.json
            output/video-plani.json
            output/images/
            data/youtube_history.json
          if-no-files-found: warn
          retention-days: 14
