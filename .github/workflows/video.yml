name: Masal Video Uret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Turkish story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import sys
          import time
          import json
          import base64
          import subprocess
          import requests

          GEMINI_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          AZURE_KEY = os.getenv("AZURE_SPEECH_KEY", "").strip()
          AZURE_REGION = os.getenv("AZURE_REGION", "").strip()
          CF_TOKEN = os.getenv("CLOUDFLARE_API_TOKEN", "").strip()
          CF_ACCOUNT = os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()

          OUT = "output"
          os.makedirs(OUT, exist_ok=True)

          session = requests.Session()
          session.headers.update({"User-Agent": "MasalVideoGenerator/1.0"})

          def require_secrets():
              missing = []
              for name, value in [
                  ("GEMINI_API_KEY", GEMINI_KEY),
                  ("AZURE_SPEECH_KEY", AZURE_KEY),
                  ("AZURE_REGION", AZURE_REGION),
                  ("CLOUDFLARE_API_TOKEN", CF_TOKEN),
                  ("CLOUDFLARE_ACCOUNT_ID", CF_ACCOUNT),
              ]:
                  if not value:
                      missing.append(name)
              if missing:
                  raise RuntimeError(
                      "GitHub Secrets eksik: " + ", ".join(missing)
                  )

          def request_with_retry(method, url, **kwargs):
              last_error = None
              for attempt in range(5):
                  try:
                      response = session.request(
                          method, url, timeout=(20, 180), **kwargs
                      )
                      if response.status_code in (429, 500, 502, 503, 504):
                          last_error = RuntimeError(
                              f"HTTP {response.status_code}: "
                              f"{response.text[:500]}"
                          )
                          time.sleep(min(5 * (attempt + 1), 25))
                          continue
                      response.raise_for_status()
                      return response
                  except (requests.RequestException, RuntimeError) as exc:
                      last_error = exc
                      if attempt < 4:
                          time.sleep(min(3 * (attempt + 1), 15))
              raise RuntimeError(f"İstek başarısız: {last_error}")

          def run_cmd(command):
              print("Çalıştırılıyor:", " ".join(command), flush=True)
              subprocess.run(command, check=True)

          def create_story():
              print("1/5: Türkçe masal hazırlanıyor...", flush=True)

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-2.5-flash:generateContent"
              )

              prompt = """
              4-8 yaş çocukları için Türkçe, özgün ve sıcak bir masal yaz.
              600-800 kelime olsun.
              Nazik, güvenli, hayal gücünü geliştiren bir hikâye anlat.
              Korkutucu şiddet, tehlikeli davranış talimatları ve uygunsuz
              içerik kullanma.
              Başlangıç, gelişme ve mutlu bir son olsun.
              Sadece masal metnini döndür; başlık ekleyebilirsin.
              """

              response = request_with_retry(
                  "POST",
                  url,
                  params={"key": GEMINI_KEY},
                  json={
                      "contents": [
                          {"parts": [{"text": prompt}]}
                      ],
                      "generationConfig": {
                          "temperature": 0.8,
                          "maxOutputTokens": 5000
                      }
                  }
              )

              data = response.json()
              try:
                  story = data["candidates"][0]["content"]["parts"][0]["text"]
              except (KeyError, IndexError, TypeError):
                  raise RuntimeError(
                      "Gemini masal metni döndürmedi: "
                      + json.dumps(data, ensure_ascii=False)[:1000]
                  )

              story = story.strip()
              if len(story) < 300:
                  raise RuntimeError("Oluşan masal çok kısa.")

              with open("masal.txt", "w", encoding="utf-8") as f:
                  f.write(story + "\n")

              print(f"Masal hazır: {len(story)} karakter", flush=True)
              return story

          def create_speech(story):
              print("2/5: Türkçe seslendiriliyor...", flush=True)

              endpoint = (
                  f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
                  "cognitiveservices/v1"
              )

              # SSML özel karakterlerini güvenli biçimde kaçır.
              import xml.sax.saxutils as saxutils
              escaped_story = saxutils.escape(story)

              ssml = f"""
              <speak version="1.0"
                xmlns="http://www.w3.org/2001/10/synthesis"
                xml:lang="tr-TR">
                <voice name="tr-TR-EmelNeural">
                  <prosody rate="-5%" pitch="+2%">
                    {escaped_story}
                  </prosody>
                </voice>
              </speak>
              """

              response = request_with_retry(
                  "POST",
                  endpoint,
                  headers={
                      "Ocp-Apim-Subscription-Key": AZURE_KEY,
                      "Content-Type": "application/ssml+xml",
                      "X-Microsoft-OutputFormat":
                          "audio-24khz-48kbitrate-mono-mp3"
                  },
                  data=ssml.encode("utf-8")
              )

              audio = response.content
              if len(audio) < 1000:
                  raise RuntimeError("Azure geçerli ses dosyası döndürmedi.")

              audio_path = os.path.join(OUT, "narration.mp3")
              with open(audio_path, "wb") as f:
                  f.write(audio)

              # Sesin gerçekten çözülebildiğini doğrula.
              run_cmd([
                  "ffprobe", "-v", "error",
                  "-show_entries", "stream=codec_type,duration",
                  "-of", "json", audio_path
              ])

              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "stream=codec_type",
                      "-of", "json", audio_path
                  ],
                  check=True, capture_output=True, text=True
              )
              streams = json.loads(probe.stdout).get("streams", [])
              if not any(s.get("codec_type") == "audio" for s in streams):
                  raise RuntimeError("Ses dosyasında ses akışı bulunamadı.")

              print(f"Ses hazır: {len(audio)} bayt", flush=True)
              return audio_path

          def cloudflare_image(prompt, output_path):
              url = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  f"{CF_ACCOUNT}/ai/run/@cf/lykon/dreamshaper-8-lcm"
              )

              response = request_with_retry(
                  "POST",
                  url,
                  headers={
                      "Authorization": f"Bearer {CF_TOKEN}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "prompt": prompt,
                      "num_steps": 4
                  }
              )

              content_type = response.headers.get("content-type", "").lower()

              if "image/" in content_type:
                  image_bytes = response.content
              else:
                  try:
                      data = response.json()
                  except ValueError:
                      raise RuntimeError(
                          "Cloudflare görsel yanıtı okunamadı: "
                          + response.text[:500]
                      )

                  result = data.get("result") or {}
                  image_data = result.get("image")

                  if not image_data:
                      raise RuntimeError(
                          "Cloudflare görsel üretmedi: "
                          + json.dumps(data, ensure_ascii=False)[:1000]
                      )

                  image_bytes = base64.b64decode(image_data)

              if len(image_bytes) < 1000:
                  raise RuntimeError("Üretilen görsel boş veya çok küçük.")

              with open(output_path, "wb") as f:
                  f.write(image_bytes)

              # FFmpeg'in kullanacağı görselin geçerli olduğunu kontrol et.
              run_cmd([
                  "ffmpeg", "-y", "-v", "error",
                  "-i", output_path,
                  "-frames:v", "1",
                  os.path.join(OUT, "validated.png")
              ])
              os.replace(
                  os.path.join(OUT, "validated.png"),
                  output_path
              )

          def create_images():
              print("3/5: Masal görselleri hazırlanıyor...", flush=True)

              prompts = [
                  "A cute little fox in a magical green forest, "
                  "children's storybook illustration, warm soft colors, "
                  "friendly characters, no text, landscape 16:9",

                  "A small fox meeting a kind rabbit near colorful flowers, "
                  "children's storybook illustration, soft light, "
                  "gentle atmosphere, no text, landscape 16:9",

                  "A sparkling blue stream flowing through a beautiful "
                  "enchanted forest, cute animals, storybook illustration, "
                  "warm colors, no text, landscape 16:9",

                  "A little fox and rabbit helping a tiny bird, "
                  "wholesome children's picture book, magical forest, "
                  "no text, landscape 16:9",

                  "A cozy little cottage among trees under golden sunlight, "
                  "storybook illustration for young children, "
                  "soft colors, no text, landscape 16:9",

                  "Friendly forest animals sharing berries together, "
                  "cute children's storybook art, peaceful and colorful, "
                  "no text, landscape 16:9",

                  "A beautiful starry sky above a peaceful enchanted forest, "
                  "dreamy children's book illustration, no text, "
                  "landscape 16:9",

                  "A happy little fox and friends watching the sunrise, "
                  "warm magical children's storybook illustration, "
                  "no text, landscape 16:9"
              ]

              paths = []
              for index, prompt in enumerate(prompts, start=1):
                  path = os.path.join(OUT, f"image_{index:02d}.png")
                  print(
                      f"Görsel {index}/{len(prompts)} üretiliyor...",
                      flush=True
                  )
                  cloudflare_image(prompt, path)
                  paths.append(path)

              return paths

          def create_visual_clips(image_paths):
              print("4/5: Görsel klipler hazırlanıyor...", flush=True)
              clips = []

              for index, image_path in enumerate(image_paths, start=1):
                  clip_path = os.path.join(OUT, f"clip_{index:02d}.mp4")

                  run_cmd([
                      "ffmpeg", "-y", "-v", "error",
                      "-loop", "1",
                      "-framerate", "24",
                      "-i", image_path,
                      "-t", "7",
                      "-vf",
                      "scale=1280:720:force_original_aspect_ratio=decrease,"
                      "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                      "setsar=1,format=yuv420p",
                      "-r", "24",
                      "-c:v", "libx264",
                      "-preset", "ultrafast",
                      "-pix_fmt", "yuv420p",
                      "-an",
                      clip_path
                  ])
                  clips.append(clip_path)

              concat_file = os.path.join(OUT, "clips.txt")
              with open(concat_file, "w", encoding="utf-8") as f:
                  for path in clips:
                      f.write(
                          "file '" + os.path.abspath(path).replace("'", "'\\''")
                          + "'\n"
                      )

              visuals = os.path.join(OUT, "visuals.mp4")
              run_cmd([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "concat", "-safe", "0",
                  "-i", concat_file,
                  "-c", "copy",
                  visuals
              ])

              return visuals

          def create_final_video(visuals, narration):
              print("5/5: Sesli video birleştiriliyor...", flush=True)
              final_path = "masal-video.mp4"

              # Görselleri ses süresi boyunca döndür; ses akışını koru.
              run_cmd([
                  "ffmpeg", "-y", "-v", "error",
                  "-stream_loop", "-1",
                  "-i", visuals,
                  "-i", narration,
                  "-map", "0:v:0",
                  "-map", "1:a:0",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                  "setsar=1,format=yuv420p",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-crf", "23",
                  "-r", "24",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ar", "48000",
                  "-ac", "2",
                  "-shortest",
                  "-movflags", "+faststart",
                  final_path
              ])

              if not os.path.exists(final_path):
                  raise RuntimeError("MP4 dosyası oluşturulamadı.")

              if os.path.getsize(final_path) < 100000:
                  raise RuntimeError("MP4 dosyası beklenenden küçük.")

              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "stream=codec_type,codec_name",
                      "-of", "json", final_path
                  ],
                  check=True, capture_output=True, text=True
              )
              streams = json.loads(probe.stdout).get("streams", [])
              types = {s.get("codec_type") for s in streams}

              if "video" not in types:
                  raise RuntimeError("Son videoda görüntü akışı yok.")
              if "audio" not in types:
                  raise RuntimeError("Son videoda ses akışı yok.")

              # Dosyanın kod çözülebildiğini kontrol et.
              run_cmd([
                  "ffmpeg", "-v", "error",
                  "-i", final_path,
                  "-f", "null", "-"
              ])

              print(
                  f"Video tamamlandı: {final_path} "
                  f"({os.path.getsize(final_path)} bayt)",
                  flush=True
              )

          def main():
              require_secrets()
              story = create_story()
              narration = create_speech(story)
              images = create_images()
              visuals = create_visual_clips(images)
              create_final_video(visuals, narration)

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print(f"\nHATA: {exc}", file=sys.stderr, flush=True)
                  raise
          PY

          python -u create_video.py

      - name: Upload finished video and story
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
            output/narration.mp3
          if-no-files-found: warn
          retention-days: 7
