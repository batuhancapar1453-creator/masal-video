          def make_caption(text, path):
              canvas = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(canvas)

              font_path = (
                  "/usr/share/fonts/truetype/dejavu/"
                  "DejaVuSans-Bold.ttf"
              )

              font = ImageFont.truetype(
                  font_path, 54
              )

              lines = []
              current = ""

              for word in text.split():
                  candidate = (
                      current + " " + word
                  ).strip()

                  bbox = draw.textbbox(
                      (0, 0),
                      candidate,
                      font=font
                  )

                  if (
                      bbox[2] - bbox[0] <= WIDTH - 140
                      or not current
                  ):
                      current = candidate
                  else:
                      lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              line_height = 80

              start_y = (
                  HEIGHT
                  - 300
                  - len(lines) * line_height
              )

              draw.rounded_rectangle(
                  (
                      45,
                      start_y - 30,
                      WIDTH - 45,
                      start_y
                      + len(lines) * line_height
                      + 40
                  ),
                  radius=30,
                  fill=(0, 0, 0, 185)
              )

              for i, line in enumerate(lines):
                  draw.text(
                      (
                          WIDTH // 2,
                          start_y + i * line_height
                      ),
                      line,
                      font=font,
                      anchor="mt",
                      fill="white",
                      stroke_width=2,
                      stroke_fill="black"
                  )

              canvas.save(path)

