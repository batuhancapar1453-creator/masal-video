name: Gizemli Dunya Kisa Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy

      - name: Gizem videosunu olustur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import io
          import re
          import json
          import time
          import base64
          import wave
          import random
          import subprocess
          from pathlib import Path

          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          # =====================================
          # AYARLAR
          # =====================================

          GEMINI_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          CF_TOKEN = os.getenv("CLOUDFLARE_API_TOKEN", "").strip()
          CF_ACCOUNT = os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()

          GEMINI_MODEL = "gemini-3.8-flash"
          IMAGE_MODEL = "@cf/lykon/dreamshaper-8-lcm"

          WIDTH = 720
          HEIGHT = 1280
          FPS = 25

          SCENE_COUNT = 6
          SCENE_SECONDS = 5
          DURATION = SCENE_COUNT * SCENE_SECONDS

          SAMPLE_RATE = 22050

          ROOT = Path.cwd()
          OUT = ROOT / "output"
          IMAGES = OUT / "images"
          CAPTIONS = OUT / "captions"
          CLIPS = OUT / "clips"

          for folder in [OUT, IMAGES, CAPTIONS, CLIPS]:
              folder.mkdir(parents=True, exist_ok=True)

          if not CF_TOKEN or not CF_ACCOUNT:
              raise RuntimeError(
                  "Cloudflare API bilgileri GitHub Secrets "
                  "bolumunde eksik."
              )

          session = requests.Session()

          # =====================================
          # KONU HAVUZU
          # =====================================
          # Her konu 6 baglantili sahne icerir.
          # Metinlerde kanitlanmamis iddialar
          # kesin gercek olarak sunulmaz.
          # =====================================

          TOPICS = [
              {
                  "title": "Piramitlerin Gizli Boşlukları",
                  "category": "Antik Mısır",
                  "scenes": [
                      [
                          "Piramitlerin içinde hâlâ keşfedilecek şeyler var.",
                          "Great Pyramid of Giza at sunrise, vast golden "
                          "desert, dramatic ancient monument, aerial view"
                      ],
                      [
                          "Büyük Piramit yaklaşık 4.500 yıllık.",
                          "Great Pyramid of Giza, massive limestone blocks, "
                          "ancient Egyptian architecture, cinematic closeup"
                      ],
                      [
                          "Bilim insanları kozmik parçacıklardan yararlandı.",
                          "Scientists studying an Egyptian pyramid using "
                          "modern non-invasive scanning equipment"
                      ],
                      [
                          "2017'de büyük bir iç boşluk tespit edildi.",
                          "Scientific artistic cutaway visualization of "
                          "the Great Pyramid showing an unknown internal void"
                      ],
                      [
                          "Bu boşluğun amacı henüz kesin olarak bilinmiyor.",
                          "Mysterious dark internal space inside ancient "
                          "pyramid, historical architectural visualization"
                      ],
                      [
                          "Piramitler araştırmacıları hâlâ şaşırtıyor.",
                          "Epic sunset over the Great Pyramid of Giza, "
                          "dramatic clouds, golden cinematic atmosphere"
                      ]
                  ]
              },
              {
                  "title": "Europa'nın Buz Altı Okyanusu",
                  "category": "Uzay",
                  "scenes": [
                      [
                          "Jüpiter'in uydusu Europa buzla kaplı.",
                          "Jupiter and its icy moon Europa seen from space, "
                          "realistic scientific space illustration"
                      ],
                      [
                          "Yüzeyinde dev çatlaklar bulunuyor.",
                          "Close view of Europa icy surface, long reddish "
                          "fractures cutting through bright frozen terrain"
                      ],
                      [
                          "Bilim insanları altında okyanus olabileceğini düşünüyor.",
                          "Scientific cutaway visualization of Europa ice "
                          "shell and a deep liquid water ocean below"
                      ],
                      [
                          "Bu okyanus, Dünya'dakilerden farklı olabilir.",
                          "Underwater visualization below Europa ice, "
                          "dark blue alien ocean, suspended ice particles"
                      ],
                      [
                          "Uzay araçları bu gizemi araştırıyor.",
                          "Robotic spacecraft approaching Europa near "
                          "Jupiter, dramatic solar system scene"
                      ],
                      [
                          "Peki Europa'da yaşam olabilir mi?",
                          "Mysterious Europa above Jupiter, distant stars, "
                          "cinematic scientific visualization"
                      ]
                  ]
              },
              {
                  "title": "Nazca Çizgilerinin Gizemi",
                  "category": "Antik uygarlıklar",
                  "scenes": [
                      [
                          "Peru çölünde dev çizimler bulunuyor.",
                          "Aerial view of Nazca desert Peru, enormous "
                          "ancient geoglyphs etched into dry terrain"
                      ],
                      [
                          "Bazıları yalnızca yukarıdan kolayca seçiliyor.",
                          "High aerial view of huge Nazca hummingbird "
                          "geoglyph in the desert"
                      ],
                      [
                          "Bu çizimleri antik insanlar oluşturdu.",
                          "Historical reconstruction of ancient Nazca "
                          "people making lines in the dry Peruvian desert"
                      ],
                      [
                          "Çizimler hayvanları ve geometrik şekilleri gösteriyor.",
                          "Wide aerial montage of authentic style Nazca "
                          "animal geoglyphs and geometric desert lines"
                      ],
                      [
                          "Tam amaçları hâlâ araştırılıyor.",
                          "Archaeologists studying ancient Nazca lines, "
                          "measuring desert geoglyphs"
                      ],
                      [
                          "Gizem uzaylı kanıtı değil, insanlık mirası.",
                          "Beautiful cinematic aerial view over Nazca "
                          "desert at sunset, ancient geoglyphs"
                      ]
                  ]
              },
              {
                  "title": "Okyanusun Güneşsiz Yaşamı",
                  "category": "Dünya'nın gizemleri",
                  "scenes": [
                      [
                          "Okyanus derinlerinde güneş ışığı yok.",
                          "Deep dark ocean abyss, faint blue light "
                          "from above, mysterious underwater landscape"
                      ],
                      [
                          "Ama burada yaşam devam ediyor.",
                          "Deep sea creatures around underwater rocks, "
                          "scientifically inspired marine ecosystem"
                      ],
                      [
                          "Sıcak su bacaları deniz tabanından yükseliyor.",
                          "Hydrothermal black smoker vents on deep ocean "
                          "floor, mineral rich clouds rising"
                      ],
                      [
                          "Bazı mikroplar kimyasal enerjiyi kullanıyor.",
                          "Scientific visualization of microbes and "
                          "chemical energy near deep sea hydrothermal vents"
                      ],
                      [
                          "Bu yaşam için güneş şart değil.",
                          "Deep sea tube worms near hydrothermal vents, "
                          "vibrant scientifically inspired ocean life"
                      ],
                      [
                          "Dünya'nın derinlikleri hâlâ keşfediliyor.",
                          "Submersible exploring mysterious deep sea "
                          "hydrothermal landscape, cinematic blue darkness"
                      ]
                  ]
              },
              {
                  "title": "Paskalya Adası'nın Dev Heykelleri",
                  "category": "Tarih",
                  "scenes": [
                      [
                          "Bu dev taş heykellere Moai deniyor.",
                          "Moai stone statues on Rapa Nui Easter Island, "
                          "cinematic ocean backdrop"
                      ],
                      [
                          "Heykelleri Rapa Nui halkı yaptı.",
                          "Historical reconstruction of Rapa Nui stone "
                          "carvers working on an enormous Moai statue"
                      ],
                      [
                          "Bazıları tonlarca ağırlığında.",
                          "Massive Moai stone statue closeup showing "
                          "gigantic scale and weathered volcanic stone"
                      ],
                      [
                          "Nasıl taşındıkları üzerine araştırmalar sürüyor.",
                          "Historical archaeological reconstruction "
                          "of people transporting a giant Moai statue"
                      ],
                      [
                          "Araştırmacılar farklı yöntemleri test ediyor.",
                          "Archaeologists testing Moai statue transport "
                          "techniques in a Pacific island landscape"
                      ],
                      [
                          "Bu heykeller güçlü bir kültürel miras.",
                          "Majestic line of Moai statues at sunset, "
                          "Rapa Nui island, Pacific Ocean, golden sky"
                      ]
                  ]
              }
          ]

          # =====================================
          # YARDIMCI FONKSIYONLAR
          # =====================================

          def run_cmd(command):
              subprocess.run(command, check=True)

          def choose_topic():
              run_number = int(
                  os.getenv("GITHUB_RUN_NUMBER", "1")
              )

              index = (run_number - 1) % len(TOPICS)
              return TOPICS[index]

          def enrich_prompts_with_gemini(topic):
              """
              Gemini yalnizca gorsel istemlerini zenginlestirir.
              Kota dolarsa hazir istemler kullanilir.
              """
              scenes = [
                  {
                      "caption": caption,
                      "visual_prompt": prompt
                  }
                  for caption, prompt in topic["scenes"]
              ]

              if not GEMINI_KEY:
                  print(
                      "Gemini anahtari yok. "
                      "Hazir sahneler kullaniliyor."
                  )
                  return scenes

              prompt = {
                  "task": (
                      "Improve six English visual prompts for a "
                      "cinematic animated documentary short."
                  ),
                  "title": topic["title"],
                  "rules": [
                      "Keep exactly six scenes.",
                      "Preserve chronological continuity.",
                      "No new factual claims.",
                      "Maintain accurate historical or scientific context.",
                      "Use mysterious cinematic atmosphere.",
                      "Avoid fictional aliens presented as facts.",
                      "No text or logos in generated images.",
                      "Portrait 9:16 composition."
                  ],
                  "scenes": [
                      {
                          "scene": i + 1,
                          "caption": s["caption"],
                          "prompt": s["visual_prompt"]
                      }
                      for i, s in enumerate(scenes)
                  ],
                  "output": (
                      'JSON object with key "scenes", containing '
                      'six objects with "visual_prompt" fields.'
                  )
              }

              url = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{GEMINI_MODEL}:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": json.dumps(
                                      prompt,
                                      ensure_ascii=False
                                  )
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseMimeType": "application/json"
                  }
              }

              try:
                  response = session.post(
                      url,
                      params={"key": GEMINI_KEY},
                      json=payload,
                      timeout=90
                  )

                  if response.status_code == 429:
                      print(
                          "Gemini kotasi kullanilamiyor. "
                          "Hazir istemlerle devam ediliyor."
                      )
                      return scenes

                  if not response.ok:
                      print(
                          "Gemini HTTP hatasi:",
                          response.status_code
                      )
                      return scenes

                  result = response.json()

                  raw = "".join(
                      part.get("text", "")
                      for part in (
                          result["candidates"][0]
                          ["content"]["parts"]
                      )
                  )

                  data = json.loads(raw)
                  generated = data.get("scenes", [])

                  if len(generated) != SCENE_COUNT:
                      return scenes

                  for i, generated_scene in enumerate(
                      generated
                  ):
                      improved = str(
                          generated_scene.get(
                              "visual_prompt", ""
                          )
                      ).strip()

                      if len(improved) > 25:
                          scenes[i]["visual_prompt"] = (
                              improved[:1200]
                          )

                  print("Gemini istemleri zenginlestirdi.")

              except Exception as exc:
                  print(
                      "Gemini yerine hazir istemler "
                      "kullaniliyor:",
                      str(exc)[:200]
                  )

              return scenes

          # =====================================
          # 1. KONUYU SEC
          # =====================================

          print("1/6 Konu seciliyor...")

          topic = choose_topic()

          print("Konu:", topic["title"])
          print("Kategori:", topic["category"])

          scenes = enrich_prompts_with_gemini(topic)

          (OUT / "video-plani.json").write_text(
              json.dumps(
                  {
                      "title": topic["title"],
                      "category": topic["category"],
                      "scenes": scenes
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # =====================================
          # 2. CLOUDFLARE GORSEL URETIMI
          # =====================================

          def generate_image(scene, destination):
              url = (
                  "https://api.cloudflare.com/client/v4/"
                  f"accounts/{CF_ACCOUNT}/ai/run/"
                  f"{IMAGE_MODEL}"
              )

              full_prompt = (
                  "High quality cinematic animated documentary "
                  "concept art, visually stunning, "
                  "scientifically or historically grounded, "
                  "mysterious atmosphere, dramatic lighting, "
                  "rich detailed environment, "
                  "strong foreground and background depth, "
                  "vertical portrait composition, "
                  "no text, no letters, no watermark. "
                  + scene["visual_prompt"]
              )

              last_error = None

              for attempt in range(1, 4):
                  try:
                      response = session.post(
                          url,
                          headers={
                              "Authorization": (
                                  f"Bearer {CF_TOKEN}"
                              )
                          },
                          json={
                              "prompt": full_prompt[:1800],
                              "negative_prompt": (
                                  "text, subtitles, logo, "
                                  "watermark, blurry, distorted"
                              ),
                              "width": 768,
                              "height": 1024,
                              "num_steps": 20
                          },
                          timeout=180
                      )

                      if response.status_code in (401, 403):
                          raise PermissionError(
                              "Cloudflare token yetkisiz."
                          )

                      if not response.ok:
                          raise RuntimeError(
                              f"Cloudflare HTTP "
                              f"{response.status_code}: "
                              f"{response.text[:500]}"
                          )

                      content_type = (
                          response.headers.get(
                              "Content-Type", ""
                          ).lower()
                      )

                      if (
                          "application/json" in content_type
                          or response.content[:1] == b"{"
                      ):
                          data = response.json()

                          if data.get("success") is False:
                              raise RuntimeError(
                                  str(data.get("errors"))
                              )

                          result = data.get("result", {})

                          if isinstance(result, dict):
                              encoded = (
                                  result.get("image")
                                  or result.get("data")
                              )
                          else:
                              encoded = None

                          if isinstance(encoded, list):
                              image_bytes = bytes(encoded)

                          elif isinstance(encoded, str):
                              if encoded.startswith("data:"):
                                  encoded = encoded.split(
                                      ",", 1
                                  )[-1]

                              image_bytes = base64.b64decode(
                                  encoded
                              )
                          else:
                              raise RuntimeError(
                                  "Gorsel verisi bulunamadi."
                              )
                      else:
                          image_bytes = response.content

                      image = Image.open(
                          io.BytesIO(image_bytes)
                      ).convert("RGB")

                      # 9:16 oranina kirp
                      target_ratio = WIDTH / HEIGHT
                      image_ratio = (
                          image.width / image.height
                      )

                      if image_ratio > target_ratio:
                          crop_width = int(
                              image.height * target_ratio
                          )
                          x = (
                              image.width - crop_width
                          ) // 2

                          image = image.crop((
                              x, 0,
                              x + crop_width,
                              image.height
                          ))
                      else:
                          crop_height = int(
                              image.width / target_ratio
                          )
                          y = (
                              image.height - crop_height
                          ) // 2

                          image = image.crop((
                              0, y,
                              image.width,
                              y + crop_height
                          ))

                      image = image.resize(
                          (WIDTH, HEIGHT),
                          Image.Resampling.LANCZOS
                      )

                      image.save(destination)
                      return

                  except PermissionError:
                      raise

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"Gorsel denemesi {attempt}/3:",
                          exc
                      )

                      if attempt < 3:
                          time.sleep(5 * attempt)

              raise RuntimeError(
                  "Cloudflare gorsel olusturamadi: "
                  + str(last_error)
              )

          print("2/6 Gorseller uretiliyor...")

          for index, scene in enumerate(scenes, 1):
              destination = (
                  IMAGES / f"scene_{index:02d}.png"
              )

              print(
                  f"Gorsel {index}/{SCENE_COUNT}"
              )

              generate_image(scene, destination)

              if (
                  not destination.exists()
                  or destination.stat().st_size < 5000
              ):
                  raise RuntimeError(
                      "Olusturulan gorsel gecersiz."
                  )

          # =====================================
          # 3. TURKCE ALTYAZI GORSELLERI
          # =====================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          def make_caption(text, destination):
              overlay = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(overlay)

              font = ImageFont.truetype(
                  FONT_PATH, 36
              )

              words = text.split()
              lines = []
              current = ""

              max_text_width = WIDTH - 100

              for word in words:
                  candidate = (
                      (current + " " + word).strip()
                  )

                  bounds = draw.textbbox(
                      (0, 0),
                      candidate,
                      font=font
                  )

                  text_width = (
                      bounds[2] - bounds[0]
                  )

                  if (
                      text_width <= max_text_width
                      or not current
                  ):
                      current = candidate
                  else:
                      lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              line_height = 54
              total_height = len(lines) * line_height

              base_y = (
                  HEIGHT - 215 - total_height
              )

              # Altta yari saydam koyu alan
              draw.rounded_rectangle(
                  (
                      25,
                      base_y - 25,
                      WIDTH - 25,
                      base_y + total_height + 30
                  ),
                  radius=24,
                  fill=(0, 0, 0, 170)
              )

              for i, line in enumerate(lines):
                  y = base_y + i * line_height

                  draw.text(
                      (WIDTH // 2, y),
                      line,
                      font=font,
                      anchor="mt",
                      fill="white",
                      stroke_width=2,
                      stroke_fill="black"
                  )

              overlay.save(destination)

          print("3/6 Turkce bilgi yazilari hazirlaniyor...")

          for index, scene in enumerate(scenes, 1):
              make_caption(
                  scene["caption"],
                  CAPTIONS / f"caption_{index:02d}.png"
              )

          # =====================================
          # 4. SINEMATIK HAREKETLI KLIPLER
          # =====================================

          def make_clip(image_path, caption_path,
                        output_path, number):

              total_frames = (
                  SCENE_SECONDS * FPS
              )

              # Sahneler farkli kamera hareketleri
              # kullanir: yakinlasma, yatay ve
              # dikey kaydirma.

              if number % 3 == 1:
                  zoom = (
                      "min(1.0+0.0012*on,1.15)"
                  )
                  x = "iw/2-(iw/zoom/2)"
                  y = "ih/2-(ih/zoom/2)"

              elif number % 3 == 2:
                  zoom = "1.12"
                  x = (
                      "max(0,min(iw-iw/zoom,"
                      f"(iw-iw/zoom)*on/{total_frames}))"
                  )
                  y = "ih/2-(ih/zoom/2)"

              else:
                  zoom = "1.12"
                  x = "iw/2-(iw/zoom/2)"
                  y = (
                      "max(0,min(ih-ih/zoom,"
                      f"(ih-ih/zoom)*on/{total_frames}))"
                  )

              video_filter = (
                  "[0:v]"
                  "zoompan="
                  f"z='{zoom}':"
                  f"x='{x}':"
                  f"y='{y}':"
                  f"d={total_frames}:"
                  f"s={WIDTH}x{HEIGHT}:"
                  f"fps={FPS},"
                  "format=yuv420p[bg];"
                  "[bg][1:v]"
                  "overlay=0:0:"
                  "shortest=0:"
                  "repeatlast=1,"
                  "format=yuv420p[v]"
              )

              run_cmd([
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-y",
                  "-i", str(image_path),
                  "-i", str(caption_path),
                  "-filter_complex",
                  video_filter,
                  "-map", "[v]",
                  "-frames:v", str(total_frames),
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",
                  "-pix_fmt", "yuv420p",
                  str(output_path)
              ])

              if (
                  not output_path.exists()
                  or output_path.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      "Hareketli klip olusturulamadi."
                  )

          print("4/6 Hareketli klipler hazirlaniyor...")

          clip_paths = []

          for number in range(1, SCENE_COUNT + 1):
              image_path = (
                  IMAGES / f"scene_{number:02d}.png"
              )

              caption_path = (
                  CAPTIONS / f"caption_{number:02d}.png"
              )

              clip_path = (
                  CLIPS / f"clip_{number:02d}.mp4"
              )

              make_clip(
                  image_path,
                  caption_path,
                  clip_path,
                  number
              )

              clip_paths.append(clip_path)

              print(
                  f"Klip {number}/{SCENE_COUNT} hazir."
              )

          # =====================================
          # 5. GIZEMLI MUZIK VE SES EFEKTLERI
          # =====================================

          def make_music(destination):
              total_samples = (
                  DURATION * SAMPLE_RATE
              )

              t = (
                  np.arange(
                      total_samples,
                      dtype=np.float32
                  ) / SAMPLE_RATE
              )

              # Derin atmosferik sesler
              low_drone = (
                  0.12 * np.sin(
                      2 * np.pi * 55 * t
                  )
              )

              mid_drone = (
                  0.06 * np.sin(
                      2 * np.pi * 82.41 * t
                  )
              )

              slow_pulse = (
                  0.035
                  * np.sin(2 * np.pi * 110 * t)
                  * (
                      0.5
                      + 0.5 * np.sin(
                          2 * np.pi * 0.5 * t
                      )
                  )
              )

              music = (
                  low_drone
                  + mid_drone
                  + slow_pulse
              ).astype(np.float32)

              # Kisa gizemli zil tonlari
              notes = [
                  329.63,
                  392.0,
                  493.88,
                  440.0,
                  392.0,
                  293.66
              ]

              for i, start in enumerate(
                  np.arange(0.5, DURATION, 2.5)
              ):
                  start_i = int(
                      start * SAMPLE_RATE
                  )

                  length = min(
                      int(2.2 * SAMPLE_RATE),
                      total_samples - start_i
                  )

                  local_t = (
                      np.arange(
                          length,
                          dtype=np.float32
                      ) / SAMPLE_RATE
                  )

                  freq = notes[
                      i % len(notes)
                  ]

                  bell = (
                      0.08
                      * np.sin(
                          2 * np.pi * freq * local_t
                      )
                      * np.exp(
                          -1.6 * local_t
                      )
                  )

                  music[
                      start_i:start_i + length
                  ] += bell

              # Sahne gecislerinde hafif whoosh
              rng = np.random.default_rng()

              for second in range(
                  SCENE_SECONDS,
                  DURATION,
                  SCENE_SECONDS
              ):
                  length = int(
                      0.5 * SAMPLE_RATE
                  )

                  start_i = int(
                      (second - 0.25)
                      * SAMPLE_RATE
                  )

                  noise = rng.normal(
                      0, 1, length
                  ).astype(np.float32)

                  envelope = np.sin(
                      np.linspace(
                          0,
                          np.pi,
                          length,
                          dtype=np.float32
                      )
                  )

                  whoosh = (
                      0.035 * noise * envelope
                  )

                  end_i = min(
                      start_i + length,
                      total_samples
                  )

                  music[
                      start_i:end_i
                  ] += whoosh[
                      :end_i - start_i
                  ]

              # Giris/cikis yumusatma
              fade_len = int(
                  1.2 * SAMPLE_RATE
              )

              music[:fade_len] *= (
                  np.linspace(
                      0, 1, fade_len
                  )
              )

              music[-fade_len:] *= (
                  np.linspace(
                      1, 0, fade_len
                  )
              )

              peak = float(
                  np.max(np.abs(music))
              )

              if peak > 0:
                  music *= (
                      0.70 / peak
                  )

              stereo = np.column_stack(
                  (music, music)
              )

              pcm = (
                  np.clip(
                      stereo,
                      -1,
                      1
                  ) * 32767
              ).astype("<i2")

              with wave.open(
                  str(destination),
                  "wb"
              ) as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(
                      SAMPLE_RATE
                  )
                  wav.writeframes(
                      pcm.tobytes()
                  )

          print("5/6 Muzik ve efektler uretiliyor...")

          soundtrack = (
              OUT / "soundtrack.wav"
          )

          make_music(soundtrack)

          # =====================================
          # 6. VIDEO BIRLESTIRME
          # =====================================

          print("6/6 Final video hazirlaniyor...")

          concat_file = (
              OUT / "concat.txt"
          )

          concat_file.write_text(
              "".join(
                  f"file '{path.resolve()}'\n"
                  for path in clip_paths
              ),
              encoding="utf-8"
          )

          silent_video = (
              OUT / "silent.mp4"
          )

          run_cmd([
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "error",
              "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video)
          ])

          final_video = (
              ROOT / "gizemli-dunya-video.mp4"
          )

          run_cmd([
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "error",
              "-y",
              "-i", str(silent_video),
              "-i", str(soundtrack),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ])

          # =====================================
          # DOGRULAMA
          # =====================================

          info = json.loads(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration,size:"
                      "stream=codec_type,width,height",
                      "-of", "json",
                      str(final_video)
                  ],
                  text=True
              )
          )

          streams = info.get(
              "streams", []
          )

          types = {
              stream.get("codec_type")
              for stream in streams
          }

          if "video" not in types:
              raise RuntimeError(
                  "Video akisi yok."
              )

          if "audio" not in types:
              raise RuntimeError(
                  "Ses akisi yok."
              )

          duration = float(
              info["format"]["duration"]
          )

          if duration < 25:
              raise RuntimeError(
                  "Video suresi cok kisa."
              )

          if not final_video.exists():
              raise RuntimeError(
                  "Final video bulunamadi."
              )

          print("")
          print("==============================")
          print("VIDEO OLUSTURULDU")
          print("==============================")
          print("Baslik:", topic["title"])
          print("Kategori:", topic["category"])
          print("Sure:", round(duration, 1), "saniye")
          print("Cozunurluk:", WIDTH, "x", HEIGHT)
          print("Seslendirme: Yok")
          print("Turkce bilgi yazilari: Var")
          print("Gizemli muzik: Var")
          print("Kamera hareketleri: Var")
          print("Dosya:", final_video)

          PY

          python create_video.py

