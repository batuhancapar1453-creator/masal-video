name: Masal Videosu Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy

      - name: Masal videosunu oluştur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          cat > create_video.py <<'PY'
          import os
          import re
          import json
          import time
          import base64
          import random
          import subprocess
          import wave
          from pathlib import Path
          from io import BytesIO

          import requests
          import numpy as np
          from PIL import Image, ImageEnhance, ImageFilter, ImageStat

          # ==========================================
          # AYARLAR
          # ==========================================

          GEMINI_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          CF_TOKEN = os.getenv("CLOUDFLARE_API_TOKEN", "").strip()
          CF_ACCOUNT = os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()

          GEMINI_MODEL = os.getenv(
              "GEMINI_MODEL", "gemini-3.8-flash"
          )

          IMAGE_MODEL = "@cf/lykon/dreamshaper-8-lcm"

          SCENE_COUNT = 8
          SCENE_SECONDS = 7
          FPS = 25
          WIDTH = 1280
          HEIGHT = 720
          SAMPLE_RATE = 44100

          ROOT = Path.cwd()
          OUT = ROOT / "output"
          IMAGES = OUT / "images"
          CLIPS = OUT / "clips"

          OUT.mkdir(exist_ok=True)
          IMAGES.mkdir(exist_ok=True)
          CLIPS.mkdir(exist_ok=True)

          session = requests.Session()
          random.seed()

          if not CF_TOKEN or not CF_ACCOUNT:
              raise RuntimeError(
                  "Cloudflare API bilgileri eksik."
              )

          # ==========================================
          # API HATA YÖNETİMİ
          # ==========================================

          class QuotaExceededError(Exception):
              pass

          def run_cmd(command):
              subprocess.run(command, check=True)

          def api_json_with_retry(
              url, payload, headers=None,
              params=None, timeout=180
          ):
              last_error = None

              for attempt in range(1, 6):
                  try:
                      response = session.post(
                          url,
                          json=payload,
                          headers=headers,
                          params=params,
                          timeout=timeout
                      )

                      if response.status_code == 429:
                          body = response.text.lower()

                          if (
                              "free_tier_requests" in body
                              or "per day limit exceeded" in body
                              or "quota exceeded" in body
                          ):
                              raise QuotaExceededError(
                                  "Gemini kullanım kotası doldu."
                              )

                          raise RuntimeError(
                              "HTTP 429: " + response.text[:500]
                          )

                      if response.status_code in (
                          500, 502, 503, 504
                      ):
                          raise RuntimeError(
                              f"Geçici HTTP {response.status_code}"
                          )

                      if not response.ok:
                          raise ValueError(
                              f"HTTP {response.status_code}: "
                              f"{response.text[:1200]}"
                          )

                      return response.json()

                  except QuotaExceededError:
                      raise

                  except ValueError:
                      raise

                  except (
                      requests.RequestException,
                      RuntimeError
                  ) as exc:
                      last_error = exc

                      print(
                          f"API denemesi {attempt}/5: {exc}"
                      )

                      if attempt < 5:
                          time.sleep(min(attempt * 5, 25))

              raise RuntimeError(
                  f"API başarısız: {last_error}"
              )

          # ==========================================
          # GEMINI
          # ==========================================

          def gemini_generate(prompt):
              if not GEMINI_KEY:
                  raise RuntimeError(
                      "GEMINI_API_KEY tanımlı değil."
                  )

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{GEMINI_MODEL}:generateContent"
              )

              payload = {
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }],
                  "generationConfig": {
                      "responseMimeType": "application/json"
                  }
              }

              result = api_json_with_retry(
                  url,
                  payload,
                  params={"key": GEMINI_KEY},
                  timeout=240
              )

              candidates = result.get("candidates", [])

              if not candidates:
                  raise RuntimeError(
                      "Gemini boş yanıt verdi."
                  )

              parts = candidates[0].get(
                  "content", {}
              ).get("parts", [])

              raw = "".join(
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict)
              ).strip()

              if not raw:
                  raise RuntimeError(
                      "Gemini metin döndürmedi."
                  )

              return json.loads(raw)

          # ==========================================
          # 1. MASAL OLUŞTURMA
          # ==========================================

          def read_backup_story():
              candidates = [
                  ROOT / "masal.txt",
                  ROOT / "backup" / "masal.txt"
              ]

              for path in candidates:
                  if not path.is_file():
                      continue

                  content = path.read_text(
                      encoding="utf-8"
                  ).strip()

                  if len(content) < 1500:
                      continue

                  lines = content.splitlines()
                  title = lines[0].strip()
                  story = "\n".join(lines[1:]).strip()

                  if len(story) >= 1500:
                      print(
                          f"Yedek masal kullanılıyor: {path}"
                      )
                      return title, story

              return None

          def generate_story():
              seed = random.randint(100000, 999999)

              prompt = f"""
              Özgün bir Türkçe çocuk masalı yaz.

              Çalışma numarası: {seed}
              Yaş grubu: 4-8.
              Uzunluk: 650-850 kelime.

              Masal sıcak, eğlenceli, huzurlu
              ve hayal gücü yüksek olsun.

              Belirgin başlangıç, gelişme
              ve mutlu son içersin.

              Şiddet, korku, telifli karakter
              veya marka kullanma.

              Yalnızca JSON döndür:

              {{
                "title": "Masal başlığı",
                "story": "Masal metni"
              }}
              """

              try:
                  data = gemini_generate(prompt)

                  title = str(
                      data.get("title", "")
                  ).strip()

                  story = str(
                      data.get("story", "")
                  ).strip()

                  if len(story) < 1500:
                      raise RuntimeError(
                          "Gemini masalı çok kısa."
                      )

                  return title or "Yeni Bir Masal", story

              except Exception as exc:
                  print(
                      f"Gemini kullanılamadı: {exc}"
                  )

                  backup = read_backup_story()

                  if backup:
                      return backup

                  raise RuntimeError(
                      "Gemini masal oluşturamadı ve "
                      "depoda geçerli bir yedek masal "
                      "bulunamadı. Kota yenilenmesini "
                      "bekleyin veya masal.txt ekleyin."
                  ) from exc

          print("1/6 Masal oluşturuluyor...")

          title, story = generate_story()

          (OUT / "masal.txt").write_text(
              title + "\n\n" + story,
              encoding="utf-8"
          )

          print(f"Masal hazır: {title}")

          # ==========================================
          # 2. YEREL SAHNE PLANI
          # ==========================================

          def generate_scene_plan(title, story):
              sentences = re.split(
                  r'(?<=[.!?])\s+',
                  story.strip()
              )

              sentences = [
                  s.strip()
                  for s in sentences
                  if s.strip()
              ]

              if len(sentences) < SCENE_COUNT:
                  raise RuntimeError(
                      "Masal sekiz sahneye bölünemiyor."
                  )

              scenes = []
              total = len(sentences)

              for i in range(SCENE_COUNT):
                  start = i * total // SCENE_COUNT
                  end = (i + 1) * total // SCENE_COUNT

                  segment = " ".join(
                      sentences[start:end]
                  ).strip()

                  description = (
                      "Beautiful children's picture book "
                      "illustration. "
                      f"Story title: {title}. "
                      f"Story moment: {segment}. "
                      "Whimsical original characters, "
                      "warm magical atmosphere, "
                      "consistent character design, "
                      "detailed colorful artwork, "
                      "soft cinematic lighting, "
                      "landscape composition 16:9. "
                      "No text, no letters, "
                      "no subtitles, no watermark."
                  )

                  scenes.append({
                      "scene": i + 1,
                      "description": description,
                      "motion": (
                          "Slow cinematic camera movement "
                          "with gentle zoom and pan."
                      )
                  })

              return scenes

          print("2/6 Sahne planı hazırlanıyor...")

          scenes = generate_scene_plan(
              title, story
          )

          (OUT / "sahne-plani.json").write_text(
              json.dumps(
                  {
                      "title": title,
                      "scenes": scenes
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Sekiz sahne hazır.")

          # ==========================================
          # 3. CLOUDFLARE GÖRSELLERİ
          # ==========================================

          def generate_image(description, destination):
              url = (
                  "https://api.cloudflare.com/client/v4/"
                  f"accounts/{CF_ACCOUNT}/ai/run/"
                  f"{IMAGE_MODEL}"
              )

              prompt = (
                  "Children's storybook illustration. "
                  "Colorful hand-painted art, "
                  "beautiful soft lighting, "
                  "original friendly characters, "
                  "magical environment, "
                  "landscape 16:9, no text. "
                  + description
              )

              last_error = None

              for attempt in range(1, 5):
                  try:
                      response = session.post(
                          url,
                          headers={
                              "Authorization": (
                                  f"Bearer {CF_TOKEN}"
                              )
                          },
                          json={"prompt": prompt},
                          timeout=240
                      )

                      if not response.ok:
                          raise RuntimeError(
                              f"Cloudflare HTTP "
                              f"{response.status_code}: "
                              f"{response.text[:800]}"
                          )

                      content_type = (
                          response.headers.get(
                              "Content-Type", ""
                          ).lower()
                      )

                      if (
                          "json" in content_type
                          or response.content[:1] == b"{"
                      ):
                          payload = response.json()

                          if payload.get("success") is False:
                              raise RuntimeError(
                                  str(payload.get("errors"))
                              )

                          result = payload.get(
                              "result", {}
                          )

                          encoded = None

                          if isinstance(result, dict):
                              encoded = (
                                  result.get("image")
                                  or result.get("data")
                              )

                          if not encoded:
                              raise RuntimeError(
                                  "Cloudflare görsel döndürmedi."
                              )

                          if isinstance(encoded, list):
                              content = bytes(encoded)
                          else:
                              encoded = str(encoded)

                              if encoded.startswith("data:"):
                                  encoded = encoded.split(
                                      ",", 1
                                  )[-1]

                              content = base64.b64decode(
                                  encoded
                              )
                      else:
                          content = response.content

                      image = Image.open(
                          BytesIO(content)
                      ).convert("RGB")

                      ratio = WIDTH / HEIGHT
                      current = (
                          image.width / image.height
                      )

                      if current > ratio:
                          new_width = int(
                              image.height * ratio
                          )
                          left = (
                              image.width - new_width
                          ) // 2

                          image = image.crop((
                              left, 0,
                              left + new_width,
                              image.height
                          ))
                      else:
                          new_height = int(
                              image.width / ratio
                          )
                          top = (
                              image.height - new_height
                          ) // 2

                          image = image.crop((
                              0, top,
                              image.width,
                              top + new_height
                          ))

                      image = image.resize(
                          (WIDTH, HEIGHT),
                          Image.Resampling.LANCZOS
                      )

                      brightness = (
                          sum(
                              ImageStat.Stat(image).mean
                          ) / 3
                      )

                      if brightness < 12:
                          raise RuntimeError(
                              "Görsel çok karanlık."
                          )

                      image = (
                          ImageEnhance.Color(image)
                          .enhance(1.06)
                      )

                      image = (
                          ImageEnhance.Contrast(image)
                          .enhance(1.04)
                      )

                      image = image.filter(
                          ImageFilter.UnsharpMask(
                              radius=1.2,
                              percent=100,
                              threshold=3
                          )
                      )

                      image.save(
                          destination,
                          format="PNG"
                      )
                      return

                  except Exception as exc:
                      last_error = exc

                      print(
                          f"Görsel denemesi "
                          f"{attempt}/4: {exc}"
                      )

                      if attempt < 4:
                          time.sleep(attempt * 4)

              raise RuntimeError(
                  f"Görsel oluşturulamadı: "
                  f"{last_error}"
              )

          print("3/6 Görseller oluşturuluyor...")

          for scene in scenes:
              number = scene["scene"]

              destination = (
                  IMAGES /
                  f"scene_{number:02d}.png"
              )

              print(
                  f"Görsel {number}/{SCENE_COUNT}"
              )

              generate_image(
                  scene["description"],
                  destination
              )

              if (
                  not destination.exists()
                  or destination.stat().st_size < 5000
              ):
                  raise RuntimeError(
                      f"{number}. görsel geçersiz."
                  )

          # ==========================================
          # 4. HAREKETLİ VİDEO SAHNELERİ
          # ==========================================

          def make_animated_clip(
              image_path, output_path, scene
          ):
              frames = SCENE_SECONDS * FPS
              number = int(scene["scene"])

              if number % 4 == 1:
                  x_expr = "iw/2-(iw/zoom/2)"
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.0+0.0007*on,1.06)"
                  )

              elif number % 4 == 2:
                  x_expr = (
                      "max(0,min(iw-iw/zoom,"
                      f"(iw-iw/zoom)*on/{frames}))"
                  )
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.06,1.0+0.0006*on)"
                  )

              elif number % 4 == 3:
                  x_expr = (
                      "max(0,min(iw-iw/zoom,"
                      f"(iw-iw/zoom)*(1-on/{frames})))"
                  )
                  y_expr = "ih/2-(ih/zoom/2)"
                  zoom_expr = (
                      "min(1.06,1.0+0.0006*on)"
                  )

              else:
                  x_expr = "iw/2-(iw/zoom/2)"
                  y_expr = (
                      "max(0,min(ih-ih/zoom,"
                      f"(ih-ih/zoom)*on/{frames}))"
                  )
                  zoom_expr = (
                      "min(1.0+0.0007*on,1.06)"
                  )

              video_filter = (
                  "zoompan="
                  f"z='{zoom_expr}':"
                  f"x='{x_expr}':"
                  f"y='{y_expr}':"
                  f"d={frames}:"
                  f"s={WIDTH}x{HEIGHT}:"
                  f"fps={FPS},"
                  "setsar=1,format=yuv420p"
              )

              run_cmd([
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-y",
                  "-loop", "1",
                  "-framerate", str(FPS),
                  "-i", str(image_path),
                  "-vf", video_filter,
                  "-frames:v", str(frames),
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-movflags", "+faststart",
                  str(output_path)
              ])

              if not output_path.exists():
                  raise RuntimeError(
                      "Video sahnesi oluşturulamadı."
                  )

          print("4/6 Hareketli sahneler hazırlanıyor...")

          clip_paths = []

          for scene in scenes:
              number = scene["scene"]

              image_path = (
                  IMAGES /
                  f"scene_{number:02d}.png"
              )

              clip_path = (
                  CLIPS /
                  f"clip_{number:02d}.mp4"
              )

              make_animated_clip(
                  image_path,
                  clip_path,
                  scene
              )

              clip_paths.append(clip_path)

              print(
                  f"Sahne {number}/{SCENE_COUNT} hazır."
              )

          # ==========================================
          # 5. FON MÜZİĞİ VE SES EFEKTLERİ
          # ==========================================

          def make_soundtrack(destination):
              duration = (
                  SCENE_COUNT * SCENE_SECONDS
              )

              sample_count = (
                  duration * SAMPLE_RATE
              )

              t = (
                  np.arange(
                      sample_count,
                      dtype=np.float32
                  ) / SAMPLE_RATE
              )

              notes = [
                  261.63, 329.63,
                  392.00, 329.63,
                  293.66, 349.23,
                  440.00, 349.23,
                  261.63, 329.63,
                  392.00, 523.25,
                  440.00, 392.00,
                  329.63, 293.66
              ]

              music = np.zeros(
                  sample_count,
                  dtype=np.float32
              )

              beat = 1.5

              for index, start in enumerate(
                  np.arange(0, duration, beat)
              ):
                  end = min(
                      start + beat,
                      duration
                  )

                  start_i = int(
                      start * SAMPLE_RATE
                  )

                  end_i = int(
                      end * SAMPLE_RATE
                  )

                  length = end_i - start_i

                  if length <= 0:
                      continue

                  local_t = (
                      np.arange(
                          length,
                          dtype=np.float32
                      ) / SAMPLE_RATE
                  )

                  note = notes[
                      index % len(notes)
                  ]

                  envelope = np.minimum(
                      local_t / 0.12, 1.0
                  )

                  envelope *= np.minimum(
                      (
                          end - start - local_t
                      ) / 0.2,
                      1.0
                  )

                  envelope = np.clip(
                      envelope, 0, 1
                  )

                  tone = (
                      np.sin(
                          2 * np.pi
                          * note * local_t
                      )
                      + 0.35 * np.sin(
                          2 * np.pi
                          * note * 2 * local_t
                      )
                  )

                  music[
                      start_i:end_i
                  ] += (
                      0.10 * tone * envelope
                  )

              rng = np.random.default_rng()

              noise = rng.normal(
                  0, 1, sample_count
              ).astype(np.float32)

              ambience = (
                  0.008 * noise
                  + 0.003 * np.sin(
                      2 * np.pi * 110 * t
                  )
                  + 0.002 * np.sin(
                      2 * np.pi * 164.81 * t
                  )
              )

              chimes = np.zeros(
                  sample_count,
                  dtype=np.float32
              )

              for start in np.arange(
                  4.0, duration, 9.0
              ):
                  freq = random.choice([
                      523.25,
                      659.25,
                      783.99,
                      880.0
                  ])

                  start_i = int(
                      start * SAMPLE_RATE
                  )

                  length = min(
                      int(1.8 * SAMPLE_RATE),
                      sample_count - start_i
                  )

                  if length <= 0:
                      continue

                  local_t = (
                      np.arange(
                          length,
                          dtype=np.float32
                      ) / SAMPLE_RATE
                  )

                  decay = np.exp(
                      -2.8 * local_t
                  )

                  chimes[
                      start_i:start_i + length
                  ] += (
                      0.035
                      * np.sin(
                          2 * np.pi
                          * freq * local_t
                      )
                      * decay
                  )

              mix = (
                  music + ambience + chimes
              )

              fade_length = int(
                  2 * SAMPLE_RATE
              )

              mix[:fade_length] *= (
                  np.linspace(
                      0, 1,
                      fade_length,
                      dtype=np.float32
                  )
              )

              mix[-fade_length:] *= (
                  np.linspace(
                      1, 0,
                      fade_length,
                      dtype=np.float32
                  )
              )

              peak = float(
                  np.max(np.abs(mix))
              )

              if peak > 0:
                  mix *= 0.75 / peak

              stereo = np.column_stack(
                  (mix, mix)
              )

              pcm = (
                  np.clip(
                      stereo, -1, 1
                  ) * 32767
              ).astype("<i2")

              with wave.open(
                  str(destination), "wb"
              ) as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(
                      SAMPLE_RATE
                  )
                  wav.writeframes(
                      pcm.tobytes()
                  )

          print("5/6 Müzik hazırlanıyor...")

          soundtrack = (
              OUT / "soundtrack.wav"
          )

          make_soundtrack(soundtrack)

          # ==========================================
          # 6. VİDEOYU BİRLEŞTİR
          # ==========================================

          print("6/6 Video birleştiriliyor...")

          concat_file = (
              OUT / "concat.txt"
          )

          concat_file.write_text(
              "".join(
                  f"file '{path.resolve()}'\n"
                  for path in clip_paths
              ),
              encoding="utf-8"
          )

          silent_video = (
              OUT / "silent-video.mp4"
          )

          run_cmd([
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "error",
              "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video)
          ])

          final_video = (
              ROOT / "animasyon-video.mp4"
          )

          run_cmd([
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "error",
              "-y",
              "-i", str(silent_video),
              "-i", str(soundtrack),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video)
          ])

          probe = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries",
              "format=duration,size:"
              "stream=codec_type,width,height",
              "-of", "json",
              str(final_video)
          ], text=True)

          info = json.loads(probe)

          streams = info.get(
              "streams", []
          )

          stream_types = {
              stream.get("codec_type")
              for stream in streams
          }

          if "video" not in stream_types:
              raise RuntimeError(
                  "Video akışı yok."
              )

          if "audio" not in stream_types:
              raise RuntimeError(
                  "Ses akışı yok."
              )

          duration = float(
              info["format"]["duration"]
          )

          size = int(
              info["format"]["size"]
          )

          if duration < 30:
              raise RuntimeError(
                  "Video beklenenden kısa."
              )

          if size < 500000:
              raise RuntimeError(
                  "Video dosyası çok küçük."
              )

          print("")
          print("================================")
          print("VIDEO BASARIYLA OLUSTURULDU")
          print("================================")
          print(f"Başlık: {title}")
          print(f"Süre: {duration:.1f} saniye")
          print(
              f"Boyut: "
              f"{size / 1024 / 1024:.2f} MB"
          )
          print(f"Dosya: {final_video}")
          print("Seslendirme: Yok")
          print("Fon müziği: Var")
          print("Ses efektleri: Var")

          PY

          python create_video.py

      - name: Videoyu ve dosyaları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
