              'voice': TTS_VOICE, 'voice_style': 'deep male Turkish narration, restrained and natural, slower final line', 'duration_seconds': 'automatic from narration; no fixed 30-second limit', 'image_source': 'Cloudflare Workers AI FLUX.2 Klein 4B native portrait; Wikimedia Commons fallback'
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          FONT_PATH = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          FONT_REGULAR = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          FONT_TITLE = ImageFont.truetype(FONT_PATH, 29)
          FONT_CAPTION = ImageFont.truetype(FONT_PATH, 27)
          FONT_SMALL = ImageFont.truetype(FONT_PATH, 18)


          def run_ffmpeg(args):
              subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', *args], check=True)


          def probe_duration(path):
              return float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', str(path)
              ], text=True).strip())


          async def create_tts(text_value, path, rate=TTS_RATE, pitch=TTS_PITCH):
              last_error = None
              for attempt in range(3):
                  try:
                      communicator = edge_tts.Communicate(
                          text_value, TTS_VOICE, rate=rate, volume='+0%', pitch=pitch
                      )
                      await communicator.save(str(path))
                      if path.exists() and path.stat().st_size > 1000:
                          return
                      raise RuntimeError('TTS bos ses dosyasi olusturdu.')
                  except Exception as exc:
                      last_error = exc
                      print(f'TTS denemesi {attempt+1}/3: {str(exc)[:220]}')
                      if attempt < 2:
                          await asyncio.sleep(3 * (attempt + 1))
              # Internet tabanli ucretsiz TTS erisilemezse, tamamen yerel espeak-ng yedegi.
              fallback_wav = path.with_suffix('.fallback.wav')
              try:
                  subprocess.run(['espeak-ng','-v','tr','-s','145','-p','35','-a','170',
                                  '-w',str(fallback_wav),text_value],check=True)
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(fallback_wav),
                                  '-codec:a','libmp3lame','-q:a','4',str(path)],check=True)
                  if path.exists() and path.stat().st_size > 1000:
                      print('Bilgi: Edge TTS erisilemedi; ucretsiz cevrimdisi Turkce ses kullanildi.')
                      return
              except Exception as fallback_error:
                  raise RuntimeError('Ucretsiz Turkce seslendirme olusturulamadi: '
                                     + str(last_error) + ' | cevrimdisi yedek: ' + str(fallback_error))
              raise RuntimeError('Ucretsiz Turkce seslendirme bos dosya olusturdu: ' + str(last_error))


          def make_voice_tracks():
              print('1/5 Ucretsiz Turkce erkek seslendirme olusturuluyor...')
              raw_files, raw_durations = [], []
              for i, (caption, _) in enumerate(scenes, 1):
                  mp3 = VOICE_DIR / f'voice_{i:02d}.mp3'
                  final_beat = (i == len(scenes))
                  voice_rate = '-12%' if final_beat else TTS_RATE
                  voice_pitch = '-18Hz' if final_beat else TTS_PITCH
                  asyncio.run(create_tts(caption, mp3, rate=voice_rate, pitch=voice_pitch))
                  duration = probe_duration(mp3)
                  if duration <= 0.2:
                      raise RuntimeError(f'{i}. sahnenin seslendirmesi gecersiz.')
                  raw_files.append(mp3)
                  raw_durations.append(duration)
                  print(f'Ses {i}/{SCENE_COUNT}: {duration:.2f} saniye')

              # Sabit 30 saniyeye sikistirma yok: dogal konusma hizi korunur.
              # Her sahne sonuna kisa bir nefes araligi eklenir; goruntu suresi sese gore belirlenir.
              scene_durations = [d + STORY_PAUSE_SECONDS for d in raw_durations]
              padded_files = []
              for i, (mp3, spoken, scene_duration) in enumerate(zip(raw_files, raw_durations, scene_durations), 1):
                  wav = VOICE_DIR / f'voice_padded_{i:02d}.wav'
                  pad = max(0.0, scene_duration - spoken)
                  filters = f'apad=pad_dur={pad:.6f},atrim=duration={scene_duration:.6f}'
                  run_ffmpeg(['-i', str(mp3), '-af', filters, '-ar', '44100', '-ac', '2',
                              '-c:a', 'pcm_s16le', str(wav)])
                  padded_files.append(wav)
              # WAV dosyalarini ffmpeg concat-list dosyasina bagimli kalmadan
              # Python wave moduluyle sirayla birlestir. Bu yontem, GitHub
              # runner'da concat-list dosyasinin kaybolmasi/okunamamasi hatasini
              # ortadan kaldirir.
              voice = OUT / 'narration.wav'
              if len(padded_files) != len(scenes):
                  raise RuntimeError(f'Birlesecek ses parcasi eksik: {len(padded_files)}/{len(scenes)}')
              missing_wavs = [str(p) for p in padded_files if not p.exists() or p.stat().st_size < 1000]
              if missing_wavs:
                  raise RuntimeError('Ara ses dosyasi olusmadi: ' + ', '.join(missing_wavs))
              with wave.open(str(padded_files[0]), 'rb') as first_wav:
                  params = first_wav.getparams()
                  with wave.open(str(voice), 'wb') as merged:
                      merged.setnchannels(params.nchannels)
                      merged.setsampwidth(params.sampwidth)
                      merged.setframerate(params.framerate)
                      merged.setcomptype(params.comptype, params.compname)
                      for wav_path in padded_files:
                          with wave.open(str(wav_path), 'rb') as part:
                              part_params = part.getparams()
                              if (part_params.nchannels != params.nchannels or
                                  part_params.sampwidth != params.sampwidth or
                                  part_params.framerate != params.framerate or
                                  part_params.comptype != params.comptype):
                                  raise RuntimeError(f'Ses parcasi formatlari uyusmuyor: {wav_path.name}')
                              while True:
                                  frames = part.readframes(65536)
                                  if not frames:
                                      break
                                  merged.writeframesraw(frames)
              actual = probe_duration(voice)
              expected = sum(scene_durations)
              if actual <= 0 or abs(actual - expected) > 0.35:
                  raise RuntimeError(f'Seslendirme/sahne zamanlamasi uyusmuyor: {actual:.3f}s / {expected:.3f}s.')
              print(f'Dogal seslendirme suresi: {actual:.2f} saniye (30 saniye siniri yok)')
              return voice, scene_durations


          def wrap_text(draw, text_value, font, max_width):
              words = text_value.split()
              lines = []
              current = ''
              for word in words:
                  test = (current + ' ' + word).strip()
                  if draw.textbbox((0, 0), test, font=font)[2] <= max_width or not current:
                      current = test
                  else:
                      lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines


          def draw_subtitles(draw, text_value, progress, category, scene_no):
              # Kanal adi / ust koyu serit tamamen kaldirildi.
              lines = wrap_text(draw, text_value, FONT_CAPTION, WIDTH-78)
              line_h = 37
              panel_h = len(lines)*line_h + 34
              top = HEIGHT-72-panel_h
              draw.rounded_rectangle((24, top, WIDTH-24, HEIGHT-72), radius=22,
                                     fill=(3, 8, 18, 220), outline=(255, 255, 255, 80), width=2)
              for i, line in enumerate(lines):
                  draw.text((WIDTH//2, top+18+i*line_h), line, font=FONT_CAPTION, anchor='mt',
                            fill=(255, 255, 255, 255), stroke_width=1, stroke_fill=(0, 0, 0, 180))


          def image_dhash(image):
              """Small perceptual fingerprint used to reject repeated-looking scenes."""
              gray = ImageOps.fit(image.convert('L'), (9, 8), method=Image.Resampling.LANCZOS)
              px = np.asarray(gray, dtype=np.int16)
              bits = (px[:, 1:] > px[:, :-1]).flatten()
              value = 0
              for bit in bits:
                  value = (value << 1) | int(bit)
              return value


          def hamming_distance(a, b):
              return (a ^ b).bit_count()


          def scene_shot_description(scene_no):
              shots = [
                  'wide establishing shot that clearly reveals the location and geography',
                  'medium cinematic shot focused on the exact event and its physical evidence',
                  'tight close-up of the important object or unsettling clue, shallow depth of field',
                  'over-the-shoulder or low-angle perspective showing the threat in the environment',
                  'dramatic reveal shot with a new composition and a visually meaningful consequence'
              ]
              return shots[(scene_no - 1) % len(shots)]


          def validate_generated_image(image, scene_no):
              if image.width < 640 or image.height < 1100:
                  raise RuntimeError(f'Gorsel cozunurlugu dusuk: {image.size}')
              rgb = np.asarray(image.convert('RGB'), dtype=np.uint8)
              if float(rgb.std()) < 18.0:
                  raise RuntimeError('Gorsel asiri duz/siyah; ayrinti seviyesi yetersiz.')
              if len(np.unique(rgb.reshape(-1, 3)[::max(1, rgb.shape[0] * rgb.shape[1] // 5000)], axis=0)) < 80:
                  raise RuntimeError('Gorselde yeterli renk/detay cesitliligi yok.')
              current_hash = image_dhash(image)
              for old_path in sorted(IMAGE_DIR.glob('scene_*.jpg')):
                  if old_path.name == f'scene_{scene_no:02d}.jpg':
                      continue
                  try:
                      old = Image.open(old_path).convert('RGB')
                      if hamming_distance(current_hash, image_dhash(old)) < 7:
                          raise RuntimeError(f'{old_path.name} ile birbirine cok benzeyen sahne gorseli reddedildi.')
                  except RuntimeError:
                      raise
                  except Exception:
                      continue
              return current_hash


