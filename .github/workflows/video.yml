name: Masal Videosu Oluştur

on:
workflow_dispatch:
schedule:
- cron: "0 6 * * *"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

```
steps:
  - name: Depoyu indir
    uses: actions/checkout@v4

  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: FFmpeg kur
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg

  - name: Python paketlerini kur
    run: |
      python -m pip install --upgrade pip
      pip install requests pillow

  - name: Masal videosunu üret
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_REGION: ${{ secrets.AZURE_REGION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    run: |
      cat > create_video.py <<'PY'
      import os, json, time, base64, subprocess, re, sys
      from pathlib import Path
      from io import BytesIO
      import requests
      from PIL import Image, ImageStat, ImageEnhance, ImageFilter

      OUT = Path("output")
      IMGDIR = OUT / "images"
      OUT.mkdir(exist_ok=True)
      IMGDIR.mkdir(exist_ok=True)

      def need(name):
          value = os.environ.get(name, "").strip()
          if not value:
              raise RuntimeError(f"GitHub Secrets eksik: {name}")
          return value

      GEMINI = need("GEMINI_API_KEY")
      SPEECH = need("AZURE_SPEECH_KEY")
      REGION = need("AZURE_REGION")
      CF_TOKEN = need("CLOUDFLARE_API_TOKEN")
      CF_ACCOUNT = need("CLOUDFLARE_ACCOUNT_ID")

      session = requests.Session()
      session.headers.update({"User-Agent": "masal-video-builder/1.0"})

      def gemini(prompt, json_mode=False):
          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent"
          )
          body = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.8}
          }
          if json_mode:
              body["generationConfig"]["responseMimeType"] = "application/json"

          for attempt in range(4):
              try:
                  r = session.post(
                      url, params={"key": GEMINI}, json=body, timeout=120
                  )
                  r.raise_for_status()
                  data = r.json()
                  text = data["candidates"][0]["content"]["parts"][0]["text"]
                  if text.strip():
                      return text.strip()
                  raise RuntimeError("Gemini boş yanıt döndürdü.")
              except Exception as e:
                  print(f"Gemini denemesi {attempt + 1}/4: {e}")
                  if attempt == 3:
                      raise
                  time.sleep(4 * (attempt + 1))

      print("1/5: Türkçe çocuk masalı ve sahne tasvirleri hazırlanıyor...")
      story_prompt = """
      Türkçe konuşan 4-8 yaş çocuklar için sıcak, özgün bir uyku masalı yaz.
      Yaklaşık 900-1200 Türkçe kelime kullan. Korkutucu veya şiddet içeren
      hiçbir şey olmasın. Basit, akıcı, huzurlu bir anlatım ve mutlu bir son
      olsun. Baş karakterlerin görünüşleri hikâye boyunca tutarlı kalsın.
      Yanıtı yalnızca şu JSON biçiminde ver:
      {
        "title": "kısa masal başlığı",
        "story": "tam masal metni",
        "scenes": [
          {"description": "bu sahnede görülen olayın açık tasviri"}
        ]
      }
      scenes listesinde tam 12 sahne olsun; sahneler hikâyenin sırasını izlesin.
      Her tasvir tek bir kolay anlaşılır görsel sahneyi anlatsın. Karakterlerin
      renkleri, kıyafetleri ve fiziksel özellikleri tekrar tekrar aynı kalsın.
      JSON dışında açıklama yazma.
      """
      raw = gemini(story_prompt, json_mode=True)
      try:
          data = json.loads(raw)
      except Exception:
          match = re.search(r"\{.*\}", raw, re.S)
          if not match:
              raise RuntimeError("Gemini masal JSON'u oluşturamadı.")
          data = json.loads(match.group(0))

      title = str(data.get("title", "Güzel Bir Masal")).strip()[:100]
      story = str(data.get("story", "")).strip()
      scenes = data.get("scenes", [])
      if len(story) < 500:
          raise RuntimeError("Masal metni çok kısa; güvenli biçimde durduruldu.")
      if len(scenes) < 8:
          raise RuntimeError("Yeterli sahne açıklaması oluşturulmadı.")
      scenes = scenes[:12]
      while len(scenes) < 12:
          scenes.append(scenes[-1])

      (OUT / "masal.txt").write_text(
          title + "\n\n" + story, encoding="utf-8"
      )
      print(f"Masal: {title} | {len(story)} karakter | {len(scenes)} sahne")

      print("2/5: Türkçe seslendiriliyor...")
      escaped = (story.replace("&", "&amp;").replace("<", "&lt;")
                      .replace(">", "&gt;"))
      ssml = f'''<speak version="1.0" xml:lang="tr-TR">
      <voice name="tr-TR-EmelNeural">
      <prosody rate="-8%" pitch="+2%">{escaped}</prosody>
      </voice></speak>'''
      tts_url = f"https://{REGION}.tts.speech.microsoft.com/cognitiveservices/v1"
      tts_headers = {
          "Ocp-Apim-Subscription-Key": SPEECH,
          "Content-Type": "application/ssml+xml",
          "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3"
      }
      r = session.post(tts_url, headers=tts_headers, data=ssml.encode("utf-8"), timeout=180)
      if not r.ok:
          raise RuntimeError(f"Azure seslendirme hatası: HTTP {r.status_code} {r.text[:300]}")
      audio = OUT / "narration.mp3"
      audio.write_bytes(r.content)
      if len(r.content) < 10000:
          raise RuntimeError("Ses dosyası boş veya beklenenden küçük.")
      probe = subprocess.check_output([
          "ffprobe", "-v", "error", "-show_entries", "format=duration",
          "-of", "default=noprint_wrappers=1:nokey=1", str(audio)
      ], text=True).strip()
      audio_duration = float(probe)
      if audio_duration < 20:
          raise RuntimeError(f"Ses süresi anormal derecede kısa: {audio_duration:.1f} sn")
      print(f"Ses hazır: {audio_duration:.1f} saniye")

      def cloudflare_image(prompt, dest):
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}"
              "/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )
          headers = {
              "Authorization": f"Bearer {CF_TOKEN}",
              "Content-Type": "application/json",
              "Accept": "image/png"
          }
          body = {"prompt": prompt}
          r = session.post(url, headers=headers, json=body, timeout=180)
          if not r.ok:
              raise RuntimeError(f"Cloudflare HTTP {r.status_code}: {r.text[:250]}")

          content = r.content
          ctype = r.headers.get("Content-Type", "").lower()
          if "json" in ctype or content[:1] == b"{":
              result = r.json()
              image_value = result.get("result", {})
              if isinstance(image_value, dict):
                  image_value = image_value.get("image") or image_value.get("data")
              if isinstance(image_value, str):
                  content = base64.b64decode(image_value)

          im = Image.open(BytesIO(content)).convert("RGB")
          im.thumbnail((1600, 1600))
          stats = ImageStat.Stat(im)
          brightness = sum(stats.mean) / 3
          extrema = im.getextrema()
          spread = sum((hi - lo) for lo, hi in extrema) / 3
          if brightness < 18 or spread < 18:
              raise RuntimeError(
                  f"Görsel siyah veya ayrıntısız (parlaklık={brightness:.1f}, "
                  f"renk aralığı={spread:.1f})"
              )

          # 16:9 kadraj: kare görselin üst-alt kısmını dengeli kırp.
          w, h = im.size
          target_ratio = 16 / 9
          if w / h > target_ratio:
              nw = int(h * target_ratio)
              left = (w - nw) // 2
              im = im.crop((left, 0, left + nw, h))
          else:
              nh = int(w / target_ratio)
              top = max(0, (h - nh) // 2)
              im = im.crop((0, top, w, top + nh))
          im = ImageEnhance.Contrast(im).enhance(1.12)
          im = ImageEnhance.Color(im).enhance(1.08)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.4, percent=120, threshold=3))
          im.save(dest, "PNG")
          return brightness, spread

      print("3/5: Her sahne için renkli çocuk kitabı görselleri oluşturuluyor...")
      previous_good = None
      for i, scene in enumerate(scenes, start=1):
          description = str(scene.get("description", "")).strip()
          prompt = (
              "High quality, clear and recognizable children's picture book "
              "illustration, polished 3D storybook art, bright soft colors, "
              "cinematic lighting, sharp focus, well-defined objects, detailed "
              "faces, clean composition, landscape illustration. "
              "No text, no letters, no watermark, no blurry objects, no black "
              "image. Keep character designs consistent across all scenes. "
              f"Story title: {title}. Scene {i}: {description}. "
              "Show the main action clearly, with the characters large enough "
              "to recognize. Wholesome, safe for young children."
          )
          dest = IMGDIR / f"scene_{i:02d}.png"
          success = False
          for attempt in range(1, 5):
              try:
                  adjusted = prompt
                  if attempt > 1:
                      adjusted += (
                          " Retry instruction: use a simpler scene with one "
                          "clearly visible main subject, strong lighting, "
                          "distinct colors and clean uncluttered background."
                      )
                  brightness, spread = cloudflare_image(adjusted, dest)
                  previous_good = dest
                  print(
                      f"Sahne {i}/12 hazır (deneme {attempt}; "
                      f"parlaklık {brightness:.1f}, ayrıntı aralığı {spread:.1f})"
                  )
                  success = True
                  break
              except Exception as e:
                  print(f"Sahne {i}, deneme {attempt}/4 başarısız: {e}")
                  time.sleep(3 * attempt)

          if not success:
              if previous_good and previous_good.exists():
                  print(f"UYARI: Sahne {i} için önceki geçerli görsel kullanılacak.")
                  import shutil
                  shutil.copy2(previous_good, dest)
              else:
                  raise RuntimeError(
                      f"İlk sahne görseli oluşturulamadı; bozuk video üretmemek için durduruldu."
                  )

      print("4/5: Görseller hareketlendirilip sesle eşleştiriliyor...")
      # Her sahneye eşit süre ayır; toplam görüntü süresi anlatımla aynı olur.
      scene_duration = audio_duration / len(scenes)
      clips = []
      for i in range(1, len(scenes) + 1):
          img = IMGDIR / f"scene_{i:02d}.png"
          clip = OUT / f"clip_{i:02d}.mp4"
          frames = max(1, round(scene_duration * 25))
          # Yavaş Ken Burns yakınlaştırması, 25 fps, 720p.
          vf = (
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,"
              f"zoompan=z='min(zoom+0.00035,1.08)':d={frames}:"
              "x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
              "s=1280x720:fps=25,"
              "setsar=1,format=yuv420p"
          )
          subprocess.run([
              "ffmpeg", "-y", "-loop", "1", "-i", str(img),
              "-vf", vf, "-frames:v", str(frames),
              "-an", "-c:v", "libx264", "-preset", "ultrafast",
              "-crf", "23", str(clip)
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          clips.append(clip)
          print(f"Sahne videosu {i}/12 hazır.")

      concat_file = OUT / "clips.txt"
      concat_file.write_text(
          "".join(f"file '{p.resolve()}'\n" for p in clips),
          encoding="utf-8"
      )
      visuals = OUT / "visuals.mp4"
      subprocess.run([
          "ffmpeg", "-y", "-f", "concat", "-safe", "0",
          "-i", str(concat_file), "-c", "copy", str(visuals)
      ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)

      final = Path("masal-video.mp4")
      subprocess.run([
          "ffmpeg", "-y", "-i", str(visuals), "-i", str(audio),
          "-map", "0:v:0", "-map", "1:a:0",
          "-c:v", "copy", "-c:a", "aac", "-b:a", "128k",
          "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",
          "-t", f"{audio_duration:.3f}",
          "-movflags", "+faststart", str(final)
      ], check=True)

      print("5/5: Son video kontrol ediliyor...")
      info = json.loads(subprocess.check_output([
          "ffprobe", "-v", "error", "-show_streams", "-show_format",
          "-of", "json", str(final)
      ], text=True))
      streams = info.get("streams", [])
      has_video = any(s.get("codec_type") == "video" for s in streams)
      has_audio = any(s.get("codec_type") == "audio" for s in streams)
      duration = float(info["format"]["duration"])
      if not has_video or not has_audio:
          raise RuntimeError("Son videoda görüntü veya ses akışı eksik.")
      if abs(duration - audio_duration) > 3:
          raise RuntimeError(
              f"Ses ve video süreleri uyuşmuyor: video={duration:.1f}, ses={audio_duration:.1f}"
          )
      if final.stat().st_size < 500_000:
          raise RuntimeError("Son video beklenenden küçük; üretim başarısız olabilir.")

      print(f"BAŞARILI: {final} | {duration:.1f} saniye | {final.stat().st_size / 1024 / 1024:.1f} MB")
      PY
      python create_video.py

  - name: Videoyu ve masal metnini yükle
    uses: actions/upload-artifact@v4
    with:
      name: masal-video
      path: |
        masal-video.mp4
        output/masal.txt
      if-no-files-found: error
      retention-days: 7
