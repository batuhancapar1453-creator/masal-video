name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy

      - name: Generate Turkish cartoon video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIFTYVID_WORKER_URL: https://nifty-vid.batuhancapar1453.workers.dev
          ANIMATION_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import json
          import time
          import math
          import wave
          import random
          import subprocess
          import requests
          import numpy as np
          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          NIFTYVID_WORKER_URL = os.environ.get(
              "NIFTYVID_WORKER_URL",
              "https://nifty-vid.batuhancapar1453.workers.dev"
          ).rstrip("/")

          RUN_NUMBER = os.environ.get("ANIMATION_RUN_NUMBER", "1")
          random.seed(int(RUN_NUMBER))

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          CF_MODEL = "@cf/lykon/dreamshaper-8-lcm"
          CF_URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/{CF_MODEL}"
          )

          SCENE_COUNT = 8
          SCENE_SECONDS = 3.5
          FPS = 25
          WIDTH = 1280
          HEIGHT = 720
          SAMPLE_RATE = 44100
          TOTAL_SECONDS = SCENE_COUNT * SCENE_SECONDS

          session = requests.Session()

          def run(cmd):
              subprocess.run(cmd, check=True)

          def request_with_retry(method, url, **kwargs):
              last_error = None

              for attempt in range(5):
                  try:
                      response = session.request(
                          method, url, timeout=180, **kwargs
                      )

                      if response.status_code not in (
                          429, 500, 502, 503, 504
                      ):
                          response.raise_for_status()
                          return response

                      last_error = (
                          f"HTTP {response.status_code}: "
                          f"{response.text[:500]}"
                      )

                  except requests.RequestException as exc:
                      last_error = str(exc)

                  if attempt < 4:
                      wait_time = 5 * (attempt + 1)
                      print(
                          f"İstek başarısız: {last_error}. "
                          f"{wait_time} saniye sonra tekrar denenecek."
                      )
                      time.sleep(wait_time)

              raise RuntimeError(
                  f"İstek 5 denemede başarısız oldu: {last_error}"
              )

          def gemini_text(prompt, temperature=0.7, max_tokens=5000,
                          json_mode=False):
              generation_config = {
                  "temperature": temperature,
                  "maxOutputTokens": max_tokens
              }

              if json_mode:
                  generation_config["responseMimeType"] = "application/json"

              response = request_with_retry(
                  "POST",
                  GEMINI_URL,
                  json={
                      "contents": [
                          {"parts": [{"text": prompt}]}
                      ],
                      "generationConfig": generation_config
                  }
              )

              data = response.json()

              try:
                  return data["candidates"][0]["content"]["parts"][0]["text"]
              except (KeyError, IndexError, TypeError):
                  raise RuntimeError(
                      "Gemini yanıtı okunamadı: "
                      + json.dumps(data, ensure_ascii=False)[:2000]
                  )

          def parse_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = text.split("\n", 1)[1]
                  text = text.rsplit("```", 1)[0].strip()

              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  start = text.find("{")
                  end = text.rfind("}")

                  if start >= 0 and end > start:
                      return json.loads(text[start:end + 1])

                  raise

          def extract_niftyvid_url(value):
              base_url = (
                  "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space"
              )

              if isinstance(value, str):
                  if value.startswith(("http://", "https://")):
                      return value

                  if value.startswith("/"):
                      return base_url + "/gradio_api/file=" + value

                  return base_url + "/gradio_api/file=" + value

              if isinstance(value, list):
                  for item in value:
                      found = extract_niftyvid_url(item)
                      if found:
                          return found
                  return None

              if isinstance(value, dict):
                  for key in ("url", "video_url", "download_url"):
                      item = value.get(key)
                      if isinstance(item, str) and item:
                          if item.startswith(("http://", "https://")):
                              return item
                          return base_url + "/gradio_api/file=" + item

                  for key in ("path", "name"):
                      item = value.get(key)
                      if isinstance(item, str) and item:
                          if item.startswith(("http://", "https://")):
                              return item
                          return base_url + "/gradio_api/file=" + item

                  for key in ("video", "file", "data", "output", "result"):
                      if key in value:
                          found = extract_niftyvid_url(value[key])
                          if found:
                              return found

              return None

          def generate_animated_clip(image_path, output_path,
                                     motion_prompt, scene_number):
              params = {
                  "prompt": motion_prompt,
                  "duration_seconds": SCENE_SECONDS,
                  "steps": 6
              }

              print(
                  f"Sahne {scene_number}: gerçek animasyon üretiliyor..."
              )

              response = session.post(
                  f"{NIFTYVID_WORKER_URL}/generate",
                  files={
                      "image": (
                          os.path.basename(image_path),
                          open(image_path, "rb"),
                          "image/png"
                      )
                  },
                  data={
                      "params": json.dumps(params, ensure_ascii=False)
                  },
                  headers={"Accept": "text/event-stream"},
                  stream=True,
                  timeout=(30, 600)
              )

              try:
                  if not response.ok:
                      raise RuntimeError(
                          f"NiftyVid HTTP {response.status_code}: "
                          f"{response.text[:1000]}"
                      )

                  event_name = "message"
                  data_lines = []
                  video_url = None

                  for raw_line in response.iter_lines(
                      decode_unicode=True
                  ):
                      if raw_line is None:
                          continue

                      line = raw_line.strip()

                      if line.startswith("event:"):
                          event_name = line[6:].strip()
                          continue

                      if line.startswith("data:"):
                          data_lines.append(line[5:].strip())
                          continue

                      if line:
                          continue

                      if data_lines:
                          event_data = "\n".join(data_lines)

                          try:
                              payload = json.loads(event_data)
                          except json.JSONDecodeError:
                              payload = event_data

                          if event_name == "error":
                              raise RuntimeError(
                                  "NiftyVid üretim hatası: "
                                  + str(payload)[:1000]
                              )

                          if event_name == "complete":
                              video_url = extract_niftyvid_url(payload)

                              if not video_url:
                                  raise RuntimeError(
                                      "NiftyVid tamamlandı ancak "
                                      "video bağlantısı bulunamadı: "
                                      + str(payload)[:1000]
                                  )
                              break

                      event_name = "message"
                      data_lines = []

                  if not video_url:
                      raise RuntimeError(
                          "NiftyVid akışı tamamlanmadan kapandı veya "
                          "video bağlantısı dönmedi."
                      )

              finally:
                  response.close()

              temp_path = output_path + ".download.mp4"

              with session.get(
                  video_url, stream=True, timeout=(30, 180)
              ) as video_response:
                  video_response.raise_for_status()

                  with open(temp_path, "wb") as video_file:
                      for chunk in video_response.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              video_file.write(chunk)

              if not os.path.exists(temp_path) or (
                  os.path.getsize(temp_path) < 20000
              ):
                  raise RuntimeError(
                      f"Sahne {scene_number} video dosyası boş veya küçük."
                  )

              run([
                  "ffmpeg", "-y",
                  "-i", temp_path,
                  "-t", str(SCENE_SECONDS),
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,setsar=1,fps=25,format=yuv420p",
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-movflags", "+faststart",
                  output_path
              ])

              os.remove(temp_path)

              if os.path.getsize(output_path) < 20000:
                  raise RuntimeError(
                      f"Sahne {scene_number} klibi geçersiz."
                  )

          print("1/5 Yeni Türkçe hikâye oluşturuluyor...")

          story_prompt = """
          4-8 yaş arası çocuklar için Türkçe, özgün, sıcak ve eğlenceli
          bir çocuk hikâyesi yaz. Yaklaşık 600-800 kelime olsun.
          Başlangıcı, gelişmesi ve mutlu bir sonu olsun.
          Dostluk, iyilik, cesaret veya paylaşma gibi olumlu bir mesaj içersin.
          Korkutucu, şiddet içeren veya uygunsuz içerik kullanma.
          Ana karakterleri, amaçlarını ve karşılaştıkları sorunu anlat.
          Olaylar mantıklı bir sırayla ilerlesin.
          Her bölüm görselleştirilebilecek somut bir olay içersin.
          Önceki çalıştırmalardan farklı bir konu ve olay örgüsü seç.
          Bu çalıştırma numarası: """ + RUN_NUMBER + """
          Yalnızca hikâyeyi ve ilk satırda başlığını döndür.
          """

          story = gemini_text(
              story_prompt, temperature=0.9, max_tokens=5000
          ).strip()

          if len(story) < 500:
              raise RuntimeError(
                  f"Hikâye çok kısa oluşturuldu: {len(story)} karakter."
              )

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print(f"Hikâye hazır: {len(story)} karakter.")

          print("Masal için karakter ve sahne planı hazırlanıyor...")

          scene_plan_prompt = f"""
          Aşağıdaki Türkçe çocuk hikâyesini analiz et ve tam 8 sahnelik
          bir animasyon filmi planı oluştur.

          Hikâyedeki olayları sırayla anlat; hikâyede olmayan olay ekleme.
          Bütün sahnelerde karakterlerin görünüşü aynı kalmalı.
          Ana karakterin renkleri, kıyafetleri, boyutu ve ayırt edici
          özellikleri her sahnede tutarlı olsun.

          Görsel stil: yüksek kaliteli, sevimli 3D aile animasyon filmi,
          canlı renkler, sinematik ışık, güzel materyaller, temiz kompozisyon.
          Fotogerçekçi değil, açıkça stilize edilmiş çizgi film görünümü.
          Yatay 16:9 kadraj. Karakterlerin başı ve ayakları kadrajda kalsın.
          Görsellerde yazı, altyazı, logo veya filigran olmasın.

          Yalnızca geçerli JSON döndür.

          Şema:
          {{
            "style": "Sabit görsel stil tarifi",
            "character_bible": "Ana karakterlerin sabit görünüş tarifleri",
            "scenes": [
              {{
                "scene": 1,
                "story_beat": "Hikâyedeki olay",
                "visual_prompt": "İngilizce ayrıntılı görsel talimatı",
                "motion_prompt": "İngilizce hareket talimatı",
                "sound_cues": ["Bu sahneye uygun kısa ses efektleri"]
              }}
            ]
          }}

          Tam 8 sahne üret. Her sahne bir öncekinin devamı olsun.
          motion_prompt yalnızca o sahnedeki karakterleri ve nesneleri
          hareket ettirsin; karakter görünüşünü değiştirmesin, yeni karakter
          eklemesin, başka bir sahneye kesme yapmasın.
          sound_cues yalnızca konuşma içermeyen çevresel sesler ve efektler
          tarif etsin. Örneğin kuş cıvıltısı, hafif rüzgâr, su sesi, yaprak
          hışırtısı, yumuşak sihir parıltısı veya hafif adım sesleri.
          Her sahnede 1-3 kısa ses tarifi olsun.

          HİKÂYE:
          {story}
          """

          plan_text = gemini_text(
              scene_plan_prompt,
              temperature=0.35,
              max_tokens=6000,
              json_mode=True
          )

          try:
              scene_plan = parse_json(plan_text)
              scenes = scene_plan["scenes"]
              character_bible = scene_plan.get("character_bible", "")
              style_bible = scene_plan.get("style", "")

              if len(scenes) != SCENE_COUNT:
                  raise ValueError(
                      f"{SCENE_COUNT} sahne yerine {len(scenes)} sahne geldi."
                  )

              for i, scene in enumerate(scenes, start=1):
                  scene["visual_prompt"] = str(
                      scene.get("visual_prompt", "")
                  ).strip()
                  scene["motion_prompt"] = str(
                      scene.get("motion_prompt", "")
                  ).strip()
                  scene["sound_cues"] = scene.get("sound_cues", [])

                  if not scene["visual_prompt"] or not scene["motion_prompt"]:
                      raise ValueError(f"{i}. sahnenin istemi eksik.")

                  if not isinstance(scene["sound_cues"], list):
                      scene["sound_cues"] = [str(scene["sound_cues"])]

          except Exception as exc:
              raise RuntimeError(
                  "Sahne planı oluşturulamadı: "
                  + str(exc) + " | Yanıt: " + plan_text[:1500]
              ) from exc

          with open("sahne-plani.json", "w", encoding="utf-8") as f:
              json.dump(
                  scene_plan, f, ensure_ascii=False, indent=2
              )

          for i, scene in enumerate(scenes, start=1):
              scene["visual_prompt"] = (
                  f"{style_bible}. "
                  f"Consistent character design: {character_bible}. "
                  f"Story moment {i}: {scene['visual_prompt']}. "
                  "High quality stylized 3D animated family cartoon film, "
                  "cinematic lighting, vivid but harmonious colors, "
                  "clear subject, polished materials, 16:9 wide frame. "
                  "Keep all characters fully inside the frame. "
                  "No photorealism, no text, no captions, no logo, no watermark."
              )

              scene["motion_prompt"] = (
                  f"{scene['motion_prompt']}. "
                  "Preserve the exact character design, face, colors, clothes, "
                  "proportions, background and objects from the source image. "
                  "Animate natural body movement, blinking, gentle head turns, "
                  "small gestures, and subtle environmental motion. "
                  "One continuous shot, stable camera, no morphing, "
                  "no new characters, no scene transition, no text."
              )

          print("8 sahne hazır; karakter görünüşleri sabitlendi.")

          print("2/5 Sahne görselleri oluşturuluyor...")

          os.makedirs("images", exist_ok=True)
          image_paths = []

          for i, scene in enumerate(scenes, start=1):
              print(f"Görsel {i}/{SCENE_COUNT} hazırlanıyor...")

              payload = {
                  "prompt": scene["visual_prompt"],
                  "negative_prompt": (
                      "photorealistic, live action, blurry, low quality, "
                      "low resolution, distorted face, deformed anatomy, "
                      "extra limbs, inconsistent character, different clothes, "
                      "cropped head, cropped feet, text, letters, logo, watermark, "
                      "black bars, blank margins, border"
                  ),
                  "width": 1024,
                  "height": 576,
                  "num_steps": 20,
                  "guidance": 1.5
              }

              image_response = request_with_retry(
                  "POST",
                  CF_URL,
                  headers={
                      "Authorization": f"Bearer {CF_TOKEN}",
                      "Content-Type": "application/json"
                  },
                  json=payload
              )

              try:
                  image = Image.open(
                      BytesIO(image_response.content)
                  ).convert("RGB")
              except Exception as exc:
                  raise RuntimeError(
                      f"Cloudflare {i}. sahne için geçerli görsel döndürmedi: "
                      f"{image_response.text[:1000]}"
                  ) from exc

              if image.width < 512 or image.height < 288:
                  raise RuntimeError(
                      f"{i}. sahnenin çözünürlüğü çok düşük: "
                      f"{image.width}x{image.height}"
                  )

              target_ratio = 16 / 9
              ratio = image.width / image.height

              if ratio > target_ratio:
                  new_width = int(image.height * target_ratio)
                  left = (image.width - new_width) // 2
                  image = image.crop(
                      (left, 0, left + new_width, image.height)
                  )
              elif ratio < target_ratio:
                  new_height = int(image.width / target_ratio)
                  top = (image.height - new_height) // 2
                  image = image.crop(
                      (0, top, image.width, top + new_height)
                  )

              image = image.resize(
                  (WIDTH, HEIGHT), Image.Resampling.LANCZOS
              )

              image_path = f"images/scene_{i:02d}.png"
              image.save(image_path, "PNG")
              image_paths.append(image_path)

              print(f"Görsel {i} kaydedildi: {WIDTH}x{HEIGHT}")

          print("3/5 Gerçek hareketli sahneler üretiliyor...")

          clip_paths = []

          for i, image_path in enumerate(image_paths, start=1):
              clip_path = f"clip_{i:02d}.mp4"

              # Animasyon servisi başarısız olursa sabit görsele düşme.
              generate_animated_clip(
                  image_path,
                  clip_path,
                  scenes[i - 1]["motion_prompt"],
                  i
              )

              clip_paths.append(clip_path)
              print(f"Animasyon {i}/{SCENE_COUNT} hazır.")

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for clip in clip_paths:
                  f.write(f"file '{os.path.abspath(clip)}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat_list.txt",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-pix_fmt", "yuv420p",
              "-an",
              "visuals.mp4"
          ])

          print("Animasyon sahneleri birleştirildi.")

          print("4/5 Konuşmasız müzik ve ses efektleri hazırlanıyor...")

          # Sesler sentetik olarak üretilir; konuşma/seslendirme yoktur.
          # Hafif melodik arka plan ve sahne ipuçlarına göre efektler eklenir.
          total_samples = int(TOTAL_SECONDS * SAMPLE_RATE)
          audio = np.zeros((total_samples, 2), dtype=np.float64)

          def add_tone(start, duration, frequency, volume=0.04,
                       pan=0.0, decay=True):
              start_sample = max(0, int(start * SAMPLE_RATE))
              end_sample = min(
                  total_samples,
                  int((start + duration) * SAMPLE_RATE)
              )

              if end_sample <= start_sample:
                  return

              count = end_sample - start_sample
              t = np.arange(count, dtype=np.float64) / SAMPLE_RATE
              signal = np.sin(2 * np.pi * frequency * t)

              # Hafif ikinci harmonik daha yumuşak, çizgi film benzeri tını verir.
              signal += 0.22 * np.sin(2 * np.pi * frequency * 2 * t)

              if decay:
                  envelope = np.exp(-4.0 * t / max(duration, 0.01))
                  attack = np.minimum(1.0, t / 0.035)
                  signal *= envelope * attack

              signal *= volume
              left_gain = math.sqrt((1.0 - max(-1.0, min(1.0, pan))) / 2)
              right_gain = math.sqrt((1.0 + max(-1.0, min(1.0, pan))) / 2)

              audio[start_sample:end_sample, 0] += signal * left_gain
              audio[start_sample:end_sample, 1] += signal * right_gain

          def add_noise(start, duration, volume=0.008, pan=0.0):
              start_sample = max(0, int(start * SAMPLE_RATE))
              end_sample = min(
                  total_samples,
                  int((start + duration) * SAMPLE_RATE)
              )

              if end_sample <= start_sample:
                  return

              count = end_sample - start_sample
              rng = np.random.default_rng(
                  int((start + 1) * 1000) + int(volume * 100000)
              )
              noise = rng.normal(0, 1, count)

              # Gürültüyü yumuşatıp sert tıslama hissini azalt.
              kernel = np.ones(12, dtype=np.float64) / 12
              noise = np.convolve(noise, kernel, mode="same")

              t = np.arange(count) / SAMPLE_RATE
              envelope = np.minimum(1.0, t / 0.15)
              envelope *= np.minimum(
                  1.0, (duration - t) / 0.25
              ).clip(0, 1)

              signal = noise * volume * envelope
              left_gain = math.sqrt((1.0 - max(-1.0, min(1.0, pan))) / 2)
              right_gain = math.sqrt((1.0 + max(-1.0, min(1.0, pan))) / 2)

              audio[start_sample:end_sample, 0] += signal * left_gain
              audio[start_sample:end_sample, 1] += signal * right_gain

          # Yumuşak, telifsiz olarak bu kod içinde sentezlenen arka plan melodisi.
          # Melodi sabit bir ses seviyesinde kalır ve anlatım içermez.
          melody = [
              261.63, 329.63, 392.00, 329.63,
              293.66, 349.23, 440.00, 349.23,
              261.63, 329.63, 392.00, 523.25,
              440.00, 392.00, 329.63, 293.66
          ]

          beat = 0.875
          for index, start in enumerate(np.arange(0, TOTAL_SECONDS, beat)):
              freq = melody[index % len(melody)]
              add_tone(
                  float(start),
                  min(0.68, TOTAL_SECONDS - float(start)),
                  freq,
                  volume=0.027,
                  pan=0.12 if index % 2 == 0 else -0.12
              )

              # Bas notası, müziğe çok hafif bir gövde katar.
              if index % 2 == 0:
                  add_tone(
                      float(start),
                      min(0.7, TOTAL_SECONDS - float(start)),
                      freq / 2,
                      volume=0.012,
                      pan=0.0
                  )

          # Hafif, sürekli açık hava ambiyansı.
          add_noise(0, TOTAL_SECONDS, volume=0.0025, pan=0.0)

          def cue_effect(cue, start):
              cue = str(cue).lower()
              end = min(TOTAL_SECONDS, start + SCENE_SECONDS)

              if any(word in cue for word in (
                  "water", "river", "stream", "rain", "su", "nehir",
                  "dere", "yağmur", "yagmur", "dalga", "splash"
              )):
                  add_noise(start, end - start, 0.016, pan=0.15)
                  for offset in (0.4, 1.2, 2.1):
                      add_tone(
                          start + offset, 0.22,
                          random.choice([620, 740, 880]),
                          volume=0.014,
                          pan=random.uniform(-0.5, 0.5)
                      )

              elif any(word in cue for word in (
                  "wind", "breeze", "leaves", "rüzgar", "rüzgâr",
                  "yaprak", "esinti"
              )):
                  add_noise(start, end - start, 0.013, pan=-0.2)

              elif any(word in cue for word in (
                  "bird", "birds", "chirp", "kuş", "kus", "cıvıltı",
                  "civilt", "singing bird"
              )):
                  for offset in (0.25, 0.75, 1.45, 2.2):
                      add_tone(
                          start + offset, 0.16,
                          random.choice([1500, 1750, 1900, 2100]),
                          volume=0.013,
                          pan=random.uniform(-0.65, 0.65)
                      )

              elif any(word in cue for word in (
                  "magic", "sparkle", "magical", "sihir", "büyü",
                  "buyu", "parıltı", "parilti"
              )):
                  for offset, freq in (
                      (0.15, 880), (0.35, 1174.66), (0.62, 1568)
                  ):
                      add_tone(
                          start + offset, 0.48, freq,
                          volume=0.023,
                          pan=random.uniform(-0.7, 0.7)
                      )

              elif any(word in cue for word in (
                  "footstep", "steps", "walking", "adım", "adim",
                  "yürüyüş", "yuruyus", "running", "koş"
              )):
                  for offset in (0.3, 0.8, 1.3, 1.8, 2.3, 2.8):
                      add_tone(
                          start + offset, 0.09,
                          random.choice([95, 120, 145]),
                          volume=0.025,
                          pan=random.choice([-0.25, 0.25])
                      )

              elif any(word in cue for word in (
                  "bell", "chime", "ding", "zil", "çan", "can"
              )):
                  add_tone(
                      start + 0.25, 0.75, 880,
                      volume=0.035, pan=0.1
                  )
                  add_tone(
                      start + 0.45, 0.65, 1320,
                      volume=0.022, pan=-0.1
                  )

              elif any(word in cue for word in (
                  "bounce", "boing", "jump", "zıpla", "zipla",
                  "sekme", "zıplama", "zip lama"
              )):
                  add_tone(
                      start + 0.2, 0.32, 240,
                      volume=0.03, pan=0.0
                  )
                  add_tone(
                      start + 0.35, 0.27, 480,
                      volume=0.02, pan=0.0
                  )

              elif any(word in cue for word in (
                  "fire", "crackle", "ateş", "ates", "kamp"
              )):
                  add_noise(start, end - start, 0.012, pan=0.0)

              else:
                  # Diğer sahne ipuçlarına hafif bir ortam vurgusu.
                  add_tone(
                      start + 0.45, 0.3,
                      random.choice([523.25, 587.33, 659.25]),
                      volume=0.009,
                      pan=random.uniform(-0.3, 0.3)
                  )

          for scene_index, scene in enumerate(scenes):
              scene_start = scene_index * SCENE_SECONDS
              cues = scene.get("sound_cues", [])

              for cue in cues[:3]:
                  cue_effect(str(cue), scene_start)

          # Başlangıç ve bitişte yumuşak ses geçişi.
          fade_samples = int(0.6 * SAMPLE_RATE)
          if fade_samples > 0:
              audio[:fade_samples] *= np.linspace(
                  0, 1, fade_samples
              )[:, None]
              audio[-fade_samples:] *= np.linspace(
                  1, 0, fade_samples
              )[:, None]

          peak = float(np.max(np.abs(audio)))
          if peak > 0:
              audio = audio * min(0.88 / peak, 1.0)

          pcm = (audio * 32767).astype(np.int16)

          with wave.open("soundtrack.wav", "wb") as wav_file:
              wav_file.setnchannels(2)
              wav_file.setsampwidth(2)
              wav_file.setframerate(SAMPLE_RATE)
              wav_file.writeframes(pcm.tobytes())

          print(
              f"Konuşmasız ses bandı hazır: {TOTAL_SECONDS:.1f} saniye."
          )

          print("5/5 Ses ve görüntü birleştiriliyor...")

          run([
              "ffmpeg", "-y",
              "-i", "visuals.mp4",
              "-i", "soundtrack.wav",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-t", str(TOTAL_SECONDS),
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,fps=25,format=yuv420p",
              "-af", "loudnorm=I=-18:TP=-1.5:LRA=11",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-c:a", "aac",
              "-b:a", "192k",
              "-ar", "48000",
              "-ac", "2",
              "-shortest",
              "-movflags", "+faststart",
              "animasyon-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries",
              "stream=codec_type,width,height,duration",
              "-show_entries", "format=duration",
              "-of", "json",
              "animasyon-video.mp4"
          ], text=True)

          info = json.loads(probe)
          streams = info.get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" not in stream_types:
              raise RuntimeError("Videoda ses akışı bulunamadı.")

          video_stream = next(
              s for s in streams if s.get("codec_type") == "video"
          )

          if (
              video_stream.get("width") != WIDTH
              or video_stream.get("height") != HEIGHT
          ):
              raise RuntimeError(
                  "Video çözünürlüğü 1280x720 değil."
              )

          duration = float(info["format"]["duration"])

          if abs(duration - TOTAL_SECONDS) > 2:
              raise RuntimeError(
                  f"Video süresi beklenenden farklı: {duration:.2f} saniye."
              )

          size = os.path.getsize("animasyon-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "animasyon-video.mp4",
              "-f", "null", "-"
          ])

          print("Video başarıyla oluşturuldu ve doğrulandı.")
          print(f"Süre: {duration:.1f} saniye")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Görüntü: 1280x720, 8 hareketli sahne.")
          print("Ses: Konuşma yok; müzik ve sahne efektleri var.")
          PY

          python create_video.py

      - name: Upload video and story
        uses: actions/upload-artifact@v4
        with:
          name: animasyon-video
          path: |
            animasyon-video.mp4
            masal.txt
            sahne-plani.json
          if-no-files-found: error
          retention-days: 7
