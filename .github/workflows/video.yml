              draw.ellipse((x-48*scale,y-70*scale,x+48*scale,y+25*scale), fill=(202,103,145,255), outline=(70,34,75,255), width=4)
              draw.ellipse((x-22*scale,y-35*scale,x-8*scale,y-21*scale), fill='white')
              draw.ellipse((x+8*scale,y-35*scale,x+22*scale,y-21*scale), fill='white')
