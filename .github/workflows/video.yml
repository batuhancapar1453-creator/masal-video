name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import sys
          import time
          import base64
          import subprocess
          import html
          import requests

          def require(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  sys.exit(f"Missing GitHub secret: {name}")
              return value

          GEMINI_KEY = require("GEMINI_API_KEY")
          AZURE_KEY = require("AZURE_SPEECH_KEY")
          CF_TOKEN = require("CLOUDFLARE_API_TOKEN")
          CF_ACCOUNT = require("CLOUDFLARE_ACCOUNT_ID")
          AZURE_REGION = os.environ.get("AZURE_REGION", "westeurope").strip()

          def run(command):
              result = subprocess.run(
                  command, text=True, capture_output=True
              )
              if result.returncode:
                  print(result.stderr[-3000:])
                  raise RuntimeError("Command failed")
              return result

          print("1/5 Generating Turkish story...")

          prompt = """
          Write an original Turkish bedtime story for children aged 4-7.
          The main characters are a kind little rabbit and a friendly star.
          Use simple Turkish, gentle humor, and a happy ending.
          Include a lesson about kindness and helping others.
          Around 450-600 words. No violence or frightening scenes.
          Return only the story text with a short title.
          """

          response = requests.post(
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent",
              
            params={"key": GEMINI_KEY},
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 1800
                  }
              },
              timeout=120
          )

          if not response.ok:
              print("Gemini error:", response.status_code, response.text[:1500])
              response.raise_for_status()

          story = response.json()["candidates"][0]["content"]["parts"][0]["text"].strip()

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print("2/5 Generating Turkish narration...")

          ssml = (
              '<speak version="1.0" xml:lang="tr-TR">'
              '<voice name="tr-TR-EmelNeural">'
              + html.escape(story)
              + '</voice></speak>'
          )

          tts_url = (
              f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          audio = requests.post(
              tts_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat":
                      "audio-24khz-48kbitrate-mono-mp3"
              },
              data=ssml.encode("utf-8"),
              timeout=180
          )

          if not audio.ok:
              print("Azure TTS error:", audio.status_code, audio.text[:1500])
              audio.raise_for_status()

          with open("narration.mp3", "wb") as f:
              f.write(audio.content)

          print("3/5 Generating illustrations...")

          image_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )

          prompts = [
              "Cute brown rabbit in a colorful magical flower meadow, children's storybook illustration, no text",
              "Tiny friendly glowing golden star in a twilight sky, children's picture book illustration, no text",
              "Rabbit looking up at a smiling little star in an enchanted forest, colorful storybook art, no text",
              "Cute rabbit walking along a path with glowing flowers, children's illustration, no text",
              "Friendly little star lighting a forest path, gentle magical children's book art, no text",
              "Rabbit and star helping a little bird find its nest, warm storybook illustration, no text",
              "Happy rabbit, star and forest animals celebrating together, children's picture book art, no text",
              "Cute rabbit sleeping peacefully under a starry sky, cozy bedtime story illustration, no text"
          ]

          headers = {
              "Authorization": f"Bearer {CF_TOKEN}",
              "Content-Type": "application/json"
          }

          def make_image(prompt, filename):
              r = requests.post(
                  image_url,
                  headers=headers,
                  json={
                      "prompt": prompt,
                      "width": 1024,
                      "height": 576,
                      "num_steps": 8
                  },
                  timeout=180
              )

              if not r.ok:
                  print("Cloudflare error:", r.status_code, r.text[:1500])
                  r.raise_for_status()

              content_type = r.headers.get("content-type", "").lower()

              if content_type.startswith("image/") or r.content.startswith(b"\x89PNG"):
                  image_bytes = r.content
              else:
                  try:
                      data = r.json()
                  except Exception:
                      print("Unexpected Cloudflare response:", content_type)
                      print(r.text[:1000])
                      raise RuntimeError("Could not read image response")

                  image_data = data.get("result", {}).get("image")

                  if not image_data:
                      print("Image missing from Cloudflare response")
                      print(str(data)[:1500])
                      raise RuntimeError("No image returned")

                  if image_data.startswith("data:image"):
                      image_data = image_data.split(",", 1)[1]

                  image_bytes = base64.b64decode(image_data)

              if not image_bytes:
                  raise RuntimeError("Empty image received")

              with open(filename, "wb") as f:
                  f.write(image_bytes)

          for i, prompt_text in enumerate(prompts, 1):
              print(f"Generating image {i}/8...")
              make_image(prompt_text, f"scene_{i:02d}.png")
              time.sleep(1)

          print("4/5 Creating video clips...")

          for i in range(1, 9):
              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", f"scene_{i:02d}.png",
                  "-t", "7",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,format=yuv420p",
                  "-r", "24",
                  "-an",
                  f"clip_{i:02d}.mp4"
              ])

          with open("clips.txt", "w", encoding="utf-8") as f:
              for i in range(1, 9):
                  f.write(f"file 'clip_{i:02d}.mp4'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat", "-safe", "0",
              "-i", "clips.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          print("5/5 Combining video and narration...")

          run([
              "ffmpeg", "-y",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "128k",
              "-shortest",
              "-movflags", "+faststart",
              "masal-video.mp4"
          ])

          print("SUCCESS: masal-video.mp4 created")
          PY

          python create_video.py

      - name: Upload video and story
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
          if-no-files-found: error
          retention-days: 7
