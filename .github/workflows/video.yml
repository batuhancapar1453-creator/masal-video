          def draw_ghost(draw, x, y, phase, scale=1.0, alpha=190):
              # Translucent animated apparition: floating body, waving arms and trailing hem.
              bob = 11 * math.sin(phase * 1.8) * scale
              sway = 17 * math.sin(phase * 1.2) * scale
              x = x + sway
              y = y + bob
              fill = (205, 225, 240, int(alpha))
              edge = (125, 160, 190, min(230, int(alpha + 35)))
              r = 31 * scale
              draw.ellipse((x-r, y-r, x+r, y+r), fill=fill, outline=edge, width=max(1, int(3*scale)))
              draw.rounded_rectangle((x-r, y-3*scale, x+r, y+75*scale), radius=int(20*scale), fill=fill, outline=edge, width=max(1, int(3*scale)))
              # Wavy lower edge moves from frame to frame.
              points=[(x-r, y+60*scale)]
              for j in range(9):
                  px=x-r+j*(2*r/8)
                  py=y+72*scale+math.sin(phase*2+j*0.8)*8*scale
                  points.append((px,py))
              points.extend([(x+r,y+55*scale),(x+r,y+8*scale)])
              draw.polygon(points, fill=fill)
              arm=math.sin(phase*2.1)*20*scale
              draw.line((x-r+5*scale,y+18*scale,x-r-30*scale,y+40*scale+arm),fill=edge,width=max(3,int(11*scale)))
              draw.line((x+r-5*scale,y+18*scale,x+r+30*scale,y+40*scale-arm),fill=edge,width=max(3,int(11*scale)))
              draw.ellipse((x-12*scale,y-4*scale,x-5*scale,y+5*scale),fill=(20,35,55,int(alpha)))
              draw.ellipse((x+5*scale,y-4*scale,x+12*scale,y+5*scale),fill=(20,35,55,int(alpha)))
              draw.arc((x-10*scale,y+7*scale,x+10*scale,y+22*scale),10,170,fill=(50,65,85,int(alpha)),width=max(1,int(2*scale)))


          def draw_worker(draw, x, ground, phase, scale=1.0, color=(105,69,43,255), carrying=True):
              # Stylized but fully formed animated ancient worker: tunic, face, arms and legs.
              bob = math.sin(phase*2) * 3.5 * scale
              head_y = ground - 132*scale + bob
              r = 17*scale
              skin=(183,125,83,255); outline=(61,42,31,255)
              draw.ellipse((x-r,head_y-r,x+r,head_y+r), fill=skin, outline=outline, width=max(1,int(2.5*scale)))
              # Hair and linen head wrap.
              draw.pieslice((x-r-2*scale,head_y-r-3*scale,x+r+2*scale,head_y+5*scale),180,355,fill=(49,35,29,255))
              draw.arc((x-r,head_y-r-5*scale,x+r,head_y+12*scale),185,355,fill=(238,220,180,255),width=max(2,int(5*scale)))
              draw.ellipse((x-7*scale,head_y-2*scale,x-3*scale,head_y+2*scale),fill=(30,25,22,255))
              draw.ellipse((x+4*scale,head_y-2*scale,x+8*scale,head_y+2*scale),fill=(30,25,22,255))
              draw.line((x,head_y+4*scale,x+2*scale,head_y+9*scale),fill=(105,64,46,255),width=max(1,int(2*scale)))
              torso_top=head_y+19*scale
              hip=ground-49*scale+bob
              # Linen tunic with shoulder shape and waist sash.
              draw.rounded_rectangle((x-20*scale,torso_top,x+20*scale,hip),radius=int(8*scale),fill=(226,207,162,255),outline=outline,width=max(1,int(2*scale)))
              draw.polygon([(x-18*scale,torso_top+8*scale),(x-30*scale,torso_top+22*scale),(x-20*scale,torso_top+48*scale),(x-12*scale,torso_top+40*scale)],fill=(226,207,162,255),outline=outline)
              draw.polygon([(x+18*scale,torso_top+8*scale),(x+30*scale,torso_top+22*scale),(x+20*scale,torso_top+48*scale),(x+12*scale,torso_top+40*scale)],fill=(226,207,162,255),outline=outline)
              draw.line((x-18*scale,ground-68*scale,x+18*scale,ground-68*scale),fill=(133,79,45,255),width=max(2,int(5*scale)))
              swing=math.sin(phase*2.2)*19*scale
              # Arms swing while walking; hands are drawn as rounded fists.
              left_hand=(x-34*scale,torso_top+46*scale+swing)
              right_hand=(x+34*scale,torso_top+45*scale-swing)
              draw.line((x-17*scale,torso_top+13*scale,*left_hand),fill=skin,width=max(4,int(10*scale)))
              draw.line((x+17*scale,torso_top+13*scale,*right_hand),fill=skin,width=max(4,int(10*scale)))
              for hx,hy in (left_hand,right_hand):
                  draw.ellipse((hx-6*scale,hy-6*scale,hx+6*scale,hy+6*scale),fill=skin,outline=outline,width=1)
              # Alternating stride gives a visible walk cycle.
              stride=math.sin(phase*2.2)*15*scale
              draw.line((x-9*scale,hip,x-15*scale+stride,ground-3*scale),fill=skin,width=max(4,int(10*scale)))
              draw.line((x+9*scale,hip,x+15*scale-stride,ground-3*scale),fill=skin,width=max(4,int(10*scale)))
              draw.line((x-15*scale+stride,ground-3*scale,x-3*scale+stride,ground),fill=(75,48,32,255),width=max(3,int(9*scale)))
              draw.line((x+15*scale-stride,ground-3*scale,x+27*scale-stride,ground),fill=(75,48,32,255),width=max(3,int(9*scale)))
              if carrying:
                  # A stone block is held at shoulder height and bobs with the worker.
                  bx=x+27*scale; by=torso_top+3*scale+bob
                  draw.rounded_rectangle((bx,by,bx+35*scale,by+29*scale),radius=3,fill=(166,128,88,255),outline=(72,55,42,255),width=max(1,int(2*scale)))
                  draw.line((bx+7*scale,by+8*scale,bx+27*scale,by+8*scale),fill=(218,181,132,180),width=2)


          def draw_astronaut(draw, x, y, phase, scale=1.0):
              bob=math.sin(phase*1.8)*15*scale
              y += bob
              draw.ellipse((x-25*scale,y-45*scale,x+25*scale,y+5*scale), fill=(225,232,238,255), outline=(35,48,75,255), width=4)
