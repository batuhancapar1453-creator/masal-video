              for i in range(8):
                  side=-1 if i%2==0 else 1
                  base_x=x+side*(25+i//2*5)*scale
                  end_x=base_x+side*(25+15*math.sin(phase+i))*scale
                  end_y=y+35*scale+(i//2)*13*scale+20*math.sin(phase*1.5+i)*scale
                  draw.line((base_x,y+5*scale,end_x,end_y), fill=(178,83,128,255), width=max(3,int(9*scale)))


          def wrap_text(draw, text_value, font, max_width):
              words=text_value.split(); lines=[]; current=''
              for word in words:
                  test=(current+' '+word).strip()
                  if draw.textbbox((0,0),test,font=font)[2] <= max_width or not current:
                      current=test
                  else:
                      lines.append(current); current=word
              if current: lines.append(current)
              return lines


