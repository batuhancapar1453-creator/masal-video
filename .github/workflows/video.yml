                  'museum': ['old museum corridor interior', 'museum hall dark'],
                  'library': ['old library shelves dark', 'historic library interior'],
                  'book': ['antique book closeup', 'old book library'],
                  'radio': ['vintage radio closeup', 'old radio dark room'],
                  'cassette': ['audio cassette tape closeup', 'vintage cassette recorder'],
                  'camera': ['vintage camera closeup', 'old photograph camera'],
                  'photo': ['old photograph album closeup', 'vintage photo album'],
                  'footprints': ['footprints wet ground night', 'footprints snow forest'],
