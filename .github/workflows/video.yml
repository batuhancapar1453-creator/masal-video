GİZEMLİ DÜNYA PROJESİ – TAM DEVAM TALİMATI

Gizemli Dünya YouTube kanalımızın projesine kaldığımız yerden devam ediyoruz. Önceki konuşmalarda aldığımız bütün kararları koru. Aşağıdaki maddeler projenin kesin gereksinimleridir.

1. YOUTUBE KANALI

Kanal adı: Gizemli Dünya

İçerik:

- Gizemli olaylar
- Paranormal hikâyeler
- Açıklanamayan vakalar
- Tarihin bilinmeyen gerçekleri
- Esrarengiz yerler ve olaylar

Videolar sürükleyici, merak uyandırıcı ve izleyicinin sonuna kadar izlemek isteyeceği şekilde hazırlanacak.

Gerçek olaylar ile efsaneler, iddialar ve teoriler birbirinden ayrılacak.

2. ANA KARAKTERİMİZ: LİNA

Lina, kanalın bütün videolarında yer alacak ana kadın karakterimizdir.

Görünümü:

- Genç yetişkin kadın.
- Oval, hafif çilli yüz.
- Ela-kahverengi gözler.
- Uzun, dalgalı, koyu kestane saçlar.
- Kahverengi uzun deri kaşif ceketi.
- Krem rengi bluz.
- Bordo atkı.
- Antik bronz pusula kolyesi.
- Sinematik ve kaliteli 3D animasyon görünümü.

Karakter tarzı:

- Sempatik ama gizemli.
- Doğal, samimi ve etkileyici anlatım.
- İzleyiciyle iletişim kuran bir karakter.
- Hikâyeleri kendi başından anlatıyormuş gibi birinci şahıs anlatımı.
- Olayın gerçekleştiği mekânda bulunan ana karakter.

Karakter tutarlılığı

Lina'nın yüzü, gözleri, saçları, kıyafetleri, aksesuarları ve vücut oranları bütün videolarda aynı kalmalı.

Her sahnede farklı bir kadın oluşmamalı. Yalnızca ortam, ışık, kamera açısı, duruş ve hikâyeye uygun mimikler değişebilir.

3. EN ÖNEMLİ YENİ DEĞİŞİKLİK: LİNA ARTIK HAREKET EDEN VE KONUŞAN BİR KARAKTER OLACAK

Önceki video üretim sistemi başarılı şekilde çalıştı ancak Lina yalnızca sabit görsellerden oluşuyordu.

Bu sistemi değiştirmek istiyoruz.

Yeni sistemde:

1. Lina'nın ağzı konuşma sesiyle senkronize hareket etmeli.
2. Konuşurken dudak hareketleri doğal görünmeli.
3. Göz kırpma ve göz hareketleri bulunmalı.
4. Başını doğal şekilde hareket ettirmeli.
5. Yüz ifadeleri ve mimikleri hikâyeye göre değişmeli.
6. Vücut ve el hareketleri doğal olmalı.
7. Kamera hareketleri sinematik olmalı.
8. Lina yalnızca fotoğraf gibi durmamalı; canlı bir 3D karakter hissi vermeli.
9. Animasyon boyunca karakterin yüzü ve kimliği korunmalı.
10. Animasyon, ses kaydıyla uyumlu şekilde oluşturulmalı.

İstediğimiz sonuç: Fotoğraf üzerine ses eklenmiş bir video değil, gerçekten canlıymış gibi görünen, konuşan ve hikâye anlatan Lina.

4. SES SİSTEMİ

Önceki sistemde "tr-TR-EmelNeural" kadın sesi kullanılıyordu.

Yeni hedef:

- Daha gerçekçi Türkçe kadın sesi.
- Doğal vurgu ve tonlama.
- Mekanik olmayan anlatım.
- Hikâyenin atmosferine uygun duygu.
- Noktalama işaretlerine uygun duraklamalar.
- Ağız hareketleriyle sesin senkronize olması.

Mevcut ses sistemi korunarak daha kaliteli bir alternatif değerlendirilmeli.

