      - name: YouTube OAuth baglantisini onceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values = {k: os.getenv(k, '').strip() for k in (
              'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN'
          )}
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('Eksik GitHub Secrets: ' + ', '.join(missing))
          r = requests.post('https://oauth2.googleapis.com/token', data={
              'grant_type': 'refresh_token',
              'client_id': values['YOUTUBE_CLIENT_ID'],
              'client_secret': values['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': values['YOUTUBE_REFRESH_TOKEN'],
          }, timeout=30)
          payload = r.json()
          if not r.ok or not payload.get('access_token'):
              raise SystemExit('YouTube OAuth hatasi: ' + str(payload.get('error')) +
                               ' (' + str(payload.get('error_description', ''))[:180] + ')')
          print('YouTube OAuth testi basarili.')
          PY

      - name: Siradaki Tuhaf Kasaba bolumunu uret ve YouTube a yukle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tuhaf-kasaba/run_episode.py

      - name: Video ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuhaf-kasaba-run-${{ github.run_id }}
          path: |
            output/
            work_tuhaf_kasaba/out/
            work_tuhaf_kasaba/stills/preview_sheet.jpg
            work_tuhaf_kasaba/work/words.json
            data/tuhaf_kasaba_history.json
          if-no-files-found: ignore
          retention-days: 14
