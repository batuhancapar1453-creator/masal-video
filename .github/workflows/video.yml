          slot = (f'{now:%Y-%m-%d}-' + ('sabah' if now.hour < 15 else 'aksam')
                  if RUN_EVENT == 'schedule' else f'manuel-{RUN_ID}')
          history = json.loads(HISTORY_FILE.read_text(encoding='utf-8')) if HISTORY_FILE.exists() else []
          if not isinstance(history, list):
              raise RuntimeError('data/youtube_history.json bir JSON listesi olmali.')
          if any(item.get('slot') == slot for item in history):
              print(f'Bu zaman diliminde zaten yukleme kaydedildi: {slot}. Tekrar edilmiyor.')
              raise SystemExit(0)
          used_ids = {item.get('topic_id') for item in history}
          available = [item for item in TOPICS if item[0] not in used_ids]
          if not available:
              raise RuntimeError('Tum hazir konular kullanildi. Tekrar yapmamak icin durduruldu; TOPICS havuzuna yeni konular ekleyin.')
          topic_id, title, category, hero, facts = available[0]
          print(f'Konu: {title} | Kayitli video: {len(history)} | Kalan konu: {len(available)}')
          scenes = [
              (f'{title}: bilmeniz gerekenler!', hero + ', wide establishing shot'),
              *facts,
              ('Daha fazla ilginç bilgi için takip et!', hero + ', breathtaking cinematic closing shot')
          ]
          assert len(scenes) == SCENE_COUNT
          (OUT / 'video-plani.json').write_text(json.dumps({'topic_id': topic_id, 'title': title, 'scenes': scenes}, ensure_ascii=False, indent=2), encoding='utf-8')

          session = requests.Session()
          PRIMARY_MODEL = '@cf/black-forest-labs/flux-2-klein-4b'
          BACKUP_MODEL = '@cf/lykon/dreamshaper-8-lcm'

          class DailyQuotaExhausted(Exception):
              pass

          # FLUX.2 klein 4B: gercekci belgesel fotograflarina benzer goruntuler.
          # Modelin dogrudan dikey oran uretmesini sagliyoruz (kirpma minimum).
          style = (
              'Photorealistic premium documentary still frame, highly detailed realistic photograph, '
              'credible natural materials, true-to-life textures, authentic historical or astronomical subject, '
              'physically believable illumination, balanced exposure, fine detail, natural contrast, '
              'professional editorial color grading, clear strong foreground subject, '
              'portrait 9:16 framing, generous safe margins on every side, subject within central 70 percent, '
              'no captions, no letters, no diagrams, no logos, no watermarks. '
          )

          def image_from_response(response):
              ctype = response.headers.get('content-type', '').lower()
              if 'json' not in ctype and response.content[:1] != b'{':
                  return response.content
              payload = response.json()
              if payload.get('success') is False:
                  raise RuntimeError(str(payload.get('errors', payload))[:500])
              data = payload.get('result', payload)
              encoded = (data.get('image') or data.get('data')) if isinstance(data, dict) else None
              if isinstance(encoded, list):
                  return bytes(encoded)
              if isinstance(encoded, str):
                  return base64.b64decode(encoded.split(',')[-1])
              raise RuntimeError('Gorsel baytlari alinamadi.')

          def call_image(model, prompt, seed):
              url = f'https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}/ai/run/{model}'
              headers = {'Authorization': f'Bearer {CF_TOKEN}'}
              if model == PRIMARY_MODEL:
                  # Klein 4B, JSON degil multipart/form-data ister.
                  # Content-Type headerini requests otomatik olusturur.
                  response = session.post(url, headers=headers, files={
                      'prompt': (None, prompt[:2000]),
                      'width': (None, '768'),
                      'height': (None, '1344'),
                      'guidance': (None, '4.0'),
                      'seed': (None, str(seed)),
                  }, timeout=180)
              else:
                  response = session.post(url, headers=headers, json={
                      'prompt': prompt[:1800],
                      'width': 768,
                      'height': 1344,
                      'num_steps': 14,
                      'guidance': 7.5,
                      'seed': seed,
                      'negative_prompt': (
                          'blurry, soft focus, warped shapes, floating artifacts, painting, '
                          'cartoon, oversaturated, incorrect architecture, text, watermark'
                      ),
                  }, timeout=180)
              if response.status_code == 429:
                  body = response.text.lower()
                  if ('daily free allocation' in body or '10,000 neurons' in body
                          or '4006' in body or '3036' in body):
                      raise DailyQuotaExhausted('Cloudflare gunluk neuron kotasi doldu.')
              if not response.ok:
                  raise RuntimeError(f'{model} HTTP {response.status_code}: {response.text[:350]}')
              return image_from_response(response)

          def crop_and_save(raw, path):
              img = Image.open(io.BytesIO(raw)).convert('RGB')
              if min(img.size) < 256:
                  raise RuntimeError('Gorsel cok kucuk.')
              desired = WIDTH / HEIGHT
              if img.width / img.height > desired:
                  new_w = round(img.height * desired)
                  left = (img.width - new_w) // 2
                  img = img.crop((left, 0, left + new_w, img.height))
              else:
                  new_h = round(img.width / desired)
                  top = (img.height - new_h) // 2
                  img = img.crop((0, top, img.width, top + new_h))
              img = img.resize((WIDTH, HEIGHT), Image.Resampling.LANCZOS)
              img = ImageEnhance.Contrast(img).enhance(1.06)
              img = ImageEnhance.Color(img).enhance(1.03)
              img = img.filter(ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=3))
              img.save(path, format='PNG', optimize=True)

          def make_caption(text_value, path):
              overlay = Image.new('RGBA', (WIDTH, HEIGHT), (0, 0, 0, 0))
              draw = ImageDraw.Draw(overlay)
              font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
              font = ImageFont.truetype(font_path, 54)
              words, lines, current = text_value.split(), [], ''
              for word in words:
                  test = f'{current} {word}'.strip()
                  bbox = draw.textbbox((0, 0), test, font=font)
                  if bbox[2] - bbox[0] <= WIDTH - 140 or not current:
                      current = test
                  else:
                      lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              line_height = 80
              start = HEIGHT - 300 - len(lines) * line_height
              draw.rounded_rectangle((45, start - 30, WIDTH - 45, start + len(lines) * line_height + 40),
                                     radius=30, fill=(0, 0, 0, 185))
              for i, line in enumerate(lines):
                  draw.text((WIDTH // 2, start + i * line_height), line, font=font,
                            anchor='mt', fill='white', stroke_width=2, stroke_fill='black')
              overlay.save(path)

          def run_ffmpeg(args):
              subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', *args], check=True)

          def make_clip(img, caption, result, number):
              frames = SCENE_SECONDS * FPS
              if number % 3 == 1:
                  z, x, y = 'min(1.0+0.00065*on,1.08)', 'iw/2-(iw/zoom/2)', 'ih/2-(ih/zoom/2)'
              elif number % 3 == 2:
                  z, x, y = '1.07', f'max(0,min(iw-iw/zoom,(iw-iw/zoom)*on/{frames}))', 'ih/2-(ih/zoom/2)'
              else:
                  z, x, y = '1.07', 'iw/2-(iw/zoom/2)', f'max(0,min(ih-ih/zoom,(ih-ih/zoom)*on/{frames}))'
              filt = (f"[0:v]zoompan=z='{z}':x='{x}':y='{y}':d={frames}:s={WIDTH}x{HEIGHT}:fps={FPS},"
                      'setsar=1,format=yuv420p[bg];[bg][1:v]overlay=0:0:shortest=0:repeatlast=1,format=yuv420p[v]')
              run_ffmpeg(['-i', str(img), '-i', str(caption), '-filter_complex', filt,
                          '-map', '[v]', '-frames:v', str(frames), '-an', '-c:v', 'libx264',
                          '-preset', 'medium', '-crf', '17', '-pix_fmt', 'yuv420p', str(result)])

          def make_soundtrack(path):
              total = SCENE_COUNT * SCENE_SECONDS * SAMPLE_RATE
              t = np.arange(total, dtype=np.float32) / SAMPLE_RATE
              audio = (0.11 * np.sin(2*np.pi*55*t) + 0.055 * np.sin(2*np.pi*82.41*t) +
                       0.025 * np.sin(2*np.pi*110*t) * (0.5+0.5*np.sin(2*np.pi*0.48*t)))
              notes = [329.63, 392, 493.88, 440, 392, 293.66]
              for i, start in enumerate(np.arange(0.5, SCENE_COUNT*SCENE_SECONDS, 2.5)):
                  first = int(start*SAMPLE_RATE)
                  size = min(int(2.1*SAMPLE_RATE), total-first)
                  lt = np.arange(size, dtype=np.float32)/SAMPLE_RATE
                  audio[first:first+size] += 0.07 * np.sin(2*np.pi*notes[i % len(notes)]*lt) * np.exp(-1.6*lt)
              rng = np.random.default_rng(987)
              for sec in range(SCENE_SECONDS, SCENE_COUNT*SCENE_SECONDS, SCENE_SECONDS):
                  first = int((sec-0.2)*SAMPLE_RATE)
                  size = min(int(0.4*SAMPLE_RATE), total-first)
                  noise = rng.normal(0, 1, size).astype(np.float32)
                  audio[first:first+size] += noise * np.sin(np.linspace(0, np.pi, size)) * 0.03
              fade = int(SAMPLE_RATE * 1.2)
              audio[:fade] *= np.linspace(0, 1, fade)
              audio[-fade:] *= np.linspace(1, 0, fade)
              peak = float(np.max(np.abs(audio)))
              if peak > 0:
                  audio *= 0.7 / peak
              pcm = (np.clip(np.column_stack((audio, audio)), -1, 1)*32767).astype('<i2')
              with wave.open(str(path), 'wb') as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(SAMPLE_RATE)
                  wav.writeframes(pcm.tobytes())

          def youtube_upload(path):
              creds = Credentials(
                  token=None, refresh_token=YOUTUBE_REFRESH_TOKEN,
                  token_uri='https://oauth2.googleapis.com/token',
                  client_id=YOUTUBE_CLIENT_ID, client_secret=YOUTUBE_CLIENT_SECRET,
                  scopes=['https://www.googleapis.com/auth/youtube.upload']
              )
              creds.refresh(Request())
              youtube = build('youtube', 'v3', credentials=creds, cache_discovery=False)
              description = (f'{title}\n\nDünya, tarih ve uzaydan ilginç bilgiler. '
                             'Görseller yapay zekâ destekli temsili canlandırmalardır; '
                             'özellikle bilimsel ve tarihsel sahneler gerçek görüntüler değildir.\n\n'
                             '#Shorts #Bilim #Tarih #Uzay #Gizem')
              body = {
                  'snippet': {
                      'title': f'{title} | Gizemli Dünya #Shorts'[:100],
                      'description': description,
                      'tags': ['Shorts', 'Gizemli Dünya', 'Bilim', 'Tarih', 'Uzay', category],
                      'categoryId': '27',
                      'defaultLanguage': 'tr'
                  },
                  'status': {
                      'privacyStatus': YOUTUBE_PRIVACY,
                      'selfDeclaredMadeForKids': False,
                      'containsSyntheticMedia': True
                  }
              }
              media = MediaFileUpload(str(path), mimetype='video/mp4', chunksize=-1, resumable=True)
              request = youtube.videos().insert(part='snippet,status', body=body, media_body=media)
              result = None
              retry = 0
              while result is None:
                  try:
                      _, result = request.next_chunk()
                      retry = 0
                  except HttpError as error:
                      if error.resp.status not in (500, 502, 503, 504) or retry >= 4:
                          raise
                      retry += 1
                      time.sleep(min(2**retry, 30))
                  except (OSError, ConnectionError) as error:
                      if retry >= 4:
                          raise
                      retry += 1
                      time.sleep(min(2**retry, 30))
              youtube_id = result.get('id')
              if not youtube_id:
                  raise RuntimeError('YouTube ID donmedi: ' + str(result)[:300])
              return youtube_id

          # Uretim
          print('1/5 Kaliteli gorseller olusturuluyor...')
          seed_base = int(hashlib.sha256((topic_id + slot).encode()).hexdigest()[:7], 16)
          clips = []
          for i, (caption, visual) in enumerate(scenes, 1):
              image_path = IMAGES / f'scene_{i:02d}.png'
              caption_path = CAPTIONS / f'caption_{i:02d}.png'
              clip_path = CLIPS / f'clip_{i:02d}.mp4'
              prompt = (style + visual)
              last_error = None
              for model in (PRIMARY_MODEL, BACKUP_MODEL):
                  for attempt in range(2):
                      try:
                          raw = call_image(model, prompt, seed_base+i*17+attempt)
                          crop_and_save(raw, image_path)
                          last_error = None
                          break
                      except DailyQuotaExhausted as error:
                          print('KOTA DOLDU:', error)
                          raise SystemExit(2)
                      except Exception as error:
                          last_error = error
                          print(f'Gorsel {i}, model {model}, deneme {attempt+1}: {str(error)[:220]}')
                          if attempt == 0:
                              time.sleep(3)
                  if last_error is None:
                      break
              if last_error is not None:
                  raise RuntimeError(f'{i}. gorsel uretilemedi: {last_error}')
              print(f'Gorsel {i}/{SCENE_COUNT} hazir.')
              make_caption(caption, caption_path)
              make_clip(image_path, caption_path, clip_path, i)
              clips.append(clip_path)

          print('2/5 Fon muzigi hazirlaniyor...')
          sound = OUT/'soundtrack.wav'
          make_soundtrack(sound)
          print('3/5 Video birlestiriliyor...')
          concat = OUT/'concat.txt'
          concat.write_text(''.join(f"file '{p.resolve()}'\n" for p in clips), encoding='utf-8')
          silent = OUT/'silent.mp4'
          run_ffmpeg(['-f', 'concat', '-safe', '0', '-i', str(concat), '-c', 'copy', str(silent)])
          final = ROOT/'gizemli-dunya-video.mp4'
          run_ffmpeg(['-i', str(silent), '-i', str(sound), '-map', '0:v:0', '-map', '1:a:0',
                      '-c:v', 'copy', '-c:a', 'aac', '-b:a', '192k', '-shortest',
                      '-movflags', '+faststart', str(final)])
          info = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries',
            'format=duration:stream=codec_type', '-of', 'json', str(final)], text=True))
          if float(info.get('format', {}).get('duration', 0)) < 25:
              raise RuntimeError('Video 25 saniyeden kisa.')
          if {s.get('codec_type') for s in info['streams']} != {'video', 'audio'}:
              raise RuntimeError('Video veya ses akisi bulunamadi.')

          print('4/5 YouTube yuklemesi baslatiliyor...')
          youtube_id = youtube_upload(final)
          youtube_url = f'https://www.youtube.com/watch?v={youtube_id}'
          print('YouTube video:', youtube_url)
          record = {'slot': slot, 'topic_id': topic_id, 'title': title,
                    'youtube_id': youtube_id, 'url': youtube_url,
                    'uploaded_at': datetime.now(ZoneInfo('Europe/Istanbul')).isoformat()}
          (OUT/'upload-result.json').write_text(json.dumps(record, ensure_ascii=False, indent=2), encoding='utf-8')

          print('5/5 Kalici yayin gecmisi kaydediliyor...')
          history.append(record)
          HISTORY_FILE.write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(HISTORY_FILE.relative_to(ROOT))], check=True)
          subprocess.run(['git', 'commit', '-m', f'Yayin gecmisi: {topic_id}'], check=True)
          try:
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          except subprocess.CalledProcessError as exc:
              raise RuntimeError('Video YouTube a yuklendi fakat gecmis GitHub a yazilamadi! '
                                 'Ayni videonun tekrarlanmamasi icin output/upload-result.json kaydini '
                                 'depo data/youtube_history.json dosyasina elle ekleyin.') from exc
          print('BASARILI:', youtube_url)
          PY
          python create_video.py

      - name: Videoyu ve yayin kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizemli-dunya-youtube-${{ github.run_id }}
          path: |
            gizemli-dunya-video.mp4
            output/upload-result.json
            output/video-plani.json
            output/images/
            data/youtube_history.json
          if-no-files-found: warn
          retention-days: 14
