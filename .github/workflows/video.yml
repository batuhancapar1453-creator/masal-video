name: Masal Video Uret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python paketlerini kur
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests pillow

      - name: Masal videosu oluştur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > video_olustur.py <<'PY'
          import os
          import time
          import html
          import base64
          import json
          import subprocess
          import requests

          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          AZURE_KEY = os.environ["AZURE_SPEECH_KEY"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()

          if not CF_ACCOUNT or not CF_TOKEN:
              raise RuntimeError("Cloudflare ayarları eksik.")

          session = requests.Session()

          print("=== 1. MASAL OLUŞTURULUYOR ===")

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )

          prompt = """
          Türkçe çocuk YouTube kanalı için özgün bir masal yaz.
          Yaklaşık 4-5 dakika uzunluğunda olsun.
          Sevimli ve akılda kalıcı bir ana karakter olsun.
          Eğlenceli bir macera ve küçük bir gizem içersin.
          Sonunda problem güzel şekilde çözülsün.
          Çocuklara uygun, sıcak ve güvenli bir dil kullan.
          Korku ve şiddet kullanma.
          Önce masal başlığını, sonra masalı yaz.
          """

          response = session.post(
              gemini_url,
              headers={
                  "x-goog-api-key": GEMINI_KEY,
                  "Content-Type": "application/json"
              },
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 5000
                  }
              },
              timeout=120
          )

          if response.status_code != 200:
              raise RuntimeError(
                  "Gemini hatası "
                  + str(response.status_code)
                  + ": " + response.text[:400]
              )

          story = response.json()["candidates"][0]["content"]["parts"][0]["text"]

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print("Masal oluşturuldu.")

          print("=== 2. SESLENDİRME ===")

          chunks = []
          remaining = story

          while remaining:
              length = min(2000, len(remaining))

              if length < len(remaining):
                  space = remaining.rfind(" ", 0, length)
                  if space > 500:
                      length = space

              chunk = remaining[:length].strip()

              if chunk:
                  chunks.append(chunk)

              remaining = remaining[length:].strip()

          audio_files = []

          azure_url = (
              "https://eastus.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          for index, chunk in enumerate(chunks):
              ssml = (
                  "<speak version='1.0' xml:lang='tr-TR'>"
                  "<voice xml:lang='tr-TR' name='tr-TR-EmelNeural'>"
                  + html.escape(chunk)
                  + "</voice></speak>"
              )

              response = session.post(
                  azure_url,
                  headers={
                      "Ocp-Apim-Subscription-Key": AZURE_KEY,
                      "X-Microsoft-OutputFormat":
                          "audio-16khz-128kbitrate-mono-mp3",
                      "Content-Type": "application/ssml+xml",
                      "User-Agent": "MasalOtomasyon"
                  },
                  data=ssml.encode("utf-8"),
                  timeout=120
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      "Azure ses hatası "
                      + str(response.status_code)
                      + ": " + response.text[:400]
                  )

              filename = f"ses_{index:02d}.mp3"

              with open(filename, "wb") as f:
                  f.write(response.content)

              audio_files.append(filename)

              print(f"Ses parçası {index + 1}/{len(chunks)} hazır.")
              time.sleep(1)

          with open("concat.txt", "w", encoding="utf-8") as f:
              for filename in audio_files:
                  f.write(f"file '{filename}'\n")

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat", "-safe", "0",
              "-i", "concat.txt",
              "-c", "copy", "ses.mp3"
          ], check=True)

          print("=== 3. CLOUDFLARE GÖRSELLERİ ===")

          image_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + CF_ACCOUNT
              + "/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )

          prompts = [
              "Cute friendly rabbit in a magical colorful forest, "
              "children's storybook illustration, warm colors, "
              "landscape composition, no text",

              "The same cute rabbit exploring a forest with colorful "
              "flowers and tall trees, children's storybook illustration, "
              "landscape composition, no text",

              "The same cute rabbit discovering a glowing path in a "
              "magical forest, cheerful children's illustration, no text",

              "The same cute rabbit meeting friendly forest animals, "
              "warm colorful children's storybook art, landscape, no text",

              "The same cute rabbit solving a gentle mystery in a magical "
              "forest, bright friendly children's illustration, no text",

              "The same cute rabbit discovering a beautiful magical secret, "
              "colorful storybook illustration, landscape, no text",

              "The same cute rabbit celebrating with forest friends, "
              "joyful children's storybook illustration, landscape, no text",

              "The same cute rabbit watching a beautiful sunset with friends, "
              "peaceful warm children's storybook illustration, no text"
          ]

          for index, scene_prompt in enumerate(prompts):
              print(f"Görsel isteği {index + 1}/8 gönderiliyor.")

              response = session.post(
                  image_url,
                  headers={
                      "Authorization": "Bearer " + CF_TOKEN,
                      "Content-Type": "application/json"
                  },
                  json={"prompt": scene_prompt},
                  timeout=300
              )

              content_type = response.headers.get("Content-Type", "")

              print("Cloudflare HTTP:", response.status_code)
              print("Cloudflare içerik türü:", content_type)

              if response.status_code != 200:
                  raise RuntimeError(
                      "Cloudflare HTTP hatası "
                      + str(response.status_code)
                      + ": " + response.text[:400]
                  )

              if content_type.lower().startswith("image/"):
                  image_bytes = response.content
              else:
                  try:
                      data = response.json()
                  except ValueError:
                      raise RuntimeError(
                          "Cloudflare JSON yerine başka yanıt döndürdü. "
                          "İçerik türü: " + content_type
                          + ". Yanıt: " + response.text[:250]
                      )

                  if not data.get("success"):
                      raise RuntimeError(
                          "Cloudflare model hatası: "
                          + json.dumps(data, ensure_ascii=False)[:400]
                      )

                  result = data.get("result") or {}
                  encoded = result.get("image")

                  if not encoded:
                      raise RuntimeError(
                          "Cloudflare yanıtında image alanı yok. "
                          "Mevcut alanlar: " + str(list(result.keys()))
                      )

                  image_bytes = base64.b64decode(encoded)

              try:
                  image = Image.open(BytesIO(image_bytes)).convert("RGB")
              except Exception as exc:
                  raise RuntimeError(
                      "Görsel açılamadı: " + str(exc)
                  )

              filename = f"sahne_{index:02d}.jpg"
              image.save(filename, "JPEG", quality=90)

              print(f"Görsel {index + 1}/8 kaydedildi.")
              time.sleep(1)

          print("=== 4. VIDEO OLUŞTURULUYOR ===")

          subprocess.run([
              "ffmpeg", "-y",
              "-loop", "1",
              "-framerate", "1",
              "-i", "sahne_%02d.jpg",
              "-i", "ses.mp3",
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=decrease,"
              "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
              "format=yuv420p",
              "-c:v", "libx264",
              "-tune", "stillimage",
              "-c:a", "aac",
              "-b:a", "128k",
              "-shortest",
              "-pix_fmt", "yuv420p",
              "masal-video.mp4"
          ], check=True)

          print("VIDEO BAŞARIYLA OLUŞTURULDU!")
          PY

          python3 video_olustur.py

      - name: Video dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
```
