          def make_clip(
              image_path,
              caption_path,
              destination,
              number
          ):
              frames = (
                  SCENE_SECONDS * FPS
              )

              if number % 3 == 1:
                  zoom = (
                      "min(1.0+0.00065*on,1.08)"
                  )

                  x = "iw/2-(iw/zoom/2)"
                  y = "ih/2-(ih/zoom/2)"

              elif number % 3 == 2:
                  zoom = "1.07"

                  x = (
                      "max(0,min(iw-iw/zoom,"
                      f"(iw-iw/zoom)*on/{frames}))"
                  )

                  y = "ih/2-(ih/zoom/2)"

              else:
                  zoom = "1.07"

                  x = "iw/2-(iw/zoom/2)"

                  y = (
                      "max(0,min(ih-ih/zoom,"
                      f"(ih-ih/zoom)*on/{frames}))"
                  )

              video_filter = (
                  "[0:v]"
                  "zoompan="
                  f"z='{zoom}':"
                  f"x='{x}':"
                  f"y='{y}':"
                  f"d={frames}:"
                  f"s={WIDTH}x{HEIGHT}:"
                  f"fps={FPS},"
                  "setsar=1,"
                  "format=yuv420p[bg];"
                  "[bg][1:v]"
                  "overlay=0:0:"
                  "shortest=0:"
                  "repeatlast=1,"
                  "format=yuv420p[v]"
              )

              run_ffmpeg([
                  "-i", str(image_path),
                  "-i", str(caption_path),
                  "-filter_complex", video_filter,
                  "-map", "[v]",
                  "-frames:v", str(frames),
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "17",
                  "-pix_fmt", "yuv420p",
                  str(destination)
              ])

