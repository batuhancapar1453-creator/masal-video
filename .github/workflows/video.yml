name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate Turkish story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import json
          import time
          import shutil
          import subprocess
          import requests
          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          AZURE_KEY = os.environ["AZURE_SPEECH_KEY"]
          AZURE_REGION = os.environ["AZURE_REGION"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          CF_MODEL = "@cf/lykon/dreamshaper-8-lcm"
          CF_URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/{CF_MODEL}"
          )

          def run(cmd):
              subprocess.run(cmd, check=True)

          def request_with_retry(method, url, **kwargs):
              for attempt in range(5):
                  response = requests.request(
                      method, url, timeout=180, **kwargs
                  )
                  if response.status_code not in (
                      429, 500, 502, 503, 504
                  ):
                      response.raise_for_status()
                      return response

                  if attempt == 4:
                      response.raise_for_status()

                  wait_time = 5 * (attempt + 1)
                  print(
                      f"İstek başarısız: {response.status_code}. "
                      f"{wait_time} saniye sonra tekrar denenecek."
                  )
                  time.sleep(wait_time)

              raise RuntimeError("İstek tekrar denemeleri başarısız.")

          print("1/5 Türkçe masal hazırlanıyor...")

          story_prompt = """
          4-8 yaş arası çocuklar için Türkçe, özgün ve sıcak bir masal yaz.
          Masal 600-800 kelime uzunluğunda olsun.
          Başlangıcı, gelişmesi ve mutlu bir sonu olsun.
          Dostluk, iyilik, cesaret veya paylaşma gibi olumlu bir mesaj içersin.
          Korkutucu, şiddet içeren veya uygunsuz içerik kullanma.
          Yalnızca masal metnini ver; başlık dışında açıklama ekleme.
          """

          story_response = request_with_retry(
              "POST",
              GEMINI_URL,
              json={
                  "contents": [
                      {
                          "parts": [
                              {"text": story_prompt}
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 5000
                  }
              }
          )

          story_data = story_response.json()

          try:
              story = story_data["candidates"][0]["content"]["parts"][0]["text"]
          except (KeyError, IndexError, TypeError):
              raise RuntimeError(
                  "Gemini masal metnini oluşturamadı: "
                  + json.dumps(story_data, ensure_ascii=False)[:2000]
              )

          story = story.strip()

          if len(story) < 500:
              raise RuntimeError(
                  f"Masal metni çok kısa oluşturuldu: {len(story)} karakter."
              )

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print(f"Masal oluşturuldu: {len(story)} karakter.")

          print("2/5 Azure ile seslendirme oluşturuluyor...")

          speech_url = (
              f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          escaped_story = (
              story.replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
          )

          ssml = f"""<speak version="1.0"
          xmlns="http://www.w3.org/2001/10/synthesis"
          xml:lang="tr-TR">
          <voice name="tr-TR-EmelNeural">
          <prosody rate="-5%" pitch="+2%">{escaped_story}</prosody>
          </voice>
          </speak>"""

          speech_response = requests.post(
              speech_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat":
                      "audio-24khz-48kbitrate-mono-mp3",
                  "User-Agent": "MasalVideoGenerator"
              },
              data=ssml.encode("utf-8"),
              timeout=300
          )

          if not speech_response.ok:
              raise RuntimeError(
                  "Azure seslendirme hatası: "
                  f"{speech_response.status_code} "
                  f"{speech_response.text[:1500]}"
              )

          if len(speech_response.content) < 1000:
              raise RuntimeError(
                  "Azure ses dosyası boş veya beklenenden küçük."
              )

          with open("narration.mp3", "wb") as f:
              f.write(speech_response.content)

          print(
              "Seslendirme oluşturuldu: "
              f"{len(speech_response.content) / 1024:.1f} KB"
          )

          print("3/5 Masal görselleri oluşturuluyor...")

          image_prompts = [
              "A beautiful whimsical children's storybook illustration, "
              "a little rabbit standing in a magical forest, soft warm "
              "sunlight, colorful flowers, charming 3D animated movie "
              "style, highly detailed, child friendly, no text, no letters",

              "A cute little rabbit walking along a forest path, "
              "mushrooms and colorful flowers, magical golden sunlight, "
              "beautiful children's picture book illustration, "
              "high quality 3D animation style, no text",

              "A friendly little fox meeting a cute rabbit in a lush "
              "enchanted forest, warm expressions, vibrant natural colors, "
              "cinematic children's storybook illustration, detailed, "
              "no text, no letters",

              "A magical woodland clearing with a sparkling blue stream, "
              "a cute rabbit and a friendly fox exploring together, "
              "beautiful soft lighting, high quality 3D animated storybook "
              "art, no text",

              "A small rabbit helping a tiny bird near a beautiful tree, "
              "warm and heartwarming children's illustration, detailed "
              "fur and feathers, rich natural colors, soft cinematic light, "
              "no text",

              "A cheerful rabbit and fox sharing berries in a magical "
              "forest, colorful flowers, warm afternoon sunlight, "
              "beautiful children's animated film style, detailed, "
              "no text",

              "A group of adorable woodland animals gathering in a "
              "beautiful forest clearing, rabbit, fox, birds and hedgehog, "
              "joyful expressions, vibrant storybook illustration, "
              "cinematic lighting, no text",

              "A peaceful magical forest at sunset, a cute rabbit and "
              "friendly fox looking at a glowing golden sky, heartwarming "
              "children's storybook ending, beautiful detailed 3D animation "
              "style, warm colors, no text"
          ]

          os.makedirs("images", exist_ok=True)
          valid_images = []

          for i, prompt in enumerate(image_prompts, start=1):
              print(f"Görsel {i}/{len(image_prompts)} hazırlanıyor...")

              payload = {
                  "prompt": prompt,
                  "negative_prompt": (
                      "blurry, low quality, low resolution, distorted, "
                      "deformed, ugly, extra limbs, bad anatomy, "
                      "text, letters, watermark, logo, noise, artifacts"
                  ),
                  "width": 1024,
                  "height": 1024,
                  "num_steps": 20,
                  "guidance": 1.5
              }

              try:
                  image_response = request_with_retry(
                      "POST",
                      CF_URL,
                      headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"
                      },
                      json=payload
                  )

                  image_bytes = image_response.content

                  try:
                      image = Image.open(BytesIO(image_bytes)).convert("RGB")
                  except Exception:
                      result = image_response.json()
                      raise RuntimeError(
                          "Cloudflare geçerli görsel döndürmedi: "
                          + json.dumps(result, ensure_ascii=False)[:1000]
                      )

                  if image.width < 512 or image.height < 512:
                      raise RuntimeError(
                          f"Görsel çözünürlüğü düşük: "
                          f"{image.width}x{image.height}"
                      )

                  image_std = image.convert("RGB").getchannel("R").getextrema()
                  if image_std[1] - image_std[0] < 8:
                      raise RuntimeError(
                          "Görsel kalite kontrolünden geçemedi."
                      )

                  image_path = f"images/scene_{i:02d}.png"
                  image.save(image_path, format="PNG", quality=95)
                  valid_images.append(image_path)

                  print(
                      f"Görsel {i} kaydedildi: "
                      f"{image.width}x{image.height}"
                  )

              except Exception as e:
                  print(f"Görsel {i} oluşturulamadı: {e}")

                  if valid_images:
                      fallback_path = f"images/scene_{i:02d}.png"
                      shutil.copy2(valid_images[-1], fallback_path)
                      valid_images.append(fallback_path)
                      print(
                          f"Önceki başarılı görsel {i}. görsel için kullanıldı."
                      )
                  else:
                      raise RuntimeError(
                          "İlk görsel oluşturulamadığı için işlem durduruldu."
                      ) from e

          if len(valid_images) != len(image_prompts):
              raise RuntimeError("Görsellerin tamamı oluşturulamadı.")

          print("4/5 Görüntü klipleri oluşturuluyor...")

          clip_paths = []

          for i, image_path in enumerate(valid_images, start=1):
              clip_path = f"clip_{i:02d}.mp4"

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "25",
                  "-i", image_path,
                  "-f", "lavfi",
                  "-i", "anullsrc=channel_layout=stereo:sample_rate=48000",
                  "-t", "7",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,setsar=1,format=yuv420p",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",
                  "-shortest",
                  "-movflags", "+faststart",
                  clip_path
              ])

              clip_paths.append(clip_path)
              print(f"Klip {i}/{len(valid_images)} oluşturuldu.")

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for clip_path in clip_paths:
                  f.write(f"file '{clip_path}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat_list.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          print("Görüntü klipleri birleştirildi.")

          print("5/5 Ses ve görüntü birleştiriliyor...")

          duration_result = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "narration.mp3"
          ], capture_output=True, text=True, check=True)

          narration_duration = float(duration_result.stdout.strip())

          run([
              "ffmpeg", "-y",
              "-stream_loop", "-1",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-t", str(narration_duration),
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,format=yuv420p",
              "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-c:a", "aac",
              "-b:a", "192k",
              "-ar", "48000",
              "-ac", "2",
              "-shortest",
              "-movflags", "+faststart",
              "masal-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,width,height",
              "-of", "json",
              "masal-video.mp4"
          ], text=True)

          streams = json.loads(probe).get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" not in stream_types:
              raise RuntimeError("Videoda ses akışı bulunamadı.")

          size = os.path.getsize("masal-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "masal-video.mp4",
              "-f", "null", "-"
          ])

          print("5/5 Video başarıyla oluşturuldu!")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Görüntü ve ses akışları doğrulandı.")
          PY

          python create_video.py

      - name: Upload video and story
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
          if-no-files-found: error
          retention-days: 7
