                  'ship': ['old ship fog sea', 'ship at night ocean'],
                  'bus': ['empty bus night road', 'old bus station'],
                  'busstop': ['empty bus stop night', 'rural bus shelter fog'],
                  'door': ['old wooden door dark corridor', 'abandoned house doorway'],
                  'door_self': ['old wooden door corridor', 'door handle closeup'],
