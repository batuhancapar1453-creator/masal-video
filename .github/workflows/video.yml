name: GizemliStüdyo - KIRILMA Kayıp Ada Sezon 1 Günlük Yayın

on:
  workflow_dispatch:
  schedule:
    # Her gün Türkiye saati 09:00 (UTC 06:00; Türkiye UTC+3).
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-gizemlistudyo-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ve font kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts playwright requests google-auth google-auth-oauthlib google-api-python-client

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: GizemliStüdyo kaynak paketini bul ve aç
        run: |
          python - <<'PY'
          import io, zipfile
          from pathlib import Path
          required = {
              "cizgi-short/kit/engine/index.html",
              "gizemli404/run_episode.py",
              "gizemli404/story.js",
              "gizemli404/episodes/episode_01.json",
          }
          candidates=[]
          for name in ("GizemliStüdyo_KayıpAda_Sezon1_Kaynak.zip", "gizemli404-source.zip"):
              p=Path(name)
              if p.is_file(): candidates.append(p)
          candidates.extend(p for p in Path(".").rglob("*.zip") if p.is_file() and p not in candidates)
          source_bytes=None;source_label=None
          for p in candidates:
              try:
                  with zipfile.ZipFile(p) as z:
                      if required.issubset(set(z.namelist())):
                          source_bytes=p.read_bytes();source_label=str(p);break
                      nested=next((n for n in z.namelist() if n.replace("\\","/").endswith("gizemli404-source.zip")),None)
                      if nested:
                          b=z.read(nested)
                          with zipfile.ZipFile(io.BytesIO(b)) as inner:
                              if required.issubset(set(inner.namelist())):
                                  source_bytes=b;source_label=f"{p} içindeki {nested}";break
              except (zipfile.BadZipFile,OSError):
                  continue
          if source_bytes is None:
              raise SystemExit("GizemliStüdyo kaynak ZIP bulunamadı. Depo köküne GizemliStüdyo_KayıpAda_Sezon1_Kaynak.zip yükleyin.")
          with zipfile.ZipFile(io.BytesIO(source_bytes)) as z:
              missing=sorted(required-set(z.namelist()))
              if missing: raise SystemExit("Kaynak ZIP eksik dosyalar içeriyor: "+", ".join(missing))
              z.extractall(".")
          print("GizemliStüdyo kaynakları açıldı:",source_label)
          PY

      - name: Sezon dosyalarını ve Python kodunu doğrula
        run: |
          python -m compileall -q gizemli404 cizgi-short/kit/tools
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("gizemli404/episodes").glob("episode_*.json"))
          if len(files)!=10: raise SystemExit(f"Sezon 1 için 10 bölüm bekleniyordu, bulundu: {len(files)}")
          expected=["Son Rota","İlk Gece","Ormandaki İzler","Şelalenin Ardında","Terk Edilmiş Yerleşke","Fırtınadan Sonra","Yeraltındaki Geçit","Dağın Zirvesi","Son Kayıt","Kıyıdaki Tekne"]
          for i,p in enumerate(files,1):
              d=json.loads(p.read_text(encoding="utf-8"))
              words=sum(len(x["text"].split()) for x in d["lines"])
              if d.get("number")!=i or d.get("title")!=expected[i-1]: raise SystemExit(f"Bölüm sırası/başlığı hatalı: {p}")
              if not 600 <= words <= 1000: raise SystemExit(f"{p.name}: senaryo kelime sayısı hedef dışında: {words}")
              if d.get("word_count")!=words: raise SystemExit(f"{p.name}: word_count eşleşmiyor")
          print("10 bölüm, sıra, JSON ve senaryo kelime kontrolleri başarılı.")
          PY

      - name: Sıradaki bölüm kimliğini belirle
        id: episode
        run: python gizemli404/select_episode.py

      - name: Yarım kalan render karelerini geri yükle
        if: steps.episode.outputs.episode_id != 'season-complete'
        uses: actions/cache@v4
        with:
          path: .render_cache
          key: gizemlistudyo-frames-${{ steps.episode.outputs.episode_id }}-${{ hashFiles('gizemli404/story.js', 'gizemli404/run_episode.py', 'gizemli404/episodes/episode_*.json', 'cizgi-short/kit/engine/**', 'cizgi-short/kit/tools/**', 'cizgi-short/kit/vendor/**', 'cizgi-short/kit/fonts/**') }}-${{ github.run_id }}
          save-always: true
          restore-keys: |
            gizemlistudyo-frames-${{ steps.episode.outputs.episode_id }}-${{ hashFiles('gizemli404/story.js', 'gizemli404/run_episode.py', 'gizemli404/episodes/episode_*.json', 'cizgi-short/kit/engine/**', 'cizgi-short/kit/tools/**', 'cizgi-short/kit/vendor/**', 'cizgi-short/kit/fonts/**') }}-

      - name: YouTube OAuth bağlantısını önceden denetle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          values={k:os.getenv(k,"").strip() for k in ("YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN")}
          missing=[k for k,v in values.items() if not v]
          if missing: raise SystemExit("Eksik GitHub Secrets: "+", ".join(missing))
          r=requests.post("https://oauth2.googleapis.com/token",data={
              "grant_type":"refresh_token","client_id":values["YOUTUBE_CLIENT_ID"],
              "client_secret":values["YOUTUBE_CLIENT_SECRET"],"refresh_token":values["YOUTUBE_REFRESH_TOKEN"]},timeout=30)
          payload=r.json()
          if not r.ok or not payload.get("access_token"):
              raise SystemExit("YouTube OAuth hatası: "+str(payload.get("error"))+" ("+str(payload.get("error_description",""))[:180]+")")
          print("YouTube OAuth testi başarılı.")
          PY

      - name: Sıradaki Kayıp Ada bölümünü üret ve yükle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python gizemli404/run_episode.py

      - name: Çalışma önizlemesini ve yayın kaydını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizemlistudyo-kayip-ada-run-${{ github.run_id }}
          path: |
            output/
            work_gizemli404/out/
            work_gizemli404/stills/preview_sheet.jpg
            work_gizemli404/work/words.json
            work_gizemli404/episode.json
            data/gizemli404_history.json
            data/tuhaf_kasaba_history.json
            .render_cache/
          if-no-files-found: ignore
          retention-days: 7
