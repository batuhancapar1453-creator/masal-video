name: Tuhaf Kasaba - 10 Bolum Otomatik Cizgi Film

on:
  workflow_dispatch:
  schedule:
    # Istanbul saatine gore 09:23 ve 20:23 (GitHub cron UTC kullanir).
    - cron: '23 6,17 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-tuhaf-kasaba-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ve gerekli sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts playwright requests google-auth google-auth-oauthlib google-api-python-client

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

