name: Kisa Animasyon Video Uret

on:
  workflow_dispatch:

jobs:
  animation-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate short cartoon animation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIFTYVID_WORKER_URL: https://nifty-vid.batuhancapar1453.workers.dev
          ANIMATION_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import json
          import time
          import subprocess
          import requests
          from PIL import Image
          from io import BytesIO

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          AZURE_KEY = os.environ["AZURE_SPEECH_KEY"]
          AZURE_REGION = os.environ["AZURE_REGION"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          RUN_NUMBER = os.environ.get(
              "ANIMATION_RUN_NUMBER", str(int(time.time()))
          )

          NIFTYVID_WORKER_URL = os.environ.get(
              "NIFTYVID_WORKER_URL",
              "https://nifty-vid.batuhancapar1453.workers.dev"
          ).rstrip("/")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          CF_MODEL = "@cf/lykon/dreamshaper-8-lcm"
          CF_URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/{CF_MODEL}"
          )

          def run(cmd):
              subprocess.run(cmd, check=True)

          def request_with_retry(method, url, **kwargs):
              for attempt in range(5):
                  response = requests.request(
                      method, url, timeout=180, **kwargs
                  )

                  if response.status_code not in (
                      429, 500, 502, 503, 504
                  ):
                      response.raise_for_status()
                      return response

                  if attempt == 4:
                      response.raise_for_status()

                  wait_time = 5 * (attempt + 1)
                  print(
                      f"İstek başarısız: {response.status_code}. "
                      f"{wait_time} saniye sonra tekrar denenecek."
                  )
                  time.sleep(wait_time)

              raise RuntimeError("İstek tekrar denemeleri başarısız.")

          def extract_niftyvid_url(file_data):
              if isinstance(file_data, str):
                  return (
                      "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space/"
                      "gradio_api/file=" + file_data
                  )

              if isinstance(file_data, dict):
                  if file_data.get("url"):
                      return file_data["url"]

                  if file_data.get("path"):
                      return (
                          "https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space/"
                          "gradio_api/file=" + file_data["path"]
                      )

              return None

          def generate_animated_clip(
              image_path, output_path, motion_prompt, scene_number
          ):
              params = {
                  "prompt": motion_prompt,
                  "duration_seconds": 3.5,
                  "steps": 6,
              }

              print(
                  f"Sahne {scene_number}: hareketli klip oluşturuluyor..."
              )

              with open(image_path, "rb") as image_file:
                  with requests.post(
                      f"{NIFTYVID_WORKER_URL}/generate",
                      files={
                          "image": (
                              os.path.basename(image_path),
                              image_file,
                              "image/png"
                          )
                      },
                      data={
                          "params": json.dumps(
                              params, ensure_ascii=False
                          )
                      },
                      headers={"Accept": "text/event-stream"},
                      stream=True,
                      timeout=(30, 600),
                  ) as response:

                      if not response.ok:
                          try:
                              detail = response.json().get(
                                  "error", response.text[:500]
                              )
                          except Exception:
                              detail = response.text[:500]

                          raise RuntimeError(
                              f"NiftyVid HTTP {response.status_code}: "
                              f"{detail}"
                          )

                      event_name = "message"
                      data_lines = []
                      video_url = None

                      for raw_line in response.iter_lines(
                          decode_unicode=True
                      ):
                          if raw_line is None:
                              continue

                          line = raw_line.strip()

                          if not line:
                              if data_lines:
                                  event_data = "\n".join(data_lines)

                                  if event_name == "error":
                                      raise RuntimeError(
                                          "Animasyon üretim hatası: "
                                          + event_data[:500]
                                      )

                                  if event_name == "complete":
                                      payload = json.loads(event_data)

                                      first = (
                                          payload[0]
                                          if isinstance(payload, list)
                                          and payload
                                          else None
                                      )

                                      video_url = extract_niftyvid_url(first)

                                      if not video_url:
                                          raise RuntimeError(
                                              "Video bağlantısı dönmedi."
                                          )

                                      break

                              event_name = "message"
                              data_lines = []

                          elif line.startswith("event:"):
                              event_name = line[6:].strip()

                          elif line.startswith("data:"):
                              data_lines.append(line[5:].strip())

              if not video_url:
                  raise RuntimeError(
                      "Animasyon tamamlanmadan bağlantı kapandı."
                  )

              temp_path = output_path + ".download.mp4"

              with requests.get(
                  video_url, stream=True, timeout=(30, 180)
              ) as video_response:
                  video_response.raise_for_status()

                  with open(temp_path, "wb") as video_file:
                      for chunk in video_response.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              video_file.write(chunk)

              run([
                  "ffmpeg", "-y",
                  "-i", temp_path,
                  "-t", "3.5",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=increase,"
                  "crop=1280:720,setsar=1,format=yuv420p",
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-movflags", "+faststart",
                  output_path
              ])

              os.remove(temp_path)

              if os.path.getsize(output_path) < 20000:
                  raise RuntimeError("Animasyon klibi çok küçük.")

          print("1/5 Yeni çizgi film konusu hazırlanıyor...")

          animation_prompt = f"""
          BU ÇALIŞTIRMANIN NUMARASI: {RUN_NUMBER}

          4-8 yaş çocukları için kısa, eğlenceli ve görsel açıdan etkileyici
          bir çizgi film animasyonu üret. Bu bir uzun masal değildir.

          HER ÇALIŞTIRMADA YENİ KONU:
          Bu çalıştırmada kendin yepyeni bir konu, ana karakter ve amaç seç.
          Önceki çalıştırmalardaki konuyu tekrar etme. Arı ve polen örneğini
          her seferinde kullanma; o yalnızca sıralı olay anlatımına örnektir.
          Küçük bir kaplumbağa, sevimli bir penguen, minik bir robot,
          uğur böceği, tilki, kedi veya bambaşka çocuk dostu bir karakter
          seçebilirsin. Her çalıştırmada farklı bir fikir geliştirmeye çalış.

          Tek ana karakter ve kolay anlaşılır tek bir hedef olsun.
          Karakterin görünüşü bütün sahnelerde aynı kalmalı.
          Yardımcı karakterler yalnızca olay örgüsünde gerçekten gerekiyorsa
          yer alsın.

          OLAYLAR SIRAYLA İLERLEMELİ:
          Örneğin karakter bir yere gider, bir şey yapar, bir sorunla
          karşılaşır, çözüm bulur ve amacına ulaşır. Bu yalnızca genel
          bir yapı örneğidir; her seferinde yeni bir olay örgüsü kur.
          Her sahne önceki sahnenin devamı olmalı.
          Birbirinden bağımsız rastgele görüntüler üretme.
          Görüntüde olan olay o sahnenin anlatımıyla uyuşmalı.

          GÖRSEL TARZ:
          Kaliteli 3D çocuk çizgi filmi, canlı ama dengeli renkler,
          sevimli yüz ifadeleri, net hareketler, güzel ışıklandırma,
          tutarlı karakter tasarımı ve sinematik kamera açıları kullan.
          Korku, şiddet, tehlikeli davranış, yazı, altyazı ve logo olmasın.
          Görüntüler yatay 16:9 kadraj için hazırlansın.

          SÜRE:
          Tam 8 kısa sahne hazırla.
          Her sahne yaklaşık 3,5 saniyelik hareketli klibe uygun olsun.
          Seslendirme kısa ve sade Türkçe olsun, 130 kelimeyi geçmesin.
          Nihai video 3 dakikayı aşmamalı.
          Anlatım, sahnelerde gerçekleşen olayları doğru sırayla açıklamalı.

          Her sahne için:
          - story_beat: sahnede gerçekten gerçekleşen olay
          - visual_prompt: o olayın görselini tarif eden ayrıntılı İngilizce istem
          - motion_prompt: görselde karakterin yapacağı somut hareketi anlatan
            İngilizce istem. Hareket başlangıcı, yönü ve çevre hareketi açık olsun.
          - Her sahnede aynı ana karakterin tasarımını koru.

          Yalnızca geçerli JSON döndür. Markdown veya başka açıklama yazma.

          JSON şeması:
          {{
            "title": "kısa çizgi film başlığı",
            "narration": "kısa Türkçe seslendirme",
            "style": "bütün sahnelerde korunacak çizgi film stili",
            "character_bible": "ana karakterin değişmeyecek görünüşü",
            "scenes": [
              {{
                "scene": 1,
                "story_beat": "bu sahnede gerçekleşen olay",
                "visual_prompt": "İngilizce görsel istemi",
                "motion_prompt": "İngilizce hareket istemi"
              }}
            ]
          }}
          """

          plan_response = request_with_retry(
              "POST",
              GEMINI_URL,
              json={
                  "contents": [
                      {
                          "parts": [
                              {"text": animation_prompt}
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.85,
                      "maxOutputTokens": 6000,
                      "responseMimeType": "application/json"
                  }
              }
          )

          plan_data = plan_response.json()

          try:
              plan_text = (
                  plan_data["candidates"][0]["content"]["parts"][0]["text"]
                  .strip()
              )

              if plan_text.startswith("```"):
                  plan_text = plan_text.split("\n", 1)[1]
                  plan_text = plan_text.rsplit("```", 1)[0].strip()

              scene_plan = json.loads(plan_text)
              scenes = scene_plan["scenes"]
              character_bible = str(
                  scene_plan.get("character_bible", "")
              ).strip()
              style_bible = str(scene_plan.get("style", "")).strip()
              narration = str(scene_plan.get("narration", "")).strip()

              if len(scenes) != 8:
                  raise ValueError(
                      f"8 sahne yerine {len(scenes)} sahne döndü."
                  )

              if not narration or len(narration.split()) > 130:
                  raise ValueError(
                      "Seslendirme boş veya 130 kelimeden uzun."
                  )

              if not character_bible or not style_bible:
                  raise ValueError(
                      "Karakter görünüşü veya görsel stili eksik."
                  )

              for index, scene in enumerate(scenes, start=1):
                  scene["visual_prompt"] = str(
                      scene.get("visual_prompt", "")
                  ).strip()
                  scene["motion_prompt"] = str(
                      scene.get("motion_prompt", "")
                  ).strip()
                  scene["story_beat"] = str(
                      scene.get("story_beat", "")
                  ).strip()

                  if (
                      not scene["visual_prompt"]
                      or not scene["motion_prompt"]
                      or not scene["story_beat"]
                  ):
                      raise ValueError(
                          f"{index}. sahnenin olay, görsel veya hareket "
                          "bilgisi eksik."
                      )

          except Exception as e:
              raise RuntimeError(
                  "Çizgi film planı oluşturulamadı: "
                  + str(e) + " | Yanıt: "
                  + json.dumps(plan_data, ensure_ascii=False)[:1800]
              ) from e

          with open("animasyon-metni.txt", "w", encoding="utf-8") as f:
              f.write(narration)

          with open("sahne-plani.json", "w", encoding="utf-8") as f:
              json.dump(
                  scene_plan,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          for index, scene in enumerate(scenes, start=1):
              scene["visual_prompt"] = (
                  f"{style_bible}. "
                  f"Consistent main character design: {character_bible}. "
                  f"Exact chronological action for shot {index}: "
                  f"{scene['story_beat']}. "
                  f"{scene['visual_prompt']}. "
                  "One continuous children's cartoon. Keep the same character, "
                  "face, proportions, colors and style. Show only the action "
                  "described for this scene. Wide 16:9 composition, full "
                  "character visible, expressive face, beautiful lighting, "
                  "no text, no captions, no logo, no watermark."
              )

          print(
              f"Yeni çizgi film konusu: "
              f"{scene_plan.get('title', 'Kısa animasyon')}"
          )

          print("2/5 Türkçe seslendirme oluşturuluyor...")

          speech_url = (
              f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          escaped_narration = (
              narration.replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
          )

          ssml = f"""<speak version="1.0"
          xmlns="http://www.w3.org/2001/10/synthesis"
          xml:lang="tr-TR">
          <voice name="tr-TR-EmelNeural">
          <prosody rate="-5%" pitch="+2%">{escaped_narration}</prosody>
          </voice>
          </speak>"""

          speech_response = requests.post(
              speech_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat":
                      "audio-24khz-48kbitrate-mono-mp3",
                  "User-Agent": "ShortAnimationGenerator"
              },
              data=ssml.encode("utf-8"),
              timeout=300
          )

          if not speech_response.ok:
              raise RuntimeError(
                  "Azure seslendirme hatası: "
                  f"{speech_response.status_code} "
                  f"{speech_response.text[:1500]}"
              )

          if len(speech_response.content) < 1000:
              raise RuntimeError(
                  "Azure ses dosyası boş veya beklenenden küçük."
              )

          with open("narration.mp3", "wb") as f:
              f.write(speech_response.content)

          print(
              "Seslendirme hazır: "
              f"{len(speech_response.content) / 1024:.1f} KB"
          )

          print("3/5 Sahnelere özel görseller oluşturuluyor...")

          image_prompts = [
              scene["visual_prompt"] for scene in scenes
          ]

          motion_prompts = [
              scene["motion_prompt"] for scene in scenes
          ]

          os.makedirs("images", exist_ok=True)
          valid_images = []

          for i, prompt in enumerate(image_prompts, start=1):
              print(f"Görsel {i}/{len(image_prompts)} oluşturuluyor...")

              payload = {
                  "prompt": prompt,
                  "negative_prompt": (
                      "blurry, low quality, distorted, deformed, extra limbs, "
                      "bad anatomy, text, letters, watermark, logo, noise, "
                      "different character design, inconsistent colors, "
                      "cropped head, cropped feet, black bars, borders"
                  ),
                  "width": 1024,
                  "height": 576,
                  "num_steps": 20,
                  "guidance": 1.5
              }

              try:
                  image_response = request_with_retry(
                      "POST",
                      CF_URL,
                      headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"
                      },
                      json=payload
                  )

                  image_bytes = image_response.content

                  try:
                      image = Image.open(
                          BytesIO(image_bytes)
                      ).convert("RGB")

                  except Exception:
                      result = image_response.json()
                      raise RuntimeError(
                          "Cloudflare geçerli görsel döndürmedi: "
                          + json.dumps(
                              result, ensure_ascii=False
                          )[:1000]
                      )

                  if image.width < 512 or image.height < 288:
                      raise RuntimeError(
                          f"Görsel çözünürlüğü düşük: "
                          f"{image.width}x{image.height}"
                      )

                  target_ratio = 16 / 9
                  image_ratio = image.width / image.height

                  if image_ratio > target_ratio:
                      new_width = int(image.height * target_ratio)
                      left = (image.width - new_width) // 2
                      image = image.crop(
                          (left, 0, left + new_width, image.height)
                      )
                  elif image_ratio < target_ratio:
                      new_height = int(image.width / target_ratio)
                      top = (image.height - new_height) // 2
                      image = image.crop(
                          (0, top, image.width, top + new_height)
                      )

                  image_path = f"images/scene_{i:02d}.png"
                  image.save(image_path, format="PNG")
                  valid_images.append(image_path)

                  print(
                      f"Görsel {i} kaydedildi: "
                      f"{image.width}x{image.height}"
                  )

              except Exception as e:
                  print(f"Görsel {i} oluşturulamadı: {e}")

                  raise RuntimeError(
                      f"{i}. sahnenin görseli üretilemedi. "
                      "Başka bir sahnenin görselini kullanmamak için "
                      "işlem durduruldu."
                  ) from e

          if len(valid_images) != len(image_prompts):
              raise RuntimeError("Bütün sahne görselleri oluşturulamadı.")

          print("4/5 Sahne sahne hareketli klipler oluşturuluyor...")

          clip_paths = []

          for i, image_path in enumerate(valid_images, start=1):
              clip_path = f"clip_{i:02d}.mp4"
              motion_prompt = motion_prompts[i - 1]

              try:
                  generate_animated_clip(
                      image_path,
                      clip_path,
                      motion_prompt,
                      i
                  )

                  print(
                      f"Hareketli sahne {i}/{len(valid_images)} hazır."
                  )

              except Exception as animation_error:
                  raise RuntimeError(
                      f"{i}. sahnenin gerçek animasyonu üretilemedi. "
                      "Durağan görseli animasyonmuş gibi sunmamak için "
                      "işlem durduruldu. NiftyVid hatası: "
                      f"{animation_error}"
                  ) from animation_error

              clip_paths.append(clip_path)

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for clip_path in clip_paths:
                  f.write(f"file '{clip_path}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat_list.txt",
              "-c", "copy",
              "visuals.mp4"
          ])

          print("Hareketli sahneler birleştirildi.")

          print("5/5 Görüntü ve ses birleştiriliyor...")

          duration_result = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "narration.mp3"
          ], capture_output=True, text=True, check=True)

          narration_duration = float(duration_result.stdout.strip())

          if narration_duration > 180:
              raise RuntimeError(
                  f"Seslendirme {narration_duration:.1f} saniye. "
                  "3 dakika sınırını aşıyor."
              )

          run([
              "ffmpeg", "-y",
              "-stream_loop", "-1",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-t", str(narration_duration),
              "-vf",
              "scale=1280:720:force_original_aspect_ratio=increase,"
              "crop=1280:720,setsar=1,format=yuv420p",
              "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-c:a", "aac",
              "-b:a", "192k",
              "-ar", "48000",
              "-ac", "2",
              "-shortest",
              "-movflags", "+faststart",
              "animasyon-video.mp4"
          ])

          probe = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,width,height",
              "-of", "json",
              "animasyon-video.mp4"
          ], text=True)

          streams = json.loads(probe).get("streams", [])
          stream_types = {s.get("codec_type") for s in streams}

          if "video" not in stream_types:
              raise RuntimeError("Videoda görüntü akışı bulunamadı.")

          if "audio" not in stream_types:
              raise RuntimeError("Videoda ses akışı bulunamadı.")

          size = os.path.getsize("animasyon-video.mp4")

          if size < 100000:
              raise RuntimeError("Video dosyası beklenenden küçük.")

          run([
              "ffmpeg", "-v", "error",
              "-i", "animasyon-video.mp4",
              "-f", "null", "-"
          ])

          print("Animasyon başarıyla oluşturuldu!")
          print(f"Konu: {scene_plan.get('title', 'Kısa animasyon')}")
          print(f"Dosya boyutu: {size / 1024 / 1024:.2f} MB")
          print("Görüntü ve ses akışları doğrulandı.")
          PY

          python create_video.py

      - name: Upload animation files
        uses: actions/upload-artifact@v4
        with:
          name: kisa-cizgi-film
          path: |
            animasyon-video.mp4
            animasyon-metni.txt
            sahne-plani.json
          if-no-files-found: error
          retention-days: 7
