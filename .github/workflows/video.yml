          def extract_image(response):
              content_type = (
                  response.headers.get(
                      "content-type", ""
                  ).lower()
              )

              if (
                  "json" not in content_type
                  and response.content[:1] != b"{"
              ):
                  return response.content

              payload = response.json()

              if payload.get("success") is False:
                  raise RuntimeError(
                      str(
                          payload.get(
                              "errors", payload
                          )
                      )[:500]
                  )

              data = payload.get(
                  "result", payload
              )

              encoded = None

              if isinstance(data, dict):
                  encoded = (
                      data.get("image")
                      or data.get("data")
                  )

              if isinstance(encoded, list):
                  return bytes(encoded)

              if isinstance(encoded, str):
                  encoded = encoded.split(",")[-1]
                  return base64.b64decode(encoded)

              raise RuntimeError(
                  "Gorsel verisi alinamadi."
              )

          def call_image(model, prompt, seed):
              url = (
                  "https://api.cloudflare.com/"
                  "client/v4/accounts/"
                  f"{CF_ACCOUNT}/ai/run/{model}"
              )

              headers = {
                  "Authorization": (
                      f"Bearer {CF_TOKEN}"
                  )
              }

              if model == PRIMARY_MODEL:
                  # FLUX multipart/form-data kullanir.
                  fields = {
                      "prompt": (
                          None, prompt[:2100]
                      ),
                      "width": (
                          None, "1024"
                      ),
                      "height": (
                          None, "1792"
                      ),
                      "guidance": (
                          None, "4"
                      ),
                      "seed": (
                          None, str(seed)
                      )
                  }

                  response = session.post(
                      url,
                      headers=headers,
                      files=fields,
                      timeout=240
                  )
              else:
                  response = session.post(
                      url,
                      headers=headers,
                      json={
                          "prompt": prompt[:1800],
                          "width": 768,
                          "height": 1344,
                          "num_steps": 20,
                          "seed": seed,
                          "negative_prompt": NEGATIVE_PROMPT
                      },
                      timeout=240
                  )

              if not response.ok:
                  raise RuntimeError(
                      f"{model} HTTP "
                      f"{response.status_code}: "
                      f"{response.text[:350]}"
                  )

              return extract_image(response)

          def crop_and_save(raw, destination):
              image = Image.open(
                  io.BytesIO(raw)
              ).convert("RGB")

              if min(image.size) < 256:
                  raise RuntimeError(
                      "Gorsel cok kucuk."
                  )

              desired_ratio = (
                  WIDTH / HEIGHT
              )

              current_ratio = (
                  image.width / image.height
              )

              if current_ratio > desired_ratio:
                  new_width = round(
                      image.height * desired_ratio
                  )

                  left = (
                      image.width - new_width
                  ) // 2

                  image = image.crop((
                      left,
                      0,
                      left + new_width,
                      image.height
                  ))
              else:
                  new_height = round(
                      image.width / desired_ratio
                  )

                  top = (
                      image.height - new_height
                  ) // 2

                  image = image.crop((
                      0,
                      top,
                      image.width,
                      top + new_height
                  ))

              image = image.resize(
                  (WIDTH, HEIGHT),
                  Image.Resampling.LANCZOS
              )

              image = (
                  ImageEnhance.Contrast(image)
                  .enhance(1.04)
              )

              image = image.filter(
                  ImageFilter.UnsharpMask(
                      radius=1.1,
                      percent=75,
                      threshold=3
                  )
              )

              image.save(
                  destination,
                  format="PNG",
                  optimize=True
              )

