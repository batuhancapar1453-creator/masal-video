name: Masal Videosu Oluştur

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

```
steps:
  - name: Depoyu indir
    uses: actions/checkout@v4

  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: FFmpeg kur
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg

  - name: Paketleri kur
    run: |
      python -m pip install --upgrade pip
      pip install requests pillow

  - name: Masal videosunu oluştur
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_REGION: ${{ secrets.AZURE_REGION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    run: |
      cat > create_video.py <<'PY'
      import os, json, time, base64, subprocess, re
      from pathlib import Path
      from io import BytesIO
      import requests
      from PIL import Image, ImageStat, ImageEnhance, ImageFilter

      def secret(name):
          value = os.getenv(name, "").strip()
          if not value:
              raise RuntimeError(f"GitHub Secrets eksik: {name}")
          return value

      GEMINI = secret("GEMINI_API_KEY")
      AZURE_KEY = secret("AZURE_SPEECH_KEY")
      AZURE_REGION = secret("AZURE_REGION")
      CF_TOKEN = secret("CLOUDFLARE_API_TOKEN")
      CF_ACCOUNT = secret("CLOUDFLARE_ACCOUNT_ID")

      OUT = Path("output")
      IMAGES = OUT / "images"
      IMAGES.mkdir(parents=True, exist_ok=True)
      session = requests.Session()

      def run(cmd):
          subprocess.run(cmd, check=True)

      def make_story():
          prompt = """
          4-8 yaşındaki çocuklar için Türkçe, huzurlu ve özgün bir uyku masalı
          yaz. Yaklaşık 700-900 kelime olsun. Şiddet, korku ve tehlikeli davranış
          içermesin. Baş karakterlerin görünüşü bütün sahnelerde aynı kalsın.
          Yalnızca geçerli JSON döndür:
          {
            "title":"Masal başlığı",
            "story":"Masalın tamamı",
            "scenes":[
              {"description":"sahne 1"},
              {"description":"sahne 2"}
            ]
          }
          Tam 12 sahne oluştur. Sahneler masaldaki olayları sırasıyla anlatsın.
          Her sahnede görsel olarak gösterilebilecek somut bir olay bulunsun.
          JSON dışında açıklama yazma.
          """
          url = ("https://generativelanguage.googleapis.com/v1beta/"
                 "models/gemini-2.5-flash:generateContent")
          for attempt in range(4):
              try:
                  r = session.post(
                      url, params={"key": GEMINI},
                      json={
                          "contents": [{"parts": [{"text": prompt}]}],
                          "generationConfig": {
                              "temperature": 0.8,
                              "responseMimeType": "application/json"
                          }
                      }, timeout=120
                  )
                  r.raise_for_status()
                  raw = r.json()["candidates"][0]["content"]["parts"][0]["text"]
                  try:
                      data = json.loads(raw)
                  except Exception:
                      match = re.search(r"\{.*\}", raw, re.S)
                      if not match:
                          raise RuntimeError("Masal JSON biçiminde gelmedi.")
                      data = json.loads(match.group())
                  if len(data.get("story", "")) < 500:
                      raise RuntimeError("Masal çok kısa.")
                  scenes = data.get("scenes", [])
                  if len(scenes) < 8:
                      raise RuntimeError("Yeterli sahne oluşturulmadı.")
                  data["scenes"] = scenes[:12]
                  while len(data["scenes"]) < 12:
                      data["scenes"].append(data["scenes"][-1])
                  return data
              except Exception as e:
                  print(f"Masal denemesi {attempt + 1}/4 başarısız: {e}")
                  if attempt == 3:
                      raise
                  time.sleep(5 * (attempt + 1))

      print("1/5 Masal yazılıyor...")
      data = make_story()
      title = str(data.get("title", "Güzel Bir Masal"))
      story = str(data["story"]).strip()
      (OUT / "masal.txt").write_text(title + "\n\n" + story, encoding="utf-8")
      print(f"Masal hazır: {title}")

      print("2/5 Türkçe ses oluşturuluyor...")
      ssml_text = (story.replace("&", "&amp;")
                        .replace("<", "&lt;").replace(">", "&gt;"))
      ssml = (
          '<speak version="1.0" xml:lang="tr-TR">'
          '<voice name="tr-TR-EmelNeural">'
          '<prosody rate="-8%">' + ssml_text +
          '</prosody></voice></speak>'
      )
      speech_url = f"https://{AZURE_REGION}.tts.speech.microsoft.com/cognitiveservices/v1"
      r = session.post(
          speech_url,
          headers={
              "Ocp-Apim-Subscription-Key": AZURE_KEY,
              "Content-Type": "application/ssml+xml",
              "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3"
          },
          data=ssml.encode("utf-8"), timeout=180
      )
      if not r.ok:
          raise RuntimeError(f"Azure ses hatası HTTP {r.status_code}: {r.text[:300]}")
      audio = OUT / "narration.mp3"
      audio.write_bytes(r.content)
      if len(r.content) < 10000:
          raise RuntimeError("Ses dosyası boş veya hatalı.")
      audio_duration = float(subprocess.check_output([
          "ffprobe", "-v", "error", "-show_entries", "format=duration",
          "-of", "default=noprint_wrappers=1:nokey=1", str(audio)
      ], text=True).strip())
      if audio_duration < 20:
          raise RuntimeError("Ses süresi beklenenden kısa.")
      print(f"Ses süresi: {audio_duration:.1f} saniye")

      def create_image(description, destination):
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}"
              "/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )
          prompt = (
              "Beautiful high quality children's storybook illustration, "
              "clear recognizable characters and objects, bright colorful "
              "lighting, sharp focus, clean composition, detailed scene, "
              "consistent character appearance, wholesome child-friendly art. "
              "No words, no text, no watermark, no blurry objects. "
              "Landscape story illustration. Scene: " + description
          )
          r = session.post(
              url,
              headers={
                  "Authorization": f"Bearer {CF_TOKEN}",
                  "Content-Type": "application/json",
                  "Accept": "image/png"
              },
              json={"prompt": prompt}, timeout=180
          )
          if not r.ok:
              raise RuntimeError(f"Cloudflare HTTP {r.status_code}: {r.text[:200]}")

          content = r.content
          if "json" in r.headers.get("Content-Type", "").lower() or content[:1] == b"{":
              result = r.json().get("result", {})
              if isinstance(result, dict):
                  content = result.get("image") or result.get("data") or ""
              if isinstance(content, str):
                  content = base64.b64decode(content)
          im = Image.open(BytesIO(content)).convert("RGB")
          stat = ImageStat.Stat(im)
          brightness = sum(stat.mean) / 3
          spread = sum(hi - lo for lo, hi in im.getextrema()) / 3
          if brightness < 18 or spread < 18:
              raise RuntimeError("Görsel siyah veya ayrıntısız.")
          w, h = im.size
          ratio = 16 / 9
          if w / h > ratio:
              nw = int(h * ratio)
              x = (w - nw) // 2
              im = im.crop((x, 0, x + nw, h))
          else:
              nh = int(w / ratio)
              y = max(0, (h - nh) // 2)
              im = im.crop((0, y, w, y + nh))
          im = im.resize((1280, 720), Image.Resampling.LANCZOS)
          im = ImageEnhance.Contrast(im).enhance(1.1)
          im = ImageEnhance.Color(im).enhance(1.08)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.3, percent=110, threshold=3))
          im.save(destination, "PNG")
          return brightness

      print("3/5 Görseller oluşturuluyor...")
      previous = None
      for i, scene in enumerate(data["scenes"], 1):
          destination = IMAGES / f"scene_{i:02d}.png"
          desc = str(scene.get("description", "")).strip()
          success = False
          for attempt in range(1, 5):
              try:
                  prompt_desc = desc
                  if attempt > 1:
                      prompt_desc += (
                          ". Show one simple, clearly recognizable action, "
                          "large main subject, strong lighting, uncluttered background."
                      )
                  brightness = create_image(prompt_desc, destination)
                  previous = destination
                  success = True
                  print(f"Sahne {i}/12 hazır, parlaklık {brightness:.1f}")
                  break
              except Exception as e:
                  print(f"Sahne {i}, deneme {attempt}/4: {e}")
                  time.sleep(3 * attempt)
          if not success:
              if previous and previous.exists():
                  import shutil
                  shutil.copy2(previous, destination)
                  print(f"UYARI: Sahne {i} için önceki görsel kullanıldı.")
              else:
                  raise RuntimeError("İlk sahne görseli oluşturulamadı.")

      print("4/5 Videonun sahneleri oluşturuluyor...")
      count = len(data["scenes"])
      scene_duration = audio_duration / count
      clips = []
      for i in range(1, count + 1):
          img = IMAGES / f"scene_{i:02d}.png"
          clip = OUT / f"clip_{i:02d}.mp4"
          frames = max(1, round(scene_duration * 25))
          vf = (
              "scale=1280:720,"
              f"zoompan=z='min(zoom+0.0003,1.06)':d={frames}:"
              "x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
              "s=1280x720:fps=25,setsar=1,format=yuv420p"
          )
          run([
              "ffmpeg", "-y", "-loop", "1", "-i", str(img),
              "-vf", vf, "-frames:v", str(frames),
              "-an", "-c:v", "libx264", "-preset", "ultrafast",
              "-crf", "23", str(clip)
          ])
          clips.append(clip)

      concat = OUT / "clips.txt"
      concat.write_text(
          "".join("file '" + str(p.resolve()) + "'\n" for p in clips),
          encoding="utf-8"
      )
      visuals = OUT / "visuals.mp4"
      run([
          "ffmpeg", "-y", "-f", "concat", "-safe", "0",
          "-i", str(concat), "-c", "copy", str(visuals)
      ])

      print("5/5 Ses ve görüntü birleştiriliyor...")
      final = Path("masal-video.mp4")
      run([
          "ffmpeg", "-y", "-i", str(visuals), "-i", str(audio),
          "-map", "0:v:0", "-map", "1:a:0",
          "-c:v", "copy", "-c:a", "aac", "-b:a", "128k",
          "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",
          "-t", str(audio_duration),
          "-movflags", "+faststart", str(final)
      ])

      info = json.loads(subprocess.check_output([
          "ffprobe", "-v", "error", "-show_streams", "-show_format",
          "-of", "json", str(final)
      ], text=True))
      streams = info.get("streams", [])
      if not any(s.get("codec_type") == "video" for s in streams):
          raise RuntimeError("Videoda görüntü akışı bulunamadı.")
      if not any(s.get("codec_type") == "audio" for s in streams):
          raise RuntimeError("Videoda ses akışı bulunamadı.")
      duration = float(info["format"]["duration"])
      if abs(duration - audio_duration) > 3:
          raise RuntimeError("Ses ve görüntü süreleri eşleşmiyor.")
      if final.stat().st_size < 500000:
          raise RuntimeError("Video dosyası beklenenden küçük.")
      print(f"BAŞARILI: {final}, {duration:.1f} saniye")

      PY
      python create_video.py

  - name: Videoyu ve masal metnini yükle
    uses: actions/upload-artifact@v4
    with:
      name: masal-video
      path: |
        masal-video.mp4
        output/masal.txt
      if-no-files-found: error
      retention-days: 7
