6. DEĞİŞMEYECEK KAPANIŞ CÜMLESİ

Her videonun sonunda Lina şu cümleyi aynen söyleyecek:

“Kanalıma abone olup bana destek olmayı unutmayın!”

Bu ifade kesinlikle başka bir abonelik çağrısıyla değiştirilmeyecek.

7. MEVCUT TEKNİK SİSTEM

Mevcut YAML dosyasında bulunan çalışan özellikler korunmalı:

- GitHub Actions otomasyonu.
- Cloudflare AI görsel üretimi.
- FFmpeg video oluşturma.
- 1080×1920 dikey video.
- 30 FPS.
- Türkçe kadın seslendirmesi.
- Altyazı oluşturma.
- YouTube OAuth ile otomatik yükleme.
- Zamanlanmış otomatik çalıştırma.
- 30 hikâyelik içerik sistemi.

Daha önce çözdüğümüz sorunlar tekrar ortaya çıkmamalı:

- YouTube "invalidDescription" hatası.
- Görsellere yapay zekâ tarafından alakasız yazı basılması.
- Altyazı dışında görüntüye yazı eklenmesi.
- Cloudflare görsel üretimindeki istenmeyen metinler.

Altyazı haricinde görüntü üzerinde istenmeyen yazı bulunmamalı.

8. ÖNCEKİ YAML DOSYASI

Son başarılı dosyamızın adı:

"gizemli_dunya_lina_30_hikaye_guncel.yml"

Önceki sürümde Lina'nın referans görseli, karakter tanımlaması, 30 hikâye, Türkçe kadın sesi, sabit kapanış cümlesi, FFmpeg ve YouTube yükleme sistemi bulunuyordu.

Ancak Lina sabit kaldığı için yeni animasyon sistemi eklenmeli.

9. YENİ ANİMASYON SİSTEMİ İÇİN TEKNİK GEREKSİNİMLER

Lina'nın mevcut görselini sesle senkronize videoya dönüştürebilen uygun bir animasyon servisi araştır.

Gerektiğinde:

- Konuşan karakter animasyonu.
- Dudak senkronizasyonu.
- Yüz ve baş hareketleri.
- Doğal karakter animasyonu.
- Referans görselle karakter tutarlılığı.
- Türkçe ses desteği.

özelliklerini değerlendir.

Önceki konuşmada FAL ve "FAL_KEY" gündeme gelmişti ancak henüz kesin bir servis bağlantısı kurulmuş veya test edilmiş değil.

Servisin gerçek API özelliklerini, fiyatlandırmasını, modelini ve gerekli anahtarlarını doğrula. Yalnızca gerçekten desteklenen özellikleri kullan.

Animasyon servisi başarısız olursa sistem sessizce sabit görsele dönüp başarılıymış gibi davranmasın. Hata açıkça bildirilsin.

10. YAPILACAK İŞLER

1. Kullanacağımız son başarılı YAML dosyasının tamamını incele.
2. Mevcut çalışan kodu ve otomasyonları koru.
3. Lina için gerçek konuşma animasyonu ekle.
4. Ses ve ağız hareketlerini senkronize et.
5. Doğal yüz, göz, baş ve vücut hareketlerini ekle.
6. Daha gerçekçi Türkçe ses sistemini değerlendir ve uygula.
7. Lina'nın yüz ve karakter tutarlılığını koru.
8. 30 hikâyeyi ve dört bölümlü anlatım yapısını koru.
9. Sabit kapanış cümlesini koru.
10. Altyazı ve YouTube yükleme sistemini bozma.
11. YAML ve Python sözdizimini kontrol et.
12. Gerekli API anahtarlarını ve GitHub Secrets ayarlarını açıkça belirt.
13. Eksiksiz, yeni ve düzeltilmiş YAML dosyasını indirilebilir şekilde teslim et.

11. ÖNEMLİ ÇALIŞMA KURALLARI

- Bana parçalı kod verme.
- Mevcut çalışan sistemin tamamını gereksiz yere değiştirme.
- Sadece gerekli değişiklikleri yap.
- Bir özelliği test etmediysen test edilmiş gibi söyleme.
- Gerçek animasyon sağlamayan bir sistemi animasyon sistemi diye sunma.
- Gereksiz API veya ücretli servis ekleme.
- Ücretsiz veya düşük maliyetli seçenekleri öncelikle değerlendir.
- Her değişiklikten sonra hata kontrolü yap.
- Sonuçta tek parça, eksiksiz YAML dosyası ver.

ŞİMDİ BAŞLANGIÇ: Önce son başarılı YAML dosyasını incele. Ardından Lina'yı sabit görselden çıkarıp doğal hareketlerle konuşan, sesle senkronize ve karakter tutarlılığı korunmuş bir 3D anlatıcıya dönüştürecek sistemi uygula.
