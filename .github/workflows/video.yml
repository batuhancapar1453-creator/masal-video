name: Masal Video Uret

on:
  workflow_dispatch:

jobs:
  masal-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Turkish story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > create_video.py <<'PY'
          import os
          import time
          import json
          import base64
          import subprocess
          import requests

          def secret(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(
                      f"{name} is missing from GitHub Actions secrets."
                  )
              return value

          GEMINI_KEY = secret("GEMINI_API_KEY")
          AZURE_KEY = secret("AZURE_SPEECH_KEY")
          AZURE_REGION = secret("AZURE_REGION")
          CF_TOKEN = secret("CLOUDFLARE_API_TOKEN")
          CF_ACCOUNT = secret("CLOUDFLARE_ACCOUNT_ID")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_KEY}"
          )

          def request_with_retry(method, url, **kwargs):
              last_response = None

              for attempt in range(6):
                  response = requests.request(
                      method, url, timeout=180, **kwargs
                  )
                  last_response = response

                  if response.status_code not in (
                      429, 500, 502, 503, 504
                  ):
                      return response

                  if attempt < 5:
                      wait_seconds = 10 * (2 ** attempt)
                      print(
                          f"Temporary error {response.status_code}. "
                          f"Waiting {wait_seconds} seconds; "
                          f"attempt {attempt + 2}/6."
                      )
                      time.sleep(wait_seconds)

              return last_response

          print("1/5 Generating Turkish story...")

          prompt = """
          Türkçe, 4-8 yaş çocukları için özgün bir uyku masalı yaz.
          Yaklaşık 600-800 kelime olsun.
          Sıcak, güvenli, eğitici ve hayal gücü yüksek olsun.
          Korkutucu veya şiddet içeren sahneler olmasın.
          Başlıkla başla. Yalnızca masalı yaz.
          """

          response = request_with_retry(
              "POST",
              GEMINI_URL,
              headers={"Content-Type": "application/json"},
              json={
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }]
              }
          )
          response.raise_for_status()

          data = response.json()
          try:
              story = data["candidates"][0]["content"]["parts"][0]["text"]
          except (KeyError, IndexError, TypeError):
              raise RuntimeError(
                  "Gemini returned no story: "
                  + json.dumps(data, ensure_ascii=False)[:1500]
              )

          with open("masal.txt", "w", encoding="utf-8") as f:
              f.write(story)

          print("Story created.")

          print("2/5 Generating narration with Azure Speech...")

          speech_url = (
              f"https://{AZURE_REGION}.tts.speech.microsoft.com/"
              "cognitiveservices/v1"
          )

          escaped_story = (
              story.replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
          )

          ssml = f"""
          <speak version="1.0"
              xmlns="http://www.w3.org/2001/10/synthesis"
              xml:lang="tr-TR">
            <voice name="tr-TR-EmelNeural">
              <prosody rate="-5%" pitch="+2%">
                {escaped_story}
              </prosody>
            </voice>
          </speak>
          """

          speech_response = request_with_retry(
              "POST",
              speech_url,
              headers={
                  "Ocp-Apim-Subscription-Key": AZURE_KEY,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3",
                  "User-Agent": "MasalVideoGenerator"
              },
              data=ssml.encode("utf-8")
          )

          if not speech_response.ok:
              raise RuntimeError(
                  f"Azure Speech error {speech_response.status_code}: "
                  f"{speech_response.text[:1000]}"
              )

          with open("narration.mp3", "wb") as f:
              f.write(speech_response.content)

          print("Narration created.")

          print("3/5 Generating illustrations with Cloudflare AI...")

          cf_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{CF_ACCOUNT}/ai/run/@cf/lykon/dreamshaper-8-lcm"
          )

          prompts = [
              "Cute little fox in a magical forest, children's storybook illustration, watercolor, warm colors, no text",
              "A small fox meets a friendly rabbit near flowers, children's picture book, watercolor, no text",
              "A sparkling blue river in a peaceful enchanted forest, storybook illustration, no text",
              "A little fox and rabbit help a tiny bird, charming children's illustration, no text",
              "Friendly forest animals under glowing stars, watercolor storybook art, no text",
              "A cozy little cottage surrounded by flowers, dreamy children's book illustration, no text",
              "A smiling fox looking at a beautiful moon, gentle watercolor picture book, no text",
              "Forest animals sleeping peacefully beneath the stars, bedtime storybook illustration, no text"
          ]

          image_files = []

          for i, image_prompt in enumerate(prompts, start=1):
              print(f"Generating illustration {i}/{len(prompts)}...")

              image_response = request_with_retry(
                  "POST",
                  cf_url,
                  headers={
                      "Authorization": f"Bearer {CF_TOKEN}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "prompt": image_prompt,
                      "num_steps": 4
                  }
              )

              if not image_response.ok:
                  raise RuntimeError(
                      f"Cloudflare image error "
                      f"{image_response.status_code}: "
                      f"{image_response.text[:1000]}"
                  )

              content_type = image_response.headers.get(
                  "content-type", ""
              )

              image_bytes = None

              if "image/" in content_type:
                  image_bytes = image_response.content
              else:
                  result = image_response.json()
                  image_data = result.get("result", {}).get("image")

                  if image_data:
                      image_bytes = base64.b64decode(image_data)
                  else:
                      raise RuntimeError(
                          "Cloudflare did not return image data: "
                          + json.dumps(
                              result, ensure_ascii=False
                          )[:1000]
                      )

              filename = f"image_{i:02d}.png"
              with open(filename, "wb") as f:
                  f.write(image_bytes)

              image_files.append(filename)

          print("Illustrations created.")

          print("4/5 Creating video with FFmpeg...")

          clips = []

          for i, filename in enumerate(image_files, start=1):
              clip = f"clip_{i:02d}.mp4"
              subprocess.run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", filename,
                  "-f", "lavfi",
                  "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                  "-t", "7",
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                  "format=yuv420p",
                  "-r", "24",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-c:a", "aac",
                  "-shortest",
                  clip
              ], check=True)

              clips.append(clip)

          with open("clips.txt", "w", encoding="utf-8") as f:
              for clip in clips:
                  f.write(f"file '{clip}'\n")

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "clips.txt",
              "-c", "copy",
              "visuals.mp4"
          ], check=True)

          duration_result = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "narration.mp3"
          ], capture_output=True, text=True, check=True)

          narration_duration = float(duration_result.stdout.strip())

          subprocess.run([
              "ffmpeg", "-y",
              "-stream_loop", "-1",
              "-i", "visuals.mp4",
              "-i", "narration.mp3",
              "-t", str(narration_duration),
              "-vf", "scale=1280:720,format=yuv420p",
              "-c:v", "libx264",
              "-preset", "ultrafast",
              "-c:a", "aac",
              "-b:a", "128k",
              "-shortest",
              "-movflags", "+faststart",
              "masal-video.mp4"
          ], check=True)

          print("5/5 Video completed: masal-video.mp4")
          PY

          python create_video.py

      - name: Upload video and story
        uses: actions/upload-artifact@v4
        with:
          name: masal-video
          path: |
            masal-video.mp4
            masal.txt
          if-no-files-found: error
          retention-days: 7
