              draw.rounded_rectangle((x-29*scale,y+2*scale,x+29*scale,y+75*scale), radius=15, fill=(230,232,225,255), outline=(50,65,90,255), width=4)
              swing=math.sin(phase*2)*22*scale
              draw.line((x-20*scale,y+20*scale,x-55*scale,y+45*scale+swing), fill=(225,232,238,255), width=max(4,int(12*scale)))
              draw.line((x+20*scale,y+20*scale,x+55*scale,y+45*scale-swing), fill=(225,232,238,255), width=max(4,int(12*scale)))
              draw.line((x-12*scale,y+70*scale,x-25*scale,y+105*scale-swing), fill=(225,232,238,255), width=max(4,int(13*scale)))
              draw.line((x+12*scale,y+70*scale,x+25*scale,y+105*scale+swing), fill=(225,232,238,255), width=max(4,int(13*scale)))


          def draw_fish(draw, x, y, phase, scale=1.0, color=(70,200,190,255)):
              tail=math.sin(phase*3)*16*scale
              draw.ellipse((x-45*scale,y-24*scale,x+38*scale,y+24*scale), fill=color, outline=(5,50,70,255), width=3)
