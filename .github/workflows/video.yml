name: Gizemli Dunya - Otomatik YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9,20 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg ve font kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy google-api-python-client google-auth

      - name: Video uret ve YouTube'a yukle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
        run: |
          cat > create_video.py <<'PY'
          import os
          import io
          import json
          import base64
          import time
          import wave
          import subprocess
          import hashlib
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import numpy as np

          from PIL import (
              Image,
              ImageDraw,
              ImageFont,
              ImageEnhance,
              ImageFilter,
          )

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          # ======================================
          # AYARLAR
          # ======================================

          ROOT = Path.cwd()

          OUT = ROOT / "output"
          IMAGES = OUT / "images"
          CAPTIONS = OUT / "captions"
          CLIPS = OUT / "clips"

          HISTORY_FILE = (
              ROOT / "data" / "youtube_history.json"
          )

          WIDTH = 1080
          HEIGHT = 1920
          FPS = 25

          SCENE_COUNT = 6
          SCENE_SECONDS = 5

          SAMPLE_RATE = 22050

          CF_TOKEN = os.getenv(
              "CLOUDFLARE_API_TOKEN", ""
          ).strip()

          CF_ACCOUNT = os.getenv(
              "CLOUDFLARE_ACCOUNT_ID", ""
          ).strip()

          YOUTUBE_CLIENT_ID = os.getenv(
              "YOUTUBE_CLIENT_ID", ""
          ).strip()

          YOUTUBE_CLIENT_SECRET = os.getenv(
              "YOUTUBE_CLIENT_SECRET", ""
          ).strip()

          YOUTUBE_REFRESH_TOKEN = os.getenv(
              "YOUTUBE_REFRESH_TOKEN", ""
          ).strip()

          YOUTUBE_PRIVACY = os.getenv(
              "YOUTUBE_PRIVACY", "private"
          ).strip()

          RUN_EVENT = os.getenv(
              "GITHUB_EVENT_NAME",
              "workflow_dispatch"
          )

          RUN_ID = os.getenv(
              "GITHUB_RUN_ID", "local"
          )

          PRIMARY_MODEL = (
              "@cf/black-forest-labs/flux-2-klein-9b"
          )

          BACKUP_MODEL = (
              "@cf/lykon/dreamshaper-8-lcm"
          )

          for folder in (
              OUT,
              IMAGES,
              CAPTIONS,
              CLIPS,
              HISTORY_FILE.parent,
          ):
              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

          required = {
              "CLOUDFLARE_API_TOKEN": CF_TOKEN,
              "CLOUDFLARE_ACCOUNT_ID": CF_ACCOUNT,
              "YOUTUBE_CLIENT_ID": YOUTUBE_CLIENT_ID,
              "YOUTUBE_CLIENT_SECRET": YOUTUBE_CLIENT_SECRET,
              "YOUTUBE_REFRESH_TOKEN": YOUTUBE_REFRESH_TOKEN,
          }

          missing = [
              key for key, value in required.items()
              if not value
          ]

          if missing:
              raise RuntimeError(
                  "Eksik GitHub Secrets: "
                  + ", ".join(missing)
              )

          if YOUTUBE_PRIVACY not in (
              "private",
              "public",
              "unlisted",
          ):
              raise RuntimeError(
                  "Gecersiz YouTube gizlilik ayari."
              )

          session = requests.Session()

